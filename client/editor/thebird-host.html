  <link rel="stylesheet" href="/editor/wm/os-token-bridge.css">
  <script>
    (function () {
      const root = document.documentElement;
      root.classList.add('ds-247420');
      const mq = window.matchMedia('(prefers-color-scheme: dark)');
      const apply = () => mq.matches ? root.setAttribute('data-theme', 'ink') : root.removeAttribute('data-theme');
      apply();
      mq.addEventListener?.('change', apply);
    })();
  </script>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">

  <style>
    /* thebird desktop shell: full-viewport window manager overlay */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg, #030a10);
    }
    #thebird-desktop {
      position: absolute;
      inset: 0;
      /* The desktop surface where thebird windows live */
      background: var(--os-bg-0, var(--bg, #030a10));
      overflow: hidden;
    }
    #spoint-container {
      position: absolute;
      inset: 0;
      bottom: 40px;
      /* Spoint editor is embedded as a full-desktop "app" */
    }
    .thebird-taskbar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 40px;
      background: var(--os-bg-1, var(--bg-2));
      display: flex;
      align-items: center;
      padding: 0 12px;
      gap: 8px;
      border-top: 1px solid var(--os-bg-2, var(--bg-3));
      z-index: 10000;
    }
    .thebird-taskbar-item {
      padding: 4px 12px;
      font: 11px var(--ff-mono, monospace);
      color: var(--os-fg, var(--fg));
      background: var(--os-bg-2, var(--bg-3));
      border-radius: 4px;
      cursor: pointer;
      user-select: none;
    }
    .thebird-taskbar-item.active {
      background: var(--os-accent, var(--accent));
      color: var(--bg);
    }
  </style>
</head>
<body class="canvas-host">
  <div id="thebird-desktop">
    <div id="spoint-container">
      <div id="ui-root"></div>
      <div id="click-prompt" style="display:none">Click to play</div>
    </div>
  </div>
  <div class="thebird-taskbar">
    <span style="font:12px var(--ff-mono,monospace);color:var(--os-fg,var(--fg));opacity:0.8">thebird</span>
    <div class="thebird-taskbar-item active">Spoint Editor</div>
    <div style="flex:1"></div>
    <span style="font:10px monospace;color:var(--os-fg-3,var(--fg-3))">
      <span id="clock"></span>
    </span>
  </div>

  <script>
    // Simple clock in the taskbar
    function updateClock() {
      const el = document.getElementById('clock');
      if (el) el.textContent = new Date().toLocaleTimeString();
    }
    updateClock();
    setInterval(updateClock, 30000);
  </script>

  <!-- Load full Spoint app module which boots engine + BrowserServer + EditorShell -->
  <script type="module">
    import '/app.js'

    // Expose thebird desktop integration handle
    window.__thebird = {
      name: 'thebird-desktop-host',
      get editPanel() { return window.debug?.editPanel || null }
    }
    console.log('[thebird] Spoint editor & engine hosted inside thebird desktop shell with live hot-reloading')
  </script>
</body>
</html>
