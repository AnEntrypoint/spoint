<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><script>{const p=new URLSearchParams(location.search);const mode=p.has("singleplayer")||p.has("wwjoin")||p.has("room")||p.has("multiplayer");if(!mode){location.replace(location.pathname+"?singleplayer&world=tps-game")}}</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Spoint</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="https://unpkg.com/anentrypoint-design@latest/dist/247420.css">
  <script>
    (function () {
      const root = document.documentElement;
      root.classList.add('ds-247420');
      const mq = window.matchMedia('(prefers-color-scheme: dark)');
      const apply = () => mq.matches ? root.setAttribute('data-theme', 'ink') : root.removeAttribute('data-theme');
      apply();
      mq.addEventListener?.('change', apply);
    })();
  </script>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#030a10">
  <!-- The importmap MUST come before any module load/preload, else the browser
       rejects it ("Import maps are not allowed after a module load or preload
       has started") and bare specifiers like 'three' fail to remap in app.js.
       Keep it ahead of the installStyles module script below. -->
  <script type="importmap">
  {
    "imports": {
      "three": "/node_modules/three/build/three.module.js",
      "three/webgpu": "/node_modules/three/build/three.webgpu.js",
      "three/tsl": "/node_modules/three/build/three.tsl.js",
      "three/addons/": "/node_modules/three/examples/jsm/",
      "@pixiv/three-vrm": "/node_modules/@pixiv/three-vrm/lib/three-vrm.module.js",
      "three-mesh-bvh": "/vendor/three-mesh-bvh.module.js",
      "anentrypoint-design": "https://unpkg.com/anentrypoint-design@latest/dist/247420.js",
      "game-editor-kit": "https://cdn.jsdelivr.net/gh/AnEntrypoint/design@main/src/components/game-editor-kit/index.js",
      "streaming-gltf": "/node_modules/streaming-gltf/index.js",
      "streaming-gltf/model-pool": "/node_modules/streaming-gltf/src/model-pool.js",
      "streaming-gltf/draco-loader": "/node_modules/streaming-gltf/src/draco-loader.js",
      "streaming-gltf/occlusion-query-tier": "/node_modules/streaming-gltf/src/occlusion-query-tier.js",
      "webjsx": "/node_modules/webjsx/dist/index.js",
      "webjsx/jsx-runtime": "/node_modules/webjsx/dist/jsx-runtime.js",
      "msgpackr": "/node_modules/msgpackr/index.js",
      "xstate": "/node_modules/xstate/dist/xstate.esm.js",
      "jolt-physics/wasm-compat": "/node_modules/jolt-physics/dist/jolt-physics.wasm-compat.js",
      "@dgreenheck/ez-tree": "/node_modules/@dgreenheck/ez-tree/build/ez-tree.es.js",
      "meshoptimizer": "/node_modules/meshoptimizer/meshopt_simplifier.js",
      "mapspinner": "/node_modules/mapspinner/src/index.js",
      "mapspinner/planet-orchestrator": "/node_modules/mapspinner/src/planet-orchestrator.js",
      "mapspinner/height-cpu": "/node_modules/mapspinner/src/height-cpu.js",
      "@three.ez/instanced-mesh": "/node_modules/@three.ez/instanced-mesh/build/index.js",
      "bvh.js": "/node_modules/bvh.js/build/index.js",
      "streaming-gltf/octahedral-impostor-ez": "/node_modules/streaming-gltf/src/octahedral-impostor-ez.js",
      "wireweave": "/node_modules/wireweave/src/index.js",
      "nostr-tools": "/vendor/nostr-tools.mjs"
    }
  }
  </script>
  <script type="module">
    import { installStyles } from 'https://unpkg.com/anentrypoint-design@latest/dist/247420.js';
    installStyles();
  </script>
  <!-- Modulepreload hints for the critical-path ES modules app.js imports immediately on
       parse (three is the heaviest, msgpackr the earliest-needed for the wire protocol) --
       these must come AFTER the importmap above so the resolved (not bare) specifier is used,
       else the browser fetches an un-remapped bare-specifier URL and wastes the request.
       /app.js itself is preloaded too: buildStaticDirs (src/sdk/server.js) transparently
       swaps this same URL between the raw dev file and the built dist/client/app.js bundle,
       so one hint covers both. -->
  <link rel="modulepreload" href="/app.js">
  <link rel="modulepreload" href="/node_modules/three/build/three.module.js">
  <link rel="modulepreload" href="/node_modules/msgpackr/index.js">
</head>
<body class="canvas-host">
  <div id="ui-root"></div>
  <div id="click-prompt">Click to play<span class="cp-hint">press M for multiplayer</span></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
