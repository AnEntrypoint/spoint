<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Preconnects first: both CDN origins are on the boot critical path (the design kit's CSS +
       module from unpkg render/parse-block, game-editor-kit's module graph from jsdelivr is a
       static import of app.js). `crossorigin` variants serve the module-script (CORS) connection
       pool; the bare unpkg one serves the no-CORS stylesheet fetch -- Chrome keys connections by
       credentials mode, so a single hint would only warm one of the two. -->
  <link rel="preconnect" href="https://unpkg.com" crossorigin>
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Spoint</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="https://unpkg.com/anentrypoint-design@1.0.34/dist/247420.css">
  <script>
    (function () {
      const root = document.documentElement;
      root.classList.add('ds-247420');
      const mq = window.matchMedia('(prefers-color-scheme: dark)');
      const apply = () => mq.matches ? root.setAttribute('data-theme', 'ink') : root.removeAttribute('data-theme');
      apply();
      mq.addEventListener?.('change', apply);
    })();
  </script>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#030a10">
  <!-- The importmap MUST come before any module load/preload, else the browser
       rejects it ("Import maps are not allowed after a module load or preload
       has started") and bare specifiers like 'three' fail to remap in app.js.
       Keep it ahead of the installStyles module script below. -->
  <script type="importmap">
  {
    "imports": {
      "three": "/node_modules/three/build/three.module.js",
      "three/webgpu": "/node_modules/three/build/three.webgpu.js",
      "three/tsl": "/node_modules/three/build/three.tsl.js",
      "three/addons/": "/node_modules/three/examples/jsm/",
      "@pixiv/three-vrm": "/node_modules/@pixiv/three-vrm/lib/three-vrm.module.js",
      "three-mesh-bvh": "/vendor/three-mesh-bvh.module.js",
      "anentrypoint-design": "https://unpkg.com/anentrypoint-design@1.0.34/dist/247420.js",
      "game-editor-kit": "https://cdn.jsdelivr.net/gh/AnEntrypoint/design@70550868836df5d3c8cd3c85570090ff571edde0/src/components/game-editor-kit/index.js",
      "streaming-gltf": "/node_modules/streaming-gltf/index.js",
      "streaming-gltf/model-pool": "/node_modules/streaming-gltf/src/model-pool.js",
      "streaming-gltf/draco-loader": "/node_modules/streaming-gltf/src/draco-loader.js",
      "streaming-gltf/occlusion-query-tier": "/node_modules/streaming-gltf/src/occlusion-query-tier.js",
      "webjsx": "/node_modules/webjsx/dist/index.js",
      "webjsx/jsx-runtime": "/node_modules/webjsx/dist/jsx-runtime.js",
      "msgpackr": "/node_modules/msgpackr/index.js",
      "xstate": "/node_modules/xstate/dist/xstate.esm.js",
      "jolt-physics/wasm-compat": "/node_modules/jolt-physics/dist/jolt-physics.wasm-compat.js",
      "@dgreenheck/ez-tree": "/node_modules/@dgreenheck/ez-tree/build/ez-tree.es.js",
      "meshoptimizer": "/node_modules/meshoptimizer/meshopt_simplifier.js",
      "mapspinner": "/node_modules/mapspinner/src/index.js",
      "mapspinner/planet-orchestrator": "/node_modules/mapspinner/src/planet-orchestrator.js",
      "mapspinner/height-cpu": "/node_modules/mapspinner/src/height-cpu.js",
      "@three.ez/instanced-mesh": "/node_modules/@three.ez/instanced-mesh/build/index.js",
      "bvh.js": "/node_modules/bvh.js/build/index.js",
      "streaming-gltf/octahedral-impostor-ez": "/node_modules/streaming-gltf/src/octahedral-impostor-ez.js",
      "wireweave": "/node_modules/wireweave/src/index.js",
      "nostr-tools": "/vendor/nostr-tools.mjs"
    }
  }
  </script>
  <script type="module">
    import { installStyles } from 'https://unpkg.com/anentrypoint-design@1.0.34/dist/247420.js';
    installStyles();
  </script>
  <!-- Modulepreload hints for the critical-path ES modules app.js imports immediately on
       parse (three is the heaviest, msgpackr the earliest-needed for the wire protocol) --
       these must come AFTER the importmap above so the resolved (not bare) specifier is used,
       else the browser fetches an un-remapped bare-specifier URL and wastes the request.
       /app.js itself is preloaded too: buildStaticDirs (src/sdk/server.js) transparently
       swaps this same URL between the raw dev file and the built dist/client/app.js bundle,
       so one hint covers both. -->
  <link rel="modulepreload" href="/app.js">
  <link rel="modulepreload" href="/node_modules/three/build/three.module.js">
  <!-- three.module.js is a thin re-export shell over three.core.js (the 1.3MB payload) -- without
       this hint the browser only discovers three.core.js after fetching+parsing three.module.js. -->
  <link rel="modulepreload" href="/node_modules/three/build/three.core.js">
  <link rel="modulepreload" href="/node_modules/msgpackr/index.js">
  <!-- Static imports of app.js / its first-level graph, otherwise discovered one module-parse late:
       the wire client (/src/index.client.js), three-vrm (PlayerManager), and xstate -- which
       LoadingMachine.js/ClientMachine.js top-level-await-import by this exact absolute URL, a
       fetch that used to start only once those two modules had themselves been parsed. -->
  <link rel="modulepreload" href="/src/index.client.js">
  <link rel="modulepreload" href="/node_modules/@pixiv/three-vrm/lib/three-vrm.module.js">
  <link rel="modulepreload" href="/node_modules/xstate/dist/xstate.esm.js">
  <!-- Default world module: a bare visit (no ?singleplayer/?multiplayer/?world) boots tps-game and
       app.js dynamic-imports it only after the whole static graph has loaded. Small file; the only
       time it goes unused is an explicit ?world=<other>. -->
  <link rel="modulepreload" href="/apps/world/tps-game.js">
  <link rel="modulepreload" href="https://unpkg.com/anentrypoint-design@1.0.34/dist/247420.js">
  <link rel="preload" as="style" href="https://unpkg.com/anentrypoint-design@1.0.34/dist/247420.css">
</head>
<body class="canvas-host">
  <div id="ui-root"></div>
  <div id="click-prompt">Click to play<span class="cp-hint">press M for multiplayer</span></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
