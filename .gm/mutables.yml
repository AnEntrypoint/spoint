  id: wgpu-rust-crate-cli-debug-tooling-fit-evaluated
  detail: 'User asked whether gfx-rs/wgpu (the Rust WebGPU implementation) could improve spoint''s CLI/debug tooling. Researched via real fetches of wgpu''s own README (raw.githubusercontent.com/gfx-rs/wgpu) and wgpu-native''s README (the C-bindings layer). Findings: (1) wgpu is a Rust library/crate, not a standalone CLI or debug tool -- it is the graphics backend inside Firefox/Servo/Deno, consumed by writing Rust (or via wgpu-native''s C ABI) code against it. (2) wgpu-native lists 20+ language bindings (Python, .NET, Java, Julia, Go, C++, Zig, Kotlin, etc.) but NO Node.js/JS binding -- integrating wgpu into this 100%-Node/browser-stack project would mean either writing a from-scratch N-API addon (high build/maintenance surface for a project with zero existing native-addon precedent) or adopting Deno as a second runtime (Deno''s own documented GPU Web API is backed by wgpu internally, confirmed via docs.deno.com). (3) The concrete blocker for using wgpu as a REPLACEMENT for spoint''s existing GPU-debug path (scripts/lib/gpu-eval.mjs''s withGpuPage, which drives real Chrome via the gm daemon''s browser/CDP verb against a live dev server) is that wgpu natively consumes WGSL/SPIR-V shaders, while this codebase''s actual rendering-critical shaders (packages/mapspinner/src/gl-render.js''s terrain raymarch, and 17+ files patching THREE.ShaderChunk per docs/webgpu-shader-audit.md) are raw GLSL 300 es driven through WebGLRenderer -- there is no path to validate/debug THOSE specific shaders through a native wgpu tool without a GLSL->WGSL transpilation layer (naga, bundled with wgpu, does this) that introduces exactly the kind of ''two versions that can silently disagree'' risk this project''s own AGENTS.md repeatedly flags as a real recurring failure class (see wireweave/design-kit vendoring discipline). VERDICT: no clear net-positive fit for wgpu specifically in spoint''s CLI/debug tooling today -- the existing browser/CDP-verb-driven gpu-eval.mjs approach already tests the REAL rendering path (actual WebGLRenderer + actual GLSL shaders + actual live game state), which a native wgpu tool testing WGSL-transpiled shaders in isolation would not. A native wgpu tool COULD have narrow value for pure-compute (non-rendering) GPU tasks with zero GLSL dependency (e.g. a from-scratch WGSL compute shader for offline data processing) if such a need arises, but no such need was identified this session -- not a decision to build, absent a concrete use case.'
