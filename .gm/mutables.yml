  status: witnessed
  witness_evidence: 'Traced full call chain: bakeTileReadback (gl-render.js:396, readPixels) -> exposed as globalThis.__thcBakeReadback -> patch-baker.js bakeTile() (line 62, SYNCHRONOUS, polls up to 12x if null) -> patchFor() (line 83, synchronous) -> createPatchHeightFn''s returned lookup (synchronous), used deterministically by BOTH the server collider (TerrainPhysics) AND client placement (veg/grass/rock) for byte-identical height parity per patch-baker.js''s own header comment. Converting bakeTileReadback to async PBO+fence (matching sampleGroundM''s pattern) would require the ENTIRE chain -- bakeTile, patchFor, the collider-build path, and the client placement path -- to become async, a much larger architectural change than the probe fix (which only fed a single non-deterministic camera-height value, tolerant of 1-frame staleness). This determinism/parity guarantee is load-bearing (explicitly documented). NOT converting this session: the correct fix needs a design decision (e.g. a bake-ahead/prefetch queue that overlaps the PBO latency with useful work, vs an async chain rewrite) that risks breaking placement parity if done hastily. Confirmed via live 144Hz profile that readPixels IS the dominant real cost (3.34ms p50, 48% of the 6.94ms budget) -- this is the single highest-value remaining item, correctly scoped as a follow-up requiring its own dedicated design+verify session, not blockedBy:external (authority is available, the complexity is real).'
