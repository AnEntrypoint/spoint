lly for a non-canvas, non-null-outputRenderTarget RenderContext (the frameBufferTarget case) to find where its depthStencilAttachment.view actually comes from, then live-verify with a real depth-occlusion witness (e.g. place a THREE object partially behind a known terrain rise, screenshot/readback, confirm correct occlusion) under ?webgpu=1 in the real game.'
