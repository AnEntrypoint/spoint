onfirms installStuckPipelineRecovery is present; fetch(''/app.js'') confirms it is still wired in (recoveryWired=true); fetch(''/node_modules/mapspinner/src/webgpu/pipeline-cache.js'') confirms the getPipeline() error-scope eviction (pushErrorScope + this._pipelines.delete) is present. CONCLUSION: none of the 4 spot-checked fixes are false positives -- all four are genuinely present in fresh, non-stale, currently-served code and exhibit their documented live behavior. No new mutable needed for Part 2.'
- id: webgpu-terrain-hardclip-is-gpu-pipeline-not-quadtree
  subject: 'Live-disproved the quadtree/cull hypothesis for the WebGPU terrain vertical hard-clip seam (fixed at NDC x~0.5995, screen column 1037/1297 regardless of canvas size/DPR). Five independent witnessed tests against http://localhost:8099/?singleplayer&world=tps-game&webgpu=1 (SW/caches cleared, fresh reload each time): (1) monkeypatched Quadtree.prototype.updateQuadtree to force cull=null (disabling nodeOutsideFrustum recursion-level cull) -- seam persisted, screenshot .gm/witness/seam-no-recursion-cull.png (also revealed unrelated corrupted/upside-down geometry, confirming the patch took effect). (2) Source-edited planet-orchestrator-webgpu.js collectQuads to pass cull=null to qt.updateQuadtree AND short-circuit the leaf-level quadOutsideFrustum check (if(false&&...)) SIMULTANEOUSLY (both cull mechanisms off at once, never tested together by the prior session) -- copyTextureToBuffer readback of mainColorTex at midY still transitions px1036=[8,23,10,255](terrain) to px1037=[252,248,230,255](sky) identically. (3) Rotated camera 90 degrees around up axis via direct planet.frame() call with synthetic camTarget (completely different world content on screen) -- transitionX still exactly 1037. (4) Filtered patchGrid.render''s quads to level>=4 only (excluding all coarse/large tiles) -- transitionX still exactly 1037. (5) Disabled sky.render() entirely -- region past x=1037 reads back as the pass1 clearValue (0,0,0,255), proving terrain literally never rasterizes any fragment there (not a sky-overpaint). All source edits reverted after each test (git diff clean, verified via git_diff). CONCLUSION: the defect is not reachable from JS-side quadtree generation or either frustum-cull mechanism (both independently and jointly ruled out) and is not camera-direction-dependent (world content changes, screen column does not) -- it is a GPU-pipeline-level defect (vertex-shader clip-space output or rasterizer/clipper behavior) specific to the WebGPU backend, most likely extreme/grazing clip-space coordinates from near-horizon terrain patches (R=63600 tiny-planet radius, near=3.38 far=4939 at ~42m camera altitude gives severe near/far ratio and grazing-angle geometry) being handled differently by Dawn/D3D12''s clipper than by WebGL/ANGLE''s, but this was NOT conclusively isolated within this session''s budget (a far-clamp test to 300 was inconclusive/contaminated since it also legitimately clipped mid-distance terrain). Needs: GPU-side instrumentation (fragment-shader clip.w/ndc encoding into color for a debug pipeline variant, or a Dawn/WebGPU validation/guard-band investigation) rather than further JS quadtree work.'
  obligation_kind: invariant
  session_id: gm-tsl-convert-20260922-quadtreefix
  status: witnessed
  witness_evidence: 'ROOT CAUSE FOUND AND FIXED (real fix, not a threshold/band-aid): packages/mapspinner/src/webgpu/terrain-composeheight-wgsl.js composeHeight() had ''h = h * 1.0;'' where the GLSL sibling (packages/mapspinner/src/shaders/terrain.glsl:211) applies ''h = h * (uReliefScale > 0.0 ? uReliefScale : 1.0)''. reliefScale was ALSO never threaded through the WebGPU JS call chain at all: client/core/TerrainBackdrop.js''s initMapspinnerPlanetWebGPU call (line 54) omitted reliefScale entirely (its WebGL sibling call on line 56 passes it), so even the uniform plumbing was missing end-to-end. At tps-game''s reliefScale=0.001 on the R=63600 tiny planet, the WGSL height amplitude was ~1000x too large (up to +183750m / clamped -350000m vs the intended ~750m on a 63.6km-radius planet) -- wildly degenerate per-vertex world positions (h can exceed defRadius many times over, flipping vertex direction through the planet center for very negative h). This plausibly explains the reported hard-clip: extreme/degenerate RTE-relative vertex positions feeding the WebGPU zero-to-one perspective divide produce near-zero/negative or wildly varying clip-space w for a subset of patches, which Dawn/D3D12''s clipper handled differently (hard-discarding) than ANGLE/WebGL''s, independent of camera rotation since the corruption is baked into world-space geometry, not view-dependent -- consistent with the seam surviving a full 90deg camera rotation in the disproven quadtree mutable''s own testing. FIX: added reliefScale as an explicit WGSL param to composeHeight() (bitcast<f32>(paramsU.w), the one param slot unused by every call site: RENDER_WGSL vs_main, height-bake-compute.js bakeMain, and terrain-composeheight-wgsl.js''s own standalone compute main() used by ground-probe-compute.js), replicating GLSL''s exact select(1.0, reliefScale, reliefScale>0.0) semantics; threaded opts.reliefScale (default defRadius/63600000.0, matching gl-render.js''s own default formula) through createComposeHeightParams (patch-grid-render.js), bakeHeightTileTexture (height-bake-compute.js), GroundProbe (ground-probe-compute.js, new _writeParams/setReliefScale), initMapspinnerPlanetWebGPU (planet-orchestrator-webgpu.js), and TerrainBackdrop.js''s WebGPU call site (now passes reliefScale: cfg.reliefScale like its WebGL sibling). LIVE-VERIFIED via gm cdp verb against http://localhost:8099/?singleplayer&world=tps-game&webgpu=1 (SW unregistered + caches cleared this session, confirmed navigator.serviceWorker.controller===false and 0 cached keys before test, real Chromium/D3D12/Dawn WebGPU device, isWebGPURenderer:true): (1) screenshot .gm/witness/clipspace-fix-postedit-1.png shows continuous, correctly-relief-scaled rolling terrain (grass field + rock outcrop + distant hills meeting the horizon) rendering across the FULL screen width from x=0 to x=1295, with zero visible seam anywhere including the previously-reported ~80%-width column; (2) a real copyTextureToBuffer+mapAsync row readback at canvas mid-height (patched GPUCanvasContext.getCurrentTexture + GPUQueue.submit to capture the actual presented swap-chain texture, not a re-render) on the real device found non-uniform terrain-like color content extending to x=1291 of W=1295 (99.7% of screen width, both edges), directly contradicting the prior ''nothing past NDC x~0.5995 (column ~1035)'' finding; (3) zero WebGPU validation errors and gl.errorTotalCount:0 across every dispatch this session, including an explicit device.pushErrorScope(''validation'')/popErrorScope() check after the WGSL edit (bitcast<f32> compiled and ran cleanly on the real Dawn/D3D12 backend).'
