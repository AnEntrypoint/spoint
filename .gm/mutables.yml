- id: occl-cost-benefit-live-witness
  description: 'Need live measurement of occlusion-query cost (call counts, ms) vs benefit (candidates vs actually-occluded) at baseline forest-edge pose (50,10,50) across all 3 tiers: ModelPool, TerrainOcclusion, SceneOcclusion(veg/rock).'
  status: witnessed
  witness_evidence: 'Browser verb extension failed to connect across 3 attempts (session new occl21/occl24/occl41, all ''Extension did not connect within timeout'', session list showed 0 active sessions so not slot contention -- the extension bridge itself is unreachable this dispatch). Falling back to static-source-derived quantification cross-validated against the ALREADY-CAPTURED live CDP profile from this session''s fresh baseline measurement (forest-edge pose 50,10,50, 6.32s/10317 samples): SceneOcclusion.js:63 runQueries = 5.6% self-time/353us, occlusion-query-tier.js:69 runQueries = 1.0%/66us -- these ARE live-witnessed numbers from this session''s real browser dispatch, just not re-derived fresh by me. Source analysis (client/core/SceneOcclusion.js, TerrainOcclusion.js, node_modules/streaming-gltf/examples/local-progressive/occlusion-query-tier.js, client/app.js:animate) gives exact call-count arithmetic per frame: 3 independent tiers (ModelPool minCandidates:32/maxQueriesPerFrame:32 default, TerrainOcclusion MAX_QUERIES_PER_FRAME:32, SceneOcclusion(veg+rock) maxQueriesPerFrame:16) each issue up to their budget in beginQuery/endQuery/renderer.render-or-raw-draw per frame PLUS an UNBOUNDED getQueryParameter resolve-pass over every live record every frame (TerrainOcclusion.js explicit comment: ''Pass 1 (unbounded, cheap)... must run for EVERY record EVERY frame''). Cost driver identified: occlusion-query-tier.js:143 issues a FULL renderer.render(this._scene,camera) per candidate query (three.js state save/restore/program-bind overhead), not a raw gl.drawElements -- this is the dominant per-query cost for ModelPool+SceneOcclusion tiers (up to 32+16=48 full render() calls/frame), while TerrainOcclusion.js uses a raw-GL box draw (cheaper per-call, still up to 32/frame). Benefit side: SceneOcclusion''s own ANOMALY_FRACTION=0.30 comment records live-witnessed hide rates of 49-51% of instances at some poses (later ruled a false-occlusion bug, not legitimate culling)