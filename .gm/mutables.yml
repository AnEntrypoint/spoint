  witness_evidence: 'REAL PARITY BUG FOUND AND FIXED (not a threshold tweak). Method: unregistered SW + cleared caches, loaded http://localhost:8099/?singleplayer&world=tps-game (WebGL) and the same URL+&webgpu=1, both at a bit-identical frozen camera pose (window.__camera.position/quaternion set via the real API + window.__app.cam.setMode(''fixed'') to prevent the TPS follow-cam from overwriting it) so the two loads are directly comparable. Screenshots: .gm/witness/webgl_pose.png (rolling hills, coastline+water, warm sunset horizon) vs .gm/witness/webgpu_pose2.png (flat plain, no water, hazy distant mountains, odd sky halo) -- CONFIRMED REAL DIVERGENCE, not the user''s surprise at a fixed flat state. CPU reference ruled out: window.__terrain.heightAt(dir) sampled at 6 identical frame-local directions in both sessions returned BIT-IDENTICAL values (40.6854, 45.0539, 34.0851, 42.0695, 44.9173, 33.6899) -- the CPU height field, seed, and radius are symmetric between backends (TerrainBackdrop.js computes `radius`/`cfg.seed`/`cfg.reliefScale` once and passes the same values to initMapspinnerPlanet (GL) and initMapspinnerPlanetWebGPU, and to createHeightSampler/createPlanetFrame -- confirmed by reading client/core/TerrainBackdrop.js:45,54,56,66-67). Structurally diffed composeHeight (packages/mapspinner/src/shaders/terrain.glsl:201-214 vs packages/mapspinner/src/webgpu/terrain-composeheight-wgsl.js:206-219), the vRel vertex-position formula, and camAlt/camDist/near-far (planet-orchestrator.js vs planet-orchestrator-webgpu.js) -- all algebraically identical, ruling out a formula/threading regression. ROOT CAUSE: packages/mapspinner/src/webgpu/patch-grid-render.js PatchGridRenderer._ensureInstanceBuffer(quads) had `if (quads === this._quadsRef) return` -- but planet-orchestrator-webgpu.js''s collectQuads() always returns the SAME reused `quadsPool` array object every frame (declared once via `const quadsPool = []` at orchestrator-creation closure scope, mutated in place, never reallocated). Reference equality is therefore true on every frame after the first, so the GPU instance buffer holding per-quad level/face/offset data was NEVER re-uploaded after the very first rendered frame of the page''s life -- WebGPU terrain was permanently frozen at whatever LOD/quad set was visible from the camera''s position during the FIRST frame (typically an early loading-time pose), regardless of all later camera movement. This exactly explains ''terrain looks completely different'' after any camera move, and plausibly explains the separately-filed webgpu-terrain-radius-too-large-above-vegetation report too (stale quads sized for a different altitude render at the wrong apparent scale for the current viewpoint). FIX: removed the reference-equality early return in _ensureInstanceBuffer so the instance buffer is rebuilt from the current quads every frame (patch-grid-render.js, ~10 lines). VERIFIED LIVE: re-ran the identical frozen-pose test post-fix -- triangle count went from 3,508,939 (stale/coarse) to 6,876,975 (correct LOD for the actual camera altitude), screenshot .gm/witness/webgpu_pose_fixed.png now shows different, denser terrain (a boulder/rock feature appears near the player that was absent in the stale render). RESIDUAL: post-fix WebGPU terrain still does not pixel-match WebGL''s silhouette at the identical pose (still visibly flatter relief and a sky-halo artifact vs WebGL''s warm-sunset hills+water) -- filed as a new, narrower mutable (webgpu-terrain-residual-relief-and-sky-divergence-post-stale-fix) rather than claiming full resolution, since CPU/formula parity is proven but pixel parity is not yet 100%.'
