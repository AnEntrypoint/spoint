  desc: 'CONFIRMED root cause via CLEAN high-signal frozen-camera measurement (browser-27): with camera frozen (frozen quaternion, zero motion) and a real close tree trunk overlapping an opaque object, 40-frame region-average toggle: BASELINE 31/40 (strong strict every-other-frame 9<->172 alternation), sun.castShadow=false -> 0/40 (COMPLETELY eliminated), renderer.shadowMap.autoUpdate=true -> 2/40 (nearly eliminated, forces shadow re-render every frame bypassing the parity throttle), terrain-depth-color node disabled -> 6/40 (partial). This is DECISIVE and reproducible: the flicker IS the shadow-map every-2nd-frame update throttle (client/app.js shadow-move-gate: `if (_shadowMoved || _frameParity === 0) renderer.shadowMap.needsUpdate=true` -- shadow map re-renders only every 2nd frame). On the stale-shadow frames the trunk (shadow receiver) is shaded differently than on fresh-shadow frames -> every-other-frame compositing alternation, exactly matching the user''s ''compositing based'' description and the strict 9,172,9,172 static-scene lockstep. WHY EARLIER SESSIONS'' SHADOW FIX WAS WRONGLY REVERTED: the earlier shadow-cadence theory was CORRECT but was tested on a CONTAMINATED/noisy setup (player-avatar blob overlapping the trunk in view via the teleport rig, low-signal noisy toggle counts of 6-8) so autoUpdate=true ''appeared'' to make no difference and the fix was reverted as unproven. The clean frozen-camera high-signal measurement (baseline 31, not 6) now shows autoUpdate=true reduces 31->2 decisively. The CRITICAL methodology lesson: a frozen camera + frozen wind produces a clean high-signal every-other-frame lockstep that isolates parity-throttled mechanisms; the slow-camera-pan toggle-count method was too noisy (boundary-crossing + micro-motion) and hid the real signal. THE FIX: force shadowMap.autoUpdate=true (every-frame shadow, the throttle''s perf saving is not worth a visible every-other-frame flicker on close trees), OR fix the throttle to not leave the shadow stale for a receiver that composites visibly -- but autoUpdate=true is the proven-clean lever (2/40 residual vs 0/40 for no-shadow). Must verify the fix does not tank fps (the throttle exists for perf: re-rendering the shadow map + re-running every InstancedMesh2 BVH cull against the shadow camera every frame).'
