- mutable_id: m-batchedmesh-lod-shadow-capability-gap
  description: Does THREE.BatchedMesh(r183) support per-instance mesh-LOD (addLOD-equivalent), per-instance shadow-LOD distinct from color-pass geometry, and per-instance custom shader uniforms (windPhase/tint), the way InstancedMesh2 does -- required to collapse Vegetation.js's 30 InstancedMesh2 into 2 BatchedMesh without behavior change
  id: mut-1783250329799
  status: witnessed
  witness_evidence: 'browser-6.json + browser-7.json (session 6, live r183 BatchedMesh.prototype toString read from the real running page): (1) BatchedMesh has NO addLOD/addShadowLOD/computeBVH -- confirmed absent from Object.getOwnPropertyNames(BatchedMesh.prototype) (browser-5.json full 37-method list). (2) onBeforeShadow literally delegates to onBeforeRender with the SAME geometry param passed through unchanged -- there is no per-instance shadow-vs-color geometryIndex split; setGeometryIdAt(instanceId,geometryId) sets ONE this._instanceInfo[instanceId].geometryIndex used for both passes (source: ''this._instanceInfo[instanceId].geometryIndex = geometryId''). (3) hasInitUniformsPerInstance=false, hasPerInstanceAttribute=false across the full class source -- BatchedMesh has zero per-instance custom-shader-uniform mechanism; material is one shared instance across the whole batch (materialParamCount=2, ctor takes maxInstanceCount/maxVertexCount/maxIndexCount/material -- one material, not per-instance). CONCLUSION: BatchedMesh cannot represent (a) Vegetation.js''s distinct near-shadow/zero-area-far-shadow LOD split (branch.addShadowLOD(b2shadow,0) + addShadowLOD(makeEmptyGeo(),SHADOW_CAST) -- this NEEDS a shadow-pass geometry independent of the color-pass geometry, which onBeforeShadow''s shared-geometry-param design cannot provide without either (i) forcing color-pass geometry down to shadow-LOD resolution for ALL instances within SHADOW_CAST regardless of their own color LOD (visible-mesh downgrade= visible behavior change), or (ii) running a SECOND BatchedMesh dedicated to shadow-only draws (extra draw-call class + must stay in perfect instance-id sync with the primary -- real added complexity, not a clean collapse), and (b) the per-instance windPhase/tint InstancedMesh2 uniforms, which the wind vertex shader (applyWind, Vegetation.js:39-57) and per-species tint variation read every vertex -- BatchedMesh has no equivalent slot; the only fallback is a per-instance COLOR channel repurposed as tint (Rocks.js''s own setColorAt pattern, already used there for zero-wind static rocks) and a position/id-derived phase (Grass.js''s proven pattern: windPhase derived from instanceMatrix[3].xz, zero per-instance storage) -- windPhase-from-position is a viable substitute (matches Grass.js''s already-shipped approach) but it is a real semantic change in shader derivation, not a mechanical port, and would need its own visual-parity re-verification against the current per-instance-authored windPhase values (VegPlacement.js assigns explicit windPhase per placement, not derived from position -- switching sources could change relative phase between adjacent trees, a visible behavior change the task explicitly asks to avoid).'
