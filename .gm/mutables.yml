- id: m-rock-ceiling-unsound-bound
  description: RockPlacement.js classify() ceiling short-circuit (line 140) computes clustering multiplier as 0.6*(cluster-0.5), the FLAT-ground (slopeRatio=0) clusterStrength, not the true worst-case across all slopeRatio in [0,1). Since clusterStrength=0.6*(1-slopeRatio) DECREASES as slope steepens, and (1+clusterStrength*(cluster-0.5)) is LARGER than (1+0.6*(cluster-0.5)) whenever cluster<0.5 (negative term shrinks toward 0), ceiling underestimates true accept density for cluster<0.5 + steep slope, causing coin>=ceiling to incorrectly early-reject candidates that would have passed coin<accept. Numerically verified worst-case gap accept-ceiling=0.294 at erosion=0.2,humidity=0,elevNorm=0.6,slopeRatio=0.98,cluster=0. This directly explains missing rock coverage on steep cliffs.
  status: witnessed
  witness_evidence: 'src/terrain/RockPlacement.js:140 read live (dbd97c6d state) + numeric check /c/.../scratchpad/check_ceiling.mjs: worst-case accept-ceiling gap = 0.294 at erosion=0.2,humidity=0,elevNorm=0.6,slopeRatio=0.98,cluster=0 -- ceiling''s clustering multiplier (1+0.6*(cluster-0.5)) is NOT a valid upper bound over accept''s (1+clusterStrength*(cluster-0.5)) when cluster<0.5, since clusterStrength=0.6*(1-slopeRatio) shrinks toward 0 as slope steepens making the accept-side reduction smaller (term less negative) than ceiling assumes. Confirmed root cause of steep-cliff rock under-placement: coin>=ceiling early-rejects candidates that coin<accept would have placed.'
