  status: witnessed
  witness_evidence: 'packages/mapspinner/src/webgpu/planet-orchestrator-webgpu.js frame() restructured: ensureOffscreen(w,h) creates an owned mainColorTex+sceneCopyTex (colorFormat, full canvas size, RENDER_ATTACHMENT|TEXTURE_BINDING|COPY_SRC / TEXTURE_BINDING|COPY_DST) alongside the pre-existing depthTex. pass1 (occlusionQuerySet=occlusionProbe.querySet) draws patchGrid.render + sky.render + water.renderVisProbe into mainColorTex/depthTex with pass1.setViewport(0,0,vw,vh,0,1) where vw=round(w*vrs); occlusionProbe.resolve(encoder) + captureSceneCopy(encoder,mainColorTex,sceneCopyTex,w,h) copy the terrain+sky result for water''s refraction sample; pass2 (loadOp ''load'' on both attachments, same sub-viewport) draws water.render blended on top reading sceneCopyTex. vdrsOn=(window.__vdrs===true), vrs=vdrsOn?clamp(window.__vdrsScale,0.3,1.0):1.0, mirroring gl-render.js''s own _vdrsOn/_vdrsRsThisFrame gate verbatim (same window globals, same fixed-full-size-texture + flexed-sub-viewport convention documented in client/core/RenderControls.js''s own vdrsScale doc string, not a smaller offscreen texture). Composite: vdrsOn -> Fsr1Upscale or BilinearUpscale (window.__vdrsUpscaleFsr1 flag, matching gl-render.js''s own flag) sampling mainColorTex at uvScale=vrs into the canvas texture; vdrsOff -> BilinearUpscale at uvScale=(1,1), a literal 1:1 passthrough blit of the full-res offscreen buffer. LIVE-VERIFIED 2026-09-22 via gm cdp verb against the real tps-game world at http://127.0.0.1:8123/?singleplayer&world=tps-game&webgpu=1 (own-started spoint server.js instance, PORT=8123, since the project''s existing dev server had died mid-session): (1) VDRS-OFF path: direct GPU copyTextureToBuffer+mapAsync readback of mainColorTex, 32x32 grid, 1024/1024 samples non-black (blackN=0), waterN=102 samples classified by real RGBA (b>150&&g>150, values clustered at [194,236,248]ish matching water-render.js''s WATER_WGSL fs_main mix(scene,vec3(0.05,0.22,0.38),0.55) pulling toward a tight fixed-tint band -- tight clustering across independently-sampled screen points is itself evidence of the blend formula executing, not raw unblended background), terrainOtherN=922 at real dark-olive terrain color [18-20,25-28,15-16] matching patch-grid-render.js''s fs_main lowColor*lit output. (2) VDRS-ON path (window.__vdrs=true, window.__vdrsScale=0.5): same readback shows blackN=768/1024 (=75.0% exactly, matching the predicted 1-0.5*0.5=0.75 fraction outside the vw=649,vh=406 sub-rect of the full 1297x812 offscreen texture -- an exact quantitative geometric match, not a fuzzy visual judgement), and a second classification restricted to just the vw x vh sub-rect (vdrsOnSubRectClass) shows 0/576 black, waterN=65, terrainOtherN=511 -- terrain AND water both still fully and distinctly rendered within the reduced viewport, confirming the sub-viewport draw is genuinely populated, not degenerate. canvas dimensions stayed fixed at 1297x812 in both branches (renderer.domElement.width/height unchanged), confirming the render-small/present-full convention. (3) Live canvas-texture write confirmed directly: called planet.frame(...) manually with the real player camera''s world position/target/fov (window.__camera, window.__terrain.frame), then immediately (same JS tick, before any further THREE render) read back renderer.backend.context.getCurrentTexture() itself (not just the internal mainColorTex) via copyTextureToBuffer -- 256/256 sampled points were real non-black terrain color [24,55,19], proving the final composite genuinely lands correct pixels on the actual presented canvas texture at draw time. (4) Zero new WebGPU validation/compile errors attributable to water/vdrs code paths across all dispatches (console captured pre-existing unrelated errors only: [weather] createBuffer, MeshBasicNodeMaterial DXC compile failures, oversized uniform-buffer bindings -- none mention water-render/vdrs-composite/patch-grid pipeline labels). A separate, pre-existing architecture gap was found and filed separately (webgpu-planet-canvas-color-not-persisted-across-threejs-render): a later real game-loop screenshot shows the canvas''s terrain/sky/water region reverting to black once THREE''s own subsequent scene-color RenderGraph node renders player/scene objects, despite the hasTerrain->autoClear=false guard in client/core/RenderGraph.nodes.js:157-168 -- this predates and is independent of this fix (the original terrain+sky-only direct-to-canvas draw had the identical exposure before water/VDRS were wired in), is the color-sibling of the already-filed webgpu-planet-depth-not-shared-with-three-scene mutable, and does not block this mutable''s resolution since the composite pipeline itself (water+VDRS wiring, the literal scope here) is proven correct by direct GPU-level readback both of the internal buffer and of the live canvas texture at draw time.'
- id: webgpu-planet-depthwriteback-empty-colorattachments-mismatch
  obligation_kind: invariant
  subject: 'packages/mapspinner/src/webgpu/planet-orchestrator-webgpu.js frame(), the host-depth-writeback block added concurrently by sibling session gm-tsl-convert-20260922-depthinterop (gated on window.__hostNearFar && renderer.backend.textureUtils.getDepthBuffer): the depthPass is opened with colorAttachments: [] (empty array) but depthWriteback''s pipeline (vdrs-composite.js DepthWriteback, built via MapspinnerPipelineCache.getPipeline(''depth-writeback-colormask-off'', ...)) unconditionally declares fragment.targets: [{format: colorFormat, writeMask: COLOR_WRITE_NONE}] (pipeline-cache.js getPipeline always builds exactly one non-null fragment target regardless of hasDepth/colorWrite state) -- a render pass with 0 color attachments against a pipeline declaring 1 target is a count mismatch, which WebGPU validates at passEncoder.setPipeline() (async validation error, not a thrown JS exception) inside depthWriteback.render(). Also: DepthWriteback.render() destructures only {srcDepthTexture, uvScaleX, uvScaleY, depthEps, srcNear, srcFar, dstNear, dstFar} from its opts -- the caller''s extra depthFormat: sharedDepthTexture.format field is silently ignored (JS destructuring drops unlisted keys), so if THREE''s real shared depth buffer format ever differs from the DepthWriteback instance''s construction-time depthFormat (''depth24plus'', set at planet-orchestrator-webgpu.js''s own new DepthWriteback(device,{pipelineCache,depthFormat:''depth24plus''}) call), the depthStencilAttachment format will also mismatch the pipeline''s fixed depthStencil.format. Not verified live this session (window.__hostNearFar was never set in the tested world config, so this branch never executed during webgpu-planet-water-vdrs-not-wired''s live verification) -- needs a browser witness with window.__hostNearFar actually set by the host integration to confirm whether these are real firing validation errors or a false read of the WebGPU spec''s color-target-count rule.'
  session_id: gm-tsl-convert-20260922-waterintegrate
  status: witnessed
  witness_evidence: 'Confirmed STALE, superseded by a later sibling-session fix -- not a live bug. Read current packages/mapspinner/src/webgpu/pipeline-cache.js:76,97 (getPipeline): ''const depthOnly = !!opts.depthOnly'' and ''targets: depthOnly ? [] : [{format:colorFormat,...}]'' -- fragment.targets is already [] when depthOnly is set. vdrs-composite.js DepthWriteback._pipelineFor (line ~310) calls pipelineCache.getPipeline(''depth-writeback-colormask-off'', {..., depthOnly:true, ...}), so its pipeline has fragment.targets:[], matching planet-orchestrator-webgpu.js frame()''s depthPass colorAttachments:[] (line 250) exactly -- zero count mismatch. The mutable''s second concern (DepthWriteback.render() silently dropping opts.depthFormat via destructuring) is also already fixed: render(passEncoder, {srcDepthTexture,...,depthFormat}) destructures depthFormat and uses it via this._pipelineFor(depthFormat || this.depthFormat) (vdrs-composite.js line ~320), and the call site passes depthFormat: sharedDepthTexture.format explicitly. Live-verified via gm browser verb against http://localhost:8099/?singleplayer&world=tps-game&webgpu=1 (real Chromium D3D12/Dawn backend) with window.__hostNearFar genuinely set ({near:0.3,far:2000}, confirmed live) so the depthPass branch executes every frame: captured full console output across two independent page loads and 1500+ real device.queue.submit calls -- zero WebGPU validation/compile errors mention ''depth-writeback'', ''vdrs-'', ''fullscreen-blit'', or ''patch-grid'' pipeline labels; all captured errors (MeshBasicNodeMaterial DXC E_FAIL, oversized uniform buffer bindings) are pre-existing, independently-tracked, unrelated issues per mem-c7568d0f1fd78ff1-3104 and mem-e9a22e8f3f32501f-5861.'
- id: webgpu-planet-canvas-color-not-persisted-across-threejs-render
  obligation_kind: invariant
  subject: 'packages/mapspinner/src/webgpu/planet-orchestrator-webgpu.js frame()''s final composite (bilinearUpscale/fsr1Upscale writing terrain+sky+water into renderer.backend.context.getCurrentTexture()) DOES write correct real pixel data to the live canvas GPUTexture -- live-verified 2026-09-22 by calling planet.frame(...) directly in the real tps-game ?webgpu=1 world and immediately copyTextureToBuffer-reading renderer.backend.context.getCurrentTexture() straight after: 256/256 sampled points were non-black terrain color (24,55,19), matching patch-grid-render.js''s fs_main lit output exactly. BUT a full-page screenshot taken moments later (after the game''s own next requestAnimationFrame tick ran client/core/RenderGraph.nodes.js''s ''scene-color'' node, which calls ctx.renderer.render(ctx.scene, ctx.camera) with ctx.renderer.autoClear temporarily set false when ctx.terrainBackdrop is truthy, lines 157-168) shows the sky/terrain region as solid black while THREE-drawn scene objects (player mesh, platform, minimap HUD) remain correctly visible on top -- meaning mapspinner''s own canvas draw is being discarded by the time the frame is presented, despite the hasTerrain->autoClear=false guard. Root cause NOT yet isolated (candidates: THREE.WebGPURenderer''s canvas render path may use an internal MSAA texture + resolveTarget=canvasTexture whose resolve loadOp is not governed by the JS-level autoClear flag the way it is for a plain non-MSAA canvas colorAttachment; or ctx.terrainBackdrop may not yet be set at the RenderGraph node''s run() call under the WebGPU boot path''s async init ordering, defeating the hasTerrain check silently). This is the color-buffer sibling of the already-filed webgpu-planet-depth-not-shared-with-three-scene mutable (same file, same ''mapspinner draws straight to the live canvas context but THREE''s own subsequent scene render does not correctly compose with it'' architecture gap) and predates this session''s water/VDRS wiring -- the original terrain+sky-only draw (before water-render.js/vdrs-composite.js were wired in) had the identical direct-to-canvas structure and the identical theoretical exposure, so this is not a regression introduced by webgpu-planet-water-vdrs-not-wired''s fix, it is a pre-existing gap this session''s live full-loop screenshot happened to surface. Next step: instrument client/core/RenderGraph.nodes.js''s scene-color node with a live probe (log ctx.terrainBackdrop truthiness + renderer.autoClear value at the exact run() call under ?webgpu=1), and inspect THREE.WebGPURenderer''s actual canvas-target render pass descriptor (backend.js _colorAttachments/resolveTarget construction) for whether loadOp is genuinely wired to autoClear on the WebGPU backend the same way it is on WebGL.'
  session_id: gm-tsl-convert-20260922-waterintegrate
  status: witnessed
  witness_evidence: 'Real root cause found (not the autoClear/loadOp/MSAA-canvas-resolve hypothesis, which was disproven live: renderer.currentSamples measured 0 at runtime, not 4). Live-inspected node_modules/three@0.185.1/src/renderers/common/Renderer.js: renderer.needsFrameBufferTarget is true (tone mapping + sRGB output color space active, confirmed live: toneMapping=4, outputColorSpace=''srgb''), so THREE''s scene render targets an internal offscreen RenderTarget (Renderer.js:1425 _getFrameBufferTarget(), a real RGBA16F MSAA(4x) target, confirmed live via renderer._getFrameBufferTarget()+renderer.backend.get(...).msaaTexture), never the canvas directly. After the scene pass, Renderer.js:1813 _renderOutput() draws a fullscreen opaque ''Output Color Transform'' NodeMaterial quad from that offscreen target into the canvas -- this quad pass unconditionally covers every canvas pixel every frame regardless of autoClear (the comment at Renderer.js:1864 confirms autoClear is force-overridden for this specific pass), so whatever planet-orchestrator-webgpu.js previously wrote directly into renderer.backend.context.getCurrentTexture() was always discarded by this quad, independent of the client/core/RenderGraph.nodes.js autoClear=false guard (which only ever affected THREE''s OWN scene pass, never this output stage). Fixed in packages/mapspinner/src/webgpu/planet-orchestrator-webgpu.js by adding resolveThreeOwnedColorTarget(renderer, colorFormat): when renderer.needsFrameBufferTarget, obtain the real GPU resource via renderer._getFrameBufferTarget() + renderer.backend.get(fbTarget.texture) and draw into its .msaaTexture (matching format+sampleCount) instead of the canvas, so mapspinner''s terrain/sky/water become part of the SAME buffer THREE''s own scene draws (loadOp=''load'', autoClear=false) into and later resolves+tonemaps to canvas; falls back to the canvas MSAA companion (backend.textureUtils.getColorBuffer()) or the raw canvas texture when no framebuffer target exists. pipeline-cache.js''s getPipeline() gained sampleCount support (multisample descriptor + cache-key dimension); vdrs-composite.js''s BilinearUpscale/Fsr1Upscale RCAS pass gained per-call sampleCount+colorFormat pipeline variants (mirroring DepthWriteback''s existing lazy-pipeline pattern) since the framebuffer target''s format (rgba16float) differs from the canvas''s (bgra8unorm/preferred format). Live-verified via gm browser verb against http://localhost:8099/?singleplayer&world=tps-game&webgpu=1, REAL full game loop (never a manual planet.frame() call): patched GPUQueue.prototype.submit to copyTextureToBuffer-readback an NxN grid of renderer.backend.context.getCurrentTexture() on every real submit, grouped by GPUTexture object identity to isolate per-frame submit sequences. Across 9 independently-sampled real animation frames (post-cleanup confirmation batch: texId 118/119/120, each 3 submits/frame; earlier confirmation batch: texId 175-180, 6 frames, 8x8=64-point grid), the FIRST submit of every frame shows 100% black samples (canvas untouched pre-THREE, confirming mapspinner no longer writes there directly) and the LAST submit of every frame (after THREE''s scene pass + output/tonemap quad) shows 0% black samples with real varied terrain/sky/water/scene colors (e.g. [116,115,61],[40,79,48],[82,109,132]) -- reproduced identically across all sampled frames, zero flakiness. Prior to the fix, the same grouped-by-frame methodology on the original code showed the opposite pattern (first submit already non-black from mapspinner''s direct canvas write, last submit 58% black, i.e. the reported bug).'
- id: webgpu-meshbasicnodematerial-dxc-compile-crash
  obligation_kind: precondition
  subject: 'Live-reproduced 2026-09-22 via gm browser verb on http://localhost:8099/?webgpu=1 (tps-game world, real Chromium D3D12/DXC backend): THREE.WebGPURenderer fails to compile ANY freshly-instantiated THREE.MeshBasicMaterial (auto-converted to MeshBasicNodeMaterial) -- ''Render pipeline creation failed (renderPipeline_MeshBasicNodeMaterial_N): DXC compile failed with error: E_FAIL'', reproduced with zero relation to mapspinner/depth code (fires even in scenes with none of this session''s test objects present, tied to some pre-existing scene object, likely a HUD/crosshair reticle mesh). This silently blocks ANY ad-hoc MeshBasicMaterial-based THREE.Mesh from ever rendering under ?webgpu=1 (confirmed across SphereGeometry+MeshBasicMaterial and Sprite+SpriteMaterial-with-CanvasTexture attempts, both invisible at their exact projected screen pixel across 150-270 sampled frames each, while terrain''s own dithered gradient colors sampled correctly at the same pixels). This is the same class of risk AGENTS.md already flags (''shader-compatibility audit not yet done -- see webgpurenderer-primary-renderer-switch-staged-rollout''), now witnessed concretely: MeshBasicMaterial specifically is broken, not just an abstract risk. Also witnessed alongside: ''Binding size (262144) of [Buffer ...UniformBuffer_N_(vertex)] is larger than the maximum uniform buffer binding size (65536)'' recurring every frame for some other object (likely an InstancedMesh2 vegetation/crowd buffer sized for the old WebGL path), and ''THREE.NodeBuilder: Material "ShaderMaterial" is not compatible.'' / ''Color target has no corresponding fragment stage output but writeMask is not zero'' for ShaderMaterial-based objects (same-shape bug class as the one fixed in mapspinner''s own pipeline-cache.js this session: a declared color target with no matching fragment-shader output). None of these three are caused by or related to packages/mapspinner/src/webgpu/*; all reproduced identically with mapspinner''s depth-sharing fix applied or reverted.'
  session_id: gm-tsl-convert-20260922-depthinterop
  status: witnessed
  witness_evidence: 'Re-witnessed independently via gm browser verb (real Chromium D3D12/Dawn/DXC backend) against http://localhost:8099/?webgpu=1, same as original report: passively captured ''THREE.WebGPURenderer: Render pipeline creation failed (renderPipeline_MeshBasicNodeMaterial_430): DXC compile failed with error: E_FAIL'' during ordinary page load/idle simulation (no test code executed yet). WebGPUPipelineUtils.js:208 shows the pipeline label is `renderPipeline_${material.name||material.type}_${material.id}` -- 430 is THREE.Material''s own global auto-increment id, i.e. the 430th material constructed app-wide, not a special/unique material. Root-cause investigation: (1) fresh single MeshBasicNodeMaterial via three/webgpu, plain color -- 0 errors. (2) QuadMesh+MeshBasicNodeMaterial with a texture-sampling colorNode/uv/Fn TSL graph, matching BloomWebGPU.js/SSAOWebGPU.js/FSR1WebGPU.js/SSRWebGPU.js''s exact material-construction shape (depthTest:false,depthWrite:false,transparent,blending) -- 0 errors across a full render. (3) plain THREE.MeshBasicMaterial+SphereGeometry and THREE.Sprite+SpriteMaterial+CanvasTexture (matching the original report''s own repro description) added to the live scene and rendered -- 0 errors. (4) DecalSystem.js pools 64 decalMat.clone() + 24 tracerMat.clone() (88 distinct Material ids, all scene.add()-ed at boot, matching the ''material id in the low hundreds'' range) -- reproduced that exact pattern with 90 cloned MeshBasicMaterial instances rendered individually -- 0 errors, 0 DXC failures across all 90 compiles. Conclusion: the crash is REAL (independently reproduced once, unprompted, with byte-identical error text to the original report) but is NOT deterministically tied to MeshBasicNodeMaterial as a class, to any of BloomWebGPU/SSAOWebGPU/FSR1WebGPU/SSRWebGPU''s actual material-construction code (their exact shape was live-retested and compiles cleanly), or to the DecalSystem clone-pool pattern under repeated stress. A shader-logic or code-shape bug would fail deterministically on every compile of the same WGSL; this fails roughly 1-in-many-hundreds against byte-identical shader source recompiled repeatedly, which is the signature of an intermittent GPU-driver/DXC-compiler race under Dawn''s D3D12 backend on this machine, not a project or three.js@0.185.1 defect. Searched GitHub (api.github.com/search/issues on mrdoob/three.js and microsoft/DirectXShaderCompiler) for DXC/E_FAIL/MeshBasicNodeMaterial -- zero matching upstream issues found to cite; Chromium''s own issue tracker API required auth and could not be queried. Classification: environment-level (Windows D3D12/DXC driver flake), NOT project-fixable, NOT reliably reproducible, and NOT confirmed to affect the 4 already-shipped WebGPU effects (their exact material shapes were re-tested live and did not crash). No code change made -- there is nothing in this codebase to fix; a workaround (e.g. wrapping pipeline creation in retry-on-E_FAIL) would be speculative since the failure could not be forced to reproduce on demand.'
- id: webgpu-thc-sample-consumption-path-untested
  subject: The 2026-06-15 WebGL2 THC net-negative finding was specifically about the MAIN RENDER's FS-cost-shift from SAMPLING the baked height pool (texture() filtered fetch replacing per-vertex composeHeight), not about bake-production cost. webgpu-thc-bake-perf-vs-webgl2-thc (resolved 2026-09-22) only measured bake-PRODUCTION cost (height-bake-compute.js compute dispatch vs gl-render.js ensureBake/drawBakeTile draw), which is net-positive for WebGPU (~10x lower GPU time). packages/mapspinner/src/webgpu/patch-grid-render.js's fragment shader does NOT sample any height pool (placeholder derivative-normal lambert shading only, hpfPool/sculptTex bound as zero-filled placeholders per its own witness mut-1790056440108) -- there is no WebGPU equivalent of THC's textureLoad-from-pool sampling path built or measured yet, so whether the ORIGINAL net-negative mechanism (FS cost shift during sampling, not baking) would recur under WebGPU remains completely unknown. Do not treat the bake-perf resolution as clearing THC for live-path adoption on its own.
