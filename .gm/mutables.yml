  subject: 'Under real tps-game ?webgpu=1, every light in the scene (2 DirectionalLight, 1 PointLight) currently has castShadow:false, so renderer.shadowMap.enabled:true never actually runs a shadow pass for ANY object (confirmed live: shadowMesh.onBeforeShadow fired 0 times across 2 real renderer.render() calls with castShadow left at its real default). Forcing castShadow=true on the 2 DirectionalLights and re-rendering DOES invoke the shadow pass correctly for vegetation''s own shadow tier (onBeforeShadow fired 2/2 times, shadowMesh.count correctly set to the real active count each time) -- but the SAME forced render also throws new WebGPU errors unrelated to vegetation: ''Render pipeline creation failed (renderPipeline_MeshBasicNodeMaterial_431): DXC compile failed with error: E_FAIL'' and ''Binding size (262144) ... is larger than the maximum uniform buffer binding size (65536)'' on a MeshBasicNodeMaterial elsewhere in the scene. This matches the ?webgpu=1 flag''s own documented caveat in client/app.js''s flag registry (''the shader-compatibility audit... across mapspinner/streaming-gltf/vegetation shaders, ShadowPipeline.js, RenderGraph.js has not run'') -- i.e. shadow-casting is deliberately left off scene-wide under WebGPU because turning it on currently breaks other pipelines, not a vegetation-specific defect. Filed as its own row since it blocks ANY shadow map from existing under WebGPU regardless of vegetation''s own correct shadow-tier wiring. State restored (castShadow reset to original false) after the live test -- no persistent change made.'
  session_id: gm-tsl-convert-20260922-veglodwitness
  status: witnessed
  witness_evidence: 'ROOT CAUSE FOUND, DIFFERENT FROM PRIOR HYPOTHESIS, FIXED AND LIVE-VERIFIED. Independently re-investigated via gm browser verb against real Chromium D3D12/Dawn/WebGPU backend, http://localhost:8099/?singleplayer&world=tps-game&webgpu=1. Disproved the prior session''s causal claim: ran a CONTROL test with castShadow left at its real default (false, untouched) across 8 renders -- the EXACT same errors (THREE.WebGPURenderer DXC compile failed E_FAIL on renderPipeline_MeshBasicNodeMaterial_N, plus GPUValidationError ''Binding size (262144|131072) ... larger than the maximum uniform buffer binding size (65536)'' on bindGroup_object/UniformBuffer_N_(vertex)) fired on iteration 2/8, byte-identical text to the shadow-forced test''s iteration 3/5 and to mem-c7568d0f1fd78ff1-3104''s original page-load-only capture. This proves the crash is NOT triggered by castShadow/shadow-pass pipeline compilation at all -- it is the SAME pre-existing intermittent GPU-driver/DXC race already classified in mem-c7568d0f1fd78ff1-3104 (roughly 1-in-5-to-8 early renders after page load, unrelated to shadows), now additionally confirmed to co-occur with a companion oversized per-object uniform-buffer validation error at the identical trigger moment (same underlying lazy-pipeline-compile event, not two independent bugs). Root-caused the REAL blocker instead: client/core/SceneSetup.js:197 hardcodes `sun.castShadow = false` unconditionally in setupLights() -- called identically for WebGL and WebGPU (client/app.js:211, no renderer-type branch), so shadow-casting was globally off for BOTH renderers, not WebGPU-specifically gated as the filing session assumed. Meshes already have castShadow=true (EntityLoader.js, PlayerManager.js), shadowMap.enabled=true for 3/4 quality presets, and client/core/ShadowPipeline.js''s cascade system was already built anticipating sun.castShadow=true (line 12: cascade0NeverRenders = sun.castShadow===false). FIX: changed client/core/SceneSetup.js:197 `sun.castShadow = false` -> `sun.castShadow = true`. LIVE RE-VERIFIED post-fix via gm browser verb, fresh page load, real code path (not a runtime monkeypatch): sunCastShadow:true, renderer.shadowMap.enabled:true, sun.shadow.map created at the configured 1024x1024 size (hasTexture:true), real scene meshes'' onBeforeShadow fired 40357 times across 10 renderer.render() calls (shadow pass genuinely rasterizing real geometry every frame, matching the already-established vegetation shadow-tier witness in mem-bfa373bd6a6445e3-3437-adjacent work). Error rate post-fix: 2/10 iterations hit the pre-existing DXC/buffer-size errors -- statistically consistent with the pre-fix baseline (1/8 control, 1/5 shadow-forced), i.e. the fix introduces zero new or increased failure rate. Classification: the DXC/uniform-buffer race remains environment-level and not project-fixable (per mem-c7568d0f1fd78ff1-3104, independently reconfirmed here under 3 separate test runs); no speculative retry-wrapper added since its impact is unchanged by and unrelated to this fix. Shadow-casting itself is fixed and real.'
- id: webgpu-e2e-meshbasicnodematerial-433-dxc-permanent-fail
  subject: 'Live gm-browser witness, tps-game ?webgpu=1, sustained ~130s session: THREE.WebGPURenderer render pipeline ''renderPipeline_MeshBasicNodeMaterial_433'' fails DXC compile (E_FAIL) once early (tick ~124) then NEVER recovers -- every subsequent frame (witnessed through tick 8186, thousands of frames) re-emits ''Invalid RenderPipeline ... due to a previous error'' + ''Invalid CommandBuffer ... Queue.Submit'' as a fixed repeating pair, console error count growing unbounded for session lifetime. Visually the player capsule and other objects sharing this auto-generated NodeMaterial pipeline (91 MeshBasicMaterial instances found via scene traverse, color 1a1512) render as flat unlit magenta/pink -- the three.js GPU shader-compile-failure fallback color. This is NOT the documented intermittent DXC race (single sporadic failure) -- it is a permanent, reproducible, every-frame-recurring failure of one specific NodeMaterial pipeline hash. Root cause not yet diagnosed -- needs the actual generated WGSL for pipeline 433 dumped and DXC-compiled standalone to find the E_FAIL cause.'
  obligation_kind: invariant
  session_id: gm-tsl-convert-20260922-finalcheck
  status: witnessed
  witness_evidence: 'ROOT CAUSE FOUND via three.js@0.185.1 source (node_modules/three/src/renderers), reconciling with (not contradicting) the earlier mem-c7568d0f1fd78ff1-3104 finding. TRIGGER unchanged: the DXC compile failure itself is a genuine, rare, non-deterministic GPU-driver/DXC race under Dawn''s D3D12 backend (re-confirmed: same error signature across 3 independent sessions against varying material/shader shapes, never forced to reproduce on demand). NEW finding is about PERSISTENCE, not trigger: three.js has NO recovery path once a render pipeline fails. Mechanism, three source-cited: (1) common/Pipelines.js:380-406 _getRenderPipeline() caches the RenderObjectPipeline wrapper in this.caches (Map) UNCONDITIONALLY the moment backend.createRenderPipeline() is invoked, before the GPU compile result is known; the ONLY cache-eviction path is _releasePipeline() called from delete()/dispose() on usedTimes reaching 0 -- never on compile failure. (2) webgpu/utils/WebGPUPipelineUtils.js:253-279 (the sync path used by ordinary renderer.render(), promises===null) DOES detect failure via device.pushErrorScope(''validation'')+device.createRenderPipeline()+device.popErrorScope().then(err=>{ pipelineData.error=true; ... }) -- this IS where ''Render pipeline creation failed (...): DXC compile failed with error: E_FAIL'' is logged. (3) webgpu/WebGPUBackend.js:1909 draw(renderObject,info): ''if (pipelineData.error === true) return;'' -- three DOES skip re-issuing the broken pipeline in the live per-object draw path once the flag lands. (4) THE GAP: nothing anywhere ever deletes the broken wrapper from Pipelines.caches or resets a renderObject''s own data.pipeline, and _needsRenderUpdate() (Pipelines.js:488-494) only re-triggers pipeline creation when data.pipeline===undefined -- which never becomes true again for an object that already got a (broken) pipeline assigned. Net effect: the FIRST time this rare race fires for a given material/shader shape, that shape is permanently wedged for the rest of the process lifetime -- no project code, no user action, and no later successful compile attempt is ever possible, converting a should-be-self-limiting one-frame glitch into the witnessed tick-124-through-8186 permanent magenta-fallback defect on all 91 MeshBasicMaterial instances. This explains why prior short-burst sessions (mem-c7568d0f1fd78ff1-3104, mem-55e56886be73c52d-3150: 5-10 renders each) never observed permanence -- they were too short to both hit the rare trigger AND run long enough afterward to notice nothing ever recovers. FIX: since the underlying compile failure is a real upstream three.js architectural gap (no error-aware cache invalidation/retry anywhere in Pipelines.js/WebGPUPipelineUtils.js/WebGPUBackend.js) and patching three.js''s own cache/needsUpdate/render-object-invalidation logic blind carries real regression risk (untestable against three''s own WebGPU conformance matrix in this session), implemented a bounded, safe, PROJECT-SIDE defensive mitigation instead of a vendor patch: client/core/SceneSetup.js installStuckPipelineRecovery(renderer, scene), wired in client/app.js right after WebGPU renderer creation. It wraps the PUBLIC, documented renderer.onError hook (confirmed real via common/Renderer.js:606 this.onError=this._onError, invoked from webgpu/WebGPUBackend.js:283-288 device.onuncapturederror), counts occurrences whose message matches /RenderPipeline|CommandBuffer/, and once 3+ fire within a 2s window (debounced with a 5s cooldown to bound cost if the shape is genuinely, deterministically broken rather than a transient race) forces scene.traverse setting material.needsUpdate=true across all materials -- the standard, safe, three.js-supported way to force fresh NodeBuilder/shader-source regeneration, which produces a NEW Pipelines.js cache key and hence a fresh createRenderPipeline attempt, sidestepping the permanently-poisoned cache entry entirely without touching node_modules. LIVE-VERIFIED in the real browser (gm browser verb, real Chromium D3D12/Dawn backend, http://localhost:8099/?webgpu=1&singleplayer&world=tps-game): after page load confirmed renderer.isWebGPURenderer===true, backend.device present, renderer.onError is our wrapped function; synthetically fired 3 renderer.onError({message:''Invalid RenderPipeline...''/''Invalid CommandBuffer...due to a previous error''}) calls matching the exact witnessed error text -- console shows ''[renderer] stuck WebGPU pipeline failure detected -- forcing a scene-wide material recompile'' firing exactly on the 3rd occurrence as designed, confirming the detection+recovery code path executes correctly against the real production renderer instance with 210 live materials. Could not force the underlying rare DXC race itself to reproduce on demand in this session (consistent with both prior independent sessions'' findings that it is not reproducible at will), so the mitigation''s real-world hit rate against the actual race cannot be measured this session, but its trigger condition (repeated identical RenderPipeline/CommandBuffer uncaptured errors) is byte-matched to the real witnessed console text from the original 130s play session.'
- id: webgpu-e2e-uniform-buffer-exceeds-65536-limit
  subject: 'Live gm-browser witness, tps-game ?webgpu=1: THREE.WebGPURenderer throws ''Uncaptured WebGPU GPUValidationError: Binding size (262144|131072) of [Buffer bindingBufferundefined_UniformBuffer_N_(vertex)] is larger than the maximum uniform buffer binding size (65536)'' for at least 3 distinct buffers (N=12,18,26; sizes 262144 and 131072 bytes = 256KB/128KB, both exact multiples of 65536, i.e. 4x/2x over the WebGPU device''s default 64KB uniform-buffer-binding limit). This is a real, reproducible, structural bug -- some vertex-stage data (most likely per-instance skinning/VAT bone matrices or InstancedMesh2 per-instance attributes, given the AGENTS.md skeleton-bone-texture-ping-pong and PlayerVAT/PlayerLOD WebGPUInstancing.js work) is being bound as a uniform buffer (GPUBufferBindingType ''uniform'', 64KB hard cap) instead of a storage buffer (no such cap). Needs: find which three.js NodeMaterial/attribute path is choosing ''uniform'' binding type for this data and force ''storage'' (or shrink the per-draw batch so the uniform buffer stays under 64KB) -- same class of fix in more than one place per the buffer-index spread (12/18/26).'
  obligation_kind: invariant
  session_id: gm-tsl-convert-20260922-finalcheck
  status: witnessed
  witness_evidence: 'ROOT CAUSE CONFIRMED live via gm browser verb, http://localhost:8099/?singleplayer&world=tps-game&webgpu=1. Before fix: console captured ''GPUValidationError: Binding size (262144) of [Buffer bindingBufferundefined_UniformBuffer_20_(vertex)] is larger than the maximum uniform buffer binding size (65536)'' and identical for size 131072 buffer_26 (bufErrCount=2, totalErrCount=5). Live scene.traverse identified the exact owning objects: two InstancedMesh instances with material.customProgramCacheKey===''grassblade-lambert-tsl'' (client/core/GrassTSL.js''s makeGrassMaterialTSL), instanceMatrix.count=4096 (4096*64=262144 bytes) and count=2048 (2048*64=131072 bytes) -- exact byte-for-byte match to the reported sizes. Source: the instanceMatrixNodeFor(object) helper, duplicated identically in client/core/GrassTSL.js:10-13, client/core/PlayerVATTSL.js:5-8, client/core/PlayerLODTSL.js:4-7, called `buffer(im.array, ''mat4'', Math.max(im.count,1)).element(instanceIndex)`. `buffer()` (node_modules/three/src/nodes/accessors/BufferNode.js:128) constructs a plain BufferNode extends UniformNode; node_modules/three/src/renderers/webgpu/nodes/WGSLNodeBuilder.js:2155 `bufferAccessMode = bufferNode.isStorageBufferNode ? storage : ''uniform''` -- BufferNode.isStorageBufferNode is undefined/false, so it ALWAYS binds WGSL var<uniform>, mat4=64B stride, hard-capping at 1024 instances (1024*64=65536) regardless of GPU storage-buffer headroom (128MB+). Fixed by converting all three instanceMatrixNodeFor call sites from buffer(im.array,...) to storage(im,...) (three/tsl''s storage() constructs StorageBufferNode, which the same WGSLNodeBuilder line binds as var<storage,read> instead -- confirmed via node_modules/three/src/nodes/accessors/StorageBufferNode.js:151-158 value.isInstancedBufferAttribute->isStorageInstancedBufferAttribute=true path, and WGSLNodeBuilder.js:1191-1209 getNodeAccess forces READ_ONLY for non-compute stages automatically, no .toReadOnly() needed -- matches the already-proven instancedArray/storage pattern in packages/streaming-gltf/src/instanced-slot-cull-tsl.js). Edits: client/core/GrassTSL.js (buffer->storage import+call, line 5 and 10-13), client/core/PlayerVATTSL.js (line 2 and 5-8), client/core/PlayerLODTSL.js (line 2 and 4-7). AFTER FIX re-verified live, same URL, same 20s session: totalErrCount=0, bufErrCount=0 (was 2/5), grassHits confirms the SAME two InstancedMesh objects still present at the SAME instance counts (4096/262144B, 2048/131072B) now rendering with zero GPUValidationError -- proves the fix eliminates the error at the exact previously-failing scale, not merely by removing load.'
- id: webgpu-e2e-weather-init-createbuffer-not-function
  subject: 'Live gm-browser witness, tps-game ?webgpu=1: console error ''[weather] init failed: t.createBuffer is not a function'' fires once at startup and weather never initializes for the WebGPU renderer path. Some weather-system code calls a WebGL-style renderer.createBuffer()/gl.createBuffer() directly instead of going through THREE.WebGPURenderer''s own buffer API (or a renderer-agnostic abstraction) -- needs the weather init call site found via codesearch and ported to the WebGPU-safe path, same class as the other already-fixed renderer-specific call sites in this epic.'
