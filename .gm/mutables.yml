- mutable_id: trunk-flicker-is-universal-close-trunk-shadow-acne-not-rock-overlap
  desc: 'USER GROUND-TRUTH CORRECTION (overturns the rock-overlap theory): the flicker happens to ALL close trunks ALWAYS, nothing to do with rocks. So the ''trunk-overlaps-rock'' correlation I measured (browser-13/16/22) was itself noise/artifact -- NOT the real pattern. Combined with the one reliable finding (sun.castShadow=false ALWAYS kills it), this points to a UNIVERSAL close-trunk shadow artifact: the branch (trunk) mesh is a shadow RECEIVER, and at close range its self-shadow (or the shadow cast onto it) produces SHADOW ACNE that flickers frame-to-frame as the shadow map re-renders. This is a real, single, fixable shadow parameter (shadow.bias / shadow.normalBias / PCF radius / the trunk material''s shadowSide), NOT a per-object z-fight and NOT MSAA-compositing-against-rocks. My earlier bias A/B (browser earlier this chain) showed no effect BUT was on the contaminated/noisy single-tree setup. FIX APPROACH (per the just-written wfgy lesson: pose-robust, not single-tree noisy): sweep sun.shadow.bias / normalBias / radius across MULTIPLE close trunks with paired per-trunk A/Bs (measure each trunk''s toggle at baseline AND at each candidate value in the SAME dispatch, so run-to-run noise cancels), find the value that reduces toggling across ALL sampled trunks, verify it doesn''t break shadows elsewhere (no peter-panning / shadow detachment). branchMat.shadowSide=THREE.FrontSide is already set (Vegetation.js buildSpecies) -- check if FrontSide vs BackSide vs DoubleSide for the shadow pass changes the acne. status unknown until the pose-robust sweep runs.'
  status: witnessed
  id: mut-1783762947008
  witness_evidence: 'POSE-ROBUST testing across 4 distinct close trunks (browser-33/35/36/37/38, each a paired same-dispatch A/B so run-to-run noise cancels). CONFIRMED: the flicker is UNIVERSAL to all close trunks (user ground-truth) and shadow-caused (sun.castShadow=false -> 0/30 on ALL 4 trunks, rock-solid). RULED OUT as fixes (all noisy/inconsistent across the 4 trunks): shadow.bias (-0.002), shadow.normalBias (2.0), shadow.radius (0), branch material shadowSide (BackSide/DoubleSide), trunk receiveShadow (already false -- the branch mesh does NOT receive shadows). The ONE CONSISTENT lever: branch/trunk mesh castShadow=false reduced flicker on ALL 4 trunks (browser-37: 19->4, 3->2, 6->2, 2->2) -- i.e. the trunk PARTICIPATING IN THE SHADOW-CASTER PASS is what causes it, not receiving/bias/PCF. MECHANISM: the shadow pass re-runs every InstancedMesh2 BVH cull against the shadow camera (per SceneSetup/app.js comments); on this ANGLE-D3D11 4x-MSAA stack that per-frame shadow-caster path is non-deterministic frame-to-frame, so the trunks contribution to/rendering-with the shadow map flickers. NO TUNABLE SHADOW PARAMETER FIXES IT -- only removing shadow-casting (globally via sun.castShadow, or per-mesh via branch.castShadow) reliably stops it, both with a visual cost (trunks stop casting ground shadows). SHIPPABLE OPTIONS: (a) reduce the veg SHADOW_CAST distance (Vegetation.js, default 35m) so close trunks... no, close is exactly where it shows; (b) accept the artifact (minor, close trunks only) and document; (c) needs a GPU frame-capture to see the non-deterministic shadow-caster set, beyond pixel-toggle. Surfacing to user for the ship/accept decision rather than shipping a lossy trunk-no-cast change unilaterally.'
