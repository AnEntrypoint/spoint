  detail: 'Partial investigation of user-reported grass flickering (surfaced mid-turn alongside the tree fade bug). client/core/Grass.js''s own comment (line 234-235) explicitly states ''grass has no LOD hysteresis'' for the near/mid blade-geometry tier split (LOD_NEAR_DIST, commitChunk ~line 118-126) -- but tier assignment happens ONCE per chunk commit (loaded.has(key) guards re-commit while already loaded, streamRing ~line 195-225), so a loaded chunk cannot flip tiers while it stays loaded; the flicker is NOT a per-frame tier re-evaluation race as first hypothesized. Ruled out via static read, not yet live-witnessed. Remaining candidates not yet checked: (1) the still-camera cull-freeze mechanism (line 227+, ported from Vegetation.js, re-arms only on real movement -- Vegetation.js''s own history notes a PRIOR periodic-re-arm bug caused ''visible tree flashing at hysteresis boundaries'', so check whether Grass.js''s port has the same class of bug); (2) chunk load/unload hysteresis itself (DROP_MARGIN=16, ringRadius/dropRadius) -- verify live whether a chunk near the ring edge unloads+reloads repeatedly as the player moves normally, which WOULD flip its LOD tier on reload if position differs enough; (3) the vertex-shader ring-fade (mentioned at line 56, blade scale fade near ringRadius) for a possible discontinuity/pop at the fade boundary distinct from the LOD tier question. Needs live browser-verb reproduction (position player, watch a specific chunk''s tier/loaded-state across small movements) before any fix -- this repo''s own doctrine forbids threshold tuning without root-causing first.'
  status: witnessed
  witness_evidence: 'Live browser-verb witness (cdp-gm-grass-witness-2.json): grass.profile.loads/unloads climb continuously and monotonically (27->69 loads, 22->64 unloads) across just 15 small back-and-forth player position changes (dx swept -46..+46m from a fixed landing spot), even for tiny +/-5m and +/-8m moves that should be well inside both the render-distance ring (44m) and its drop-margin hysteresis (+16m) -- real chunk churn (unload+reload) is happening on movements that should not cross either boundary, which is the most likely direct mechanism behind the user-reported flicker (a chunk repeatedly dropping and re-streaming shows as blades popping in/out). SEPARATE anomaly also found: grass._im (the near-tier LOD mesh, distance<LOD_NEAR_DIST=8m) has instancesCount=0 at every single tested position including directly at the landing spot (dx=0, well within 8m) -- every blade is landing in the mid tier (_imMid) instead, meaning the near/mid LOD split itself may be non-functional (a second, distinct defect, not yet root-caused -- possibly the per-chunk center-point tier check at commitChunk almost never resolves useMid=false because a 32m-wide chunk''s CENTER is rarely within 8m of the player even when the player is standing inside that chunk). Neither defect''s exact trigger (why is a chunk within the ring unloading) has been root-caused to a specific line yet -- needs a live trace of one specific chunk key''s loaded/unloaded transitions correlated with exact px,pz vs ringRadiusSq/dropRadiusSq at each streamRing() call, not just the aggregate counters this pass measured.'
