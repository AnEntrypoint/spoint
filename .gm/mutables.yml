- id: sceneocclusion-fullrecord-resolve-scan
  status: witnessed
  description: SceneOcclusion.runQueries (client/core/SceneOcclusion.js:63) rebuilds a fresh candidates array + Set + Map every frame unconditionally by concatenating Vegetation/Rocks/Grass's cached getOcclusionCandidates() arrays (candidate count = ALL loaded chunks, not budget-limited). Additionally the vendored OcclusionQueryTier.runQueries (node_modules/streaming-gltf/examples/local-progressive/occlusion-query-tier.js:76) iterates this._records (every entity EVER seen, unbounded, not round-robin-budgeted) every frame to poll gl.getQueryParameter for pending queries. Matches fresh CDP profile SceneOcclusion.js:63 runQueries at 5.6%/353us self-time. Need live candidate-count witness to size real fix (throttle SceneOcclusion's per-frame candidate rebuild to only refire when a subsystem's loaded-set actually changed, since each subsystem already caches _occCands and nulls it on change -- SceneOcclusion currently ignores that signal and always calls getOcclusionCandidates() + does full Set/Map rebuild even when nothing changed).
  witness_evidence: 'Read client/core/SceneOcclusion.js:63-70 (runQueries): every frame it unconditionally does `for (const {subsystem} of subsystems) candidates.push(...subsystem.getOcclusionCandidates())` -- a fresh array concat of every registered subsystem''s FULL current candidate list, every frame, regardless of whether any subsystem''s loaded-chunk-set actually changed since last frame. Read node_modules/streaming-gltf/examples/local-progressive/occlusion-query-tier.js:76-86 (runQueries resolve pass): `for (const [entity, rec] of this._records)` iterates EVERY entity ever seen by this tier instance (no eviction inside the tier itself; SceneOcclusion.js''s own separate _streaks/_lastCandByKey release-on-drop logic at lines ~95-103 evicts the TIER''s record via tier.release(), so _records does stay bounded to the live streamed set over time, not truly unbounded across a whole session -- correcting the mutable''s unbounded claim: it is bounded to CURRENT live candidate count, not entities-ever-seen). Live candidate count could not be measured this dispatch (browser extension unreachable, 3 attempts, session list confirmed 0 active sessions so not contention -- environment-level bridge failure). Static sizing: forest-edge pose loads a bounded ring (Vegetation.js ringRadius = renderDistance+40 default 680m) of chunks; each getOcclusionCandidates() call on Vegetation/Rocks/Grass is itself an O(loadedChunks) array build (not cached across calls within a frame either) since SceneOcclusion.runQueries calls it fresh once per subsystem per frame -- so the real per-frame cost is O(3 x loadedChunks) array/Set/Map churn plus O(liveRecords) getQueryParameter polls, scaling with STREAMED WORLD SIZE not gameplay-relevant candidate count. This matches the profiled SceneOcclusion.js:63 runQueries self-time (5.6%/353us) being the 3rd-highest JS-self-time entry in the whole frame. Confirmed real (not hypothetical) cost; fix requires each subsystem to expose a changed-since-last-call signal (Vegetation.js/Rocks.js/Grass already null their internal _occCands cache on chunk load/unload per the sibling mutable''s own description) and SceneOcclusion.runQueries to skip the candidates rebuild + Set/Map churn on an unchanged frame, reusing the last-built candidate list/Set. Deferred to the fix-phase agent owning occlusion-query-tier-raw-webgl2-bypass or a sibling PRD row -- this mutable''s job (characterize + confirm real) is done; live before/after ms delta needs a working browser session, currently unavailable this dispatch.'
