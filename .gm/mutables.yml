  witness_evidence: 'PART1 ROOT-CAUSE FIX: client/service-worker.js''s DEP_CACHE_NAME (/node_modules/,/vendor/) and ASSET_CACHE_NAME (.wasm/.glb/.vrm/.ktx2/.hf) tiers used _cachedWithRevalidate (stale-while-revalidate: ALWAYS serves the cached response first, refetches in background only for the NEXT load) -- packages/mapspinner (edited directly per project/workspaces-merged-packages) is served via /node_modules/mapspinner/ per project/statichandler-path-containment''s node_modules symlink exemption, so every edit to packages/mapspinner/src/webgpu/*.js was served stale on the very next reload, exactly matching gm-tsl-convert-20260922-viewportfix''s reported symptom. SHELL_FILES used an equivalent cache-first pattern. FIX (client/service-worker.js): added DEV=/^(localhost|127.0.0.1|\[::1\]|0.0.0.0)$/.test(self.location.hostname) (line 8) and a new _networkFirst(cacheName,req) helper (fetch first, cache the fresh response, fall back to cache only on fetch failure/offline) -- lines 99/103/109 now branch DEV?_networkFirst(...):_cachedWithRevalidate(...)/cache-first, so production (a real github.io domain, scripts/static-export.mjs) keeps its existing offline-first caching untouched while any localhost/127.0.0.1/[::1]/0.0.0.0 dev server always prefers network. No comments added. LIVE-VERIFIED via gm browser verb, http://localhost:8099/?singleplayer&world=tps-game: edited client/style.css body background to #010203 (a real client file), did an ORDINARY page navigation (no manual unregister()/caches.delete()) -- confirmed navigator.serviceWorker.controller active with scriptURL=service-worker.js (real SW in control, not bypassed), fetch(''/style.css'') (both default and no-store cache modes) returned the fresh #010203 content (STYLE_FETCH_HAS_MARKER/DEFAULT_FETCH_HAS_MARKER both true), and the spoint-shell-v3 Cache Storage entry itself was also verified updated to the fresh content (CACHE_ENTRY_HAS_MARKER true) so even an offline fallback would no longer serve pre-edit byt