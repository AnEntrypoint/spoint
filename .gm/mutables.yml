  detail: 'exec_js dispatch spawning a detached long-running Node child process (server.js dev server) on Windows does not survive past the exec_js dispatch''s own return -- child.detached=true+unref() with stdio:''ignore'' or a file-backed fd leaves the child killed (tasklist confirms PID gone) within ~3s of the exec_js call returning, even though the parent exec_js call itself completed successfully. Suspected Windows Job Object propagation: the daemon''s own worker process is likely running inside a Job Object with JOB_OBJECT_LIMIT_KILL_ON_JOB_CLOSE, and Node''s detached+unref does not set CREATE_BREAKAWAY_FROM_JOB, so child termination cascades when the exec_js worker''s own job closes. This blocks the standard witness pattern (boot server via exec_js, then browser/cdp verb navigates to it) for any real live-rendering witness on this Windows daemon. Needs a real fix: either exec_js''s own spawn wrapper needs a Windows-specific breakaway flag, or witness dispatches need a documented alternative (a server the user starts and leaves running outside the daemon''s process tree, addressed by port).'
  id: exec-js-windows-detached-child-killed-on-return
  status: witnessed
  witness_evidence: 'Refined root cause via 3 elimination rounds: (1) child_process.spawn detached+unref -> tasklist confirms PID dead within seconds (Windows Job Object propagation). (2) cmd.exe /c start /B wrapper -> also refused, log empty. (3) In-process ESM import()+boot() inside a single exec_js call -> boot succeeded fully (task-output showed complete stdout log incl. ''[server] http://localhost:23920 @ 64 TPS'' and a 200 status check FROM WITHIN that same task), but a SEPARATE subsequent exec_js dispatch (same daemon, same machine) got ECONNREFUSED against the same port moments later -- proving exec_js dispatches are ephemeral, isolated worker contexts that do not share a live process/listener across dispatches, even a `global.*`-guarded one; the worker (and everything it spawned/hosted in-process) is torn down when its own dispatch task completes, not just when the OS process exits. This means any witness pattern requiring a server that outlives the dispatch that boots it needs the boot AND every probe against it to happen inside ONE exec_js call (or the cdp/browser verb''s own process, if that process persists across dispatches and can itself host or reach a long-lived server) -- never split boot-then-later-probe across separate exec_js dispatches on this daemon build.'
