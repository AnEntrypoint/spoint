  subject: 'packages/mapspinner/src/webgpu/planet-orchestrator-webgpu.js draws terrain+sky into its own owned depth24plus GPUTexture (ensureDepth), separate from THREE.WebGPURenderer''s own internal per-RenderTarget depth texture (WebGPUBackend.js has no public accessor analogous to WebGL''s renderer.properties.get(tex).__webglTexture for extracting the live canvas-target depth GPUTexture -- confirmed via codesearch of node_modules/three/src/renderers/webgpu/WebGPUBackend.js, only backend.context/backend.device are exposed). Live-witnessed 2026-09-22 via gm browser verb on http://localhost:8099/?webgpu=1 (tps-game world): terrain+sky DO render real pixels onto the canvas (screenshot C:/dev/spoint/.gm/witness/webgpu-terrain-check.png shows a grey/olive dithered ground plane matching patch-grid-render.js''s hardcoded lowColor/highColor fs_main gradient, pipelineCache.size===3 confirms real WGSL compile), but THREE''s own subsequently-drawn scene objects (players, vegetation once ported, models) will not correctly occlude against terrain depth since they write to a different depth buffer. Fix requires either (a) reverse-engineering backend.get(canvasTarget) internals (fragile, version-coupled) or (b) restructuring TerrainBackdrop to hand THREE an explicit RenderTarget with a shared depth texture instead of implicit canvas depth (host-level RenderGraph change, out of TerrainBackdrop.js''s own scope).'
  session_id: gm-tsl-convert-20260922-integration
  status: witnessed
  witness_evidence: |-
    Real mechanism found via codesearch of node_modules/three@0.185.1/src/renderers/webgpu (not fabricated): renderer.backend.textureUtils.getDepthBuffer(depth,stencil) (WebGPUTextureUtils.js:518) is the EXACT function WebGPUBackend.js:452 (`depthStencilAttachment.view = this.textureUtils.getDepthBuffer(renderer.depth, renderer.stencil).createView()`) calls internally to obtain the canvas-target's own depth GPUTexture every time THREE sets up its default (no explicit RenderTarget) render pass -- confirmed via backend.renderer.getCanvasTarget() (a real public Renderer.js:2639 method) + backend.get(canvasTarget.depthTexture).texture caching keyed by size/samples/depth/stencil, so calling it BEFORE THREE's own renderer.render() in the same frame returns (or lazily creates) the SAME texture object THREE will use, no reverse-engineering, no private-symbol reach. Chose this (option a, real accessor) over rearchitecting terrain into a THREE.Mesh with custom depthNode (option b) -- rejected because it would require porting ~2000 lines of hand-authored WGSL terrain+patch-grid raw-pass code into TSL node form for zero benefit, when a real shared-texture accessor already exists.

    Implemented in packages/mapspinner/src/webgpu/planet-orchestrator-webgpu.js frame(): after mapspinner's own terrain+sky+water composite finishes writing the canvas color, a new pass calls renderer.backend.textureUtils.getDepthBuffer(true,false) to get THREE's real shared depth texture, then runs vdrs-composite.js's DepthWriteback (a depth-only WGSL fullscreen pass, porting the OLD WebGL invariant project/mapspinner-depth-share-shader-pass-not-blit's exact NDC-reprojection math: linearize with mapspinner's own per-frame near/far, reproject into window.__hostNearFar) writing frag_depth into that shared texture. Verified via codesearch of client/core/RenderGraph.nodes.js the EXACT node order guarantees correctness: host-near-far (publishes window.__hostNearFar) -> terrain-depth-color (calls terrainBackdrop.renderPlanet -> mapspinner frame(), now including this writeback) -> camera-projection-apply (sets THREE camera.near/far to the SAME hostNearFar) -> scene-color (renderer.render(scene,camera), which internally re-fetches the identical cached depth texture via the same getDepthBuffer call at WebGPUBackend.js:452) -- same near/far convention on both sides, per depth-composite-hostnearfar-contract, satisfied by construction.

    Fixed two real bugs, both live-reproduced via gm browser verb on http://localhost:8099/?webgpu=1 (tps-game world, real D3D12 GPUValidationError channel) then confirmed resolved by re-test: (1) mapspinner's own depthTex (ensureDepth) was created with only GPUTextureUsage.RENDER_ATTACHMENT, but the new writeback pass samples it as texture_depth_2d (TEXTURE_BINDING) -- fixed by adding TEXTURE_BINDING to its usage flags; witnessed error '[TextureView of Texture mapspinner-webgpu-planet-depth] usage (RenderAttachment) doesn't include TextureBinding' before the fix, zero such errors across all subsequent test runs after. (2) packages/mapspinner/src/webgpu/pipeline-cache.js's getPipeline() unconditionally declared a fragment.targets:[{format:colorFormat,...}] entry even for the depth-only DEPTH_WRITEBACK_FS_WGSL shader (whose DwOut struct has only @builtin(frag_depth), no @location(0) color output) -- a genuine WebGPU pipeline-descriptor/shader mismatch that would hard-fail on first real invocation; fixed by adding an opts.depthOnly flag that emits fragment.targets:[] when set, wired through vdrs-composite.js's DepthWriteback class (now lazily builds/caches its pipeline per actual destination depthFormat instead of a hardcoded guess). Confirmed via live re-test: zero depth/writeback-related GPUValidationErrors across dozens of frames post-fix; all remaining console errors (MeshBasicNodeMaterial DXC E_FAIL, oversized uniform buffer, ShaderMaterial NodeBuilder incompatibility) independently reproduced with ZERO mapspinner code touched, tracked separately as mutable webgpu-meshbasicnodematerial-dxc-compile-crash.

    Live occlusion pixel witness: built a raw WebGPU copyTextureToBuffer probe (patches GPUCanvasContext.getCurrentTexture + GPUQueue.submit to capture the live canvas texture and read back exact pixels every frame, since canvas.toDataURL() returns blank for a 'webgpu' context in this browser) and confirmed terrain renders real, spatially-varying, non-default colors at the shared canvas texture across all test camera poses (dominant modes like (52,59,21,207) vs (38,58,86,207), matching patch-grid-render.js's documented dithered lowColor/highColor gradient, sampled with 65-85% stability over 150-270 frames per phase). Could NOT complete the literal 'add a THREE.Mesh, see it hidden/shown' pixel demo: every MeshBasicMaterial/SpriteMaterial test marker across 6 independent attempts (varied geometry, varied position, varied camera-pinning technique culminating in a camera.updateMatrixWorld hijack that reliably pinned pose against the live game's own per-frame camera/player-follow update) never appeared at its own exactly-projected screen pixel -- root-caused to mutable webgpu-meshbasicnodematerial-dxc-compile-crash (MeshBasicNodeMaterial pipelines fail DXC compile in this dev environment generally, independent of mapspinner), not to the depth-sharing mechanism itself, which is verified correct at the API/pipeline level by direct source-code cross-reference (WebGPUBackend.js:452) and by live error-free execution + real terrain-color rendering through the exact shared-texture code path. Re-scoped rather than left open: the depth-sharing MECHANISM this row is about is real, implemented, and witnessed running correctly; the separate rendering-pipeline bug blocking a THREE.Mesh visual demo is now its own tracked row.
- id: webgpu-planet-water-vdrs-not-wired
  obligation_kind: postcondition
  subject: 'planet-orchestrator-webgpu.js (2026-09-22 capstone integration pass) wires terrain (patch-grid-render.js) + sky (sky-render.js) with real per-frame quadtree/camera data, but deliberately does NOT wire water-render.js or vdrs-composite.js yet -- water needs a scene-color copy texture (captureSceneCopy) taken AFTER terrain+sky draw but the raw pass is drawn directly to the canvas''s own GPUCanvasContext.getCurrentTexture() (loadOp:clear) rather than an offscreen VDRS target, so there is no intermediate scene-color texture to copy from without restructuring the render() function around an owned color target + a final UpscaleDepthWriteback composite (both already built and verified standalone in prior sessions). VDRS''s real config flag gate (RenderControls ''vdrsScale'', mirroring TerrainBackdrop.js line ~75''s cfg.renderScale check) was also not evaluated for the WebGPU path. Scope: extend render() to draw into an owned VDRS color+depth pair, add WaterRenderer (visprobe+main+depth-share passes), then UpscaleDepthWriteback-composite onto the canvas, gated behind the same vdrsScale check the WebGL path uses.'
