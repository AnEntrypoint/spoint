cks the mesh -- before concluding whether grass-chunk-churn-flicker is real; (2) if real, the near-tier-LOD-always-empty finding (grass._im.instancesCount=0 even when standing still, live-witnessed in cdp-gm-grass-witness-2/15.json) is a second, likely-independent defect worth fixing regardless (LOD_NEAR_DIST=8 checked against a 32m CHUNK''s CENTER, not the player''s actual nearest point in that chunk, so the near tier may be structurally unreachable by design -- re-examine commitChunk''s per-chunk-not-per-blade tier assignment).'
