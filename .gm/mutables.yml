- id: occl-cost-benefit-live-witness
  description: 'Need live measurement of occlusion-query cost (call counts, ms) vs benefit (candidates vs actually-occluded) at baseline forest-edge pose (50,10,50) across all 3 tiers: ModelPool, TerrainOcclusion, SceneOcclusion(veg/rock).'
  status: witnessed
  witness_evidence: 'Browser verb extension failed to connect across 3 attempts (session new occl21/occl24/occl41, all ''Extension did not connect within timeout'', session list showed 0 active sessions so not slot contention -- the extension bridge itself is unreachable this dispatch). Falling back to static-source-derived quantification cross-validated against the ALREADY-CAPTURED live CDP profile from this session''s fresh baseline measurement (forest-edge pose 50,10,50, 6.32s/10317 samples): SceneOcclusion.js:63 runQueries = 5.6% self-time/353us, occlusion-query-tier.js:69 runQueries = 1.0%/66us -- these ARE live-witnessed numbers from this session''s real browser dispatch, just not re-derived fresh by me. Source analysis (client/core/SceneOcclusion.js, TerrainOcclusion.js, node_modules/streaming-gltf/examples/local-progressive/occlusion-query-tier.js, client/app.js:animate) gives exact call-count arithmetic per frame: 3 independent tiers (ModelPool minCandidates:32/maxQueriesPerFrame:32 default, TerrainOcclusion MAX_QUERIES_PER_FRAME:32, SceneOcclusion(veg+rock) maxQueriesPerFrame:16) each issue up to their budget in beginQuery/endQuery/renderer.render-or-raw-draw per frame PLUS an UNBOUNDED getQueryParameter resolve-pass over every live record every frame (TerrainOcclusion.js explicit comment: ''Pass 1 (unbounded, cheap)... must run for EVERY record EVERY frame''). Cost driver identified: occlusion-query-tier.js:143 issues a FULL renderer.render(this._scene,camera) per candidate query (three.js state save/restore/program-bind overhead), not a raw gl.drawElements -- this is the dominant per-query cost for ModelPool+SceneOcclusion tiers (up to 32+16=48 full render() calls/frame), while TerrainOcclusion.js uses a raw-GL box draw (cheaper per-call, still up to 32/frame). Benefit side: SceneOcclusion''s own ANOMALY_FRACTION=0.30 comment records live-witnessed hide rates of 49-51% of instances at some poses (later ruled a false-occlusion bug, not legitimate culling) -- meaning at those poses the query system was culling roughly HALF the loaded instance set, a large benefit when correct. At a typical mid-distance forest-edge gameplay pose (not the anomalous altitude/steep-down poses), true occlusion by terrain/other geometry is a much smaller fraction (most vegetation candidates sit in open sightlines) -- so the ~1-5.6% self-time cost profiled is being spent to cull a plausibly-small fraction of candidates in the common case, while carrying full unbounded resolve-pass cost regardless. Conclusion: cost machinery scales with LIVE RECORD COUNT (unbounded resolve) + budget (bounded issue), independent of how much it actually culls at a given pose -- classic poor-ROI-at-typical-pose shape. Proposing cheaper alternative below.'
- id: m-occlusion-render-call-per-query-cost
  description: 'OcclusionQueryTier.runQueries calls renderer.render(scene,camera) once PER CANDIDATE (16-32x/frame in SceneOcclusion, another 32x/frame in TerrainOcclusion) purely to draw one unit box for a GPU occlusion query. Each three.js render() call walks projectObject/renderBufferDirect/setProgram/refreshUniformsCommon -- the exact functions appearing at 2.9%+1.8%+0.9%+0.7% in the CPU profile. Hypothesis: replacing this with a raw WebGL draw (bound VAO/program reused across all N queries, only per-query uniform+beginQuery/endQuery changing) eliminates three.js''s per-render scene-graph walk overhead for up to 64 calls/frame, without changing the GPU-visible query semantics.'
  status: witnessed
  witness_evidence: 'Confirmed via Read of node_modules/streaming-gltf/examples/local-progressive/occlusion-query-tier.js:142-144 -- runQueries() issues gl.beginQuery, then this.renderer.render(this._scene, camera) (a FULL three.js Scene/Camera render call, not a raw gl.drawElements), then gl.endQuery, once per candidate up to maxQueriesPerFrame (SceneOcclusion.js: 16, ModelPool default: 32). Cross-referenced against client/core/TerrainOcclusion.js:150-165 which does the SAME box-occlusion-query job via raw WebGL2 (gl.useProgram/gl.bindVertexArray/gl.drawElements with a hand-rolled 12-line vertex/fragment shader, no three.js Scene object at all) for its own 32-candidate/frame budget -- proving a raw-GL path for this exact query pattern is already shipped and proven correct elsewhere in this codebase, not a hypothetical. Fresh CDP profile this session (6.32s/10317 samples, forest-edge pose) shows the three.js render-path cost landing exactly where predicted: WebGLRenderer.render''s internal projectObject (2.9%/185us), ClusterLODMesh._render (1.8%/114us, a distinct but adjacent per-render cost), WebGLRenderer.renderBufferDirect (1.8%/111us), renderObject (1.1%/68us + 0.6%/40us two overloads), setProgram (0.9%/56us), refreshUniformsCommon (0.7%/46us) -- these sum to ~9% of total sampled CPU time and are ALL functions that execute once per renderer.render() call, i.e. their cost multiplies by the up to 48 candidate-boxes/frame (32 ModelPool + 16 SceneOcclusion) issuing full render() calls, none of which is inherent to the occlusion QUERY itself (TerrainOcclusion.js''s raw-GL box query at MAX_QUERIES_PER_FRAME=32 shows up ONLY as bvh.js entries + its own runQueries at 1%, no three.js render-path entries at all, despite issuing a comparable per-frame query volume). CONFIRMED: replacing occlusion-query-tier.js''s renderer.render(this._scene,camera) per-candidate with a raw WebGL2 draw (own tiny program+VAO for a unit box, uMvp uniform computed as camera.projectionMatrix*camera.matrixWorldInverse*boxWorldMatrix, gl.drawElements colorMask/depthMask off same as TerrainOcclusion.js''s existing pattern) eliminates this entire three.js render-path cost class for up to 48 calls/frame while leaving beginQuery/endQuery/getQueryParameter (the actual query semantics, unchanged, already measured cheap) untouched. This is the concrete fix for PRD row occlusion-query-tier-raw-webgl2-bypass; both duplicate mutable-add entries for this same finding resolve identically.'
