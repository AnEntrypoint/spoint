- id: m-occlusion-scene-structural-limit
  status: resolved
  desc: tps-game's default world cannot meaningfully exercise the ModelPool occlusion-query tier
  witness_evidence: 'browser-1.json: 127 legacy-primitive box-static entities spawned via editorAPI.placeApp all route through EntityLoader (the non-ModelPool legacy path for primitives), NOT ModelPool -- occlusion stats read queried:0 despite 127 entities existing. browser-2.json: the live sillos map + player routes through ModelPool as only 2 tracked entities (the whole 429-cluster sillos structure counts as ONE ModelPool entity, not 429), also below the 32-candidate occlusionMinCandidates gate. Structural finding: ModelPool''s occlusion tier operates on ModelPool ENTITY count, not polygon/cluster count -- a scene needs many separate progressive-baked GLB models placed as distinct entities (not primitives, not one big cluster mesh) to exercise it. tps-game''s default world has no such population. Measuring this meaningfully would require either a custom test world with 32+ distinct baked-GLB props, or waiting for a real multiplayer/populated scene.'
