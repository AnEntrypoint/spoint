- id: m-veg-merge-disproven
  status: resolved
  text: 'Full species merge for Vegetation.js branch/leaf meshes DISPROVEN via static library-source read (no live witness needed for this determination). Two independent, each-individually-fatal reasons: (1) @three.ez/instanced-mesh''s InstancedMesh2.addLOD(geometry, material, distance, hysteresis) [node_modules/@three.ez/instanced-mesh/src/core/feature/LOD.d.ts] takes exactly ONE geometry per LOD level -- there is no per-instance geometry-id selection within one InstancedMesh2''s LOD ladder, so 15 species'' distinct branch/leaf geometries cannot share one InstancedMesh2+LOD-ladder; the only multi-geometry primitive in the stack is THREE''s own BatchedMesh (used by Rocks.js), which (2) has ZERO LOD support (grep for LOD|addLOD|lod in node_modules/three/src/objects/BatchedMesh.js: 0 matches) and no per-instance custom shader uniform mechanism (BatchedMesh only exposes setColorAt, a plain vertex color -- confirmed by grep for setUniformAt/initUniformsPerInstance across the entire @three.ez/instanced-mesh src tree: those symbols exist ONLY in InstancedMesh2''s own Uniforms feature, never in three''s BatchedMesh). Vegetation.js''s per-instance windPhase+tint sway (applyWind''s onBeforeCompile reading shader.uniforms + per-instance uniformsTexture) is load-bearing for the wind-sway visual and depends entirely on InstancedMesh2''s uniformsTexture feature. Merging species into a Rocks.js-style BatchedMesh would therefore: lose per-instance wind sway entirely (no replacement primitive), require hand-rolling a from-scratch LOD system (per-instance geometry-id reassignment as distance changes, which BatchedMesh''s addInstance-time geometry binding does not cheaply support per-frame), and hand-rolling an equivalent shadow-LOD -- failing all three of the standing directive''s must-preserve properties (wind uniforms, per-species LOD-hysteresis, per-species shadow-casting). CONCLUSION: no safe full-merge path exists with the current library stack; veg-species-merge-feasibility and veg-merge-implement-if-safe both close as DISPROVEN, not implemented.'
  witness: 'node_modules/@three.ez/instanced-mesh/src/core/feature/LOD.d.ts:76 (addLOD single-geometry signature); node_modules/three/src/objects/BatchedMesh.js grep for LOD pattern: 0 matches; grep for setUniformAt|initUniformsPerInstance across node_modules/@three.ez/instanced-mesh/src: only Uniforms.d.ts/js + SquareDataTexture + InstancedEntity.js, never BatchedMesh; client/core/Vegetation.js:39-57 applyWind (per-instance windPhase/tint depends on InstancedMesh2.initUniformsPerInstance/setUniformAt, called at :219/:426-428); client/core/Rocks.js:73,145 (BatchedMesh''s only per-instance visual data is setColorAt, a flat tint, not a shader uniform)'
