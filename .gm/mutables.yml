- id: m-far-trees-poke-fix-verified
  status: resolved
  text: 'Root-caused and fixed far-trees-poke-through-terrain-camera-angle. Reproduced live via low-camera-height (eyeY=groundY+1.6m) pitch sweep 0->0.5rad at pose (129.9,1.55,75) facing a real tree cluster 40-160m away: pitch 0/0.1/0.2 showed normal color, pitch 0.3 showed first dark-teal patches at horizon, pitch 0.4-0.5 showed progressively worse flat dark-teal-blue silhouette tint on distant vegetation AND a static rock (screenshots ps0-ps5.png, ps5_full.png in .gm/). Sampled pixel color (30,71,95)/255 = (0.118,0.278,0.373) closely matches client/core/SceneSetup.js installUnderwaterTint''s replace color vec3(0.04,0.34,0.52), the only mechanism in the codebase producing this color signature, applied globally via THREE.ShaderChunk patching (affects vegetation real-mesh, impostor, AND plain MeshStandardMaterial rock uniformly). Verified reconstructed vSpointWorldY math is numerically exact for one real tree sample (error ~0), so the bug is not in the world-Y recovery formula itself, but the raw zero-deadband compare (vSpointWorldY < SPOINT_SEA_Y) has no safety margin against small interpolation/precision error at grazing view angles for large/oblique polygons (billboards, rock top faces) -- exactly the geometry class and view regime (low camera + high pitch = grazing angle to near-ground geometry) that reproduced the bug. FIX: added SUBMERGE_MARGIN_M=2.0 deadband -- tint now only fires when vSpointWorldY < SPOINT_SEA_Y - 2.0, costing nothing for legitimate full submersion. LIVE VERIFIED: identical pose (129.9,1.549,75) pitch=0.5 after fix+page reload shows normal-colored trees (screenshot after_fix_pitch5.png, status bar confirms cam 129.9,1.5,75.0) -- tint completely gone at the exact reproducing pose. Residual honesty note: could not achieve 100%-certain GLSL-level root cause (e.g. exact interpolation mechanism) due to severe multi-agent contention on the shared browser-verb session this pass (dozens of cross-talk dispatches from concurrent sessions landing on my