- id: webgpu-terrain-hardclip-seam-not-viewport-or-cull
  subject: 'Live-reproduced the vertical seam (~80% screen width, terrain/green on left, uniform pale sky-color on right, hard 1px-precise boundary) via gm browser verb at http://localhost:8099/?singleplayer&world=tps-game&webgpu=1. RULED OUT with concrete live evidence: (1) canvas/viewport size mismatch -- GPURenderPassEncoder.prototype.setViewport monkeypatched, every real-frame call logged exactly ''1295x808@0,0'' or ''1297x812@0,0'' (full canvas, matches renderer.domElement.width/height and ctx.getCurrentTexture() and renderer._getFrameBufferTarget() every time, zero partial viewports/scissors ever set). (2) devicePixelRatio -- forced renderer.setPixelRatio(1), canvas backing buffer shrank to 1036x647, seam persisted at the exact same relative screen position. (3) app-level frustum culling -- temporarily bypassed quadOutsideFrustum() entirely in planet-orchestrator-webgpu.js''s collectQuads (edit reverted after test), reloaded fresh (tick ~2000, first-load, before any leak/dither accumulates), seam still present identically. (4) NOT a world-geometry/building-edge artifact -- loaded the SAME world/tick range WITHOUT ?webgpu=1 (WebGL renderer), same call site (TerrainBackdrop.js renderPlanet -> planet.frame with identical _eye/_tgt/fovy/up args), terrain+sky render perfectly continuously to 100% width, no seam, confirming this is WebGPU-renderer-specific, not a level-design gap. DIRECT PROOF the defect is baked into mapspinner''s own raw offscreen render target (not a THREE/canvas compositing or screenshot artifact): read back mainColorTex (the orchestrator''s own pre-blit WebGPU texture, exposed via window.__terrain.planet.mainColorTex()) with copyTextureToBuffer at mid-height -- texture was 1297x812, columns x=100..1036 uniformly RGB~(10,23,8) (terrain green), columns x=1037..1290 uniformly RGB~(230,248,252) (pale sky), transition exactly between x=1036 and x=1037 (79.9% of 1297). Sky pass uses pipelineDepthTested (LEQUAL-style vs depthClearValue=1.0), so the uniform sky-color region proves terrain literally wrote NO depth/color there (real missing coverage, not a wrong-shading bug). aspect(=w/h=1.597), fovy(=1.222rad=70deg), and w/h passed into ensureOffscreen/collectQuads/perspectiveZeroToOne are self-consistent within the same frame() call (verified live) so a stale-aspect race was also ruled out. SEPARATELY DISCOVERED, real and unrelated: an active service worker (navigator.serviceWorker.controller = http://localhost:8099/service-worker.js) was serving a STALE cached copy of packages/mapspinner/src/webgpu/planet-orchestrator-webgpu.js to the live page even after the on-disk file changed and a full page navigation was performed -- unregistering it + caches.delete() was required before an edited module took effect. This likely also explains why some prior sessions'' fixes may not have visibly landed in witness screenshots without them knowing to clear it; matches AGENTS.md''s own service-worker-full-url-keys-network-first-nav caveat, worth revisiting as its own item. ROOT CAUSE NOT YET FOUND: with culling disabled and aspect/w/h/fovy all confirmed correct and self-consistent, the missing terrain coverage on the right ~20% of NDC-x must come from either (a) the quadtree (qt.updateQuadtree/computeSplitDist) genuinely not generating leaf quads covering that screen region for this camera pose under the WebGPU orchestrator''s own collectQuads (a SEPARATE hand-written implementation per-renderer, not literally shared with planet-orchestrator.js''s WebGL equivalent -- only the cull PRIMITIVES in planet-orchestrator-cull.js are shared), or (b) a hardware near/far-plane clip discarding valid quad geometry due to nearFarForCam''s dynamic near/far interacting badly with M4.mul(proj,viewRel) for this pose. NOT investigated: dumping the actual per-face qt.updateQuadtree() leaf list and its raw NDC extents (my one attempt used quad CENTERS only, whose NDC range was nonsensically huge (-27..35), not diagnostic -- needs per-corner extents restricted to face==pickFace(camWorldPos) and its immediate neighbors only). Wrong-texture-bound-to-in-world-panel sub-symptom (the two black-framed panels in end-post-fix.png/post-move-view.png) NOT investigated this session (0 matching meshes found via scene.traverse() name/material regex in a fresh session; panels did not reproduce in a 90s sustained-play session either, despite FPS degrading 61->14 and the mirrored-ceiling dither reproducing) -- needs a session that specifically reproduces the panels first. Diagnostic source edits made during this investigation (cull-bypass flag, frame-diag NDC logger) were REVERTED; no net code change was shipped.'
