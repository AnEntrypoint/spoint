teSystem convention) and is NOT the bug. The actual bug: client/core/TerrainBackdrop.js''s renderPlanet() builds the mapspinner-global camera-target direction as fE = east*fwd.x + up*fwd.y + north*fwd.z from THREE''s real camera.getWorldDirection(), shared verbatim by both the WebGL and WebGPU init paths -- but WebGPU''s patch-grid-render.js consumes this fE-derived matrix DIRECTLY as the real per-vertex clip transform (out.pos = frame.viewProjNoEye * vec4(vRel,1.0) in RENDER_WGSL vs_main), whereas WebGL''s actual draw call renders through THREE''s own authoritative camera.matrixWorldInverse-derived matrix and only reuses the shared fE/M4.lookAt construction for CPU-side frustum culling -- so the same latent fwd.y sign mismatch was already present for both renderers, but only WebGPU''s direct real-vertex-transform consumption turns it into a full visible pitch inversion, matching the user''s own observation that only the WebGPU terrain view showed the symptom. FIX (client/core/TerrainBackdrop.js renderPlanet(), isWebGPU-gated, WebGL path untouched): const _fwdYSigned = isWebGPU ? -_fwd.y : _fwd.y; fE built from _fwdYSigned instead of _fwd.y directly. AFTER FIX, re-verified live with the SAME multi-angle test: pitch=0 baseline unchanged/correct (.gm/witness/fix_test_pitch0_b.png); pitch=+0.15 now correctly pushes the horizon DOWN-screen from y~380 to y~540, revealing more sky (.gm/witness/fix_test_pitch015.png); pitch=+1.3 (near-max look-up) now shows ~95% sky/haze with only wall-tops at frame edges, a complete reversal of the pre-fix 98%-ground result (.gm/witness/fix_test_pitchup_extreme.png); pitch=-0.9 correctly shows floor filling most of the screen (.gm/witness/fix_test_pitchdown.png); yaw re-verified unaffected (setVRYaw(0.6) at pitch=0 pans horizontally, sky/ground ratio unchanged, .gm/witness/fix_test_yaw.png), confirming the fix is pitch-axis-isolated and does not regress the already-resolved yaw correctness. Two diagnostic hypotheses were tested live and d