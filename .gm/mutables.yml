- id: m-fallback-recursion-bug
  desc: a lazy fallbackFn closure in TerrainBackdrop.js recursed infinitely (heightFn->fallbackFn->groundHeightLocal->heightFn->...) once blocking:false was in use, exposed by the truly-async bake fix returning null far more often
  status: witnessed
  witness_evidence: 'ROOT-CAUSED AND FIXED. client/core/TerrainBackdrop.js''s blocking:false wiring passed fallbackFn: (x,z) => frame.groundHeightLocal(x,z) -- a lazy closure re-reading frame.groundHeightLocal AFTER it gets overwritten to (x,z) => ph.heightFn(x,z) a few lines below, creating infinite mutual recursion (heightFn -> fallbackFn -> groundHeightLocal -> heightFn -> ...) on every cache-miss fallback call. Live-witnessed the exact failure before the fix: ''RangeError: Maximum call stack size exceeded'' at patchFor (patch-baker.js:139), full recursive stack trace captured via a real page.evaluate call. Fixed by capturing the fractal function BEFORE the override (const fractalGHL = frame.groundHeightLocal, moved before the createPatchHeightFn call) and passing that captured reference directly as fallbackFn instead of the lazy self-referencing closure. Live-witnessed post-fix: 15 terrain height samples across a wide coordinate range (x:0-350, z:0-252), all finite, zero exceptions, zero recursion errors. This bug was masked in earlier testing sessions because the semi-blocking bakeTileAsync (before the truly-async issue/poll conversion) rarely returned null for the same coordinate twice in one tick -- the truly-async version''s much higher null-return rate is what exposed it, meaning this was a REAL pre-existing correctness bug (not a new one introduced by the async conversion), just never triggered until now.'
