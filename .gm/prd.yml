- id: terrain-specular-pooling-from-displacement
  subject: 'Ground surface specular currently reads as a plastic sheen everywhere. Drive terrain specular from the displacement textures so specular only appears on LOW displacement (pooling in crevices and hollows, like wet puddles) and is zero or near zero on high displacement: a per-material displacement-based specular mask with soft thresholds, wetness/rain coupling if the wetness system exists, correct in both the WebGL (terrain.glsl) and WebGPU/TSL paths, consistent across LOD/blend zones, cheap.'
  acceptance_criteria: live before/after screenshots at fixed camera and light (dry and rain/wet, sun low and high) showing the plastic sheen gone and specular pooling only in low-displacement areas; pixel/histogram evidence that specular contribution correlates with (1 - displacement); no seams at material or LOD boundaries; fps/draw calls not regressed; verified on WebGL and WebGPU paths on both GPUs
  session_id: mcp-instruction-30232-1790658115841
  status: completed
