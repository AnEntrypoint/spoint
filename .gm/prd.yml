- id: cpu-plan-getsnapshot-transform-version-incremental
  title: Make AppRuntime.getSnapshot() incremental and stop keying its cache on the tick counter
  subject: getSnapshot() rebuilds every entity every tick because its cache key includes the strictly-increasing tick counter; drop tick from the key and rebuild only entities whose transform or identity actually changed, using the captureTransform compare the static-motion tracker already owns.
  body: |-
    TIER-0 parent: cpu-skip-and-replay-plan-browser. CPU-side, server tick path.

    WHAT RECOMPUTES, AND THE TWO DEFECTS
    (1) src/apps/AppRuntime.js:505 getSnapshot() caches on `this._snapshotCache._version === this._snapshotVersion && this._snapshotCache.tick === this.currentTick`. currentTick increments every tick, so the cache can only ever hit if getSnapshot() is called twice inside one tick. In practice it rebuilds the whole list every tick.
    (2) Each rebuild runs src/apps/AppRuntime.js:502 _encodeEntity(id, e) for every entity, allocating one object plus four arrays (position, rotation, scale, velocity) per entity per tick.
    Callers: src/sdk/TickHandler.js:368 (the no-relevance-radius broadcast path, per tick), src/sdk/ServerAPI.js:227, src/sdk/ServerHandlers.js:101 (join) and :342 (recovery), src/sharding/RegionWorkerEntry.js:149.

    WHY _snapshotVersion IS NOT THE KEY (the hazard that makes this row more than a cache)
    src/apps/AppRuntime.js:503 _markDirty(id) bumps _snapshotVersion, but it is called from exactly two places: src/apps/AppRuntime.js:466 (setParent) and src/apps/AppRuntime.js:749 (restoreGameState). Physics writes entity transforms in place (src/apps/AppRuntimePhysics.js:29-41 syncDynamicBody / setBodyPosition) and apps mutate e.position directly, and neither bumps _snapshotVersion. So keying a snapshot cache on _snapshotVersion ALONE would silently serve a stale snapshot of bodies that have moved. That is precisely the 'skip that returns a plausible wrong value' case, and it is why this row does not use _snapshotVersion as its invalidation key. (If desired, fixing _markDirty coverage is a separate concern; this row must not depend on it.)

    STABLE STRUCTURE (the captured graph)
    The entity set, the encoded-object schema (src/apps/AppRuntime.js:502), and the per-entity cached encoded object.

    CHANGING INPUTS
    Per entity: position(3), rotation(4), scale(3), velocity(3), model, bodyType, custom, parent.

    INVALIDATION KEY
    Self-checking, not an input hash. Per entity keep a Float64Array of the last encoded transform plus the last model / bodyType / custom reference. Each tick run the same comparison shape as src/apps/AppRuntimeStaticMotion.js:4 captureTransform (that function already exists and is already used for exactly this purpose on statics at src/apps/AppRuntimeStaticMotion.js:24), extended with velocity; reuse the cached encoded object when nothing changed, re-encode when something did. Membership changes (spawn/despawn) rebuild the array. Then drop `tick` from the cache key at src/apps/AppRuntime.js:505 and refresh only the `tick` field on the reused snapshot object.
    The cached VALUE is an encoding of entity state, so it does depend on the code that produces it: export SNAPSHOT_ENCODE_CODE_VERSION from src/static/BakeCodeVersion.js over ['../apps/AppRuntime.js','../apps/AppRuntimeStaticMotion.js'] and register it in BAKE_TRANSFORMS (src/static/BakeCodeVersion.js:110-116) so scripts/check-cache-keys.mjs fails if _encodeEntity changes while a cached encoding could survive (deviation.build-cache-no-code-version-key). Store the version on the cache and drop it on mismatch.

    KNOWN HAZARD TO RESOLVE IN IMPLEMENTATION
    Today getSnapshot() hands out a fresh array each call; reusing one array across ticks means a caller that retains it across ticks would see later mutations. Enumerate the four call sites above and either copy-on-hand-out for retaining callers or document that the array is valid until the next tick. The acceptance witness below must cover the retaining-call case explicitly.

    WORST-CASE BOUND
    Skipped work is bounded by entity count times a constant (about 14 comparisons plus 10 stores). The miss path is today's full rebuild. A false 'unchanged' is impossible: the verdict compares the live transform values. The residual risk is the shared-array aliasing above, which is a shape change, not a staleness window.

    MEASUREMENT (integer work units, immune to timer inflation -- this box's zero-delta control arm is +/-10% and currently ~2.5x inflated, so nanosecond numbers are not admissible)
    Deciding counter: per tick, (a) _encodeEntity calls today (= entities.size) and (b) entities whose transform/identity actually changed since the previous build. Skippable units per tick = (a) - (b).
  acceptance_criteria: 'Live server witness on apps/world/tps-game.js over >=300 ticks: report entities.size, _encodeEntity calls per tick before and after, and entities-with-changed-transform per tick. Pass requires _encodeEntity calls per tick to fall to at most (changed-per-tick + 1). Correctness, all four witnessed live: (i) a body moved by physics appears with its new position in getSnapshot() on the very next tick (not one tick late) -- this is the staleness test that would catch using _snapshotVersion; (ii) the join path src/sdk/ServerHandlers.js:101 returns a snapshot containing every entity; (iii) a caller that retains the returned array across a tick boundary sees a stable snapshot, or copies are handed out -- whichever the implementation chooses, witness it; (iv) decoded client snapshots byte-match the pre-change behaviour over the same seeded tick range.'
  session_id: f73df536-0f66-49a1-8888-2a064d23416a
  status: pending
- id: tsl-parity-pxworld-camdist-fp32-precision-asymmetry
  title: TSL and legacy derive the terrain pixel scale from different position bases at fp32 ulp scale
  body: |-
    TSL terrain-material-tsl.js:166 derives pxWorld from the floating-origin-relative position: max(length(fwidth(vRelP)), 0.001). Legacy terrain.glsl:806 derives it from the absolute world position: max(length(fwidth(vWorld)), 0.001). The two agree in real arithmetic and disagree in fp32: at planet radius 6.36e6 m the ulp of vWorld is 0.5 m, while vRelP is a small number of metres from the render origin, so the same surface point quantises differently on the two arms before either computes a pixel scale.

    Magnitude, measured against the band it feeds: texFarFade spans 0..10 m (terrain-defaults.js:49-50) and octFarFade 0.0015..0.015 m, so a 0.25 m quantisation of the input moves the fade factor k by a few percent. That is a contributor to the left-edge delta, not the carrier: the AMD left-edge ratio is 6.74 against an NV 2.38 and this term is present on both GPUs identically, so it cannot produce the GPU-dependent part of the gap. It is still the one difference in the ranked divergence list that no window toggle can blank, because it is inside the value both arms compute rather than in a term either arm can be asked to drop.

    Consequence: every downstream LOD and normal-map fade decision inherits it, so a left-edge window that blanks texDn and the geometric normal will still show a residual floor that this term explains, and that floor must not be read as a third carrier.
  acceptance_criteria: 'A witness that isolates the term rather than a window that guesses at it: either (a) a parity pair in which both arms compute pxWorld from the same position basis - fp64 in the shader, or a shared relative basis promoted identically on both - showing the left-edge and leftLower ratios before and after, or (b) a numeric bound stating the induced shift in k at the left-edge region and showing it is below that region''s measured noise floor. A row that only restates the ulp arithmetic without one of those two is not the acceptance evidence.'
  status: pending
- id: tsl-parity-pinned-server-stamps-process-start-not-window
  title: 'Reopened: the pinned server''s /__identity sha is the enclosing repo''s HEAD at process start, not the snapshot''s pin, and it never changes per window'
  body: |-
    Reopened deliberately. This row was marked resolved on the grounds that scripts/tsl-parity/analyze.mjs (ca481eee) no longer trusts the boot stamp and derives the capture sha from pin.json instead. That resolution left the server's behaviour exactly as it was, which is what this row is about, so it was a hedge and it is reopened here.

    The defect: GET /__identity (src/sdk/StaticHandler.js:107, stamped by src/sdk/ServerIdentity.js) reports sha = the git HEAD resolved once when the server process starts. A pinned snapshot directory has no .git of its own, so that resolution walks up to the enclosing repository and returns the repo's HEAD at process start. Observed directly: a server started with cwd C:\dev\spoint\.gm\pinned\b69c77545323 while the repo was at a318f025 reported sha=a318f025, and it kept reporting that value for every later window, including windows whose served bytes were a different pin. The endpoint therefore names neither the served content nor the window; it names whatever the tree happened to be when the process booted.

    Why it still matters with the analyzer fixed: the analyzer's pin.json fallback makes the verdict correct, but every other consumer of /__identity - run drivers, cross-session bookkeeping, anyone who curls the endpoint to ask 'what is this server serving' - gets a sha that is wrong for the whole life of the process. A stamp that is only safe because the one tool that reads it has stopped believing it is a trap for the next reader.

    Fix, scoped to the server: stamp per window, or rather per snapshot, which is what the window actually pins. scripts/pinned-snapshot.mjs materializes the snapshot; have it write the resolved pin sha into the snapshot directory (a pin.json or .pin-sha next to the served tree), and have ServerIdentity report that file's sha for the served root, falling back to the git resolution only when no such file exists. The value then describes the served bytes for the life of the server and cannot drift with the tree.
  acceptance_criteria: Start the pinned snapshot server while the enclosing repository is at a HEAD that differs from the pin, then GET /__identity and show sha equal to the pin sha b69c775453232fcd9d734d0477c11d3d4675d2c6 and not to the repo HEAD; repeat the read after moving the repo to a third HEAD without restarting the server and show the value unchanged. Also show a server started from a directory with no pin marker still reports a sane git-derived sha, so the fallback path is exercised rather than assumed.
  status: pending
- id: cpu-plan-aoi-ring-cell-neighbours-capture
  title: Cache the AOI 8-cell neighbour ring and its world centres per cell instead of recomputing them every snapshot pass
  subject: computeRingRelevantIds recomputes 8 resolveCell calls and 8 cell-centre solves for every distinct player cell on every snapshot pass, because _ringCache and _spatialCache are cleared unconditionally; both are a pure function of the cell grid and almost never change.
  body: |-
    TIER-0 parent: cpu-skip-and-replay-plan-browser. CPU-side, server snapshot path.

    WHAT RECOMPUTES
    - src/sdk/TickHandler.js:255-257 clears _spatialCache, _ringCache and _cellShareCache at the top of every buildAndSendSnapshots pass, so every ring lookup is a guaranteed miss.
    - src/sdk/TickHandlerAOI.js:31 computeRingRelevantIds(): for each distinct player cell it calls neighborCells (src/sdk/TickHandlerAOI.js:56) -> 8 x resolveCell (CubeSphereCells.js:72: up to 2 hops with string edge compares and one object allocation each) plus one array allocation; then per neighbour it runs _cellCenterWorld (src/sdk/TickHandlerAOI.js:45: 2 Math.tan, 1 Math.hypot, 9 multiplies, one array allocation), nearbyPlayerIdsHysteresis, and getRelevantDynamicIdsWithStarvation; plus 2 new Set() and one object per ring (src/sdk/TickHandlerAOI.js:67-69).
    - collectStarved (src/spatial/Octree.js:167) walks all entities per viewer: O(N x viewers).
    Work units per distinct player cell per snapshot pass: 8 resolveCell calls, 8 cell-centre solves, 8 array allocations, 2 Set allocations, 1 object allocation.

    STABLE STRUCTURE (the captured graph)
    The 8 neighbour cell keys and their _cellCenterWorld points. They are a pure function of (cellKey, cellsPerFace, planetRadius, relevanceRadius). They do not depend on which players occupy the cell. The cell grid is fixed for the life of the world.

    CHANGING INPUTS
    The set of player-cells present this pass; relevanceRadius; planetRadius; cellsPerFace; chart epoch.

    INVALIDATION KEY
    Per cellKey, cache (neighbourKeys[8], centres[8]).
    key = fnv1a(SCHEMA_RING || fnv1aString(computeRingRelevantIds.toString() + _cellCenterWorld.toString() + neighborCells.toString() + resolveCell.toString()) || planetRadius || relevanceRadius || cellsPerFace || chartEpoch || cellKey)
    The CODE term is mandatory: a cache keyed on inputs alone silently serves stale output forever when the transform code changes (deviation.build-cache-no-code-version-key). src/shared/fnv1a.js:24 fnv1aString already exists; hashing Function.prototype.toString() of the emitting functions means any edit to the producing code invalidates the artifact with no human bumping a number. SCHEMA_RING is a hand-bumped int covering the artifact's own shape. Store the key inside the cached artifact and compare on read; mismatch discards and recomputes, never serves. Fail closed: if toString() is unavailable or the read throws, treat as a permanent miss rather than a hit.
    Also fold in chartEpoch -- chart re-anchor already bumps it, and a re-anchor changes the cell lattice.

    WORST-CASE BOUND
    Skipped path is 8 array reads. Miss path is today's code. Bounded by the distinct player-cell count. Failure mode if the key is wrong: a viewer is served AOI cells from the wrong cube face across a seam, so entities pop in and out at seams. That is visible and testable, and the key covers every input the computation reads, so a false hit requires planetRadius/relevanceRadius/cellsPerFace to change without going through the paths that rebuild the cache -- which the chartEpoch and radius terms close.

    MEASUREMENT (integer work units, immune to timer inflation -- this box's zero-delta control arm is +/-10% and currently ~2.5x inflated, so nanosecond numbers are not admissible)
    Deciding counter: per snapshot pass, (a) resolveCell calls, (b) _cellCenterWorld calls, (c) array/Set/object allocations inside computeRingRelevantIds, (d) distinct player cells. After the change, (a) and (b) must fall to 8 per NEW distinct cell only, i.e. to 0 per pass once the cells are populated. Re-measure with a zero-delta control arm in the same window.

    RELATED FLAG (correctness, not perf)
    _spatialCache entries hold relevantIds from getRelevantDynamicIdsWithStarvation, a per-tick dynamic query, yet the caches are cleared every pass at src/sdk/TickHandler.js:255-257. Confirm that clear cadence matches the staleness that query tolerates; if it does not, that is an AOI correctness bug upstream of this row and must be resolved first.
  acceptance_criteria: 'Live multi-player server witness (needs stageLoader, spatial and a real player set) over >=300 snapshot ticks with >=8 players spread across >=4 distinct cells: report per pass (a) resolveCell calls, (b) _cellCenterWorld calls, (c) allocations inside computeRingRelevantIds. Pass requires (a) and (b) at 0 per pass after warmup (cells populated) and a zero-delta control arm in the same window showing the counters are not themselves drifting. Correctness: for every cell a player occupies during a scripted circumnavigation crossing every cube-face seam, the neighbour set served must be identical to a fresh neighborCells() computed without the cache, and no entity may pop in or out at a seam (compare the relevant id set per tick before and after).'
  session_id: f73df536-0f66-49a1-8888-2a064d23416a
  status: pending
- id: cpu-plan-static-tile-index-int-span-key
  title: Replace the StaticTileIndex 19-concat string tile key with an integer tile-span compare
  subject: StaticTileIndex.update builds a ~70-character string key from 10 floats on every body touch and 55 percent of its cost is that string; key on the integer tile span instead and skip the forget plus re-add when the span is unchanged.
  body: |-
    TIER-0 parent: cpu-skip-and-replay-plan-browser. CPU-side, physics bookkeeping (not per-tick, but per body churn, and the churn is driven by the collider streamer).

    WHAT RECOMPUTES
    src/physics/StaticTileIndex.js:37 update(), called from src/physics/World.js:114 _addBody, :157 _repositionBody and :514 removeBody. Per body touched: 1 GetWorldSpaceBounds() call, 10 float getters, 19 string concatenations into a ~70-character key, 1 Map.get, 1 Map.set.
    Measured in this survey pass against the real module: 5.539 microseconds per update on a body that did not change, of which 3.040 microseconds (55 percent) is the string key alone; 2 Map operations per update; 2000 bodies produce 3147 tiles.
    The churn is not per-tick but is driven by the collider streamer: vegetation cap 384 (src/terrain/VegPhysics.js:41) recycles bodies through the park position on every evict/add, firing 2 update() calls per collider per 300 ms rebuild, and each one bumps t.version on every tile it touches, invalidating tile builds downstream.

    STABLE STRUCTURE (the captured graph)
    The body -> integer tile span (tx0, tx1, tz0, tz1).

    CHANGING INPUTS
    The body's world-space bounds and rotation (raw float64s, already read at src/physics/StaticTileIndex.js:35-36).

    INVALIDATION KEY
    Store the 4 integers instead of the string. Equality of the 4 integers implies an identical tile span, which implies no behavioural difference at all, so this key cannot produce a false hit -- the key IS the output. Formally:
    key = fnv1a(SCHEMA_TILESPAN || fnv1aString(update.toString() + forget.toString()) || id || tileM || marginM || MAX_TILES_PER_BODY || COLUMN_HALF_Y_M || float64 bits of (minX,minY,minZ,maxX,maxY,maxZ,qx,qy,qz,qw))
    fnv1aString already exists at src/shared/fnv1a.js:24. The CODE term is mandatory: a key derived from inputs alone silently serves stale output forever when the transform code changes (deviation.build-cache-no-code-version-key), and hashing Function.prototype.toString() of update() and forget() makes any edit auto-invalidate. Fail closed -- if toString() is missing or the read throws, treat as a permanent miss, never a hit.

    WORST-CASE BOUND
    Skipped path is a 4-integer compare. Miss path is the current forget() plus re-add. Worst realistic case: a body that genuinely moved pays one extra compare. There is no plausible-wrong mode: the compare is over exactly the value that determines tile membership, and the float64 bits are the same bits the bounds getters return.

    MEASUREMENT (integer work units, immune to timer inflation -- this box's zero-delta control arm is +/-10% and currently ~2.5x inflated, so microsecond numbers must be re-taken with a control arm)
    Deciding counter: per collider-streamer rebuild, (a) StaticTileIndex.update calls, (b) of those, the number whose integer tile span is unchanged from the stored span, (c) string concatenations performed. Skippable units = (b), and (c) must fall to 0.
  acceptance_criteria: 'Real-module witness (no Jolt needed for the key path, but confirm against a real PhysicsWorld too): report update() calls per collider-streamer rebuild, unchanged-span updates, and string concatenations, before and after. Pass requires string concatenations in update() to reach 0 and unchanged-span updates to skip the forget+re-add entirely. Correctness: over a scripted sequence of 2000 body adds, 2000 repositions and 2000 removes, the resulting tile membership (body -> tile span) must be identical to the pre-change implementation, compared tile by tile; and a body moved across a tile boundary must appear in its new tile span on that same call. Re-measure the 5.539 us and 55 percent figures with a zero-delta control arm in the same window before quoting them as the win.'
