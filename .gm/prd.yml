  body: 'The discriminating A/B for the TSL terrain/grass +6R/+4G/+4B excess needs a frame with the terrain albedo forced to a constant grey. No such toggle exists: window.__passProbe/__passProbeSkyNoDepth live only in the legacy packages/mapspinner/src/gl-render.js, __tpOverride is a camera override (client/app.js:2384), and the only TSL terrain knob read from window per frame is __reliefShade (planet-tsl.js:254). Smallest hook: a uniform u.albedoOverride (vec4, w=0 off) in terrain-material-tsl.js, mixed into splat.albedo at line 171 before the wet darkening, set each frame in planet-tsl.js next to u.reliefShade from window.__albedoOverride; the legacy terrain.glsl needs the matching uniform so both renderers can be forced to the same grey.'
