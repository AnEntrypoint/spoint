- acceptance_criteria: '`agentplug-runner.exe --version`, the version in the install dir''s agentplug-runner.version, and the BOOT pid line in daemon.log all agree; a daemon that boots from bytes whose sha256 differs from the recorded swap is refused or loudly named in daemon.log and daemon-status.json.'
  body: daemon.log shows BOOT pid=9464 version=0.1.171 at 20:37:51 and BOOT pid=98164 version=0.1.170 twenty-four seconds later from the same path C:\Users\user\.gm-tools\agentplug-runner.exe. That file now self-reports agentplug-runner 0.1.170 and its sha256 (21eef6dd514279b22fd491ac3f0ee8e3) is byte-identical to the tree's target\release build. So the binary is not the 0.1.171 build that the earlier boot line announced, and nothing in daemon.log or daemon-status.json says which bytes are meant to be live (last_completed_runner_swap still records 0.1.159). Two daemons briefly coexisted and then only one survived, with no ownership-lock exit line recorded for 9464. Until version parity is asserted at boot, a lane can believe a fix is running when the live binary predates it.
