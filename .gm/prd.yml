- id: vdrs-composite-wgsl-inverse-aces-red-clamp-twin
  title: WGSL invertAcesFilmic in vdrs-composite.js is dead code on every shipped path and keeps the red clamp
  body: 'vdrs-composite.js:54 returns max(ACES_INPUT_INV * y, 0) * (0.6 / exposure), identical constants and clamp to the TSL inverse before c6db8721c4, so the Node round trip applies unchanged (56,176,236 -> 82.7,175.6,235.7 clamped, 55.9 unclamped). Reachability checked 2026-10-05: its only importer is planet-orchestrator-webgpu.js, which TerrainBackdrop.js constructs only in the branch else-if isWebGPU after if isTslTerrain, and isTslTerrain = isWebGPU, so the branch is unreachable; ThreeVdrs is gated off on WebGPURenderer and the legacy GL planet has no WGSL twin. Only two inverse-ACES implementations exist (codesearch 0.983729): this one and display-referred-tsl.js, whose only remaining max( is the sqrt discriminant guard. Not edited: unreachable code; its deletion belongs to tsl-step2-4-occlusion-gpu-timing-delete-legacy together with planet-orchestrator-webgpu.js, patch-grid-render.js, sky-render.js and the other WGSL twins.'
  acceptance_criteria: vdrs-composite.js, planet-orchestrator-webgpu.js and the WGSL twins deleted under tsl-step2-4-occlusion-gpu-timing-delete-legacy with a repo scan showing no importer of vdrs-composite.js; if any WGSL path is revived first, drop the max in invertAcesFilmic and re-run the round trip
