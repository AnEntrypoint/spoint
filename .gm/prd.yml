- id: chart-reanchor-forced-reset-surface-step-standing-and-multi-player
  title: Forced lattice reset still steps the collider surface under standing or many players
  body: 'Follow (tilt<=7.5) moves the surface by 0.1-0.4 mm and the quiet gate (<=20 mm) works for one moving player, but a reset forced at tilt>12 commits at once and stepped the surface by 201-425 mm under the player in two harness runs; a standing player never becomes quiet and k players must be quiet at once (probability q^k). Recall project/terrain-collider-lattice-follow-and-quiet-reset-2026-10-05. Options to measure: raise the forced tilt toward 90 minus the steepest measured slope, per-player quiet with the others exempt, or keep the old heightfield alive as a bridge. Harness: scratchpad lat/cont2.mjs style 200-point jump plus gate telemetry.'
  acceptance_criteria: Over 40 chained switches with 1, 2 and 8 simulated players (walking and standing) the surface step under every player at the commit instant is <= 0.02 m, or the residual cases are enumerated with measured frequency; default path colliders unchanged byte-for-byte.
  session_id: f73df536-0f66-49a1-8888-2a064d23416a
  status: pending
