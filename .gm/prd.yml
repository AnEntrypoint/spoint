- id: veg-lod-updatelod-linear-instance-scan
  title: WebGPULodInstancer.updateLOD rescans every instance with no spatial index
  body: 'Measured against the real module in node (createWebGPULodInstancer, 2 LOD levels, instances on a 3 m grid, 1080p frustum, 200 iterations): updateLOD costs 256.6 us at 1000 instances, 957.1 us at 10000, 11659 us at 50000 when viewChanged is true, and 0.1-0.6 us when the skip at client/core/WebGPULodInstancer.js:205 fires. viewChanged comes from client/core/Vegetation.js:692 (cull matrix inequality against the previous frame) and is true on essentially every frame of camera motion or rotation; Vegetation.updateVisibility calls updateLOD twice per mesh record (branch at :703, leaf at :704). The scan at client/core/WebGPULodInstancer.js:221-227 walks every record doing up to 6 plane tests against planeBuf with no spatial hierarchy, no grid and no BVH, so cost is linear in total instance count regardless of how many survive. At 10k instances that is ~1.9 ms per mesh record per frame; at 50k, ~23 ms. This is a structural cost, not a cache-key defect: when the frustum planes genuinely change the cull results genuinely change, so the full loop is legitimately required today -- which is also why it is not a capture-and-replay candidate. Fix direction: a spatial index over the placement lattice (uniform grid) or a budgeted per-frame slice over recs, so cost tracks surviving instances rather than total instances. Related: PRD row veg-cell-lod-updatelod-regressed-7-to-21pct (the 7->21 attribution is still unconfirmed and browser-blocked; this row''s measurement is the mechanism behind the shape of that report).'
  acceptance_criteria: 'A browser witness on a loaded vegetation world measuring updateLOD wall time per frame during continuous camera rotation at a fixed instance count, before and after, with the same scene and the same box contention; cost after must scale with surviving instances rather than total instances, evidenced by two instance counts where the per-frame cost ratio tracks the survival ratio instead of the count ratio. No regression in visible LOD selection: the set of instances drawn per frame must match the unindexed implementation''s set at the same camera pose.'
  session_id: f73df536-0f66-49a1-8888-2a064d23416a
