- session_id: f73df536-0f66-49a1-8888-2a064d23416a
  id: git-verb-message-file-bom-not-stripped
  title: A UTF-8 BOM in a @message file lands in the commit subject
  body: 'Witnessed live against the gm.wasm built from rs-plugkit 18ce835cdccc602f651d9d90b5864c79e156f9d8 and sideloaded into the isolated harness home: git_commit {message:''@C:/Users/user/iso-roots/verbtest/msg-ok.txt''} committed 4a99c7b6240fa784031c8d9d2b3310927b1ef6d0 whose subject is ''\ufeffverb witness: message came from the named file'' -- the file was written by PowerShell Set-Content -Encoding utf8, so it starts with U+FEFF, and expand_git_message_field in crates/plugkit-core/src/wasm_dispatch/verbs.rs does contents.trim(), which is whitespace-only and leaves the BOM in the message that reaches git -m. Every commit message taken from a BOM-encoded file therefore carries a leading zero-width character, which breaks subject comparisons, dedup keys and any grep on the subject. Fix: trim_start_matches(''\u{feff}'') (and the same for a leading U+FFFE) before the whitespace trim, applied in the same match arm that currently returns Ok(contents.trim().to_string()). Same blocker as sibling row git-verbs-must-force-lanmower-author-and-refuse-ai-trailers: the source fix is inert until the wasm is rebuilt with ''cargo build -p rs-plugkit --release --target wasm32-wasip1 --features slim'' (the recipe is rs-plugkit .github/workflows/release.yml, which ships target/wasm32-wasip1/release/rs_plugkit.wasm as asset plugkit-slim) and sideloaded.'
  acceptance_criteria: git_commit with a @file whose bytes start with EF BB BF produces a subject with no leading U+FEFF (verify with git log -1 --format=%s | hexdump of the first bytes), and the same dispatch with a BOM-free file is unchanged. Witnessed against a rebuilt and sideloaded gm.wasm in the isolated harness home.
  status: pending
- session_id: f73df536-0f66-49a1-8888-2a064d23416a
  id: plugkit-wasm-rebuild-and-sideload-into-live-home
  title: Ship the rebuilt plugkit wasm into the live plugin home so rs-plugkit source fixes take effect
  body: 'rs-plugkit source fixes are inert until the plugin binary is rebuilt and sideloaded, and nothing in the loop does that automatically. Established this session by reading the repo rather than guessing: rs-plugkit/.github/workflows/release.yml calls wasm-plugin-release.yml with build_command ''cargo build -p rs-plugkit --release --target wasm32-wasip1 --features slim'' and ships target/wasm32-wasip1/release/rs_plugkit.wasm as release asset plugkit-slim to AnEntrypoint/plugkit-bin (no wasm-opt/strip step -- the size difference is entirely the slim feature set; a non-slim build is ~139 MB, the slim release build is ~4.8 MB). Reproduced locally: 4,804,641 bytes from HEAD 18ce835cdccc602f651d9d90b5864c79e156f9d8. Sideload recipe, read off the live home: copy the wasm over ~/.agentplug/plugins/gm.wasm (keeping a gm.wasm.pre-<label> backup as every earlier sideload did) and write the marker file plugins/gm.version with a non-semver marker, which the runner treats as an intentional local-dev sideload and never auto-overwrites (daemon log: ''plugin gm is served from a NON-RELEASE marker ... The auto-updater will NOT overwrite it''). Done this session only in the isolated harness home C:\Users\user\.agentplug-iso (marker local-dev-sideload-gitverb-witness-FD4FC6F93E959441, verified live as loaded_plugin_content_sha256.gm fd4fc6f93e95944159325731c1feac796d372a69a1cfc7ddd29c6b1894dfb3b3 replacing 2fa67a9f15cd6159275b155b70b617cbc4d66e7e7ae64f29da4a6e2c371ea23a), which is where the git-verb witnesses were taken. NOT done in the live home C:\Users\user\.agentplug, because eleven dispatch lanes were mid-flight on it and swapping the plugin binary under them swaps the code under running verbs. Rows blocked on this: git-verbs-must-force-lanmower-author-and-refuse-ai-trailers (witnessed in the harness, not yet live), git-verb-message-file-bom-not-stripped, code-index-treesitter-failed-900-and-rebuild-thrash (rs-plugkit 18ce835), and gm-board row rs-plugkit-git-verb-defects-verified-need-rebuild-and-witness.'
  acceptance_criteria: 'The live home''s plugins/gm.wasm is a build of the rs-plugkit sha the parent gitlink names, verified three ways: the byte size is within a few percent of 4.8 MB, plugins/gm.version carries a new marker naming that sha, and the daemon''s status reports loaded_plugin_content_sha256.gm equal to the sha256 of the freshly built file. Witness the swap on a quiet box (no lane mid-dispatch), with the pre-swap gm.wasm kept as plugins/gm.wasm.pre-<label>, and re-run one git_commit and one codesearch dispatch afterwards against the live home to show the new code is serving.'
  status: pending
- id: gm-cdp-session-does-not-attach-across-dispatch-processes
  title: A cdp dispatch from a fresh process cannot attach to a session created by another process, and a stray body line is eval'd as JavaScript
  body: 'Two failure modes of the cdp verb cost an entire 25-minute GPU block. (1) A session created by one invocation (sessionId=..., ''session new gpu=amd keep_alive'', returned port 55321, idle_reap never) is not usable by the next invocation: dispatching a harness body that carries only sessionId= from a new spool CLI process failed with ''chrome CDP endpoint did not become ready within 30000ms (recent chrome output: Opening in existing browser session.)'' -- a second Chrome was launched, deferred to the instance already owning the profile, and exited, so the debug port never opened. Adding ''session new gpu=amd keep_alive'' to the same body works (session_created true, port 65345), so the session is scoped to the dispatch process, not to sessionId. Consequence: an arm body that boots a page must create its own session, while follow-on dispatches that need that booted page (settle, capture) must NOT create one, because a new session discards the page -- so boot/settle/capture dispatched as separate invocations cannot be made reliable this way, and scripts/tsl-parity/bodies.mjs emits bodies with sessionId only. The workaround in use is .gm/pinned/run-arms.mjs, one process that sequences every dispatch for both arms under a single lock hold; a merged boot+settle+capture body per arm (.gm/pinned/{legacy,tsl}-arm-all.cdp.txt) is the fallback. (2) Any body line that is not ''cdp X'', a JSON params line, or a recognised directive is evaluated as JavaScript: a stray bare token produced ''cdp-eval: exception SyntaxError: Invalid or unexpected token'' with no line number, which reads as a harness fault when it is a body-authoring fault.'
  acceptance_criteria: Either the cdp verb attaches an existing session across dispatch processes (so a body carrying only sessionId= works from any invocation), or bodies.mjs emits 'session new <gpu> keep_alive' in every boot body and the verb rejects a non-directive body line by naming the offending line instead of eval'ing it. Witnessed by one full arm completing from a body that creates its own session, and by a stray-line body reporting the line number.
  status: pending
- id: tsl-parity-pinned-snapshot-bake-code-version-differs-from-tree
  title: git archive materialises LF, so a pinned snapshot computes a different bakeCodeVersion than the CRLF working tree and every pinned run falls back to exact CPU height
  body: 'The pinned serve built for the AMD parity pair (snapshot of b69c77545323 at .gm/pinned/b69c77545323, served on :3100, byte-verified by .gm/pinned-verify.json) logged two lines that matter: ''[terrain] ignoring baked heightfield /apps/world/tps-game.hf: baked with height code version 53ae5783eac2, this tree bakes 21f8cd916a26'' and ''[terrain] collider using EXACT CPU height (no baked artifact covers the spawn)''. MECHANISM: git archive writes the committed LF text, while this box checks out CRLF under core.autocrlf=true, and bakeCodeVersion hashed raw file bytes before f88ebb28 -- so the snapshot''s own digest (21f8cd916a26) can never equal the cached artifact''s (53ae5783eac2, itself the CRLF digest that CI computed as 1e14bb7bd0db, the check-cache-keys red). Re-baking inside the snapshot does not help while the pin predates the fix, because the re-bake records the same LF digest as the code that reads it -- which is only self-consistent, not equal to any other checkout. CONSEQUENCE for the pair: both arms read identical bytes, so the comparison stays valid, but the run exercises the exact-CPU-height path with terrainhash=1 forced by the URL while the world itself resolves to hashVersion 2, so it does not cover the baked-heightfield render path at all. PRESCRIPTION: re-pin onto a commit at or after f88ebb28 (LF-normalised hashing), re-bake inside the snapshot so the digest is computed from the bytes the server actually serves, and re-verify. Until then any pinned result must be reported as CPU-height-only.'
  acceptance_criteria: A pinned snapshot taken at or after f88ebb28 reports a bakeCodeVersion equal to the live tree's and to CI's, its server log shows the baked heightfield accepted with no 'ignoring baked heightfield' line, and both arms capture against the baked path with .gm/pinned-verify.json still reporting servedMatchesSnapshot true.
  status: pending
- id: fire-s2c-veg-sway-wind-vector-client
  title: 'S2c follow-on: vegetation sway uses the fire wind vector, not the scalar window.__vegWind'
  body: 'The sim carries an authoritative integer wind vector (ServerWeather on WEATHER_SYNC, seed+step field in src/shared/fire/fireWind.js) but client veg sway is still one scalar: VegetationBuild.js injects uniform float uVegWind, Vegetation.js/VegetationTSL.js set it from window.__vegWind, so sway has magnitude and no direction and cannot lean with the fire. Add a direction uniform fed from the same wind the kernel used (projected to the chart local east/north), keep the scalar as magnitude, and witness in a browser: opposite wind must lean the same canopy in opposite directions, asserted on the real uniform values plus screenshots.'
  acceptance_criteria: Wind vector reaches the direction uniform from the fire/weather source; browser witness (RTX 3060 + AMD iGPU) with opposite-lean screenshots and logged uniform values; magnitude-only path unchanged when no fire is defined.
  session_id: f73df536-0f66-49a1-8888-2a064d23416a
  status: pending
- id: apps-manifest-fast-path-never-exercised
  title: The apps-manifest fast path is never exercised, so every boot pays the live app walk
  body: 'apps-manifest.json is a gitignored build artifact (.gitignore:20) written only into dist/client by npm run build:client (scripts/bundle-client.mjs:175). client/BrowserServer.js:108 fetches it and silently falls back to the live app walk when it is absent, and src/sdk/ServerBoot.js:86 removes it as stale whenever apps/ or src/ is edited after the build. Consequence: dist/client/apps-manifest.json does not exist on this box (ls says No such file or directory), every port answers 404 for the manifest while answering 200 for /, and the static gh-pages host can never carry a gitignored artifact -- so no boot anywhere takes the manifest fast path and every one walks apps live. Measure the cost of that walk during a real boot (it is in the same boot budget as the 16-21 s figure and the foliage/vegetation long poles) and either ship the manifest on the paths that serve it or delete the fetch and the fallback so there is one path. Do not assume a cost: measure it.'
  acceptance_criteria: Measured cost of the live app walk inside a real boot, witnessed on a real served page; then either a witness that apps-manifest.json is served 200 and consumed on each host that boots, or the fetch and fallback deleted with one path remaining. Timing carries the contention caveat or is measured on an uncontended box.
  session_id: f73df536-0f66-49a1-8888-2a064d23416a
  status: pending
- id: legacy-glsl-terrain-cannot-evaluate-hashversion-2
  title: Legacy GLSL terrain pipeline cannot evaluate hashVersion 2 or carves
  body: 'Reachable configuration: a device with no working WebGPU adapter at all, so client/app.js falls back to the legacy THREE.WebGLRenderer, joining a remote server whose world is hashVersion 2 (the default). The client cannot pin the remote server to hashVersion 1, so mapspinner draws hashVersion 1 while the server simulates hashVersion 2 and TerrainBackdrop.js:37 logs the mismatch. packages/mapspinner/src/shaders/terrain.glsl has no hashVersion switch and no carve term (and no integer hash), and src/height-gen.js is generated from it, so both the drawn ground and the CPU sampler are v1-only. Not fixable by pinning at the client: either port the v2 integer hash, the octave-rotation table and the carve term into the GLSL pipeline (and regenerate height-gen.js), or move the legacy fallback onto a TSL/WebGL2-backend path. mapspinner/terrain-render surface.'
  acceptance_criteria: Boot with WebGPU forced unavailable (?webgpu=1 is refused or adapter absent) against a remote hashVersion 2 world and show collider height == rendered surface at the same seven points used by the v1/v2 parity witness, with no TerrainBackdrop mismatch error. Regenerate src/height-gen.js from the ported GLSL and show scripts/height-parity.mjs agreeing with the TSL path at hashVersion 2.
  depends_on: []
  session_id: f73df536-0f66-49a1-8888-2a064d23416a
  status: pending
- id: terrain-heightfield-residency-change-raycast-drift-and-misses
  title: Terrain raycast drift and misses when the resident heightfield set changes under a point
  body: |-
    Separate mechanism from terrain-heightfield-raycast-drift-between-identical-builds (Jolt height quantization re-anchored by a field's own min/max, fixed by snapping samples to 1 mm in sampleTerrainGridChunked). Here the samples are fine and the collider still moves, because WHICH field answers the ray changes.

    Measured with data/planet-harness/drift-churn.mjs (8 players, tps-game world, 45 s at 7 m/s, then all players shifted +128 m to force residency churn, 64x64 grid per field):
      - maxDiffWhereHitBodyChangedM: 0.016933 (16.9 mm) over 12800 grid points whose hit bodyId changed
      - hitBodySamePoints: 0 -> every point in the grid changed owner, so no same-owner comparison was possible in that run
      - missesAfterChurn: 19968 (a point that was covered before the churn is not answered at all afterwards)
      - back to back with no churn: 0.000000 m, 0 misses

    This is the shape the original row reported as 'misses track machine load': data/planet-harness/upkeep.mjs awaits the streamer between captures and has no settle, so under load a rebuild or a retire is in flight when the grid is taken and points read uncovered or read off a different corner's field. Two distinct sub-cases: (a) a different snapped corner covers the point (snapCorner quantizes centre to spacing, so a field's footprint jumps by up to one cell), and (b) the covering body was retired and its replacement is not installed yet.

    Not addressed by the 1 mm snap: the snap makes two builds of one corner bit-identical, it does not make two different corners agree at their seam, and it does not stop a point from being momentarily uncovered.
  acceptance_criteria: 'Either remove the drift or state the bound terrain-correctness claims must respect. Concretely: (1) measure the seam - at a point covered by two neighbouring resident fields, report the raycast difference between the two bodies that can answer it, and state whether cross-field disagreement is bounded by the same range/30000 quantization or exceeds it; (2) measure the uncovered window - report how long a covered point can read as a miss across a retire+build, and whether the streamer can keep the old body until the replacement is installed; (3) re-run the churn harness and report maxDiffWhereHitBodyChangedM and missesAfterChurn after the change, or state the bound: a before/after terrain comparison is only meaningful on points whose covering field corner is unchanged on both sides, and a miss at a previously covered point is a residency event, not a height defect.'
  status: pending
- id: tsl-parity-amd-valid-pair-fails-terrain-grass-leftedge-on-non-relief-poses
  title: 'First valid AMD TSL-vs-legacy pair: sky and water match, terrain grass leftLower and leftEdge do not, and greyRelief1 passes'
  body: 'The AMD window .gm/tsl-parity/run-amd-pinned-vegwarm is the first in this project to come back ''amd pair valid''. It is admissible on every proof available: served bytes verified 63/63 against a materialized git archive of b69c775453232fcd9d734d0477c11d3d4675d2c6 both before the first arm (2026-10-06T02:55:36Z) and after the last (2026-10-06T03:05:36Z), the same server pid 141124 at both ends with root C:\dev\spoint\.gm\pinned\b69c77545323, node_modules materialized rather than symlinked to the live tree, all 37 mapspinner modules byte-identical across arms (hashDiffers=0), and executed mapspinner bytes equal disk PASS with checked 37 and mismatched []. Adapters: legacy cls=WebGLRenderer backend=webgl2-legacy gpu=ANGLE (AMD, AMD Radeon(TM) Graphics (0x00001681) Direct3D11 vs_5_0 ps_5_0, D3D11); TSL cls=WebGPURenderer backend=webgpu gpu=amd rdna-2. Both arms settled at 233 vegetation instances with the last five samples constant, zero page errors and zero console errors. Region ratios (ratio = meanAbs/floor, K=3, floorMin=1): sky passes everywhere at 0.045 to 0.131 and water passes everywhere at 0.112 to 0.526. terrain fails on the three plain poses at 3.799 (skyPose), 3.817 (ground), 4.030 (grey) and passes on greyRelief1 at 2.605. grass fails at 3.575, 3.713, 3.731 and passes at 2.129. leftLower fails at 4.474, 4.506, 4.451 and passes at 2.016. leftEdge is the worst at 7.089, 6.627, 6.560 and passes at 2.036. vegColumn passes at skyPose 2.832, fails at ground 3.455, grey 3.485 and greyRelief1 3.137. Two shapes stand out. The sign flips with the pose: terrain, leftLower and leftEdge deltas are consistently negative on the plain poses (TSL darker, leftEdge about -7 to -5.4 per channel) while on greyRelief1 the terrain and grass deltas are small and positive (about +0.86, +0.77, +0.67). And the magnitude is ordered leftEdge > leftLower > terrain ~ grass > vegColumn, which is a spatial gradient toward the left edge of the frame rather than a uniform shading offset. So the divergence lives in the terrain and grass shading path that the greyRelief1 albedo-relief override bypasses, and it is largest at the frame''s left edge. Next step is to bisect that path on a GPU arm: the relief override is the cheapest lever, since it already makes every land region pass.'
  acceptance_criteria: 'A GPU arm isolates which stage of the TSL terrain and grass path diverges: the same poses captured with and without the relief override, and with the sky and water paths left alone, showing which stage''s removal or substitution makes terrain grass leftLower and leftEdge pass on the plain poses, with the left-edge gradient explained.'
