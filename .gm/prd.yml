  title: 'client/hud/VoiceIndicator.js: the voice lifecycle is two booleans over four states, so {joined:true,destroyed:true} and {session:null,joined:true} are representable'
  why: 'createVoiceIndicator keeps `let session = null` next to `let joined = false`, `let muted = true` and `let destroyed = false` (client/hud/VoiceIndicator.js:29-32). The lifecycle really has four states - idle, session created but not connected, connected, destroyed - because `joined` is NOT redundant with session: after a failed `s.connect` or the session''s `disconnected` event the session stays non-null while joined goes false, so those two booleans were presumably kept precisely because the pair encodes three live states. The encoding still admits combinations no transition ever produces: {session:null, joined:true} (joined is only set after ensureSession returned a session) and {joined:true, destroyed:true} (destroy sets destroyed but never clears joined, so the exported `joined` getter keeps reporting true after teardown). destroy''s only path that could reset joined is `await session?.disconnect()` at :234, wrapped in a swallowing `catch (_) {}`, so if disconnect rejects the flag stays true with no signal. Minsky: make the illegal state unrepresentable - one `phase` of ''idle''|''connecting''|''connected''|''destroyed'', with `joined` derived as phase === ''connected'', exactly the shape row ILLEGAL-r250-1 gave Chat.js. NOT resolved here: a hop logs rows by live execution and resolves none, and the change moves render plus the `disconnected` and `destroy` paths and the exported `joined` getter together, so it belongs to a resolver lane that owns client/hud.'
