  witness_evidence: 'Already fixed prior to this session (commit 659be07d): client/app.js''s onHotReload (~line 1469) already swaps a matching <link href> with a cache-bust query param for .css paths, falling through to location.reload() only for non-CSS. Attempted to add the same capability to singleplayer''s in-Worker host (src/sdk/WorkerEntry.js never wired ReloadManager/CSS watching at all, unlike the standalone multiplayer src/sdk/server.js) but found this is architecturally infeasible, not a bug: WorkerEntry.js runs inside a real browser Worker (new Worker(url,{type:''module''}) in client/BrowserServer.js), which has zero filesystem access -- node:fs/promises/node:path/node:url imports fail to load in that context, confirmed by live-reproducing a full singleplayer boot failure (Connection failed, Worker script failed to parse) when node: imports were added there, then confirming a clean revert restores working boot. The standalone-multiplayer CSS-hot-swap path (this row''s actual scope) already works and needed no further work; the singleplayer-specific gap is a separate, structurally different limitation (no local filesystem inside a browser sandbox) outside what this row could fix.'
