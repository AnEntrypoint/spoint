- id: relocation-pending-trimesh-builds-ignores-proximity
  subject: 'src/sdk/Relocation.js:86-88 staticCollidersPendingNear returns true whenever AppRuntime._pendingTrimeshBuilds.size > 0, ignoring the spawn point entirely, unlike the _pendingTrimeshEntities branch directly below it which filters by SPAWN_STATIC_WAIT_RADIUS. One pending static collider build anywhere in the world therefore makes holdSpawnUntilGrounded''s probe return null for every candidate, so rankSpawnPointsByWalkingRoom scores them all -1, falls back to scored.slice(0,1) and spawns with no ground snap, and every joining player is held up to SPAWN_HOLD_MAX_MS 20000 ms. src/sdk/chartState/index.js:13 reads the same set globally to refuse any chart re-anchor. Fix: record each pending build''s position alongside its promise and filter by distance the way _pendingTrimeshEntities is filtered. Witness: boot a real server, start one long static collider build far from the spawn ring, join a client and show it is grounded and spawned without being held.'
  status: pending
