  title: client/hud/MinimapHUD.js advances its terrain row sweep without a surface-solve guess
  body: advanceTerrain (client/hud/MinimapHUD.js:145) calls sampleMinimapCell (src/shared/MinimapBiome.js:33) for every cell of the BUFFER_CELLS grid with no yGuess, so each solve starts at renderYOnSphere and pays about 3.12 height samples instead of about 2.23. sampleMinimapCell already forwards a guess and scripts/bake-minimap.mjs:108 already passes one; the HUD sweep is the remaining row-major caller that does not. scripts/bake-heightfield.mjs got the same treatment and its real N=257 bake went from 4627 ms to 3677 ms with 9 of 66049 cells differing by 1e-4 m. This one is a live client path on a per-frame deadline, so it needs its own measurement rather than the bake number.
