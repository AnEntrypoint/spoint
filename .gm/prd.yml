- id: fire-s3-vegetation-burn-state-cell-texture
  title: 'S3 fire: vegetation burn stage via a cell-state texture, zero extra draws, charred collider and shadow removal'
  body: 'Measured on the real client/core/WebGPULodInstancer.js (bench-vegburn.mjs, 30000 instances): per-instance writes (setUniformAt of a burn float or a recoloured tint) upload 2.2-2.4 MiB next frame for 10-1000 SCATTERED changes and 72-533 KiB for coherent fronts, because markSlotDirty keeps one contiguous dirty window over instanceMatrix (64 B) plus every attribute. Design instead (disagrees with the row: no variant attribute exists, shape variants are separate meshes, and it is not a prerequisite): write a per-instance fireCell float ONCE at load next to windPhase/tint (rides the padded .w of the WebGPU vec3 tint; one extra uniform channel on the legacy InstancedMesh2 path), derived by exact integer arithmetic from trunkId (i = floor(id/cps) mod cps ...; I = i>>1); stage, ignition age and intensity live in one shared RGBA8 DataTexture indexed by tile slot*64+cell, so N stage changes upload N texels * 4 B (4 B for 1, 4 KB for 1000) and the vegetation vertex/fragment stage animates green -> flicker -> char -> scaled-down stump from ignition age with NO per-tree CPU work, zero new draw calls (draws are per rec/tier/branch|leaf already) and zero new pipelines (the lookup is added to the existing TSL/GLSL vegetation materials before boot warmup). Collider: add excludePlacement(trunkId) and release(trunkId) to src/terrain/ColliderStreamer.js (calls its own scheduleRemove at :178) so charred trunks lose their box body on server and on the client mirror; shadows: the shadow LOD pool skips or collapses instances whose cell is charred. Client keys state by trunkId/cell, never instance id (Vegetation.js loadChunk thins trees by distance). NOTE: another agent currently has uncommitted edits in WebGPULodInstancer.js and Vegetation lanes; coordinate before touching.'
  acceptance_criteria: 'GPU window, both RTX 3060 and AMD iGPU, before/after per-pass GPU ms (timestamp queries), CPU ms/frame, draw calls unchanged (renderer.info) with N burning trees vs 0, WebGPU calls/frame, contamination buckets clean, reachability PASS; re-run the same diagnostic: count of charred trunk colliders == count of charred cells'' trees on server and client; a stage change of 1000 cells uploads <= 4 KB.'
  session_id: f73df536-0f66-49a1-8888-2a064d23416a
