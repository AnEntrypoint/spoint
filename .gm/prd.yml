- id: tsl-parity-amd-legacy-arm-never-settled-planet-absent
  title: 'AMD legacy (WebGL) arm never settles: planet absent after first build, so the AMD pair yields no verdict'
  body: 'MEASURED 2026-10-05, window 4, run-amd-2247, HEAD b3c15824, AMD Radeon 0x1681 (amd/rdna-2, ANGLE_D3D11), one window, one head. The legacy arm (legacy-boot, legacy-settle, legacy-capture) never settled. legacy-boot returned settle false with reason world objects missing, app true, veg false, and the message warn: [terrain] planet absent after first build (cold-load context storm), draining GL errors plus one re-attempt, after 66 s. legacy-settle (566 B) did not recover it. legacy-capture returned in 53 s instead of the 166 s an AMD capture costs, and analyze reports legacyDoc null with per-pose vegetation counts [192,208,223,227,233,0,22]; the trailing 0 and 22 are the legacy arm having no world. All five region rows (skyClip, skyPose, ground, grey, greyRelief1) report missing frames, so no per-region delta exists on AMD and none of the pre-registered AMD prediction rows can be adjudicated. This is not the TSL renderer: the same window produced a clean TSL boot (blocked 0, pageErrors 0, consoleErrors 0, executed mapspinner bytes equal disk, checked 37, mismatched 0). It is the legacy WebGL path failing to build the planet on this adapter, and it is the third distinct failure mode that has denied an AMD pair across four windows (window 2: TSL half only, ran out of time; window 3: gm MCP down; window 4: legacy planet absent).'
  acceptance_criteria: A legacy (legacygl=1) boot on the AMD adapter reaches settle true with vegetation present and non-zero, and the planet-absent warning is either gone or explained with a named mechanism; then a full AMD pair analyzes to a verdict with all five region rows populated. Until then no AMD parity number may be quoted.
  status: pending
- id: tsl-parity-amd-vegetation-never-settles-inside-the-boot-settle-cap
  title: AMD TSL vegetation is still growing at the 118 s in-boot settle cap (veg 165 against minVeg 225), so every AMD TSL arm is captured unsettled
  body: 'MEASURED twice on AMD Radeon 0x1681 (amd/rdna-2). Window 2 (run-amd-2128): boot 125 s with settle false and veg 158 at the 115 s cap, needing a separate 10 s settle to reach 227. Window 4 (run-amd-2247): boot 120.5 s elapsed 117.9 s with settle false and veg 165. NVIDIA settles 233/233 inside the same body. Consequence: whichever way the lane handles it, the capture is taken on a page whose vegetation is still streaming, and the analyzer gate vegetation settled on both renderers fires with tsl 165. The capture itself is not corrupt: camera pose identical, ammo 30/30, blocked 0, zero page and console errors, executed mapspinner bytes equal disk (checked 37, mismatched 0). The only thing wrong with the AMD TSL arm is that the world was not finished when the frames were taken. Any AMD body budget must therefore assume boot plus a separate settle, not boot alone.'
  acceptance_criteria: An AMD TSL boot reaches vegetation 225 or more inside one body, or the harness is changed so the settle loop runs in the same session as the boot and the capture is gated on settle true before the first frame; witnessed by an AMD run whose analyzer vegetation gate passes.
  status: pending
- id: tsl-parity-amd-legacy-scenery-build-lands-on-the-30s-race-cap
  title: 'AMD legacy WebGL2 planet does build: backdrop 21.7 s inclusive, whole scenery build 30.0 s against a 30.0 s cap, so the arm is slow at the boundary and not failing outright'
  body: 'MEASURED 2026-10-05 window 5, HEAD d624662d, AMD Radeon 0x1681 (amd/rdna-2, ANGLE_D3D11), run-amd-2319, legacy arm (legacygl=1). The legacy arm SETTLED: settle true, veg 233, elapsedMs 89087, cls WebGLRenderer, backend webgl2-legacy, blocked 0, pageErrors 0, consoleErrors 0, consoleWarns 0, and window.__terrain true. A poll immediately before the capture returned terrain true with zero occurrences of the planet absent after first build warning. performance marks (ms from navigation) give the decisive series: boot:backdrop:start 14131, boot:backdrop:modules-imported 18202 (4.07 s for module import), boot:backdrop:sampler-built 18203, boot:backdrop:planet-initialised 31362 (17.23 s after backdrop start), boot:backdrop:returned 35867, boot:scenery-built 44148. So createTerrainBackdrop inclusive is 21.74 s (14131 to 35867), comfortably under the 30 s cap, with no exception and no rejection; and _buildWorldScenery spans 14131 to 44148 = 30.02 s, which lands on SCENERY_BUILD_TIMEOUT_MS 30000 to within 20 ms. That is the answer to reject versus exceed: EXCEEDED, not rejected, and the exceed is a boundary case of a 30 s cap against a 30 s build, which is why the same body settled here (veg 233) and failed in window 4 at elapsedMs 61858 with settle false and reason world objects missing. The legacy capture then produced 1,861,143 B in 130 s. The pair is still not complete because no TSL arm ran at this HEAD, so analyze refuses with missing one of tsl-boot, legacy-boot, tsl-capture, legacy-capture.'
  acceptance_criteria: A full AMD pair at one HEAD analyzes to a verdict, with the legacy arm settling on AMD on two consecutive runs; and either SCENERY_BUILD_TIMEOUT_MS is raised above the measured AMD scenery build with before/after settle evidence, or the race is replaced by a cancellable build. Until then, a single AMD legacy settle is not evidence the arm is reliable.
  status: pending
