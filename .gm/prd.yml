  session_id: f73df536-0f66-49a1-8888-2a064d23416a
  status: pending
  subject: 'RE-SCOPED 2026-10-02 after reading the code, because the row as first written may be wrong and I would rather correct it now than have someone fix the wrong thing. What the code actually does: client/app.js:500 subscribes `if (loadingMachine.isReady) _finishLoading()`, and `_finishLoading` (app.js:327) awaits `Promise.race([_buildWorldScenery(), 30 s timeout])` before calling `await _revealWorld()`. So the overlay reveal IS gated on readiness -- it is gated on `loadingMachine.isReady`, which is connection-and-snapshot state, and the scenery build and the reveal happen after it. The row was filed on a reported isReady at 3227 ms against a reveal at 9596 ms, and framed as a late reveal costing time for nothing; but reading the path, the gap between those two numbers is the world actually being built, which is not nothing. The genuinely suspicious part is different and smaller: `loadingMachine.isReady` is published as THE readiness signal and every consumer of it -- scripts/cold-load-gate.mjs, scripts/frame-time-gate.mjs, and anything reading `window.__app.loadingMachine.isReady` -- treats the client as ready at 3227 ms while the world does not exist yet for another six seconds. That is a readiness signal that lies to its consumers, which is a different defect from an overlay that hides late. Fixing it by hiding the overlay earlier would be actively worse: it would reveal an empty world. Do not change the reveal timing on the strength of this row until the four timestamps are measured.'
