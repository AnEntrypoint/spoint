- acceptance_criteria: 'A fire cell''s fuel comes from what grows on it, witnessed end to end: two cells with the same terrain kind but different placement burn measurably differently, authority and mirror agree step for step, and a mirror that never had an anchorField still reproduces the fuel after adopting a keyframe. Plus the measured ms per new tile creation (64 cells = 4 placement chunks) on a real planet frame, cached-chunk reuse proven against an uncached control, and the fraction of cells whose fuel changes when one tree flips quantified.'
  blockedBy: []
  body: |-
    Split out of fire-s1e-per-tile-reclaim-and-placement-fuel, whose per-tile reclamation half landed in 8113b92a20c17d1b15ba0781f60a742f32b3cb3d (witnessed by scripts/fire-tile-reclaim-witness.mjs). Remaining half: fuelClassAt comes from the spec (integer hash or data) and knows nothing about what actually grows on a cell.

    Measured this pass, and it changes the shape of the work: placement fuel cannot be derived inside the kernel. classify() (src/terrain/VegPlacement.js:170-234) is a float chain over the anchor field - groveAt noise, climateAt temp/humidity/erosion/seaBias, radialSlopeAt, paintedWeightsFor(frame.hashVersion) grass weight, treeline and reliefMarginScale, species/size/yaw from rand(cellHash, k) - so its result depends on the chart, the anchor field and float rounding, while the fire kernel is integer-only and its cells are deliberately chart independent, and src/shared/fire/fireLattice.js carries geometry only, no veg content. So the kernel can only STORE an integer the host hands it: a fuelAt(face, I, J) hook called at tile creation, integer, and identical on every peer.

    That hook has a wire consequence not yet designed or measured: a mirror that has no anchorField cannot recompute the value, so per-cell initial fuel has to travel in the keyframe (a TILE_ARRAYS entry past the interior bitmaps added in version 4) or the mirror silently starts from different fuel. Nothing for this half is measured yet: no per-tile classification cost, no chunk-cache reuse figure, no class-flip sensitivity, no keyframe size delta. Until a flip is quantified, the layer stays server-authoritative and peer-simulated profiles keep the integer hash fuel.
