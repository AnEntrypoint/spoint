- id: grass-vegfocus-periodic-snapshot-jitter
  subject: 'Newly discovered during grass-churn-natural-movement-reverify (see mutable grass-churn-postcondition-verdict for full witness): under real WASD movement while the player is stopped by collision, client.getLocalState().position exhibits a strictly periodic (~257ms / ~4Hz) exact-repeat divergence to a fixed alternate value (observed magnitude ~4.3m) before reverting to the correct resting position, likely tied to the singleplayer snapshot/keyframe delivery cadence rather than the 64Hz sim tick. Did not cross a chunk boundary in the ~4.3m magnitude observed, so it is not the same defect as grass-chunk-churn-flicker, but the same mechanism could plausibly exceed a 32m/2=16m half-chunk-width divergence under different conditions (faster movement, higher latency, packet loss) and cause real chunk churn. Needs: instrument the singleplayer snapshot delivery path (src/client/BaseClient.js, PredictionEngine.js, the loopback transport) to find why a stale position is periodically re-applied to the SAME localState object consumers read, root-cause it, and either fix it or establish a measured bound proving it can never exceed half a chunk width.'
  session_id: grasschurn-20260915
  status: pending
- id: vrm-feetoffset-ratio-sink-investigation
  subject: 'Discovered while live-verifying player-ankle-clearance-feet-offset, out of scope for that task and filed separately per noticing-to-PRD: the VRM avatar mesh''s own bounding-box bottom sits ~0.234m BELOW the SceneGraph render anchor (capsule-bottom equivalent), measured live in tps-game via THREE.Box3().setFromObject on the player''s isDynamicShadowCaster mesh (groupY=9.479337, box.min.y=9.245197, gap=0.234140), driven by client/PlayerManager.js''s `vrm.scene.position.y = -feetOffsetRatio * modelScale` (feetOffsetRatio=0.212, modelScale=1.323 -> -0.2805 nominal, vs 0.234 measured -- the ~0.046 discrepancy itself needs explaining, e.g. animated idle-pose crouch vs bind-pose Box3, or hair/cape geometry extending below the feet). This pre-dates and is unrelated to this session''s ankle-clearance change (unaffected by it, confirmed by direct comparison). Needs root-cause investigation (not a threshold guess): trace whether feetOffsetRatio''s negative sign is correct for this VRM rig''s own origin convention, and why the measured gap doesn''t match the nominal feetOffsetRatio*modelScale arithmetic exactly, before deciding whether/how to recalibrate it.'
  session_id: fade-sil-1
  status: pending
