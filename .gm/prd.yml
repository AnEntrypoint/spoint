  body: 'MEASURED 2026-10-06 by reading client/AppModuleSystem.js:48-55: createDispatcher(method, errorLabel) caught with `console.error(errorLabel, e.message)`, so a handler that throws inside onEvent/onInput produces a line like `[app-event] Cannot read properties of undefined (reading ''x'')` with no app name and no stack. Since every app module in the page shares that one prefix, an emitted event cannot be tied to the app that produced it and every boot investigation starts by guessing which handler and which payload shape -- which is exactly why the second-joiner row arena-combat-app-event-undefined-x-on-second-joiner has stayed open with a plausible mechanism and no named handler.'
