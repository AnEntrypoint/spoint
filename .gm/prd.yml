  subject: 'The client tries WebTransport first on every real page load and silently falls back to WebSocket, so the documented latency numbers are the worst case and nobody can tell. src/client/PhysicsNetworkClient.js connect() (138-156) calls _tryWebTransport first and only falls back if it returns false (146), the same on every reconnect (_doReconnect 161-172) and on mid-session migrateTransport with kind == null (178); client/app.js:976-982 sets no webTransport key so _wtConfig is {} and the attempt happens on every load. It returns false silently in four cases with no log and no event: webTransport.enabled === false (106), typeof WebTransport !== ''function'' (107), deriveWebTransportUrl yielding nothing, or the handshake throwing or not opening (110-123). The opt-in is server-side: src/sdk/ServerAPI.js:241-254 starts WebTransportServer only when ctx.config.webTransport is set with cert and key, and plain node server.js has no QUIC listener, so every client silently lands on WebSocket -- which is why every latency figure in docs/netcode.md (899 ms versus 458 ms at 150/25/5, 171 cm versus 89 cm error) is the ordered-transport worst case rather than an edge case. Diagnosability is nonzero but passive: client.getTransportType() (line 260) and ConnectionManager''s transport field report which path was taken, but nothing says an attempt was made and failed.'
