- SESSION_ID: f73df536-0f66-49a1-8888-2a064d23416a
  title: prewarmPools makes a full Jolt body budget fatal, and a second 192-cluster ring sweep peaks past it
  body: 'At 192 clusters a second sweep of the collider ring peaks past the world Jolt body budget of 10240, and prewarmPools preallocates through PhysicsWorld.addBody, which throws when the budget is full; ColliderStreamer._rebuildMulti turns that into a FATAL and rethrows, so the whole ring rebuild dies and no further rebuild is scheduled. The crash is reachable in scripts/collider-ring-scale-witness.mjs whenever the 192-cluster arm is measured twice in one world, which the old contested re-measure did. The prewarm is a speculative optimization and should degrade to creating bodies on demand when the world is full instead of aborting the ring. A related finding: the collider body pool in src/physics/World.js _bodyPool has no upper bound, so pooled reserve bodies can consume the budget the live ring needs.'
  id: prewarmpools-makes-a-full-jolt-body-budget-fatal-and-a-second-19
