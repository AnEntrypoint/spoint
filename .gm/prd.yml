  title: _revealWorld() freezes the derived shader manifest at whichever call wins, so an early reveal made before WORLD_DEF lands skips warmup
  body: Found by adversarial review of 92488e39cf (multi-file diff sweep). _revealWorld() (client/app.js:404) sets _worldRevealed = true on entry and returns early on every later call, and it computes _shaderManifest once from worldShaderManifest(_worldDef) || worldShaderManifest(worldConfig) (app.js:407). _revealWorld() is called fire-and-forget at app.js:592 as soon as the planet backdrop exists, and awaited later at app.js:470. If the local world module import left _worldDef null (app.js:1059 `if (_wmod?.default)`) and the server WORLD_DEF that assigns worldConfig (app.js:1144) has not arrived before that early reveal, both sources are empty, the frozen manifest is null, and the later fully-informed call returns at the guard -- so a singleplayer world with >= 10 entity meshes skips warmupShaders entirely (app.js:408 gate). Same hole for a host-migration or hot-reload reassignment of worldConfig. PRE-EXISTING at HEAD (the old awaited fetch assigned to the same local and was frozen the same way), not introduced by the derivation change; no shipped world hits it today (max 30 entities) and the interleaving could not be forced live -- the forced-interleaving browser arm stalled in server boot under current machine contention (28 node + 4 chrome processes from concurrent lanes).
  acceptance_criteria: 'Witness on a live page that a warmup whose first reveal saw neither _worldDef nor worldConfig still warms the manifest meshes once the config lands (or proves the interleaving unreachable, with the reachability argument in code, not prose). Fix shape: do not freeze the manifest at the first reveal -- recompute when worldConfig is assigned and warm the difference, or defer the early reveal''s warmup decision until a config source is known.'
