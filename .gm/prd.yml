  body: 'MSG (line 3) and DISCONNECT_REASONS (line 156) are exported unfrozen while the sibling table DEFAULT_INPUT_BUTTONS is Object.freeze''d (InputCodec.js:1-4); nameMap is built with set() in a loop (lines 140-141), so two names sharing one id silently overwrite and msgName reports whichever came last, making a duplicate-id protocol unrepresentable as an error; isUnreliable(type) (lines 152-154) returns false for any id not in MSG, so an unknown or newly added message type defaults to reliable. Fix: Object.freeze both tables, assert id uniqueness while building nameMap, and refuse an unknown id in isUnreliable.'
