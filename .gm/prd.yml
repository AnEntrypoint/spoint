- id: fire-s6-burning-forest-scenario-both-gpus
  title: 'S6 fire: end-to-end wind-driven burning forest on tps-game or a planet biome, both GPUs, p95 stated'
  body: 'Integration witness after S1-S5. Scenario script (headless first, then a real browser harness like scripts/perf-run.mjs shapes): incendiary shot ignites a forest, wind 3,0,1 drives a front across a biome, players are pushed around, a player standing inside burning cells is damaged only there, a shot through smoke is blocked per the rule, rain halts the front, trees char (collider and shadow gone), scorch persists across a forced chart re-anchor, a late joiner sees the same fire (checksum row equal). Report per GPU (RTX 3060 and AMD Radeon iGPU): p50/p95/p99 frame time, per-pass GPU ms via timestamp queries, CPU ms/frame, draw calls with N burning trees vs 0 (unchanged), WebGPU calls/frame, contamination buckets clean, reachability PASS, kernel ms/tick and active cells over time.'
  acceptance_criteria: One recorded run per GPU with the numbers above, screenshots at ignition / mid front / charred / after rain, determinism checksum equal between server and browser mirror throughout, p95 frame time stated and within the project budget; no pipeline compile after boot (async creation, warm at boot).
  session_id: f73df536-0f66-49a1-8888-2a064d23416a
  status: pending
- id: veg-instancer-dirty-window-per-attribute-ranges
  title: 'Vegetation instancer: per-attribute dirty ranges (scattered setUniformAt uploads the whole pool)'
  body: 'Found while costing fire burn state, independent of fire: client/core/WebGPULodInstancer.js createDensePool.markSlotDirty (lines 23-32) extends ONE contiguous [dirtyLo, dirtyHi] window and applies it to instanceMatrix AND every attribute, so a single attribute write (tint, windPhase, any future per-instance value) uploads 64 B of matrix + all attributes for every slot between the min and max touched slot. Measured with the real instancer (30000 instances, 3 attributes incl. burn): 10 scattered setUniformAt calls upload 2.2 MiB next frame (needed: 840 B); coherent 100 changes 146-165 KiB. Fix: separate dirty ranges per attribute (matrix untouched when only an attribute changes) and a small sorted multi-range set (or per-chunk slot ordering) instead of one span; keep the existing once-per-frame reset. Measure with bench-vegburn.mjs shape before/after, then GPU-window it (upload bytes via renderer info, CPU ms/frame during streaming). NOTE: another agent has uncommitted edits in this file right now; do not start until they land.'
  acceptance_criteria: Same 10-scattered-change scenario uploads <= 2 KiB; chunk streaming (addInstances/removeInstances) upload bytes not worse; both GPUs before/after per the project witness rules.
  session_id: f73df536-0f66-49a1-8888-2a064d23416a
  status: pending
- id: terrain-field-sampling-worker-pool
  title: Move heightfield sampling off the main thread into a core-sized worker pool
  body: After the 2026-10-05 yield fix a field outside the baked .hf costs 0.55-0.7 s of solver CPU on the main thread; 64 spread players need ~38 s of one core and the server tick shares it. Workers need the planet sampler and chart frame (loadPlanetSampler, createPlanetFrame) loaded per worker, with the height delta, spline, cave and biome layers excluded or replayed. Measure serial vs 2/4 workers at 64 spread players before building.
  acceptance_criteria: At 64 players on a 1 km grid time-until-all-covered measured before (56.2 s) and after with 2 and 4 workers, field sample hashes identical to the main-thread build on the default world, server tick overrun count during the build not above the current run, workers stopped on streamer.stop, zero comments
  session_id: f73df536-0f66-49a1-8888-2a064d23416a
  status: pending
- id: planet-snapshot-groups-by-load-not-headcount
  title: Per-client snapshot rate halves at 64 players regardless of spread
  body: 'TickHandler.buildAndSendSnapshots uses snapGroups = ceil(playerCount/50), a global head count, so 64 players receive 31-32 Hz snapshots (measured 26-32 Hz at n=64 in clustered, split10, split100, antipodal) against 61-64 Hz at n=16, even when the players are in separate regions and each snapshot is cheap (tick phase snap 1.1 ms at 16 players, 71 us per player-snapshot). Replace the head count with the measured per-player snapshot cost EMA against a fraction of the tick budget, with a 2 s damping so the group count does not flap (staticByGroup resets when it changes). Measure with scripts/planet-multiplayer-harness.mjs --n=64 clustered/spread-cap: snapshot Hz, main-thread CPU ms per tick (process.threadCpuUsage column), p99 tick, on 3 runs; do not regress n=16.'
  acceptance_criteria: n=64 spread players receive >= 60 Hz snapshots while main-thread CPU per tick stays under 60 percent of the tick budget; a crowded 64-player cluster still groups; 3-run before/after numbers recorded; rollback-duel and lockstep-rts 0 desyncs.
  session_id: f73df536-0f66-49a1-8888-2a064d23416a
  status: pending
- id: planet-crowd-tier-snapshot-cost-superlinear
  title: Per-viewer snapshot cost grows 2.7x from 16 to 64 players in one crowd
  body: 'Measured per-player snapshot cost 71 us at n=16 and 190 us at n=64 clustered (tick phase snap 3.0 ms at 32 Hz). With more than 30 neighbours each viewer runs classifyPlayerTiers (allocates and sorts every neighbour) and buildCrowdDots (a Map of 25 m buckets over every dot player) in SnapshotEncoder.filterEncodedPlayersTiered; in a window CPU profile buildCrowdDots was 9 percent of the server main thread. Dots do not depend on the viewer except for membership: keep one per-snapshot bucket histogram of all players and subtract the viewer''s full/reduced/self members, partial-select the 30 nearest instead of sorting. Interest correctness must stay 0 missing (harness LOD-aware check).'
  acceptance_criteria: n=64 clustered snapshot phase per snapshot pass measurably lower on 3 runs with identical per-client player/dot payloads (byte comparison on a fixed seed), harness interest 0 missing, rollback-duel and lockstep-rts 0 desyncs.
  session_id: f73df536-0f66-49a1-8888-2a064d23416a
  status: pending
- id: planet-roam-crowd-reanchor-refusals
  title: A roaming crowd across a lattice boundary is refused 400 times in 20 s; edge and pole roams need dry placement
  body: 'Harness --service=on --scenario=roam-corner --n=16: players placed 30 m before the chart-lattice cell boundary and sprinting forward; reanchorCount 1 (the placement), refusals 398 in 20 s, epochsDuringRun 0 (the crowd did not cross), corrections per ack 0.31 and client-server offset 0.37 m while sprinting. roam-edge and roam-pole placements are open ocean on this seed so all 16 swim (0.45 and 0.93 corrections per ack). The harness now reports chart.lastRefusal; read the per-tick refusal reasons (heightfields-not-ready, waiting-for-quiet-surface, cluster refusals) over the run and decide whether 16 crossing players converge. Architect-owned (re-anchor policy); the harness change needed is a dry-land roam placement (search along the feature for land, or change seed).'
  acceptance_criteria: 16 and 64 players crossing a face edge, a corner and a pole with the service on all reach the new epoch with no player more than 1 m from the server, refusal reasons tallied per name, corrections per ack under 0.05.
  session_id: f73df536-0f66-49a1-8888-2a064d23416a
  status: pending
- id: planet-two-browser-region-witness
  title: 'GPU-window witness: two real browsers in different planet regions on both GPUs'
  body: 'Browser-only; do not run until the GPU lock is free. Plan: serve tps-game with SPOINT_NO_WATCH=1 and relevanceRadius 200; browser A at the anchor (?at=0,0), browser B 5 km away on dry land (window.__spoint.go({dir}) from a bookmark found with the harness walkableDir logic, slope under 20 deg, above waterline+2 m), then B 100 m from A. Record per browser on the RTX 3060 and the AMD GPU: remote player visible/absent in __scene at 5 km (must be absent) and at 100 m (must be present within 2 snapshots), fire from A at B at 100 m (hit event received on both, rewind ms), chat and APP_EVENT delivery, frame time p95, console errors, rendering of the remote player after B crosses 200 m (interest hysteresis, no pop at 200/230 m). Use ?v=<ts> cache buster, perf harness draw-call buckets for contamination.'
  acceptance_criteria: Table of the above on both GPUs with screenshots from __scene readback, per the interest rule measured in recall project/planet-multiplayer-scenario-matrix-2026-10-05.
  session_id: f73df536-0f66-49a1-8888-2a064d23416a
  status: pending
- id: airborne-player-ground-solve-moving-cost
  title: A horizontally moving player far from the anchor still pays a full 14-evaluation solve (168 us at 52 km) every tick the ground height is asked
  body: 'The exact-position memo in groundHeightLocal only helps stationary players. A moving player (sprinting airborne, falling with horizontal velocity) misses the memo. At 52 km the solve takes 14.3 evaluations because the radial fixed point contracts at about 0.5 (tilt of the render ray), versus 2.0 near the anchor. Options measured nowhere yet: seed the solve with the previous y of the same player or slot (yGuess argument; row solve-surface-warm-start-cost covers sweeps), or a Newton step using the finite-difference slope of g, or caller-side throttling of the fall-kill ground check to once per N ticks for airborne players.'
  acceptance_criteria: At 64 players sprinting airborne at 52 km the physics phase is measured before/after (interleaved x10, median and IQR) and the per-solve evaluations at 52 km drop from 14.3 below 5 with outputs within 1e-4 m of the current solver; v2 baked heightfield outputs stay bit-identical or the hf is re-baked with the new key and error stats
  session_id: f73df536-0f66-49a1-8888-2a064d23416a
  status: pending
- id: tsl-terrain-grey-lighting-residual
  title: TSL terrain is about 2 levels darker than legacy on every channel under a grey albedo
  body: 'Measured on AMD: TSL-grey minus legacy-grey = (-1.99,-1.90,-1.74); legacy-grey (202.4,200.8,193.9). My flat-patch Node model gives (194.2,196.5,180.7), off by 8-13, so it is not calibrated to the pose and cannot name the stage. Stages compared line by line (terrain.glsl 939-1022 vs terrain-lighting-tsl.js): ambient floor, sky irradiance, sun gain 1.25/pi, transmittanceToSun soft term, dayShade, exposure, ACES, lookSat, pow(1/2.2) and the display-referred round trip (identity within 0.4) are the same. Differences left: aerial perspective uses the scattering LUT in TSL vs the 4-step march in legacy (modelled TSL darker by 0.2-2.9 R at 20-48 atm-km, B only -0.4 to -1.1, so the profile does not match -1.74 B), sun shadow as luminance(lightColor)/sunLum with three PCF vs legacy 4-tap host shadow, LUT texture half-float quantisation of the transmittance read, vN vs vNrm normal. Not fixed.'
  acceptance_criteria: 'GPU A/B on both renderers with window.__hazeMul = 0 under grey albedo: if the -2 disappears the stage is aerial perspective (then the LUT zenith row row scattering-lut-zenith-undersampled and the 4-step integrator are the cause); else a second A/B with the shadow disabled; then a fix with a pre-registered prediction'
  session_id: f73df536-0f66-49a1-8888-2a064d23416a
  status: pending
- id: planet-snapshot-group-planner-needs-quiet-box
  title: 'Work-driven snapGroups planner is built and parked: needs a quiet box to validate'
  body: 'Planner (medians of 32 non-keyframe passes of fixed and per-viewer wall ms, groups=ceil(viewers*perViewerMs/(tickPeriod*0.35-fixedMs)), shrink at 80% fill, index membership) saved as scratchpad planner.patch + SnapshotGroupPlanner.js; deterministic simulation: 16 players 1 group even with 20x spikes every 5th pass, 64@71us 1 group, 64@140us 2, 64@190us 3. NOT committed: on the contended box (dilationFactor 0.1) wall-clock cost makes it shed to 3-7 groups (snapPerTick 0.14-0.36 vs base 0.46-0.50), and win32 process.threadCpuUsage is quantised to ~15 ms so it cannot time a pass. Re-measure when the box is idle (CPU per tick, snapshots per server tick, clustered/split100/spread-sphere n=16 and 64, interleaved), consider a cost-time source that is not wall clock, then commit. Interest, wire and adaptive stall logic untouched.'
  acceptance_criteria: 'On an idle box: n=64 spread (isolated players) 60 Hz per client (1 group), n=64 clustered no worse than 2 groups, n=16 always 1 group, 3 interleaved before/after runs, interest 0 missing, conditioner harness unchanged.'
  session_id: f73df536-0f66-49a1-8888-2a064d23416a
  status: pending
- id: planet-snapshot-prepacked-player-records
  title: Per-viewer snapshot cost is msgpack of the player records, not the tier sort
  body: 'Profile n=64 clustered 20 s main thread: msgpackr pack/writeRecord/packArray 3.3 s versus classifyPlayerTiers 0.37 s, nearby 0.28 s, buildAndSendSnapshots 0.17 s (so crowd-tier sort is under 2%). Bench: pack 12.5 us at 16 records, 21-24 us at 31-64; tiered filter 5 vs 17-22 us. Idea: pack each player record once per pass and splice the bytes into every viewer''s snapshot; blocked by Packr bundleStrings/structures framing, needs a byte-identity check against pack() over many payloads. Also share reduced-record encoding per pass instead of per viewer.'
  acceptance_criteria: Byte-identical packed snapshots for fixed inputs (hash), per-viewer pack time measurably lower at 30+ neighbours on 3 interleaved runs.
  session_id: f73df536-0f66-49a1-8888-2a064d23416a
  status: pending
- id: tsl-grass-region-excess-after-rock-fix
  title: TSL grass-region pixels still +4.2/+3.3/+3.0 over legacy on NVIDIA after the rock-colour fix 8bc9f9e5
  body: 'NVIDIA RTX 3060, HEAD 4c60929a, ground pose (singleplayer terrainhash=1 at=-2750,-750, fraction 0.45, clear, hazeMul 0.4, cam yaw 1 pitch 0, 1036x647 DPR 1.25, veg 233 both renderers): rule-mask grass region TSL (199.28,217.79,211.89) vs legacy (195.04,214.49,208.94), meanAbs 4.21, ratio 4.21 vs K=3 FAIL (before the fix +8.78/+6.16/+4.92, ratio 6.82). Terrain region after the fix Δ(+1.08,+1.01,+0.93) but meanAbs ratio 3.57 still FAIL. Under the grey albedo override grass-region Δ is (+3.31,+2.95,+2.69) on NVIDIA and (-0.14,-0.30,-0.22) on AMD before the fix, and the grass mask responds to the terrain hook on both renderers (greyVsMix0 ~3.0-3.3), so the grass mask is mostly ground under/through grass. The pre-registered prediction grass Δ ~ -0.1 +-1.5 MISSED on NVIDIA. Raw frames: scratchpad w9-nv-tsl.json / w9-nv-legacy.json.'
