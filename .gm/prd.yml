- SESSION_ID: f73df536-0f66-49a1-8888-2a064d23416a
  id: collider-streamer-evict-over-cap-committed-noop
  title: HEAD 830db61a ships a no-op evictOverCap; collider eviction disabled in committed tree
  why: 'git show HEAD:src/terrain/ColliderStreamer.js at :434-435 has `return 0` as the FIRST statement of evictOverCap, before the live.size guard, so every eviction path is short-circuited and no collider is ever evicted. The working tree already has that line removed (another lane''s in-flight change, uncommitted). Mutation proof that this is load-bearing and caught: disabling evictOverCap makes collider-turnover-witness.mjs:87 fail with `8 step(s) over cap, worst 20` (live per step 8 15 20 15 17 18 20 20 19 at cap 8). Urgency: the committed tree is wrong and the fix is uncommitted, so any push or CI run off HEAD is red or silently unevicted.'
