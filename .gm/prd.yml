- id: collider-ring-cache-thrash-when-centres-move
  title: The per-centre ring cache misses on almost every rebuild once centres move
  acceptance: 'Witness: at 192 walking centres the ring cache serves >50% of ring lookups and the ring phase drops from ~15 ms/rebuild to under 8, with the same per-cluster collider counts and no starved cluster. Current: 345.6 of 384 ring lookups per rebuild are fresh (14-16 ms of the ~47 ms/rebuild moving arm) because CENTER_QUANTUM_M=4 quantises a 9.6 m walk into a new key every rebuild and RING_CACHE_CAP=512 is smaller than the 192 keys one rebuild needs.'
