- id: chart-reanchor-fluid3d-live-chart
  title: fluid3d refuses chart re-anchors while any fluid3d body is alive
  body: 'src/behaviours/fluid3d.js registers the service block ''fluid3d-solver-gravity-axis-is-bound-to-its-birth-chart'' because the wasm SPHSolver3D takes only gravityY along its own Y and an axis-aligned box, so a rotated chart cannot be expressed without re-initialising the particles. A world with a fluid3d-source can therefore never re-anchor. Fix: give src/fluid/as-src/sph3d.ts a gravity vector and an oriented container (npm run build:sph3d needs asc) then re-express particle positions and velocities, container frame and gravity through the transfer like the 2D solver''s frameOrigin/frameAxes.'
  acceptance_criteria: a world with a live fluid3d-source re-anchors through 10 chained epochs with particle world positions continuous to 1e-6 m and the block removed
  session_id: f73df536-0f66-49a1-8888-2a064d23416a
