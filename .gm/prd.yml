- id: gpu-optimization-plan-browser-webgpu
  title: Browser-feasible GPU optimization plan, ordered by measured bottleneck, each item gated on a witness
  body: |-
    Measured facts the plan is built on (2026-10-05, RTX 3060 and AMD Radeon iGPU, bundle 1a9ab0a40aed2c04 / 5133a3d0d11c036d): the default WebGPU path is CPU-bound, not GPU-bound, on the 3060 (frame p50 6.95 ms = vsync at 144 Hz, 87.9 draws/frame, 924 WebGPU calls/frame by the encoder hook); shadow pass is ~26% of CPU frame with ~11.3% in vegetation onBeforeShadow culling; boot to a playable world is 16-21 s, of which vegetation creation 7.4 s (45 serial species x variant builds, 90 cloned materials = 90 pipelines instead of ~30, 960 synchronous atlas cell renders, 315 pool allocations), createTerrainBackdrop 5.0 s (LUT and HPF workers awaited before sky/terrain/water build), bundle fetch/parse/eval 4.3 s, prewarm 2.2 s. Nothing yet measured: per-pass GPU time on the AMD iGPU (the real GPU-bound target). Rule: an unmeasured speedup claim is rejected; each item below needs a before/after witness on both GPUs with the contamination buckets clean.

    TIER 0 (measure first, unblocks everything): WebGPU timestamp-query per pass (shadow cascades, terrain, vegetation, sky, post) on both GPUs at 1080p and 1440p, via the existing step 2-4 gpu-timing row; feature-detect and fall back to CPU timing. Gate: a per-pass ms table for the AMD iGPU.

    TIER 1 (boot, largest player-visible cost): share one material pair per species across variants (90 -> ~30 pipelines) and move to a per-instance variant attribute (also addresses veg-variation-doubles-draws-and-halves-fps); bake or cache the impostor atlas per species, ship precomputed atmosphere LUT and HPF texels as static assets, start LUT/HPF jobs at module evaluation in parallel with connect; create pipelines asynchronously (createRenderPipelineAsync / three compileAsync) and slice vegetation builds across frames behind the loading overlay with a stated max block per slice. Gate: nav-to-scenery-built median over 3+ same-bundle arms on both GPUs, with the boot:veg:* and boot:backdrop:* spans.

    TIER 2 (CPU submission, 924 calls/frame): GPURenderBundle replay for static and semi-static scene parts; merge materials and draws (variant attribute); GPU-driven culling (compute frustum + optional Hi-Z occlusion from a depth pyramid) writing drawIndexedIndirect args, one indirect draw per material (multi-draw-indirect is an experimental Chrome feature: feature-detect only); cut redundant bind-group and uniform writes (cache by version). Gate: WebGPU calls/frame and CPU ms/frame on the 3060, draws/frame unchanged visually (A/B pixel regions at the pre-registered K).

    TIER 3 (shadows, 26% of CPU frame): cull once per cascade with per-cascade caster distance limits (tree shadows exist only within 35 m, so the far-cascade cull is wasted), static-cascade caching with updates every N frames and texel-snapped stable cascades, tight cascade fitting to scene bounds (parallel-split shadow maps, GPU Gems 3 ch. 10), shadow LOD meshes. Gate: shadow ms (timestamp) and onBeforeShadow CPU ms, shadow pixel A/B.

    TIER 4 (GPU-side cost, matters on the iGPU): dynamic render-resolution scaling driven by GPU frame time (FSR1/EASU already present, ThreeVdrs gated off on WebGPU: port it or replace with TSL EASU+RCAS), half-resolution SSAO/GTAO with depth-aware upsample, dual-filter (Kawase) bloom chain, 16-bit float targets and fewer MRT attachments, depth-only prepass for alpha-tested foliage only if overdraw is measured, low-resolution particles with depth-aware upsample for weather (GPU Gems 3 ch. 23), alpha-to-coverage or dithered cross-fade instead of sorting for foliage LOD. Gate: per-pass timestamp ms on the AMD iGPU and an fps-at-fixed-quality A/B.

    TIER 5 (architecture, only if Tier 2 leaves the main thread the limit): render in a worker with OffscreenCanvas (WebGPU is available in workers) so physics/netcode/DOM never share the render thread; compute-based GPU skinning/VAT for crowds beyond the current VAT path; terrain clipmap-style LOD only if the cube-sphere patch cost shows in timestamps.

    Already present (do not redo, verify only): instancing, octahedral impostors, ClusterLodMesh single draw (1230->450 draws), occlusion-query tier, cascaded shadows with needsUpdate gating, KTX2/BasisU and meshopt, precomputed atmosphere LUTs (Bruneton-style), floating origin, worker-baked heightfield, FSR1.

    Not feasible in a browser (do not plan): mesh shaders, bindless resources, hardware ray tracing, sparse/virtual textures, explicit async compute queues, persistent mapped buffers, DirectStorage; subgroups, dual-source blending and multi-draw-indirect are feature-detected extras, never baseline.
  acceptance_criteria: Tier 0 per-pass GPU timing table exists for both GPUs before any Tier 3/4 item starts; every optimization ships with a before/after witness on both GPUs (contamination buckets clean, 3+ same-bundle arms, reachability block PASS, pre-registered pixel criterion for any visual A/B); no item merges on an unmeasured claim. Tier 1 closes boot-vegetation-create-owns-7s and boot-terrain-backdrop-4s-webgpu-8s-legacy with measured numbers.
  session_id: f73df536-0f66-49a1-8888-2a064d23416a
  status: pending
- id: cpu-skip-and-replay-plan-browser
  title: Browser-feasible CPU work skipping and record-once-replay (the CUDA-Graphs idea), ordered by a measured CPU profile
  subject: ''
  body: |-
    The idea being ported: CUDA Graphs capture a dependent chain of GPU work once and replay it with one CPU launch, so the CPU stops re-deriving and re-submitting work whose inputs did not change. In a browser the real equivalents are narrower than CUDA's, so the plan names what exists, what does not, and the generalisation that matters most: do not recompute or resubmit anything whose inputs are unchanged.

    What the browser genuinely offers: (1) GPURenderBundle: record render commands once, replay inside any compatible render pass with one executeBundles call (formats and sample count must match; resources and bind groups are fixed at record time, contents of buffers can change, so dynamic data goes in buffers). This is the true graph-replay primitive. three.js exposes it as BundleGroup (static flag) in the WebGPU renderer: verify the pinned three version and whether the node-material path honours it. (2) GPUCommandBuffer is single-use: a whole-frame record/replay is NOT possible, and compute passes cannot be bundled; do not plan for it. (3) Indirect draw/dispatch (drawIndexedIndirect, dispatchWorkgroupsIndirect): a compute pass writes the arguments so GPU-produced counts drive later work with zero CPU readback or re-encode: this is the closest match to graph-style device-side dependency and is the basis of GPU-driven culling. (4) Queue-level: batch writeBuffer into one staging upload per frame (ring buffer, mappedAtCreation / copyBufferToBuffer), avoid per-object uniform writes, cache bind groups keyed by resource version, create pipelines once (async) and never inside the frame. (5) createRenderPipelineAsync / compileAsync to remove first-use stalls.

    The larger CPU wins are skipping, not replaying: (a) retained-mode dirty tracking in the scene graph: freeze static transforms (matrixAutoUpdate=false, matrixWorldAutoUpdate off on whole static subtrees, one explicit update when an editor edit or a chart re-anchor changes them), skip updateMatrixWorld/bounding-sphere recompute for unchanged objects, skip render-list rebuild and sort when the visible set and materials are unchanged; (b) visibility- and distance-driven update skipping: simulation LOD for everything not near a player (animation, steering, app update(), VAT crowds, weather particles tick at 1/N rate or sleep), and skip shadow-cascade renders for static content (the needsUpdate gate exists: extend it with a static-content hash); (c) physics: Jolt sleeping/island skipping exists, extend with the physics LOD/budget sweeps already present, and skip character updates for sleeping players; (d) netcode: delta snapshots and knownIds already skip unchanged entities: audit for per-tick work that scales with entity count rather than changed-entity count (TickHandler, SnapshotEncoder, LagCompensator ring writes, collision tile maps); (e) JS hot-path hygiene: zero per-frame allocation in the render and input loops (pools exist: audit), monomorphic shapes, typed arrays, avoid closures in hot loops, wasm SIMD where a numeric kernel dominates; (f) move work off the main thread: render in a worker via OffscreenCanvas (WebGPU is available in workers) so physics/netcode/DOM do not share the render thread, workers for baking and LUTs (exist) and for any sampler/placement loop; (g) idle-time scheduling: slice builds with a measured max block per slice, requestIdleCallback or scheduler.postTask with priorities for non-urgent work (placement streaming, collider ring builds, impostor bakes); (h) memoise pure functions with versioned keys (placement per chunk, height samples, collider rings, navmesh queries) and key every cache by transform-code version as well as input hash (deviation.build-cache-no-code-version-key).

    TIER 0 (measure before changing anything): a real CPU sampling profile of 120 s of REAL movement on both GPUs. The raw CDP passthrough landed this session: Profiler.enable/start/stop with a sampling interval, plus Tracing or Performance.getMetrics for main-thread vs scripting vs rendering time, so the ranked self-time list comes from the page, not from guesses. Report the top 30 functions by self time and by inclusive time, the main-thread ms breakdown (JS, style/layout, GC, rendering), GC pause counts and sizes, and per-frame allocation rate. Everything below is ordered by that table, and an item is rejected if it is not in the top of the profile.

    Candidate order once profiled (expected, not assumed): static-subtree freezing and render-list reuse; vegetation/shadow cull skipping (onBeforeShadow was 11.3% of frame); render bundles for static parts and material merging (924 calls per frame); GPU-driven culling with indirect args; simulation-LOD tick skipping; GC/allocation removal; worker render.
    ## Child rows -- the concrete, filed form of this plan

    Each row carries its own what-recomputes / stable-structure / changing-inputs / invalidation-key /
    worst-case-bound / measurement block and its own acceptance criteria. Every invalidation key is
    H(CODE) || STRUCT_EPOCH || Q(inputs), where CODE is a hash of the UTF-8 bytes of the source files
    that implement the transform itself, computed at boot -- never a hand-bumped version constant.
    Every measurement is integer work units with a zero-delta control arm in the same window: this box
    has a ~10% noise floor and is currently ~2.5x inflated, so a delta under it is unmeasurable-as-proposed.

    SERVER / NETCODE (per tick, measurable in node):
      cpu-plan-static-collision-pair-capture-and-replay   capture the static-vs-static pair list and replay its event stream (measured: N=2000/8 -> 21904 Map.get, 3657 pair tests per tick; static-only 3.585 ms/tick vs movers-only 0.002 ms/tick)
      cpu-plan-static-collision-grid-skip-rebuild         reuse the 4 m grid across ticks instead of re-bucketing every collision entity
      cpu-plan-aoi-ring-cell-neighbours-capture           cache the 8-cell neighbour ring + centres per cell (currently 8 resolveCell + 8 cell-centre solves per distinct player cell per pass, caches cleared unconditionally at TickHandler.js:255-257)
      cpu-plan-getsnapshot-transform-version-incremental  make getSnapshot incremental and stop keying its cache on the tick counter
      cpu-plan-entity-bin-double-buffer-flip-on-change    flip the 29-byte entity bin record only when its bytes change
      cpu-plan-interactables-gate-on-press                skip the interactable x player sweep on ticks where nobody is pressing interact

    PHYSICS BOOKKEEPING (per body touch, blocked on a real Jolt harness unless noted):
      cpu-plan-static-tile-index-int-span-key             replace the 19-concat string tile key with an integer tile-span compare (measured: 5.539 us/update, 3.040 us = 55% is the string alone)
      cpu-plan-static-tile-triangles-per-body-key         cache per-body triangle extraction so one changed body does not re-extract the whole tile

    CLIENT / RENDER (per frame):
      cpu-plan-mapspinner-quad-replay-gate-tolerance      split the existing frame cache into a pre-cull leaf capture plus a live cull (measured: 556 leaves / 741 node visits / 7755 Math.tan per frame at deck altitude). CORRECTED 2026-10-06: the always-miss term is the 0.256 degree rotation clause at :152, not the 1 m moveTol. The deciding counter already ships: window.__cullStats.frame is cached at :163 vs rebuild at :361.
      cpu-plan-cluster-lod-mesh-cross-frame-capture       give ClusterLodMesh a cross-frame skip; it currently has none (skip rate exactly zero)
      cpu-plan-player-tier-classify-capture               cache classifyPlayerTiers (measured: 82 us/call at n=200, 704 us/call at n=1024)
      cpu-plan-model-pool-tier-assignment-capture         capture the unconditional hero/mid/far tier loop at model-pool.js:2200-2218; budget state is mandatory in the key because the loop mutates its own thresholds

    DROPPED WITH REASONS (do not re-file without new evidence):
      gl-render.setFrameUniforms  -- already value-memoized (_chuSet* early-return on equality) and unkeyable: the remaining inputs are bare window.__* reads written from arbitrary call sites with no version and no epoch, so there is no finite input set to hash.
      ModelPool FPS-EMA budget controllers + VRAM monitor -- inputs are wall-clock and frame time, which differ every frame by construction. This is a control law, not a computation with a stable structure.
      TerrainBackdrop.renderPlanet basis rebuild -- constant cost; it only pays if the mapspinner row lands, in which case it is the natural host for that row key. Folded into cpu-plan-mapspinner-quad-replay-gate-tolerance rather than filed separately.
      RenderGraph.run per-node walk -- ~23 closure calls of pure dispatch overhead, not compute, and the nodes must run anyway. Below this box measurement noise floor; a row that cannot pass its own acceptance criteria is worse than no row.
      PlacementScheduler (already throttled to 250 ms), hpf.sampleDir (one sample per frame, folded into the mapspinner row as an input), packages/ecs (no per-frame surface found).
  acceptance_criteria: A CPU profile table (self and inclusive time, main-thread breakdown, GC) from 120 s of real movement on both GPUs exists before any implementation; each skipping or replay change ships with before/after CPU ms per frame, p50/p95/p99 frame time and WebGPU calls/frame on 3+ same-bundle arms with clean contamination buckets and PASS reachability; any visual change is witnessed by a pre-registered pixel criterion; correctness of skipped work is proven by an invalidation witness (change the input, show the cached or frozen result updates the same frame), because a skip that misses an invalidation is a silent staleness bug.
  session_id: f73df536-0f66-49a1-8888-2a064d23416a
  status: pending
