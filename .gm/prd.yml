- id: chart-reanchor-static-data-prepare-ahead
  title: Flip block for worlds with more than ~1500 statics is still O(N) in entity data, spatial reseat, park and notify
  body: 'Measured on the real server with the tile index on: after parking, a flip still costs ~7-8 us per static (fused data transform 1.7, SpatialIndex.reseat 2.7, park 3-4 incl. tile forget and entry allocation, notify loop over apps 0.7, invalidate 0.2), so 9000 statics block ~120 ms and a 16.7 ms tick holds ~1500. Design: during the pre-switch gate (like ChartReanchorTerrain.prepareFields, refuse with a named reason until ready) compute each static entity''s new-frame position/rotation/_spawnPosition into flat Float64Arrays with a source-position check (an editor move between prepare and flip must fall back to the live transform), and build per-stage SpatialIndex instances in the target chart; at the flip copy prepared values and swap the spatial references, so the synchronous block is iterate+copy (~1 us/static). Also precompute the chart-aware app list so notify does not scan every app.'
  acceptance_criteria: flip migrateMs for 10000 statics with the tile index on and 4 measured flips has a median below one tick (16.7 ms at 60 Hz) and an entity moved between prepare and flip lands at the right world point; no entity is ever observed in two frames
  session_id: f73df536-0f66-49a1-8888-2a064d23416a
  status: pending
