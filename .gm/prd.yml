- id: cpu-plan-static-collision-pair-capture-and-replay
  title: Capture the static-vs-static collision pair list and replay it instead of rebuilding and re-probing the grid every tick
  subject: The static half of the collision grid is recomputed every tick -- binning every static entity into the 4 m grid and re-running the 3x3 probe -- but statics never move, so the pair list and its payloads are a captured artifact that can be replayed.
  body: |-
    TIER-0 parent: cpu-skip-and-replay-plan-browser. CPU-side, server tick path. This is the deeper form of cpu-plan-static-collision-grid-skip-rebuild (which only reuses the binning); this row also captures the pair list and the payload sequence.

    WHAT RECOMPUTES, PER TICK
    src/apps/AppRuntimeTick.js:87 _tickCollisions() runs every tick (src/apps/AppRuntimeTick.js:25 and :45). Above _COL_GRID_THRESHOLD = 100 (src/apps/AppRuntimeTick.js:83) it takes _tickCollisionsGrid (src/apps/AppRuntimeTick.js:120), which per tick clears the grid (src/apps/AppRuntimeTick.js:121), bins EVERY collision entity with a Map.get / Map.set and an array push (src/apps/AppRuntimeTick.js:125-131), then re-walks every entity for the 3x3 neighbourhood probe (src/apps/AppRuntimeTick.js:132-148), then runs the periodic prune (src/apps/AppRuntimeTick.js:122-124).
    Measured in this survey pass with the real mixinTick, fireEvent sinked to a counter:
      N=2000 entities / 8 movers: 21904 Map.get, 3808 Map.set, 3657 pair tests, 1 Map.clear per tick
      N=20000 / 32 movers: 204672 Map.get, 9344 Map.set, 275292 pair tests
      Phase cost, static-only vs movers-only, ms/tick: 500/8 -> 1.031 vs 0.020; 1000/8 -> 0.946 vs 0.002; 2000/8 -> 3.585 vs 0.002; 5000/32 -> 15.160 vs 0.004
    The movers-only cost is two orders of magnitude smaller than the static cost, so roughly the whole phase is work whose answer never changes. (Caveat: the survey measured the discovery path with fireEvent sinked to a counter; dispatch cost is excluded from those ms figures, so re-measure end to end with a zero-delta control arm before quoting the win.)

    STABLE STRUCTURE (the captured graph)
    (a) the 4 m cell key of every bodyType === 'static' collision entity; (b) the complete static-vs-static candidate pair list from the 3x3 probe; (c) the ordered sequence of _collisionPayload results (src/apps/AppRuntimeTick.js:93) for the pairs that actually overlap.

    CHANGING INPUTS
    Positions and radii of the moving subset; membership of _collisionEntities; _COL_CELL_SZ; _COL_GRID_THRESHOLD.

    INVALIDATION KEY
    key = fnv1a(SCHEMA_COLCAP || fnv1aString(_tickCollisionsGrid.toString() + _colR.toString() + _collisionPayload.toString()) || _COL_CELL_SZ || _COL_GRID_THRESHOLD || collisionListVersion || seq over statics of (id, float64 pos[0..2], _cachedColR))
    collisionListVersion is a version counter bumped by every site that changes the collision set or a static's transform: _rebuildCollisionList (src/apps/AppRuntime.js:342), the bodyType change path (src/apps/AppRuntime.js:372-374), setEntityPosition (src/apps/AppRuntime.js:241), setEntityVelocity, restoreGameState (src/apps/AppRuntime.js:740), and the chart re-anchor migrators. Do NOT reuse appRuntime._staticVersion -- it is bumped only by destroyEntity (src/apps/AppRuntime.js:349), not by setEntityPosition, so it is a false-hit hazard here. Use a HookedSet-backed counter (the pattern already exists at src/apps/AppRuntime.js:72 for _movedStaticIds) so membership changes cannot be missed by hand-maintained bookkeeping.
    The CODE term is mandatory: a key derived from inputs alone silently serves stale output forever when the transform code changes (deviation.build-cache-no-code-version-key). fnv1aString already exists at src/shared/fnv1a.js:24; hashing Function.prototype.toString() of the emitting functions makes any edit auto-invalidate. Fail closed -- if toString() is unavailable or the read throws, treat as a permanent miss, never a hit.

    THE HAZARD THAT SHAPES THIS ROW
    onCollision here has no enter/exit edge: overlapping statics fire EVERY tick. So the artifact must replay the EVENT LIST, not merely 'which pairs exist'. A stale capture -- a static that moved without bumping collisionListVersion -- silently omits onCollision for that pair forever. That is a plausible-wrong omission, the worst class, and it is why the key is an exact function of the same positions and radii the live code reads, and why membership uses a hooked set rather than a manual counter.

    WORST-CASE BOUND
    Skipped path is bounded by the captured pair count K, computed once and fixed. Miss path is the current code, unmodified. A false hit is only possible through a missed mutation site, and it is detectable: the acceptance witness diffs the emitted event stream, capture on vs capture off, including forced mutations.

    MEASUREMENT (integer work units, immune to timer inflation -- this box's zero-delta control arm is +/-10% and currently ~2.5x inflated, so ms numbers must be re-taken with a control arm)
    Deciding counter: per tick, (a) Map.get, (b) Map.set, (c) pair tests, (d) cell-array allocations, inside _tickCollisionsGrid. After the change, on a tick with no membership change and no static transform change, (a)-(d) must fall to the moving-subset-only cost.
  acceptance_criteria: 'Live witness: N >= 500 static collision entities, 8-32 moving entities, >=300 ticks. Report per tick (a) Map.get, (b) Map.set, (c) pair tests, (d) cell-array allocations, before and after. Pass requires (a) and (b) to drop by at least 90 percent and (d) to reach 0 on ticks with no membership or static-transform change. Correctness: run 1000 ticks capture-on and capture-off on the same seeded input and diff the emitted (entityId, event, payload) stream for exact equality; that diff must also be run after each of -- teleporting a static entity, adding an entity, removing an entity, and changing a collider size -- and must be identical in every case. Re-measure the ms figures with a zero-delta control arm in the same window.'
  session_id: f73df536-0f66-49a1-8888-2a064d23416a
  status: pending
- id: cpu-plan-static-tile-triangles-per-body-key
  title: Cache per-body triangle extraction in StaticTileIndex.build so one changed body does not re-extract every body in the tile
  subject: When one body in a tile changes, StaticTileIndex.build re-extracts the triangles of every body in that tile through Jolt; cache each body's triangle block under a per-body key so only the changed body is re-extracted.
  body: |-
    TIER-0 parent: cpu-skip-and-replay-plan-browser. CPU-side, physics bookkeeping. BLOCKED on a real Jolt harness -- see MEASUREMENT.

    WHAT RECOMPUTES
    src/physics/StaticTileIndex.js:60 build() (extract at :50, hash at :75, gate at :83). The gate at :83 is `t.builtVersion !== t.version || t.builtBig !== bigVersion`, which is correct at tile granularity, and bigVersion (:44/:28) correctly invalidates all tiles because every big body is appended to every tile (:65). The residual recompute: when ONE body in a tile changes, appendTriangles re-extracts EVERY body in the tile (src/physics/StaticTileIndex.js:68) -- a J.AABox allocation, a J.ShapeGetTriangles call and a Float32Array.slice() per body -- then re-concatenates the whole tile and re-runs fnv1aBytes over it (src/physics/StaticTileIndex.js:71-75).

    STABLE STRUCTURE (the captured graph)
    The per-body triangle block (a Float32Array).

    CHANGING INPUTS
    That body's world-space bounds key and rotation; its shape.

    INVALIDATION KEY
    perBodyKey = fnv1a(SCHEMA_TRIS || fnv1aString(appendTriangles.toString() + build.toString()) || bodyId || float64 bits of (bounds min/max, quat) || tileM || marginM || _bodyShapeKey)
    _bodyShapeKey is src/physics/World.js:113. It MUST be folded in: the bounds-and-rotation key can stay constant while a compound or sculpted body's shape changes, which would otherwise serve stale geometry. Invalidate additionally on any setTerrainHeightSource or height-delta change.
    The CODE term is mandatory: a key derived from inputs alone silently serves stale output forever when the transform code changes (deviation.build-cache-no-code-version-key). fnv1aString already exists at src/shared/fnv1a.js:24; hashing Function.prototype.toString() of appendTriangles and build makes any edit auto-invalidate. Fail closed -- if toString() is unavailable or the read throws, treat as a permanent miss, never a hit.
    Store each body's Float32Array under this key; on a tile rebuild re-extract only the bodies whose key misses and re-concat. The tile hash is still recomputed from the concatenation, which is cheap relative to extraction.

    WORST-CASE BOUND
    Skipped path is bounded by the number of unchanged bodies in the tile. Miss path is today's extraction. Failure mode if the key is wrong: a body whose shape changed keeps its old triangles, so a client collision mirror silently serves stale geometry -- players collide with geometry that is no longer there. That is why _bodyShapeKey is in the key and why the acceptance witness must mutate a body's shape, not just its position.

    MEASUREMENT (blocked)
    UNMEASURED AS PROPOSED. Every path runs through Jolt wasm (J.AABox, J.ShapeGetTriangles, HEAPF32); a substitute would measure the harness, not the cost, so no number is claimed here. Deciding measurement, once a real PhysicsWorld harness exists: per tile rebuild, (a) bodies in the tile, (b) of those, bodies whose perBodyKey hit. Skippable units = (b), each worth one J.AABox + one ShapeGetTriangles + one Float32Array.slice(). Do NOT proceed on a predicted figure -- measure it, with a zero-delta control arm in the same window (this box's noise floor is +/-10 percent and is currently ~2.5x inflated).
  acceptance_criteria: 'Prerequisite: a real PhysicsWorld Node harness that exercises src/physics/StaticTileIndex.js against real Jolt bodies (no substitute for J.AABox or ShapeGetTriangles). Then: build a tile with K >= 20 bodies, dirty exactly one, and report per rebuild (a) bodies in the tile, (b) perBodyKey hits, (c) J.AABox allocations, (d) ShapeGetTriangles calls, (e) Float32Array.slice() calls. Pass requires (c), (d) and (e) to fall to 1 each (the single dirty body) and the total bytes allocated per rebuild to drop proportionally. Correctness: the concatenated tile triangle buffer must be bit-identical to the pre-change implementation for the same tile state, and must be correct after each of -- moving a body within the tile, moving a body out of the tile, and changing a body''s SHAPE (the case the bounds key alone would miss).'
  session_id: f73df536-0f66-49a1-8888-2a064d23416a
  status: pending
- id: bake-code-version-input-list-is-hand-maintained
  title: Bake code versions are a hand-maintained file list, so a file outside it ships stale bytes with no diagnostic
  body: 'src/static/BakeCodeVersion.js defines every bake cache key as bakeCodeVersion(BAKE_INPUTS_*), a hand-written array of relative paths whose contents are sha1-hashed (GLB_TRANSFORM, KTX2_EXTRACT, PROGRESSIVE_BAKE, MINIMAP_BAKE, HEIGHTFIELD_BAKE). The key is only as complete as that list. A file that changes baked output but is not named in the list does not move the version, so scripts/check-cache-keys.mjs reports nothing and every existing artifact keeps being served as valid forever: the same class as deviation.build-cache-no-code-version-key, which already shipped 10388 degenerate triangles from pre-fix bakes. Observed 2026-10-06: node scripts/check.mjs reported apps/world/tps-game.hf baked with height code version 1e14bb7bd0db while the tree baked 0e817b8c468a, so height-affecting code changed and the artifact was stale; another lane re-baked it, but only because a listed file happened to change. Fix: stop hand-maintaining the list and derive each transform closure by walking the import graph from its entry file (scripts/bake-heightfield.mjs, packages/streaming-gltf/tools/bake-cluster.mjs, scripts/bake-minimap.mjs, src/static/GLBTransformer.js, src/static/KTX2Extract.js), so any new import invalidates the cache without anyone remembering to edit an array. Filed from the fire lane; not to be fixed there.'
  acceptance_criteria: 'HEIGHTFIELD_BAKE_CODE_VERSION, and each other transform version, changes when a file in the entry point import closure changes, with no edit to BakeCodeVersion.js: witnessed by adding a new import to scripts/bake-heightfield.mjs and by editing a file two hops away, each moving the version and each flagged by scripts/check-cache-keys.mjs. Every existing artifact still validates after the switch, with a one-time re-bake of anything whose version moves, and node scripts/check.mjs exits 0.'
  session_id: f73df536-0f66-49a1-8888-2a064d23416a
  status: pending
- id: gpu-plan-terrain-height-compute-cache
  title: Terrain vertex stage evaluates the full height fractal five times per vertex; a compute pass writing height once per vertex into a storage buffer removes four of the five
  body: |-
    Parent row: gpu-optimization-plan-browser-webgpu. Bottleneck attacked: vertex-stage fractal math, not draw count and not fragment work.

    EXACT SITES. packages/mapspinner/src/tsl/terrain-material-tsl.js:134-146 -- Loop({ start: int(0), end: u.fdTaps.add(u.loopBoundDelta), type: "int", condition: "<" }) with FD_TAPS = 5 (constant, line 15) calls spec.composeHeight(d) at line 139 five times per vertex to build the central-difference normal; the cross product at line 147 and the lit normal at lines 162-163 consume the result. The raw-WGSL twin does the identical thing at packages/mapspinner/src/webgpu/patch-grid-render.js:341-356. The instance payload is minimal (iOffset vec4 plus iFace float, makePatchGeometry at packages/mapspinner/src/tsl/planet-tsl.js:53-65) and the whole terrain is one instanced draw (mesh at planet-tsl.js:112, single drawIndexed at patch-grid-render.js:930, about 143 quads at spawn), so the vertex cost is almost entirely the five fractal evaluations rather than fetch or submission.

    WHY THIS IS THE RIGHT TARGET. packages/mapspinner/AGENTS.md records the deck measurement "RUNTIME FPS is VERTEX-SHADER-bound (96% VS+raster at the deck, FS is a dead lever)". The AMD rdna-2 main scene context is 9.51 ms average (max 30.5) against a 1024x1024 shadow context at 0.099 ms (row gpu-main-pass-9.5ms-amd-no-subpass-attribution) -- comparable pixel counts, two orders of magnitude apart in cost, so ctx0 is dominated by shader math rather than fill. No measurement has yet split ctx0 into terrain, sky, water and vegetation, so the ceiling here is unknown.

    CHANGE. An instanced compute pass over the live patch set (instanceCount quads x GRID_SIZE grid vertices, roughly 143 x 289 at spawn) that evaluates composeHeight once per vertex into a storage buffer, with the vertex stage reading its own and its four finite-difference neighbours out of that buffer. This is the one mechanism packages/mapspinner/AGENTS.md records as genuinely untried: it is distinct from the removed terrain-phase1/2/3 pipeline and from the THC height pool, because THC was MEASURED NET-NEGATIVE for a different reason (it moved cost from VS to FS by adding a per-pixel texture fetch), whereas this keeps the cost in the vertex stage and only removes duplicate evaluations of the same field at the same lattice site.

    VALUE-PRESERVING AND PARITY. Read at exactly the same absLocal + (ox,oy)*step sites, so h0, the four w* taps and n0 are unchanged and no normal or lighting expression is edited. Two hazards to honour: (1) the finite-difference taps must remain inside ONE loop instance per the FXC / ANGLE d3d11 rule in packages/mapspinner/AGENTS.md -- never difference composeHeight across separate call sites, and keep the runtime bound u.loopBoundDelta, never a constant, so FXC cannot unroll the octave loop; (2) three.js WebGL2 backend has no storage buffers, so this is a WebGPU-only path and needs a guarded fallback to the current five-tap vertex stage or it breaks the automatic fallback. Because it is WebGPU-only it cannot regress the legacy GLSL parity arm directly, but it must not change the TSL arm either.

    MEASUREMENT CLASS: needs a GPU window queued through C:/dev/train/tools/gpulock.mjs (timestamp queries on real adapters; no CI gate measures a real GPU -- scripts/frame-time-gate.mjs:92 and scripts/cold-load-gate.mjs:48 both launch SwiftShader). UNMEASURED: the 5x-to-1x reduction in fractal evaluations is an arithmetic fact about the code, not a measured speedup, and its effect on frame time is bounded by the terrain share of ctx0, which is not yet measured.
  acceptance_criteria: 'GPU window via C:/dev/train/tools/gpulock.mjs, same walk pose, n>=3 same-bundle arms on BOTH the NVIDIA and AMD rdna-2 adapters, contamination buckets clean and adapter vendor recorded. (1) The ctx0 ablation in gpu-main-pass-9.5ms-amd-no-subpass-attribution must run first and report the terrain-off delta for ctx0, so this candidate ceiling is known before any code is written. (2) Before/after GPU frame p50/p95 and ctx0 ms. (3) A zero-delta control arm run in the same window whose measured delta sets the noise floor; PASS only if the improvement exceeds that control arm delta. (4) Bit parity: terrain height probe values and the shaded output at a fixed pose pixel-compare equal to the current build within the existing TSL/legacy parity tolerance. (5) The WebGL2-backend fallback arm renders with the five-tap vertex stage and no console error.'
  status: pending
- id: gpu-plan-sky-march-and-ap-unconditional
  title: The sky background runs an 8-step Rayleigh/Mie march twice per pixel and the terrain runs an aerial-perspective march on every pixel, then mixes both away with a factor already computed
  body: |-
    Parent row: gpu-optimization-plan-browser-webgpu. Bottleneck attacked: per-pixel transcendental and LUT-fetch work that is computed and then discarded.

    EXACT SITE 1 (sky). packages/mapspinner/src/tsl/sky-tsl.js:153-154 -- "const sky = marchSteps(camera, ray, sun, distToTop(r, mu))" and "const ground = marchSteps(camera, ray, sun, max(distToGround(r, mu), 1e-3))" are both executed unconditionally and then blended at line 156 by wSky = smoothstep(muTangent - ATM_HORIZON_BLEND_MU, muTangent + ATM_HORIZON_BLEND_MU, mu) (line 152), whose blend window is 0.012 wide, so it is 0 or 1 for essentially every background pixel. The sky background node only shades pixels where no geometry was drawn, so on nearly all of them the ground march is computed and thrown away. Each marchSteps (lines 117-139) is SKY_MARCH_STEPS = 8 (line 26) iterations of two exp() plus a transmittanceToSun LUT sample at line 133, so the discarded branch costs 8 LUT samples and about 16 exp per background pixel.

    EXACT SITE 2 (terrain aerial perspective). packages/mapspinner/src/tsl/terrain-lighting-tsl.js:81-89 -- apGate = smoothstep(AP_GATE_KM[0], AP_GATE_KM[1], dKm) with AP_GATE_KM = [3.0, 120.0] is computed at line 81, "ap = sky.marchRadiance(...)" runs unconditionally at line 83, and line 89 then does mix(lit, hazed, apGate.mul(u.hazeMul)), discarding it entirely for any fragment nearer than 3 km. marchRadiance (sky-tsl.js:89-108) is four scattering/transmittance LUT fetches plus phase functions.

    CHANGE. Guard each with the gate already computed: wrap the ground march in If(wSky less than 1.0) and wrap terrain-lighting-tsl.js:83-89 in If(apGate greater than 0.0), leaving every expression inside unchanged. Both are value-identical by construction because the discarded path is mix/select-ed out when the guard is false, so this does not alter the normal or the lighting arithmetic -- it is parity-safe in a way the other candidates on this list are not. Hazard: a non-uniform branch around a texture LUT fetch must keep the fetch at uniform control flow (the FXC / ANGLE d3d11 class); this codebase already solves the analogous problem for the terrain splat with .grad() at packages/mapspinner/src/tsl/surface-splat-tsl.js:47, so either hoist the fetches or select on the result rather than branching inside a march loop.

    WHY IT CAN ONLY PAY OFF ON ONE OF THE TWO ADAPTERS. The AMD rdna-2 GPU frame is p50 10.6 ms / p95 19.2 / p99 23.13 with the main scene context at 9.51 ms average, so per-pixel work is the only GPU lever with room there. The NVIDIA adapter is CPU-bound (frame p50 13.86-13.88 ms against GPU p50 3.08-3.34 ms, project/tier0-cpu-gpu-profile-2026-10-05), so removing per-pixel GPU work cannot move the NVIDIA frame at all and this row must not be judged on NVIDIA numbers.

    MEASUREMENT CLASS: needs a GPU window queued through C:/dev/train/tools/gpulock.mjs. UNMEASURED: no number exists for the sky or the aerial-perspective share of ctx0; if the ablation shows ctx0 is vertex-bound (candidate gpu-plan-terrain-height-compute-cache), this row ceiling is small and it should be closed as measured-and-negligible rather than implemented.
  acceptance_criteria: 'GPU window via C:/dev/train/tools/gpulock.mjs, n>=3 same-bundle arms, both adapters, fixed walk pose. (a) Ceiling first: ctx0 ms with the sky background node removed and with marchRadiance forced to a constant, reported separately. (b) Before/after GPU frame p50/p95 and ctx0 ms with the two guards in place. (c) A zero-delta control arm in the same window defining the noise floor; PASS only if the measured delta exceeds it. (d) Fixed-pose pixel-compare against the unguarded build within the TSL/legacy parity tolerance, and the active TSL-vs-legacy terrain darkening investigation (rows tsl-terrain-grass-brighter-than-legacy-unexplained and tsl-terrain-grey-lighting-residual) re-run and still passing, since this row edits a file on the lighting path.'
  status: pending
- id: gpu-plan-webgpu-dynamic-resolution-three-scene
  title: Dynamic resolution is unavailable on the WebGPU path for the THREE scene, and the only GPU-bound adapter may be shader-bound rather than fill-bound, so a resolution sweep must decide this before any code is written
  body: |-
    Parent row: gpu-optimization-plan-browser-webgpu. Bottleneck attacked: fill/raster cost on the one adapter where GPU work sets the frame.

    EXACT SITES. client/core/ThreeVdrs.js:248 records THREE_VDRS_WEBGPU_UNSUPPORTED, so the FSR1 EASU + RCAS plus depth-composite path in that file (259 lines, auto controller TARGET 6.94 ms, MIN 0.5 / MAX 1.0 / STEP 0.1) never engages under WebGPURenderer. packages/mapspinner/src/webgpu/vdrs-composite.js (493 lines: BilinearUpscale, Fsr1Upscale, DepthWriteback, readBackDepthF32) already implements the upscale for the mapspinner WebGPU path, so the missing piece is the THREE-scene half only. client/core/SceneSetup.js:189-190 constructs the WebGPURenderer and 148-159 sets pixel ratio min(dpr, 2) desktop / min(dpr*0.5, 1) mobile -- that is a static ratio, not a dynamic one.

    THE MEASURED FACTS THAT MOTIVATE AND ALSO THREATEN THIS CANDIDATE. AMD rdna-2 GPU frame p50 10.6 ms / p95 19.2 / p99 23.13 with the main scene pass at 9.51 ms average, against NVIDIA GPU p50 3.08-3.34 ms where the frame is CPU-bound at 13.86-13.88 ms (project/tier0-cpu-gpu-profile-2026-10-05). The measured canvas blit context is 0.039 ms NVIDIA / 0.181 ms AMD, so one extra upscale pass is cheap. But the same profile shows the 1024x1024 shadow context at 0.099 ms on AMD while the 1280x720 main pass is 9.51 ms -- similar pixel counts, roughly a hundredfold cost ratio -- which says ctx0 is dominated by per-pixel shader math, not by rasterizing pixels, and resolution scaling would then buy close to nothing. The deciding measurement is a sweep, not an implementation.

    CONSTRAINTS. FSR1 EASU/RCAS is a plain full-screen fragment shader with no vendor extension, no compute and no CUDA, so it qualifies for both the NVIDIA and AMD rdna-2 devices in a browser. Vendor upscalers (DLSS, FSR3/4, XeSS) do not: they are not exposed to WebGPU in Chrome and are therefore out of scope for this plan. 1920x1080 and 1440p arms have never completed (both hung in the tier-0 run), so any sweep must start at or below 1280x720.

    RISK TO MEASURE, NOT ASSUME. readBackDepthF32 in vdrs-composite.js is a GPU-to-CPU readback; if the depth writeback sits on the frame critical path it converts a GPU win into a stall. Time the composite with and without DepthWriteback.

    MEASUREMENT CLASS: needs a GPU window queued through C:/dev/train/tools/gpulock.mjs for both the sweep and the implementation. UNMEASURED: no predicted delta is claimed here.
  acceptance_criteria: 'GPU window via C:/dev/train/tools/gpulock.mjs. Step 1 decides whether to build it: fixed walk pose, render scale 1.0 / 0.75 / 0.5 / 0.35, n>=3 arms per scale, on AMD and NVIDIA, reporting ctx0 ms and GPU frame p50/p95 per scale plus a zero-delta control arm; if ctx0 ms is not proportional to pixel count beyond that control arm delta, close this row as measured-and-inapplicable with the table attached. Step 2 only if proportional: implement the WebGPU THREE-scene dynamic resolution, same arms, PASS on GPU frame p95 improving beyond the control arm delta, with a fixed-pose pixel-compare of the upscaled frame against the 1.0 reference within a stated tolerance, and with the DepthWriteback variant timed separately so a readback stall cannot hide inside the win.'
  status: pending
- id: gpu-plan-wire-gpu-instanced-slot-cull-and-hiz
  title: 'The shipped GPU culling passes are not on the live vegetation path: instanced-slot-cull-tsl.js has zero importers and WebGpuHizTier is reached only through a caught dynamic import'
  body: |-
    Parent row: gpu-optimization-plan-browser-webgpu. Bottleneck attacked: CPU draw submission and per-instance CPU culling, which is the binding constraint on NVIDIA.

    EXACT SITES. packages/streaming-gltf/src/instanced-slot-cull-tsl.js (TSL compute slot cull, CULL_SENTINEL = 1e7) has zero references anywhere in the tree -- it is shipped but unwired. packages/streaming-gltf/src/webgpu-hiz-tier.js (raw-WGSL hierarchical-Z buffer plus CULL_LOD plus IndirectStorageBufferAttribute indirect draw args, HZB_WORKGROUP_DIM 8, CULL_WORKGROUP_SIZE 64) is reached only from packages/streaming-gltf/src/model-pool.js:1806 through "await import('./webgpu-hiz-tier.js')" with a console.warn catch at line 1816, and its supported() gate requires backend.isWebGPUBackend. By contrast packages/streaming-gltf/src/batched-far-tier.js IS live (model-pool.js:1876, updateNow at 2014), so the tier machinery itself is proven. docs/webgpu-shader-audit.md:153 already classifies the HIZ tier as "Raw WGSL, port to TSL compute", i.e. shipped, not adopted, and not in the project TSL-only direction.

    WHY IT MATTERS. The CPU side is the binding constraint on NVIDIA: frame p50 13.86-13.88 ms against GPU p50 3.08-3.34 ms, about 87.9 draws/frame and 924 WebGPU calls/frame, with WebGPULodInstancer.updateLOD at 6.7% CPU self, setMatrixAt 4.0% and GPUQueue.writeBuffer 4.2% (project/tier0-cpu-gpu-profile-2026-10-05). GPU-driven culling moves that into a compute pass and lets one indirect draw cover a whole LOD tier. There is also a second gap: packages/streaming-gltf/src/occlusion-query-tier.js is WebGL2-only and correctly fail-open, so on the WebGPU path there is currently no occlusion culling at all.

    CHANGE. Port webgpu-hiz-tier.js to TSL compute per the audit own disposition, and route the live client/core/WebGPULodInstancer.js instance pools through the instanced slot cull so culling and LOD selection happen GPU-side, keeping the CPU path as the WebGL2-backend fallback.

    CONSTRAINT THAT SHAPES IT. Multi-draw indirect is an experimental Chrome flag and is NOT available in a browser; one indirect draw per tier is the admissible shape, which is already what webgpu-hiz-tier.js emits. Must no-op on the WebGL2 backend.

    MEASUREMENT CLASS: split. The primary metrics -- draws/frame, WebGPU calls/frame from the existing encoder hook, and updateLOD CPU self share -- are CPU-measurable without holding a GPU. The frame-time claim needs a GPU window queued through C:/dev/train/tools/gpulock.mjs. UNMEASURED: runVegetationScalePerfAB in client/core/WebGPUCullingHubIntegration.js is a proof-of-concept at 12000/30000 instances and is not the live path; its numbers are not evidence for live instance counts.

    ADJACENT-ROW INTERACTION TO EXERCISE. This row edits the same surface as cpu-veg-lod-instancer-full-scan-per-move (CPU tier rescan) and veg-variation-doubles-draws-and-halves-fps (90 instancers from 15 species x 3 variants x branch+leaf). Whatever is built here must stay correct when variants are later merged into one instancer, and the merged-instancer change must be re-witnessed against it.
  acceptance_criteria: 'CPU-measurable half, no GPU window needed: draws/frame and WebGPU calls/frame from the existing encoder hook plus updateLOD self share, live scene, before and after. GPU half via C:/dev/train/tools/gpulock.mjs: n>=3 same-bundle arms on both adapters, GPU frame p50/p95 and CPU main-thread share, with a zero-delta control arm in the same window and PASS only if the delta exceeds that control arm delta. Correctness: the visible-instance set at a fixed pose equals the CPU cull set (count and per-tier histogram identical), the WebGL2-fallback arm renders with the CPU cull and no console error, and the merged-variant instancer case from veg-variation-doubles-draws-and-halves-fps is re-witnessed against the new path.'
