- id: tsl-sky-after-c6db8721-unchanged-cache-or-ineffective
  title: 'After c6db8721 the TSL sky still measures (83.1,176.3,235.8): fix ineffective, or a cached module executed'
  body: 'NVIDIA 2026-10-05 13:06, HEAD 00ed02c5: sky clip (83.07,176.29,235.77) vs legacy (56.22,176.35,235.80), identical to the pre-fix frame. In-page no-store refetch of display-referred-tsl.js hashed 9388e429...a2dd (HEAD, no clamp, etag 8442327a), but resource timing transferSize was 0 for the loaded module despite Network.setCacheDisabled sent before Page.navigate, so the executed module may have come from the gm cdp profile cache. Separate the two: boot from a guaranteed-empty profile (or with the module URL busted via the importmap), confirm the executed shader lacks the clamp (e.g. read the compiled WGSL via renderer debug or a sentinel export), then re-measure. If the clamp is truly gone and the sky is unchanged, the ACES inverse is not on the sky path (check toneMappingMode at runtime and whether sky-tsl.js reaches invertAcesFilmic) and the Node round-trip model in 00ed02c5 does not describe the GPU path.'
