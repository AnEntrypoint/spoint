- id: fire-system-big-deal
  title: 'Fire as a first-class, gameplay-changing, performant system: spreading front on a coarse deterministic cell grid, burn-state vegetation, smoke, damage, rain extinguish'
  body: |-
    USER GOAL (2026-10-05): fire must be a really big deal in this engine. Every cost below is a design estimate until measured; the project rule applies: each piece ships with a before/after witness on both GPUs (NVIDIA RTX 3060 and AMD Radeon iGPU) with clean contamination buckets, and an unmeasured speedup claim is never executed.

    GAMEPLAY FIRST (it costs almost nothing): fire matters when it changes where players can go and what they can see. (1) It spreads: fire moves across vegetation with wind, so a fire that starts in one place becomes a moving front that pushes players around. (2) It has consequences: it damages anything inside it, burns trees (their shadow and collider disappear), blocks sightlines with smoke, and is put out by the existing rain. (3) Players can use it: start it (a weapon or explosive), steer it with the wind, hide in or behind it.

    SIMULATION AS DATA ON A COARSE GRID, not physics objects: cells, not entities; each cell holds fuel, heat and burn state; a cell steps only while it is burning or has a burning neighbour, so a quiet map costs nothing (active-list, not a full-grid sweep). Deterministic spread: seed the spread from the ignition event and the tick, as lockstep already does, so clients simulate locally and the network carries only ignition and extinguish events instead of per-cell state. Per-instance burn state on vegetation: vegetation placement is already deterministic, so the planned per-instance variant attribute (see boot-vegetation-create-owns-7s / veg-variation-doubles-draws-and-halves-fps) carries a burn stage (green, burning, charred), swapping a tree's look with no extra draws.

    ADDITIONS (to be validated and costed by the design agent, each its own row if accepted): cell addressing must be chart-independent (key cells by the world-direction cube-face lattice used by terrain placement chunks, never by chart-local x,z, so the chart re-anchor service does not invalidate fire state); integer fixed-point heat/fuel so every peer, rollback and lockstep, stays bit-identical; fuel by species/biome/grass vs trees, moisture from weather/time-of-day, wind-biased spread with a seeded ember-jump probability (spotting), firebreaks (water, rock, roads, cleared ground), regrowth after burn; burn mask painted into the terrain splat weights (scorched ground, ash) and a charred-collider/shadow swap through the existing destructible/collider pool path (no new bodies); smoke as a low-resolution volume or sprite layer that really occludes sightlines for gameplay (not only visuals) with a cheap server-side line-of-sight density query; heat shimmer as one half-resolution distortion pass gated to burning cells in view; emissive flame sprites from one instanced draw (GPU-animated, no per-flame CPU work) plus embers via GPU compute where WebGPU allows with a CPU/instanced fallback; dynamic light from a small pooled set of lights chosen by screen-space importance, never one light per flame; spatial audio from the active-front centroid per tile; player and NPC burning status effect with damage-over-time, panic/avoidance and navmesh cost for burning cells; extinguishing by rain (existing weather state), water volumes, extinguisher/water-bomb tools; incendiary weapons and explosions through ctx.defineCombat; fire objectives for game modes (spreading hazard zone like the shrinking zone, burn-the-base); persistence as ignition-event log plus tick (replayable) not cell dumps; editor ignite/extinguish brush and a fuel-paint brush; replay/heatmap hooks; LOD: far fire as billboard impostors with the sim running coarser (or lazily fast-forwarded from the event log when a player approaches); mobile/low-end quality tier (fewer sprites, no shimmer, smaller smoke); lag compensation and prediction behaviour for damage (server-authoritative, client-predicted visuals only); API as a behaviour ctx.defineFire in src/behaviours with a data spec (fuel table, spread rule constants, damage, smoke), so apps are tuning plus assets like ctx.defineCombat.

    PERFORMANCE DISCIPLINE: worst case, not average: bound the active cell count and the per-tick step cost explicitly (budget, with a documented graceful degradation: coarser step or lowest-priority cells frozen, never unbounded); SoA typed arrays, no per-cell allocation, deterministic iteration order (sorted cell ids), wasm SIMD only if the Node microbenchmark shows the JS kernel dominates; render cost bounded by an instance budget independent of the burning area; zero new draw calls per burning tree (variant attribute only) and zero new pipelines at runtime (all fire materials created and warmed at boot behind the loading overlay, async pipeline creation).
  acceptance_criteria: A design record in recall plus child PRD rows (one per independently shippable piece, each with its witness plan) exist before implementation starts; the cell simulation is proven deterministic (two independent runs and a rollback/lockstep peer pair produce bit-identical cell state hashes over thousands of ticks, with the ignition event as the only input), its worst-case step cost is measured in Node for 1k/10k/100k active cells and bounded by a budget with a graceful-degradation mode, the wire carries only ignition/extinguish events (bytes measured), the chart re-anchor service leaves fire state valid (addressing proof), and the render and gameplay pieces ship each with a before/after on both GPUs (per-pass GPU ms via timestamp queries, CPU ms/frame, draw calls unchanged for burning vegetation, WebGPU calls/frame, contamination buckets clean, reachability PASS). A burning-forest scenario (a real wind-driven front across tps-game or a planet biome) is demonstrated end to end in a real browser on both GPUs with p95 frame time stated, and fire damage, smoke occlusion and rain extinguish are each witnessed in gameplay terms (player damaged only inside burning cells; a shot blocked by smoke density per the documented rule; fire front halted by rain).
  session_id: f73df536-0f66-49a1-8888-2a064d23416a
  status: pending
- id: planet-wide-multiplayer-all-scenarios
  title: 'Planet-wide multiplayer: every multiplayer scenario analyzed and perfected, any improving change approved'
  body: |-
    USER DIRECTION (2026-10-05, a genuine user message): planet-wide multiplayer for ALL our multiplayer scenarios must be analyzed and perfected, and any change that improves it is approved. Approval means agents may execute improvements without asking first; it does not waive the project rules: root-cause not threshold tuning, measured before/after witnesses on both GPUs for anything visual, no standing test files, no unmeasured speedup claims, zero comments, lanmower-only commits, explicit-path commits, and every opportunity executed or filed (standing rule).

    SCENARIOS (the matrix to analyze; each is a column in the witness table): (1) authoritative server (Krunker-style shooter, tps-game) with N players spread across the planet; (2) rollback profile (rollback-duel); (3) lockstep profile (lockstep-rts, 2/3/4+ peers, drop/eject); (4) P2P rooms over wireweave (?room=), host-less, late join, reconnect, migrate transport; (5) singleplayer worker and host-in-browser (BrowserServer); (6) editor multiplayer (hierarchy messages, shared editing); (7) WebTransport datagram vs WebSocket ordered transport; (8) spectators and replays; (9) mixed latency, loss and jitter conditions (the conditioner harness presets); (10) mobile/low-end clients; (11) chat/voice proximity if present; (12) persistence, rejoin and world snapshots.

    PLANET-WIDE QUESTIONS (what 'planet-wide' breaks): the single flat chart is valid only inside the planet radius (63.6 km) from its anchor and the re-anchor service (default off) follows the centroid of players: a centroid of players spread over the planet, or antipodal players, is degenerate. So the central architecture question is how one world holds players on opposite sides of the planet: per-player or per-cluster charts, spatial sharding into several physics worlds (islands) each with its own chart, versus one world with re-anchoring only for co-located players; floating origin and precision at planet scale; interest management and snapshot area-of-interest by geodesic distance (not Euclidean in chart-local space); lag compensation and hit registration across charts; collision between players in different charts (never, by construction) and at cluster boundaries (handoff); terrain, collider and vegetation streaming per player rings (exist) and their server cost with players spread everywhere (CPU and memory per player ring, budget at 16/64/256 players spread); spawn selection and respawn across the planet; relocation, bookmarks and teleport across charts; cube-sphere face edges and corners, poles, the antimeridian wrap for movement, interest and sort order (ids sorted, wrap-around neighbours); snapshot size and bandwidth per client versus player count and spread, adaptive snapshot rate by distance; tick budget on the server with many far-apart active areas (physics LOD sweeps, sleeping, per-cluster stepping); determinism and checksum across charts for rollback and lockstep (rollback state save size when players span clusters); wire protocol (CHART_REANCHOR 0xc6, epochs, per-player chart ids), the shared-chart row chart-reanchor-multiplayer-shared-chart and the browser-only holders row chart-reanchor-browser-holders.

    METHOD: (a) build a planet-scale multi-client Node harness on the real server and real PhysicsNetworkClient (players placed at chosen planet positions: clustered, two clusters 10/100/10000 km apart, antipodal, uniformly spread, a roaming crowd crossing a face edge and a pole), measure per scenario server ms per tick (p50/p99), bytes per client per second, snapshot interest correctness, prediction corrections, hit registration correctness, desyncs (rollback/lockstep), memory, and failure modes (throws, silent garbage ground beyond 63.6 km, dropped events); (b) a design record with measured options for the architecture decision (per-cluster physics worlds vs one world; chart assignment, handoff, interest, lag-comp, persistence) with a recommendation; (c) execute the improvements that are measured, bounded and in-lane, default-off where risky; (d) file child rows for every independently shippable piece with its witness plan; (e) browser-only witnesses are queued for GPU windows (two or more real browsers on different planet positions, on both GPUs).
  acceptance_criteria: A scenario matrix with measured numbers (server ms/tick, bytes/client/s, corrections, desyncs, failures) for at least authoritative, rollback, lockstep and P2P at 2/16/64 players for clustered, split-cluster and antipodal placements exists in recall; the central architecture decision is recorded with measured evidence and its first slice implemented default-off or filed with witness plans; no silent degradation remains beyond the 63.6 km chart limit (every path either handles it or fails loudly with a named reason); a two-browser real-GPU witness of players in different planet regions interacting (visible, hittable, chat or events delivered per the interest rule) is scheduled in a GPU window for both GPUs; every change ships with before/after numbers and the standing opportunity rule is honoured.
  session_id: f73df536-0f66-49a1-8888-2a064d23416a
  status: pending
- id: tsl-terrain-grass-brighter-than-legacy-unexplained
  title: TSL terrain and grass read +6R +4G +4B above legacy; modelled stages excluded, albedo and sun term remain
  body: 'Headless Node model of terrain.glsl lines 927-1022 against terrain-lighting-tsl.js (snow albedo 1, muS 0.636, exposure 1.05, lookSat 1.25) reproduces the legacy ground (205.4,207.2,192.5 vs measured legacy R 205). Stages excluded by number: (a) aerial perspective LUT vs legacy 4-step: TSL is DARKER by 0.2 to 2.9 levels at 20-48 atm-km and 0 elsewhere (hazeMul 0.4 x apGate keeps the weight under 0.2), so it cannot add brightness; (b) display-referred round trip: identity within 0.4 level for ground and grass colours (205,207,192 -> 204.6,206.6,191.6; 85,113,60 -> 84.9,112.8,59.9), tone mapping is applied once in the Output Color Transform quad; (c) the blue studio DirectionalLight (SceneSetup.js:246, 0x4488ff x 0.4) goes through the plain-Lambert branch of direct() and would add +0.1 R, +2 G, +14 B at NdotL 0.8, the wrong channel pattern for a +6/+4/+4 excess, so either its NdotL is far smaller in view space or it is absent; (d) shadow term: legacy sampleHostShadow reads one host shadow map with 4 taps, TSL uses three''s single sun shadow, same data, so not a differentiator. Pattern fits a ~10 percent scale of lit (+4.5,+4.4,+5.3) or a 20 percent larger sun term (+5.7,+5.4,+4.8): remaining candidates are the TSL splat albedo vs legacy terrainAlbedoClimate for the same hashVersion 1 cell, and the sun-term inputs (diffuseColor.rgb, shadowK). Not fixed: no stage reproduces the delta yet.'
  acceptance_criteria: one GPU A/B on both sides with the studio light disabled and then with a flat grey albedo override (window overrides) names albedo, studio light or sun term by which switch collapses the delta to under 1.5 per channel; then a fix with a pre-registered prediction
  session_id: f73df536-0f66-49a1-8888-2a064d23416a
  status: pending
- id: tsl-sky-background-private-api-dependency
  title: Sky negative-red fix depends on three's private renderer._background and Background.material
  body: 'sky-tsl.js releaseBackgroundNegativeClamp reads renderer._background.get(scene).backgroundMesh/backgroundMeshNode and sets material.fragmentNode (three 0.185.1, renderers/common/Background.js). Called once per scene since the guard in planet-tsl.js (skyClampReleased); it returns false until the first render has created the mesh, so frame 1 renders clamped. A three upgrade that renames _background or the sceneData fields throws ''three renderer no longer exposes _background'' from the first frame() call (loud, page error). If sceneData fields change but _background stays, backgroundMesh is undefined and the function silently returns false every frame, so the red clamp returns silently: add a loud failure after N frames. Cleaner alternative: give the sky its own Mesh with a NodeMaterial whose fragmentNode is the sky node, vertexNode the same w=0 / z=w trick as Background.js; not executed because SSAO, SSR and other overrideMaterial passes would draw an unclamped back-face sphere (scene.backgroundNode is excluded from them), which needs layer or visibility gating verified on a GPU.'
  acceptance_criteria: either the own-mesh sky renders identical pixels to the Background.material sky with SSAO/SSR/shadow passes enabled and negative red preserved on a GPU parity boot, or the private-API path throws after 3 frames when backgroundMesh stays undefined; three version bump checklist names this file
