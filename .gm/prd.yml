- body: 'A witness that reports clean because the page never reached the state it claims to have observed is indistinguishable, in its output, from a witness that reports clean because nothing went wrong. Observed 2026-10-02: two boots in the bake-window census failed to load the app at all and the server had to be restarted mid-window, and a run under those conditions would have reported zero on every bucket. This is the same false-completion class as the degenerate-triangle case, where a fix was marked resolved on console lines proving the code ran plus one screenshot proving one viewpoint looked clean, while the real defect kept shipping. Every browser witness must assert reachability of the state it measured -- named boot marker present, or end-state counts non-zero (vegetation, grass, rocks above zero where the scene is expected to have them) -- and must fail loudly when that assertion does not hold, never report a zero as a pass. Applies to the bake-window census, the weather witness, and every perf arm. Verification: run a witness against a deliberately non-booting page (server down, or a bad world name) and show it reports failure rather than a clean zero.'
