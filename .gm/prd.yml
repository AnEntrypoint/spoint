- id: heightfield-bake-key-ignores-glsl-shader-source
  title: HEIGHTFIELD_BAKE code version omits the GLSL height source, so a shader edit leaves hashVersion-1 bakes stale
  body: |-
    Landed 3eb42b6a6f: the .hf now carries HEIGHTFIELD_BAKE_CODE_VERSION and loadBakedHeightField rejects an artifact whose stamp differs from what this tree bakes. The stamp is sha1 over the closure declared in src/static/BakeCodeVersion.js, and that closure covers the CPU bake path only: it lists packages/mapspinner/src/height-gen.js, which is transpiled from packages/mapspinner/src/shaders/terrain.glsl by scripts/gen-height.mjs, but not terrain.glsl itself.

    A hashVersion 1 bake does not use height-gen.js at all: scripts/bake-heightfield.mjs drives the browser GPU probe through scripts/lib/gpu-eval.mjs and samples the GLSL _HEIGHTBAKE_/_PROBE_ composeHeight. So editing terrain.glsl changes what a hashVersion 1 bake produces while the stamped code version stays put, and the loader serves ground baked by the old shader -- the same deviation.build-cache-no-code-version-key class 3eb42b6a6f closed for the CPU path, left open on the GPU path. Regeneration hides it: a GLSL edit that IS run through gen-height.mjs moves height-gen.js and therefore the key, which is why scripts/check-cache-keys.mjs passes today.

    Add packages/mapspinner/src/shaders/terrain.glsl, plus scripts/gen-height.mjs (which decides how GLSL becomes JS), to BAKE_INPUTS_HEIGHTFIELD so the stamp moves on any shader edit whether or not it is regenerated.
  acceptance_criteria: Witnessed by editing packages/mapspinner/src/shaders/terrain.glsl in a way that provably moves a hashVersion 1 GPU bake -- assert the baked heights move at chart-local probes, not merely that the shader recompiled -- showing HEIGHTFIELD_BAKE_CODE_VERSION changes with no version bump and no manual cache clear, and showing the pre-fix stamp does not move under the same edit. Re-bake every shipped .hf afterwards and confirm apps/world/tps-game.hf (hashVersion 2) still loads.
