- id: solve-surface-warm-start-cost
  title: solveSurfaceY costs 34% more evaluations than the old loose tolerance (2.23 -> 2.99 mean) in sweeps
  body: Sweeps over neighbouring points (heightfield builds, minimap cells, collider fields) restart each solve from the sea-level guess. A neighbour's solved y is a much closer first guess. Add an optional yGuess argument to PlanetFrame.solveSurfaceY and pass the previous cell's y from the sweep callers (HeightfieldStreamer field build, MinimapBake, bake-heightfield CPU path).
  acceptance_criteria: Mean evaluations per solve in a row-major sweep drops below the old 2.23 with outputs identical to within the 1e-4 m tolerance; ns per solve before/after and the setupTerrainStreaming coarse 20 ms and refine ~200 ms builds measured interleaved x10 with median and IQR; hashVersion 2 isolated-point results stay bit-identical
