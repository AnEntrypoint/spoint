- id: fire-s3a-client-mirror-and-shader-lookup
  title: 'S3a fire render consumer: client mirror, per-instance fireCell channel, vegetation shader lookup, foliage shadow collapse (both GPUs)'
  body: 'Everything below the GPU is done (S3 headless). Remaining: (1) client mirror: a role ''mirror'' defineFire world fed by APP_EVENT {type:''fire''} rows in client/app message routing and advanced with the snapshot tick numbering (the client''s currentTick is not the server tick); (2) fireCell per instance: write createFireStageMap().slotValueOfTrunk(trunkId) once in client/core/Vegetation.js loadChunk beside windPhase/tint (rides the padded .w of the vec3 tint on WebGPU via the existing VEG_ATTRIBUTE_SCHEMA path, one extra per-instance uniform on the legacy InstancedMesh2 path), acquire/release tiles per loaded chunk (a 32 m chunk lies in one 64 m tile), keyed by trunkId never instance id (distance thinning in loadChunk); (3) one shared DataTexture (width x height from stageMap, RGBA8, NearestFilter) uploaded with a partial update of the dirty slots from stageMap.sync() at step cadence plus uStep uniform; (4) add the stage lookup to the EXISTING vegetation TSL (client/core/VegetationTSL.js) and GLSL materials before boot warm-up so no pipeline is created at ignition: green -> flicker/emissive -> charcoal tint -> foliage scaled to 0 in the vertex stage (this also removes the foliage shadow because the shadow pass uses the same positionNode), trunk stays; (5) flame/ember sprites are S4a. Do not edit vegetation files while another agent has uncommitted edits there. Both RTX 3060 and AMD iGPU witness.'
  acceptance_criteria: 'GPU window both GPUs: draw calls unchanged (renderer.info) with 0 vs N burning trees, per-pass GPU ms (timestamp queries) vegetation + shadow pass with and without a fire in view, WebGPU calls/frame flat, no pipeline creation at first ignition, texture upload bytes per step equal tiles*256 B, screenshots at green/burning/charred on WebGPU/TSL and legacy GL, charred trunk collider count equals charred-cell trunk count on server and client, contamination buckets clean, reachability PASS.'
  session_id: f73df536-0f66-49a1-8888-2a064d23416a
  status: pending
- id: cdp-input-suppression-lost-across-navigate
  title: Input.setIgnoreInputEvents does not survive Page.navigate, so witness boots still receive host input
  body: 'scripts/tsl-parity/bodies.mjs bootBody now sends Input.setIgnoreInputEvents {ignore:true} before Page.navigate. Witnessed on NVIDIA RTX 3060 Laptop GPU, HEAD eb1d5753, same-boot pair: the TSL arm measured blocked=0 at settle and on all 8 capture frames, the legacy arm measured blocked=23 on every capture frame with an empty inputLog at settle, so all 23 events arrived after the navigation completed. Page.navigate creates a new RenderWidgetHost and the input router drops the ignore flag, so a pre-navigate setIgnoreInputEvents cannot cover the witnessed document. Input.enable is not exposed by the gm cdp bridge (''Input.enable wasn''t found''), so it cannot be used to force the domain on. The gm cdp session is launched focused and visible (session metadata focused:true, visibility:visible, display CMN153C), which is why host input reaches the page at all.'
  acceptance_criteria: 'Re-issue Input.setIgnoreInputEvents after the navigation commits (there is already a settle Runtime.evaluate after Page.navigate in bootBody) and re-take a same-boot pair: blocked=0 on every frame of both arms with the page-side blocker removed. If re-issuing still leaves a non-zero count, add an input-isolation launch option to the gm cdp verb in c:/dev/gm (background or unfocused window, or Input-domain suppression applied to every new RenderWidgetHost) and close cdp-witness-harness-delivers-input-to-page with count 0 and no page-side blocker.'
  session_id: f73df536-0f66-49a1-8888-2a064d23416a
  status: pending
- id: gm-cdp-input-isolation-option
  title: gm cdp witness windows need real input isolation that survives navigation
  body: 'A gm cdp witness window is launched focused and visible, so host OS mouse and keyboard input lands on the witnessed page during a boot and contaminates the frames it captures. Found in the TSL render-parity harness: the legacy arm recorded blockedInput=23 while the TSL arm recorded 0, invalidating a same-boot pair that passed every other gate. Issuing Input.setIgnoreInputEvents {ignore:true} before Page.navigate does not survive the navigation - the events all arrive after it (witnessed: empty inputLog at settle, 23 events after navigate). Add a real input-isolation option to the cdp verb in C:\dev\gm, e.g. an option that re-issues setIgnoreInputEvents after every Page.navigate, or that launches the target unfocused/hidden, or that routes the page into its own browser context with input suppressed. Harness-side workaround in spoint is to re-issue after navigate, but that only helps spoint; every witnessed boot from every project has the same hazard.'
  acceptance_criteria: With the option enabled, a witnessed boot of the spoint client reports blockedInput=0 on every capture frame, and the suppression provably survives at least one Page.navigate (assert by logging an input event counter after navigate). Witnessed by the TSL parity harness passing its 'no input reached the page' gate on a same-boot pair on both GPUs. No existing cdp behaviour changes when the option is off.
  session_id: f73df536-0f66-49a1-8888-2a064d23416a
  status: pending
- acceptance_criteria: 'Re-measure both numbers: the isolated harness (121 roots, zero dispatch traffic, 60 x 2 s TotalProcessorTime deltas) must stay at or below 0.05 core-equivalents, and a live box with a 127-root registry and zero dispatches in flight must fall from 1.28 to under 0.1 core-equivalents over five 5 s windows. The per-root scan must be incremental or cached so a root with no spool change costs nothing per pass.'
  body: 'Two measured numbers, and the gap between them is the finding. Floor: an isolated daemon (AGENTPLUG_HOME=C:\Users\user\.agentplug-iso, 121 synthetic git roots, plugins robocopied, a stale .inflight refreshed every 400 ms to force the busy branch) with zero real dispatch work used 0.28 core-equivalents on the pre-fix installed runner and 0.32 on a freshly built one -- before/after, statistically identical, so no busy-loop regression exists between the two builds. Live idle: the old shared daemon pid 19868 read 1.28 core-equivalents as the mean of five 5 s windows in which nothing was dispatching, against that 0.3 core floor. So the real 127-root registry costs roughly one core at idle on top of the ~0.3 core floor any registry of that size costs, and the remaining per-pass cost is touching every root: 5 s per-root plugin scan, 3 s project heartbeat ticker, 5 s registry poll, 1 s wasm epoch tick. On the live box today the same daemon reads 1.4-2.2 cores, but every 2 s window there has 1-3 dispatches in flight from seven concurrent lanes, and the single window that reached inflight=0 still read 1.76 cores because the idle backoff had not yet ramped -- which is why the isolated harness, not the live box, is the authority for the floor.'
  id: daemon-idle-floor-0p3-cores-at-127-roots
  title: Agentplug daemon burns ~0.3 cores at a no-work floor and ~1 core more at live idle on a 127-root registry
