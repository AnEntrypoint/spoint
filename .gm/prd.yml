- id: airborne-ground-solve-throttle-instead-of-warm-start
  title: 'Airborne ground solve: cut solves per tick, not evaluations per solve'
  body: 'airborne-player-ground-solve-moving-cost asks for both ''per-solve evaluations at 52 km below 5'' and ''outputs within 1e-4 m of the current solver''. Those two are not simultaneously satisfiable. A warm start does drop 52 km evaluations from 7.99 to 3.64 (measured, 0.11 m/tick walk at r=52000), but at 52-60 km chart-local the chart-vertical line crosses the terrain more than once (3 roots within 0.2 m at the 52 km outlier, 7 within 16 m at 60 km), so the warm solve legitimately returns a different intersection than the cold solve: 1 sample in 1200 differs at 52 km (max 6.2e-4 m, isolated worst 0.3249 m) and 10 in 1200 at 60 km (max 2.05e-2 m). The cold solver is well-conditioned at those points (a 1 um nudge moves it 8.6e-5 m), so this is branch selection, not noise, and being exact requires following the cold trajectory, which costs exactly the cold evaluations. The shipped warm start is therefore opt-in per sweep caller only (field build, minimap bake) and the moving player is deliberately unwarmed. The remaining lever for the airborne case is the one the row body already lists: caller-side throttling. An airborne player does not need a fresh ground solve every tick - the ground is not being used for support while airborne, so the caller can reuse the last known ground height and re-solve only on a distance or state threshold. Measure: solves per tick per airborne player before/after at 64 players, and the physics-phase ms before/after interleaved x10 with median and IQR. Verify the reused height still satisfies the row''s own tolerance by re-solving on landing and comparing.'
  acceptance_criteria: With 64 players sprinting airborne at 52 km, the number of ground solves issued per player per tick is measured before and after (interleaved x10, median and IQR) and drops by at least 5x; the physics phase ms is measured before and after in the same run; on landing the first re-solved ground height is within 1e-4 m of an unthrottled solve at the same position; no player is ever supported by a ground height older than the throttle distance threshold allows, and the threshold is derived from measured player speed rather than guessed.
  session_id: f73df536-0f66-49a1-8888-2a064d23416a
  status: pending
