  subject: 'Remote entity interpolation delay does not shrink when latency does, so a fast shooter''s view of other players is staler than it needs to be. Measured live with the real network conditioner: remote in->visual p50 is 95 ms at 0 ms added latency (RTT 22 ms) and remote effective delay is 40 ms there, but at 150/25/5% (RTT 346 ms) remote in->visual p50 is 434 ms and effective delay 212 ms. The 0-latency case is the defect: with an RTT of 22 ms there is no reason to render remote entities 95 ms in the past, and the PRD for this row explicitly asks for ''entity interpolation with a small ADAPTIVE delay''. Remote position error versus present follows the same curve (17 cm at 0 ms -> 86 cm at 150 ms). Mispredict rate (0%) and correction visibility (0.0 cm max pop) are genuinely clean and are NOT part of this row.'
