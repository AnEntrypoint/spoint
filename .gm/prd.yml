- acceptance_criteria: A 10-minute window on the live spool shows zero code_index_treesitter_failed events and at most one codeinsight_rebuild, and each rebuild names the changed files that forced it instead of a bare stored-then-current digest pair.
  body: The tail of C:\dev\spoint\.gm\exec-spool\.watcher.log (3 MB) carries 900 code_index_treesitter_failed events and 34 codeinsight_rebuild events at 165-330 s intervals, each with reason digest-mismatch and stored_then_current files=849. A rebuild re-indexes the whole 849-file corpus on every mismatch and treesitter is failing on the files it is supposed to parse, so the index is simultaneously expensive and incomplete. The rebuild should be incremental and keyed to the files that actually changed, and the treesitter failure needs its own named cause per file rather than a repeated counter.
