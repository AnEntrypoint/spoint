  title: 'First valid NVIDIA pair: vegColumn and skyPose terrain exceed the K=3 per-pixel gate'
  body: 'The first valid NVIDIA same-boot pair passes all eight gates, and five measurement rows exceed the K=3 ratio gate: skyPose terrain meanAbs 3.337 (channel delta 0.04,0.2,0.12), skyPose leftEdge 3.012, ground vegColumn 3.226, grey vegColumn 3.059, greyRelief1 vegColumn 3.696. Every one has channel deltas under 1.5 while per-pixel meanAbs is above 3, so the residual is per-pixel structure, not a region-level colour error. This refutes the registered prediction that ground-pose vegColumn meanAbs would be 2.99 and sky-pose 4.13: measured 3.226 and 5.416.'
