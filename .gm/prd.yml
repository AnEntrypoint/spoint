- id: cpu-plan-static-collision-grid-skip-rebuild
  title: Reuse the collision grid across ticks instead of re-bucketing every collision entity every tick
  subject: 'Stop rebuilding the 4 m collision grid from scratch every tick: keep a static bucket map and re-bucket only entities whose transform actually changed, using the same 10-float change capture the static-motion tracker already uses.'
  body: |-
    TIER-0 parent: cpu-skip-and-replay-plan-browser. CPU-side, server tick path.

    WHAT RECOMPUTES, PER TICK
    src/apps/AppRuntimeTick.js:87 _tickCollisions() runs every tick (src/apps/AppRuntimeTick.js:25 and :45). With c.length >= _COL_GRID_THRESHOLD (100, src/apps/AppRuntimeTick.js:83) it takes src/apps/AppRuntimeTick.js:120 _tickCollisionsGrid(), which per tick:
    - clears the grid Map (src/apps/AppRuntimeTick.js:121)
    - for EVERY collision entity: floors two coordinates, forms a key, does _colGrid.get / _colGridCells.get, possibly allocates a cell array, and pushes the entity (src/apps/AppRuntimeTick.js:125-131)
    - then re-walks every entity again for the 3x3 neighbourhood query (src/apps/AppRuntimeTick.js:132-148)
    - plus a periodic prune pass over _colGridCells (src/apps/AppRuntimeTick.js:122-124)
    The collision entity set is dominated by static world props whose transform never changes, so the bucketing result is identical tick after tick. Note the _colR radius recompute at src/apps/AppRuntimeTick.js:89 is already cached on the collider (src/apps/AppRuntimeTick.js:71-79) and is not part of this row.

    STABLE STRUCTURE (the captured graph)
    The cell grid topology (cell size _COL_CELL_SZ = 4, src/apps/AppRuntimeTick.js:84, key layout *65536), the static bucket map, and the membership of the collision entity set.

    CHANGING INPUTS
    Entity positions, and the membership of _collisionEntities.

    INVALIDATION KEY
    The project already owns the exact primitive needed: src/apps/AppRuntimeStaticMotion.js:4 captureTransform(xf, e) compares 10 floats (position 3, rotation 4, scale 3) and returns whether they changed, with the previous values held in a Float64Array(11) (src/apps/AppRuntimeStaticMotion.js:23). Reuse it per collision entity: the grid is reused when every collision entity's captureTransform returns false and the collision-set membership version is unchanged.
    Membership version: _collisionEntities is mutated by register/deregister paths; add a HookedSet-backed version counter there (src/apps/AppRuntime.js:72 already shows the HookedSet pattern used for _movedStaticIds, so a hook that bumps a version is the established shape). A static entity that is deliberately moved is already tracked in _movedStaticIds (src/apps/AppRuntime.js:72, src/apps/AppRuntimeStaticMotion.js:18) and its transform change is caught by captureTransform anyway, so it does not need a second signal.
    Because the skip is decided by comparing the actual transform values, there is no input-hash stale-output exposure for the change decision (deviation.build-cache-no-code-version-key). The one cached VALUE is the bucket map, which is derived from _COL_CELL_SZ and the key layout: fold the producing code's version into it by exporting a COLLISION_GRID_CODE_VERSION from src/static/BakeCodeVersion.js over ['../apps/AppRuntimeTick.js'] and registering it in BAKE_TRANSFORMS (src/static/BakeCodeVersion.js:110-116) so scripts/check-cache-keys.mjs fails if the grid layout changes while a bucket map could survive. Store the version with the map and drop the map on mismatch.

    WORST-CASE BOUND
    Skipped work is bounded by the collision entity count times a constant (10 float compares plus a version compare). The miss path is byte-for-byte today's full rebuild. A false 'unchanged' is impossible: captureTransform reads the live entity position, so a moved entity always invalidates. The failure mode to guard is only a membership change that does not bump the version -- hence the HookedSet hook rather than a hand-maintained counter.

    MEASUREMENT (integer work units, immune to timer inflation -- this box's zero-delta control arm is +/-10% and currently ~2.5x inflated, so nanosecond numbers are not admissible)
    Deciding counter: per tick, (a) collision entities re-bucketed (Map.get + key formation + array push each) and (b) how many of those had an unchanged transform. Skippable units per tick = (b). Also count cell-array allocations per tick. If (b)/(a) < 0.5 the delta is likely below this box's noise floor and the row should be closed as measured-not-worth-it rather than shipped.
  acceptance_criteria: 'Live server witness on apps/world/tps-game.js over >=300 ticks with _collisionEntities.length >= 100 so the grid path is taken: report collision entities per tick, unchanged-transform collision entities per tick, and cell-array allocations per tick before and after. Pass requires unchanged-transform count >= 50% of collision entities AND, after the change, cell-array allocations per tick drop to 0 on ticks with no membership change and no transform change. Correctness: with GM_PROFILE=1, _lastCollisionMs must not regress beyond the run''s own zero-delta control arm, and a scripted pair of overlapping entities must still produce onCollision on both entities on the tick they overlap (witness the app event, not a log line).'
