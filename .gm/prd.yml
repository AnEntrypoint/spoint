- id: cdp-witness-harness-delivers-input-to-page
  title: gm cdp sessions deliver pointer/key input to the witnessed page and contaminate frames
  body: 'On an AMD WebGPU sky boot the camera pitched down and ammo dropped 30->26 between frames with no script-issued input; a capture-phase blocker installed via Page.addScriptToEvaluateOnNewDocument counted blockedInput=30 on one NVIDIA boot. Either the cdp verb''s session or the focused visible Chrome window forwards real input to the page. Fix belongs in c:/dev/gm (AnEntrypoint agentplug cdp session): witness sessions must not receive host input (background/unfocused window or Input domain suppression), and the verb should expose an input-isolation flag.'
  acceptance_criteria: 'A cdp session with the fix, a page counting pointer/key events from load for 120 s while the host user moves the mouse: count 0, without any page-side blocker.'
  session_id: f73df536-0f66-49a1-8888-2a064d23416a
