- id: collider-streamer-restart-leaks-jolt-bodies
  title: Stopping and restarting a ColliderStreamer grows the resident Jolt body count, so retries can exhaust maxBodies
  detail: 'scripts/collider-turnover-witness.mjs FAILs on the restored eviction path: three stop-and-restart cycles on one physics go 75 then 71 then 76 then 84 resident bodies, so each cycle leaks instead of returning to baseline. Evidence line: [FAIL] three stop and restart cycles on one physics never grow the resident count, so a retry cannot exhaust maxBodies -- 75 before the first cycle, 84 after the last. Per-cycle before to started to stopped: 75 to 79 to 71, 71 to 84 to 76, 76 to 92 to 84. The streamer ring itself holds 8 colliders throughout, so the growth is outside the ring. The Jolt heap is fixed at 134217728 B and never grows, and maxBodies overflow makes Jolt return body id 0 so overflow bodies share one map key and destroy aborts the wasm, so a server that recycles streamers (cluster handoff, reconnect, hot reload) walks into that abort.'
  session_id: f73df536-0f66-49a1-8888-2a064d23416a
  status: pending
- id: accelerated-arms-must-hold-gpulock
  title: Every accelerated arm must hold scripts/gpulock.mjs so two arms never measure on one adapter at once
  detail: 'Measured on this box: an app page ran 17.27 ms p50 against 11.18 ms clean at the same code, while host CPU contention read 1.20, i.e. clean, because another agents chrome was on the same GPU. Host-side contention checks cannot see GPU-side contention, so the frame-time gate recorded a contended number it believed was clean. scripts/gpulock.mjs now exists (heartbeat plus pid liveness, stale takeover after ttl-ms, refuses after wait-ms, propagates the child exit code) but nothing acquires it yet. frame-time-gate.mjs, perf-run.mjs and every vendor-pinned browser arm must acquire it for the whole capture, or two lanes will keep corrupting each others numbers.'
  session_id: f73df536-0f66-49a1-8888-2a064d23416a
  status: pending
- session_id: f73df536-0f66-49a1-8888-2a064d23416a
  id: gpulock-heartbeat-rename-eperm
  title: gpulock dies on its own heartbeat rename
  why: 'scripts/gpulock.mjs writes its heartbeat through writeOwner(), which does writeFileSync(OWNER_FILE + ''.'' + pid + ''.tmp'') then renameSync(tmp, OWNER_FILE). On this box that rename raised EPERM mid-capture and killed the owner process, so the adapter lock vanished while an arm was still measuring and a second lane took the lock over. Reproduce: hold the lock for a multi-minute capture while another lane polls .gpu-lock/owner.json. Fix belongs in scripts/gpulock.mjs (write in place, or retry the rename, or keep the pid-suffixed file as the source of truth), which the frame-time lane does not own. Witness: an amd-frame-time capture aborted with Error: EPERM: operation not permitted, rename ''.gpu-lock/owner.json.20236.tmp'' -> ''C:\dev\spoint\.gpu-lock\owner.json''.'
  kind: defect
  area: scripts/gpulock.mjs
  status: pending
- session_id: f73df536-0f66-49a1-8888-2a064d23416a
  id: planet-harness-threadcpuusage-missing-on-node-20
  title: planet-multiplayer-harness.mjs crashes CI on Node 20
  why: 'The check job (.github/workflows/ci.yml) pins actions/setup-node node-version 20 and runs npm test, which reaches scripts/planet-multiplayer-harness.mjs. That harness calls process.threadCpuUsage(), which exists on Node 24 (verified locally: node v24.15.0, typeof process.threadCpuUsage === ''function'') but not on Node 20, so the witness dies with a TypeError and the whole check job goes red. Witness: CI run 37682621477 for sha 89075461, job ''check'' (job id 113002665913) -- ''gpu-free witness planet-multiplayer-harness.mjs: ran past the 600 s cap and was killed; exited 1; ... FATAL TypeError: process.threadCpuUsage is not a function'' at runScenario (scripts/planet-multiplayer-harness.mjs:478:26). Nothing else in that run failed. Fix belongs in scripts/planet-multiplayer-harness.mjs (guard on typeof process.threadCpuUsage, or fall back to process.cpuUsage) or in the workflow''s node-version; neither file is the frame-time lane''s surface.'
  kind: defect
  area: scripts/planet-multiplayer-harness.mjs
  status: pending
