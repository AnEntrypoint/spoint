- id: tsl-sky-red-excess-after-marchsteps
  title: TSL sky still renders R about +27 above legacy after bdc4409d (G and B match)
  body: 'At the sky pose (singleplayer, terrainhash=1, at=-2750,-750, fraction 0.45, hazeMul 0.4, cam yaw 1.0 pitch 0.35 zoom 2, clip 311,39,518x155 scale 0.25) after bdc4409d47 marchSteps: TSL WebGPU mean (83.1,176.3,235.8) on NVIDIA RTX 3060 and (83.1,176.3,235.7) on AMD Radeon 0x1681; legacy (56.2,176.3,235.8) NVIDIA, (56.5,176.4,235.7) AMD. Cross-GPU TSL meanAbs 0.03, so the excess is in sky-tsl.js not the driver. Before the fix AMD TSL was (92.2,179.6,238.2): marchSteps fixed G/B and 9 of the 36 R excess. Pre-registered prediction (56,176,236) missed on R only. Served sky-tsl.js sha256 3d4414eb5db5a1e4b0649cc250f8654feb452594925e1c2e639bb54650b3d361, etag b0771dce, HEAD b4ae976b. A red-only excess points at a term weighted toward long wavelengths: Mie phase/extinction, ozone absorption, or the R component of the Rayleigh beta constant in the TSL mirror of the scattering LUT (see project/mapspinner-scattering-lut-glsl-layer-mirror).'
  acceptance_criteria: 'Same pose, same clip, same scale on both GPUs: TSL vs legacy per-channel residual and meanAbs <= 3 x max(floor,1.0) = 3, with HEAD and served sky-tsl.js sha256 recorded; the cause named in the commit message.'
  session_id: f73df536-0f66-49a1-8888-2a064d23416a
  status: pending
- id: cdp-witness-harness-delivers-input-to-page
