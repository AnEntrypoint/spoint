- session_id: f73df536-0f66-49a1-8888-2a064d23416a
  id: sdk-typings-hand-maintained-monaco-lacks-fire-and-nav-surface
  title: The hand-maintained editor typings expose no fire or nav surface, so app authors get no IntelliSense for it
  body: |-
    Found while fixing sdk-typings-generated-navcost-union-omits-constant-returns. scripts/gen-sdk-typings.mjs ends with a drift report comparing the tsc-generated declarations against client/editor/sdk-typings.d.ts, the hand-maintained Monaco typings that app authors actually see as IntelliSense in the editor. That report names 296 members present in generated but absent from the hand-maintained file. Most of that 296 is correct and should stay absent: it is private state (_disposers, _runtime, _chartAware, _admitsRegistration) and a curated public subset is deliberate.

    But the public fire and navigation surface is missing from it too, and that is not deliberate curation -- it is simply newer than the file. Named in the report: navCostAt, terrainKindAt, ignite, igniteArea, igniteCell, igniteRadiusM, extinguish, extinguishCell, isBurning, isTrunkCharred, burningCount, stateAt, stateAtLocal, slotValueOfCell, slotValueOfTrunk, setWind, setRain, setMoisture, moisture, fire, resolveFireRequest, keyframeMessage, needsResync, requestResync, tickDamage, rayBlocked, cover, coverRadius, heightFn, liveHeightFn.

    Consequence: an app author writing fire or navigation code in the editor gets no completion and no type checking on any of it, and navCostAt in particular now returns 0.5 | 1 | 2 | 3 | 8 where 2 and 8 are the charred and burning fire costs (src/apps/AppContext.js NAV_COST_FIRE_CHARRED / NAV_COST_FIRE_BURNING). An author who does not know about those two values writes a switch that silently falls through on burning ground. This is directly in the way of the composable-engine goal: the fire system is default-off and apps opt in, and the opt-in surface is invisible to the people who would opt in.

    Not the same defect as the generated-file row. client/editor/sdk-typings.generated.d.ts is on AGENTS.md's never-edit list and is now regenerated and gated by scripts/gen-sdk-typings.mjs --check inside npm run check. This row is about the separately curated hand-maintained file, which no gate covers at all.
  acceptance_criteria: 'Every public member named above appears in client/editor/sdk-typings.d.ts with a real signature, not ''any'': navCostAt returns the full 0.5 | 1 | 2 | 3 | 8 union and the fire members carry their real argument and return types. Witnessed by opening the editor and confirming completion fires for navCostAt and ignite, or by a tsc run over a scratch app file that references each member and resolves it -- real code through the real typings, not a stub. The private-state members stay excluded; the drift report is expected to stay non-empty and that is not a regression. A gate keeps it honest: npm run check fails when a NEW public member is added to src/apps/AppContext.js and is absent from the hand-maintained file, with an explicit allowlist for members intentionally excluded, so this cannot silently drift again the way the generated file did.'
  status: pending
- session_id: f73df536-0f66-49a1-8888-2a064d23416a
  id: sdk-typings-navcost-fire-costs-enter-union-on-appcontext-commit
  title: navCostAt's fire costs 2 and 8 are not in the published union because the AppContext fire branch is still uncommitted
  body: |-
    Correction to sdk-typings-generated-navcost-union-omits-constant-returns, which I resolved with evidence that overstated what shipped. That evidence quoted navCostAt reading 0.5 | 1 | 2 | 3 | 8. It did, in the intermediate commit 5fdc0830 -- but that artifact was generated from a working tree whose src/apps/AppContext.js carried the fire lane's uncommitted changes, so CI correctly rejected it and it was superseded by 7ab387e296.

    At HEAD 7ab387e296 the published union is navCostAt(x: any, z: any): 0.5 | 1 | 3, line 527 of client/editor/sdk-typings.generated.d.ts. Verified: git show HEAD:src/apps/AppContext.js has navCostAt at line 468 and no NAV_COST_FIRE_* at all, while the working tree has NAV_COST_FIRE_BURNING = 8 and NAV_COST_FIRE_CHARRED = 2 at lines 31-32 and the BURNING/BURNT returns at 477-478. So the fire branch of navCostAt is uncommitted work, and the published contract cannot state it until that lands.

    This is why the row is worth keeping open rather than folding away: the union is the published app-SDK contract (AGENTS.md keeps types/*.d.ts JSDoc and this generated file as the contract app authors read as IntelliSense), and an app author writing steering or pathfinding code cannot see that burning ground costs 8 and charred ground costs 2. src/behaviours/steering.js already divides speed by that cost, so the number is load-bearing in gameplay and invisible in the contract.

    The gate that will catch it is in place: scripts/gen-sdk-typings.mjs --check runs inside npm run check and exits nonzero when the checked-in artifact differs from a fresh emit, so the moment AppContext.js's fire branch is committed without regenerating, npm run check fails in CI. The remaining action is to regenerate at that point.

    Note for whoever picks this up: because the gate compares the artifact against the source ON DISK, generating on a tree that differs from HEAD produces an artifact CI will reject -- that is exactly what 5fdc0830 did. Generate only from a tree whose src/apps/AppContext.js is committed, or use --from-head, and commit the regenerated artifact in the same commit as the AppContext.js change.
  acceptance_criteria: 'After the navCostAt fire branch is committed to src/apps/AppContext.js: client/editor/sdk-typings.generated.d.ts declares navCostAt with a union containing both 2 and 8 alongside 0.5, 1 and 3, and npm run check exits 0 with the artifact generated from that same committed source. Witnessed by reading the union out of the committed file and by a CI-green run on the commit that carries both files. Not resolvable by editing the generated file by hand -- it is generated and on AGENTS.md''s never-edit list; regenerate it.'
  status: pending
