- id: tsl-parity-cdp-gpu-rejection-has-no-nearest-match
  title: The cdp session verb's gpu rejection lists the accepted tokens but does not suggest the nearest match
  body: 'MEASURED 2026-10-06 by reading the installed runtime: ~/.gm-tools/agentplug-runner.exe carries the strings `'' is not one of nvidia|amd|intel|default` and `n'' is not a launch option (expected gpu=nvidia|amd|intel|default, uncapped, keep_alive or idle_timeout_ms=<ms>)`. The rejection therefore already names the accepted tokens, which is why tsl-parity-manifest-gpu-token-not-verb-vocabulary closed on its build.mjs half alone. What it does not do is suggest the nearest match, so a lane that writes gpu=intel=1 or gpu=nv still has to read the whole list and map it by hand. The body-dir names used by scripts/tsl-parity (nv, amd, nv-webgl2) are the ones that need the suggestion most, and build.mjs now carries the mapping in manifest.gpuVocabulary, but the runtime message is the surface every other lane sees.'
  acceptance_criteria: The gpu-token rejection appends the nearest accepted token to the message, e.g. `gpu=nv is not one of nvidia|amd|intel|default (did you mean nvidia?)`, and the same for a mistyped launch option. Witnessed by dispatching `session new gpu=nv` once and reading the rejection text.
  status: pending
- id: tsl-parity-witness-window-cannot-be-forced-unfocused
  title: No cdp command in the installed runtime can keep the witness window unfocused, so trusted input can still reach it between dispatches
  body: 'MEASURED 2026-10-06 by reading the installed runtime: ~/.gm-tools/agentplug-runner.exe contains only Emulation.setDeviceMetricsOverride, Emulation.setFocusEmulationEnabled and Emulation.setTouchEmulationEnabled under Emulation. Emulation.setFocusEmulationDisabled does not appear anywhere in it, so the unfocused half of tsl-parity-amd-window-input-contamination has no reachable CDP command today: setFocusEmulationEnabled {enabled:true} forces the page focused (the opposite of what is wanted) and {enabled:false} only restores normal focus behaviour, which is what already let twelve trusted pointerdown/pointerup/click events through on the AMD lane of 2026-10-05 while the lane was between dispatches. scripts/tsl-parity/bodies.mjs now re-asserts Input.setIgnoreInputEvents plus Emulation.setDeviceMetricsOverride at the head of every body, grab.mjs prints ABORT on blockedInput, and analyze.mjs names the first contaminated arm and probe, but nothing yet stops the input from arriving, and identifying what sent it needs a live window.'
  acceptance_criteria: Either a mechanism that keeps the witness window unfocused is found and added to every body (witnessed by a dispatch that reports blockedInput 0 across a gap during which the desktop is deliberately clicked), or the input source is identified and stopped; then a full AMD pair completes with blockedInput 0 at every probe. Needs a live cdp session, so it cannot be closed CPU-side.
  status: pending
- session_id: f73df536-0f66-49a1-8888-2a064d23416a
  id: tsl-parity-nvidia-baseline-sits-21-commits-behind-head-and-the-newer-attempt-is-void
  title: The only valid NVIDIA parity pair was captured 21 commits ago, and the newer NVIDIA capture is invalid, so every cross-GPU parity claim is currently unsupported
  body: |-
    Challenging an assumption the project has been treating as settled: that NVIDIA TSL-vs-legacy parity is measured and can serve as the comparison baseline for AMD.

    It is not currently supported. Three NVIDIA artifacts disagree about which commit they describe:

    - run-nv-2111/analysis-nv.json stamps head 3d0c82d425448daf1b21c6ebb99d41c34709f72a, verdict "pair valid", vegetation 233/233, blocked 0, all gates pass. This is the only valid NVIDIA pair on disk, and it is the source of the ten baseline numbers the project quotes (ground terrain 2.073, ground grass 2.081, grey terrain 1.936, greyRelief1 terrain 2.244, ground vegColumn 3.226 FAIL, skyPose terrain 3.337 FAIL, skyPose vegColumn 5.416, skyPose leftEdge 3.012 FAIL, grey vegColumn 3.059 FAIL, greyRelief1 vegColumn 3.696 FAIL).
    - nv/analysis-nv.json stamps head 9e1a9fd2f5d3b9e2a7cb5d6f98f8074c19124df7, verdict "pair invalid", because the "no input reached the page" gate reports blocked 23. That run is void regardless of its numbers.
    - nv/manifest.json stamps head efa4d15c4e843002b50bc85e0055fc719951a340, which is body-generation time, not capture time.

    HEAD is 21 commits past 3d0c82d4 (git rev-list --count 3d0c82d4..HEAD = 21). Note the ambiguity honestly: 3d0c82d4 is what the pre-fix analyzer stamped, which was analyze-time HEAD, so the true capture is at or before it. The baseline is therefore AT LEAST 21 commits stale, possibly more. The fix landed in 92c5bb5a (grab.mjs writes head.json, analyzer resolves head.json then manifest then a __parityHead probe) means future runs are attributable; none of the existing NVIDIA runs are.

    Why the drift plausibly moves the numbers rather than being cosmetic. Seven of the 21 commits touch client/, src/terrain or packages/mapspinner/src, and two classes are parity-relevant by construction:
    - 5c37a696 "Gate pointer lock on user activation and focus, and record a named state instead of warning" -- the analyzer gates on "camera pose identical per pose across frames and renderers". A change to when pointer lock engages can change the boot pose, which changes the pose gate itself.
    - dd7f0f39 (reuse resident field samples when a streamed heightfield scrolls), 0a1a5c59 (warm-start the row-major ground solve), ffe79b2b (route client ground-height calls through guardedGroundHeight) and 1ab331aa (name and hold a player standing over no heightfield collider) all change ground height or the terrain solve, which is exactly what the terrain and vegColumn ratios measure.

    Consequence: an AMD pair captured at HEAD cannot legitimately be compared against these numbers. Any statement of the form "AMD matches/differs from NVIDIA" is currently unsupported, because the two sides would differ by both GPU and 21 commits of code. The within-GPU question (does TSL match legacy on AMD at HEAD) is still valid on its own, because the criterion compares the two renderers inside one run at one HEAD.

    This row is not asking for the AMD window to be delayed or widened. It asks that the baseline be refreshed so the cross-GPU claim becomes supportable, and that in the meantime nobody quote the existing NVIDIA numbers as describing HEAD.

    Related: tsl-parity-witness-window-cannot-be-forced-unfocused (the input contamination that voided the 9e1a9fd2 run cannot be closed CPU-side, because Emulation.setFocusEmulationDisabled does not exist in the installed runtime).
  acceptance_criteria: 'A NVIDIA run captured at the SAME commit as a current AMD run, with head.json present in both run dirs, both analyzed at that sha, and the ten baseline region numbers either reproduced (state the deltas) or explicitly named as moved with the commit that moved them. Both runs must pass the "no input reached the page" gate with blocked 0 -- a run with blocked > 0 does not satisfy this row. Witnessed by reading head, verdict and blocked out of both analysis JSON files and by the region table of each. Not satisfiable by re-running analyze.mjs on existing artifacts: that re-derives old numbers from old frames and is exactly the confusion this row records. Commit as lanmower with explicit paths; no comments; no test files.'
  status: pending
- id: terrain-backdrop-two-writers-rebuildterrain-vs-boot-build
  title: rebuildTerrain and the boot scenery build are two unreconciled writers of terrainBackdrop
  body: 'Found by adversarial review of f1c0d55c (which fixed the boot-race overlap) and confirmed pre-existing, not introduced by it. engineCtx.rebuildTerrain (client/app.js ~881-901) nulls terrainBackdrop and calls _hmrFactories.createTerrainBackdrop directly; it never reads or writes _sceneryBuildPromise, so the join added in f1c0d55c does not cover it. It is reachable from onTerrainConfig (~1088) and the TerrainBackdrop.js HMR handler (~801), both of which can fire while the boot build is suspended at its await createTerrainBackdrop. Interleaving: boot build B suspends; rebuildTerrain nulls terrainBackdrop and starts R; B resumes, finds terrainBackdrop null so its terrainBackdrop-and-terrainBackdrop-not-equal-tb reconciliation does not fire, installs its own tb and builds sculptOverlay, sea level and foliage on it; R then resolves, passes its own buildGen check and disposes the backdrop B is now using. Two createTerrainBackdrop builds run concurrently and B keeps rendering off a disposed frame. _buildWorldSceneryOnce has no _terrainBuildGen guard analogous to rebuildTerrain''s, so the winner is decided purely by resolution order. A second symptom of the same root cause: _bootSceneryStarted is set once and never reset, so after boot any _buildWorldScenery call (retry toast, onWorldDef) builds a full backdrop at 465, finds the live one has a planet, disposes its own freshly built tb at 467 and returns -- a whole backdrop of GPU allocation built and thrown away per retry, reported to the user as success.'
  acceptance_criteria: 'terrainBackdrop has one owner: rebuildTerrain and the boot scenery build share a generation token so a superseded build never installs and never disposes a backdrop a live build is using. Witnessed live by driving a terrain-config push (or HMR re-accept) while a boot build is suspended inside createTerrainBackdrop, showing one createTerrainBackdrop in flight rather than two and no dispose of a backdrop that is still rendering. _bootSceneryStarted is reset on rebuild so a post-boot scenery build is not a silent allocate-and-dispose no-op, and the retry toast no longer reports success when nothing was rebuilt.'
  status: pending
- id: heightfield-code-version-unverified-in-browser-worker
  title: 'Browser worker cannot verify the stamped height code version: needs the tree''s version shipped in INIT or a server route'
  body: 'Precise blocker measured 2026-10-07. The browser singleplayer worker accepts a stamped .hf UNVERIFIED because it cannot recompute the bake code version: scripts/BakeCodeVersion.js imports node:fs, so it cannot evaluate in a Worker. Shipping the tree''s version to it needs EITHER a new INIT field from client/app.js OR a route in src/sdk/ServerAPIRoutes.js — both outside src/terrain/. Until one lands, the unverifiable case still accepts a stamped artifact and only logs a named line instead of throwing. Measured working today: a full `node server.js` boot logs `collider using BAKED heightfield ... height code 44ca24c0ef7b` with no `unverified` suffix, and the singleplayer worker answers a real DEBUG_COLLIDER_QUERY with terrainHeightSource "baked" (hit y=5.508661270141602, bodyId 8388781). Note the boundary already drawn: hashVersion mismatch and terrainKey/chartEpoch mismatch stay warn-and-fall-back, because those mean the artifact covers DIFFERENT terrain (a legitimate state, e.g. editor TERRAIN_RESEED), not damaged bytes — only damage and staleness are fatal.'
  acceptance_criteria: The worker either receives the tree's height code version (INIT field or route) and REFUSES a stamped artifact whose version differs, with a named error, or a witnessed argument shows the stamped version cannot reach it. Witnessed on a real singleplayer boot with a deliberately mis-stamped .hf.
  session_id: f73df536-0f66-49a1-8888-2a064d23416a
  status: pending
- session_id: f73df536-0f66-49a1-8888-2a064d23416a
  id: gm-dispatch-latency-carries-per-dispatch-remote-config-resolution-and-inline-code-index-sync
  title: 'Per-dispatch cost: doubled config resolve and inline codeinsight symbol sync'
  body: 'PART 1 IS ANSWERED, and the answer is that it is not a per-dispatch network fetch. Read, not assumed: rs-plugkit crates/plugkit-core/src/config.rs pub fn resolve() (wasm32) memoizes per project root in RESOLVE_CACHE with RESOLVE_CACHE_TTL_MS = 2_000, and it calls resolve_and_report twice whenever the just-resolved config''s sync.debounce_ms differs from GitRepoFetcher::default()''s -- first_pass with the bootstrap fetcher, then again with a fetcher built by with_debounce_ms. That second pass is the source of the paired config_resolved events (tier implicit_default_repo, pinned_sha 2097260cefef15b539220568c03592bcc2bd9498) and it is pure duplication: the retry exists only to honour a debounce the first pass had not yet read. Each pass runs load_implicit_default_repo_tier -> fetcher.refresh -> config_sync::ensure_current, which (a) reads the local checkout sha with ''git rev-parse HEAD'' in the cache dir (a local process, no network) and (b) returns early with detail ''debounced: checked Nms ago'' while now - last_checked_ms < next_probe_delay_ms, touching no network at all; only when that window has elapsed does it take the refresh lock and run probe_remote_sha = ''git ls-remote -- <repo> <ref>''. DEFAULT_DEBOUNCE_MS is 15 * 60 * 1000, so the worst case is one ls-remote per 15 minutes per project, and because write_state runs after refresh_locked the second pass in the same dispatch is always debounced. Witnessed on disk rather than inferred: /c/dev/spoint/.gm/config-source-cache-default.f75d12d89293c5af.sync.json held last_checked_ms 1791241951520 unchanged across a minute in which dozens of dispatches from eleven lanes fired config_resolved events (watcher log ts 1791242011536, 1791242011538, 1791242011751 -- pairs 2 ms and 213 ms apart, which no network round trip can produce). So the remaining defect in part 1 is the doubled resolve, not a fetch. PART 2 IS CONFIRMED AND NOT YET FIXED: code_index.rs:1462 calls code_symbols::sync_files unconditionally inside the index path with budget cfg.index.wall_budget_ms / 2, so any dispatch that finds the index stale pays the whole symbol sync inline -- that is the ''files_synced 7, files_unchanged 833, files_removed 1, symbols_written 761, treesitter_failures 0, 4310 ms'' event sitting immediately before the 5447 ms dispatch.end. The off-path mechanism already exists: code_symbols.rs:1353 registers ''sync'' => sync_tree for the codeinsight verb, so the daemon''s idle sweep can drive it. treesitter_failures is 0 in that line, which is NOT evidence that code-index-treesitter-failed-900-and-rebuild-thrash closed: that row is about code_index.rs parse_nodes emitting code_index_treesitter_failed with no file path and the resulting rebuild thrash, and a successful sync over 833 unchanged files says nothing about the failure-reporting path -- left for the agent that owns it.'
  acceptance_criteria: 'Part 1: resolve_and_report emits exactly one config_resolved per dispatch (collapse the bootstrap/tuned double pass into one pass that reads sync.debounce_ms before resolving, or caches the first pass), witnessed in .gm/exec-spool/.watcher.log as one event per dispatch instead of a pair, with no change to which tier wins. Part 2: no codeinsight_symbols_synced event is charged to a dispatch -- the sync runs from the daemon''s idle sweep via the existing ''sync'' verb, witnessed as the event appearing outside any dispatch.begin/dispatch.end pair, with dispatch.end for a cold codesearch falling by roughly the sync''s measured ms and dispatch.end for phase-status unchanged. Measured before/after on the same box with the same registry, logged with the sha of the build that produced them. Both parts land in rs-plugkit and therefore need the wasm rebuild and sideload that sibling row rs-plugkit-git-verb-defects-verified-need-rebuild-and-witness already blocks on.'
  status: pending
- id: tsl-parity-window-cannot-hold-one-head-across-two-arms
  body: 'A two-arm parity window has no HEAD freeze. Window 1 (.gm/tsl-parity/run-amd-0043): four commits from other lanes landed during the 14-minute window (1ab331aa -> 3eb42b6a -> 7b7ab961 -> 3bfbcd33/336fac3e); head.json recorded [3eb42b6a, 7b7ab961, 4dcb22bc, 336fac3e] against an in-page __parityHead stamp of 1ab331aa, and analyze.mjs printed ''HEAD DISAGREEMENT''. Window 2 (.gm/tsl-parity/run-amd-0112): both arms were built and booted at 336fac3e and both arms'' boots recorded head 336fac3e, but f6cb36d4 landed during the TSL capture, so head.json holds [336fac3e, f6cb36d4] and analyze.mjs printed ''HEAD MISMATCH: captured at 336fac3e (head.json), analyzed at f6cb36d4''. A ~10 minute capture window is not short enough to outrun the push rate. PRESCRIPTION: pin the served bytes, not the clock. The harness loads localhost:3000, which serves the live source tree, which is why a commit mid-window changes what the second arm loads; build the client once at a chosen sha and serve that static output to both arms. NOTE on what that serve must preserve: npm run build:client writes only chunk files into dist/client with no index.html, and analyze.mjs''s ''executed mapspinner bytes equal disk'' gate hashes Debugger.scriptParsed events for /node_modules/mapspinner/src/*.js, so the pinned serve must still serve UNBUNDLED modules from node_modules/mapspinner or that gate reports checked:0 and fails. A worktree at the chosen sha needs node_modules, and node_modules/mapspinner resolves into the live packages/mapspinner tree, so the symlink has to be redirected into the worktree for the pin to actually cover mapspinner. Do NOT retry with a shorter window or a more frequent HEAD check: both fail for the same reason, because the defect is that the served bytes are unpinned, not that the window is too long or sampled too coarsely. CITATION RULE: the absolute region numbers from run-amd-0043 and run-amd-0112 must not be quoted as the AMD result until a pinned run lands. Mitigating evidence that the AMD-vs-NVIDIA gap itself is real and not a cross-build artifact: the two windows ran at different shas and both drifted, yet their ratios agree within about 7 percent (ground terrain 3.715 vs 3.989, ground grass 3.917 vs 3.892, ground leftEdge 6.631 vs 6.794, grey terrain 4.024 vs 3.859, greyRelief1 vegColumn 3.268 vs 3.354), and both are roughly double the NVIDIA baseline (ground terrain 2.073, ground grass 2.081, grey terrain 1.936). A cross-build artifact would not reproduce that closely across two different sha pairs.'
  acceptance_criteria: A pinned static build served to both arms at one chosen sha, witnessed by a pair whose head.json holds exactly one sha, no HEAD DISAGREEMENT or HEAD MISMATCH line from analyze.mjs, the mapspinner hash gate still reporting checked>0, and a region table that is then citable.
  status: pending
- id: perf-framemetrics-lastms-is-dispatch-latency
  title: Adaptive quality reads _perf.lastMs, which is rAF dispatch latency plus JS work, not the frame interval the DPR/VDRS controllers were tuned against
  body: 'client/app.js:2628 feeds _perf.sample(performance.now() - now) where now is the rAF timestamp argument, so the sample is rAF dispatch latency plus JS work: p50 13.45-14.7 ms against a true rAF interval of 6.95-13.84 ms on the same run (measured on D-metric-v2 and W-walk120). _perf.lastMs drives _adaptDpr, _adaptTerrainVdrs, _adaptThreeVdrs, _adaptFog and occlusionQueryBudget.reportFrameTime, so adaptive resolution and the occlusion query budget react to an inflated number. Split out of perf-framemetrics-session-instrument-lies, whose other two defects are fixed: exportSession duration is now derived from summed frame time (witnessed: 120 samples of 6.94 ms now report duration 0.8 s where samples/60 reported 2.0 s) and stats().drawCalls now reads render.drawCalls, falling back to render.calls only where three''s WebGLInfo has no drawCalls field (witnessed: 141 on a drawCalls info object, 158 on a calls-only one). This row is the behaviour half and it needs a real-GPU A/B, because the controllers compare against a 6.94 ms (144 Hz) budget and every SwiftShader arm runs at 5-6 Hz, where every controller saturates at its floor and the A/B cannot distinguish the two inputs.'
  acceptance_criteria: The adaptive-quality inputs use the JS work time measured from callback entry (performance.now() at the top of animate, not the rAF timestamp) or the true inter-frame interval, whichever the controllers were tuned for, with the choice stated in the commit and in recall; a same-bundle A/B on a real-GPU walk arm shows the DPR/VDRS decisions and p50/p95/p99 before and after, with reachability PASS. Requires the GPU currently held by realm-v5-magic-lockstep; do not run it on SwiftShader.
  blockedBy: 'real-GPU availability: the GPU is held by realm-v5-magic-lockstep, and this A/B is undefined on SwiftShader because the controllers saturate at their floor at 5-6 Hz'
  area: perf
  status: pending
- id: perf-gl-hook-counts-every-webgl-context
  title: The GL draw hook wraps every WebGL context on the page, so legacyGL glDrawsPerFrame reads 158-197 against three's 110-116 on the same arm
  body: 'scripts/perf-run.mjs wraps HTMLCanvasElement.prototype.getContext and patches the whole prototype of every webgl/webgl2 context it hands out, then counts drawElements/drawArrays/drawElementsInstanced/drawArraysInstanced/drawRangeElements/multiDraw* into glDrawCallsPerFrame. If any second WebGL context exists on the page (mapspinner keeps a shared context -- see recall mapspinner-shared-gl-context-state-hazards) its draws land in the same counter. The archived arms carry the discrepancy: L-legacygl-v1m glDrawsPerFrame avg 158.3 / p95 240 / max 242 against threeDrawCallsPerFrame avg 115.7 / p95 149 / max 163, ratio 1.37; L-walk120b 196.9 / 242 / 246 against 109.7 / 143 / 153, ratio 1.80. The same comparison on WebGPU is near parity (V-vegvar3 wgpu 137.7 against three 114.4, ratio 1.20; D-metric-v2 113.4 against 105, 1.08), and the WebGPU hook patches GPU prototypes rather than per-context objects, so a second device is less likely to hide there. Until this is resolved, glDrawCallsPerFrame and wgpuDrawsPerFrame are not interchangeable as the authoritative draw figure: compare instruments within one backend only.'
  acceptance_criteria: Instrument one legacyGL arm recording, per frame, both the total GL draw count and the count attributed to the renderer's own canvas context (tag each wrapped context with an index and record a per-context breakdown), and report how many contexts exist and how many draws belong to non-three ones. If a second context is carrying draws, either scope the counter to the renderer's context or report the breakdown as separate fields, and state the resulting ratio to three's drawCalls on the same arm.
  blockedBy: none
  area: perf
  status: pending
- id: vegetation-creation-never-resolves-on-software-renderer
  title: Vegetation creation never resolves on the SwiftShader witness path, so boot:vegetation-created never fires
  body: |-
    Across four scripts/page-boot-witness.mjs --gl=swiftshader runs (uncontended and under six-lane contention), boot:vegetation-created never fired. Uncontended baseline: boot:backdrop:returned 28489, boot:foliage-started 28491, boot:rocks-created and boot:grass-created 28556, boot:scenery-built 44039 - vegetation creation was still pending when the boot ended. Under contention: foliage-started 64577, rocks and grass created by 64651, and boot:vegetation-created still absent 300 s into the run. _ensureVegetation (client/app.js:389) is awaited in the same Promise.all as rocks and grass (client/app.js:500), and rocks/grass settle within ~75 ms of foliage-started, so the stall is specific to vegetation, not to the foliage phase.

    It is not the physics lane "cap is not defined" ReferenceError: that string occurs 0 times in the two most recent run logs.

    Consequence: no boot gate that waits for the build can be satisfied by vegetation on this renderer. Either it falls through to SCENERY_BUILD_TIMEOUT_MS or it waits a second window and then reveals a world with no trees. This is why scenery-cap-reveals-mid-build-when-planet-is-up cannot meet its stated acceptance here.
  acceptance_criteria: 'A scripts/page-boot-witness.mjs --gl=swiftshader arm emits boot:vegetation-created before boot:scenery-built, with a non-zero vegetation instance count. Witness: mark order plus the instance count. Until this holds, every scenery gate on the software renderer necessarily falls back to the duration cap.'
  blockedBy: ''
  owner: lanmower
  session_id: f73df536-0f66-49a1-8888-2a064d23416a
  status: pending
- session_id: f73df536-0f66-49a1-8888-2a064d23416a
  id: timing-figures-carry-no-host-contention-fingerprint
  title: Every timing figure from this box is recorded without any measure of host contention, so inflated numbers get cited as real
  body: |-
    Observed 2026-10-06 on the spoint box while roughly a dozen lanes ran concurrently alongside a peer training session.

    Evidence that the box, not the code, was the variable:

    - The scenery lane measured about 2.5x timing inflation purely from six concurrent lanes, and had to re-measure to notice.
    - `git status --porcelain <single file>` did not complete within 120 s.
    - `tail` on a small task output file did not complete within 120 s either -- a read of a few KB.
    - The AMD TSL-vs-legacy parity lane needed a 25 minute GPU window and produced two windows that were both refused as invalid; several earlier windows were blamed on downstream causes before the structural one was found.

    Why this is a defect and not just an inconvenience: nothing in the harness records how loaded the host was when a number was taken. A wall-clock figure lands in a PRD witness string, a memo, or AGENTS.md stripped of the only fact that determines whether it means anything. Later sessions then cite it as the machine's real cost. This has already happened in spirit -- the scenery lane's first numbers were inflated and had to be re-taken, and every AMD parity number so far is uncitable for related reasons.

    The general shape is the same as two instruments already found wanting this session: a ruler that measures something other than what people think. `--require-gpu` asserts a real adapter and is satisfied by the wrong GPU; the parity analyzer asserts one head and rejects a same-sha pair because HEAD moved after capture. Here the missing assertion is on the host, not the page.

    The fix is a contention fingerprint recorded alongside every timing, not a policy about how many lanes may run. A fingerprint is cheap to collect and impossible to argue with later: count of concurrent node processes, count of live Chrome instances, one-minute load average or CPU busy percentage sampled over the measurement window, whether the GPU lock was held by this lane or shared, and the wall-clock duration of the window. Any before/after comparison refuses to compare two arms whose fingerprints differ beyond a stated tolerance, the same way the parity harness already refuses on a HEAD disagreement -- the refusal is the instrument doing its job.

    Scope note: this does not ask anyone to reduce parallelism. Concurrency is wanted; unlabelled concurrency is not.

    Related: measurement-windows-must-pin-served-bytes (a multi-minute window must serve bytes built at one sha) is the other half of the same problem -- pinning the bytes without recording the load still leaves a timing figure unattributable.
  acceptance_criteria: 'The boot witness, perf-run, and the TSL parity harness each emit a contention fingerprint next to every timing they report: concurrent node process count, live Chrome instance count, CPU busy over the measurement window, GPU lock holder, and window duration -- recorded in the same output file as the timing so it cannot be separated from it. A before/after or cross-arm comparison refuses when the two fingerprints differ beyond a stated tolerance, evidenced by a witnessed refusal on a deliberately contended run. Existing rows and memos that cite wall-clock figures taken during this session are re-checked or explicitly annotated as contended. Commit as lanmower with explicit paths; no comments; no test files.'
  status: pending
- id: tsl-parity-head-signal-cannot-distinguish-arm-drift-from-post-capture-drift
  title: Parity analyzer reports one git HEAD per window instead of the bytes each arm loaded
  body: |-
    Two AMD windows failed for two different reasons and the analyzer prints the same kind of line for both, so the run log cannot tell a real cross-arm byte difference from HEAD moving after the capture.

    Window 1 (run-amd-0043): head.json heads [3eb42b6a, 7b7ab961, 4dcb22bc, 336fac3e] -> 'HEAD DISAGREEMENT: capture-time sources disagree'. The two arms really loaded different commits; that pair is genuinely invalid, and its region numbers must not be cited as AMD results.

    Window 2 (run-amd-0112): every capture-time source reported 336fac3e -> 'HEAD MISMATCH: captured at 336fac3e, analyzed at f6cb36d4'. Both arms loaded the SAME bytes; the analyze-time HEAD moved afterwards because other lanes pushed during the window. Correction to the earlier read of this window: the head line is not what invalidated it. analyze.mjs:182 sets verdict = gates.every(g => g.pass), and the head lines (222-225) are printed, never gated. Window 2's single FAIL was 'vegetation equal and constant across every frame of both renderers' with counts [227,229,233]; all other gates passed, including 'executed mapspinner bytes equal disk' (checked 37, mismatched 0).

    So the signal is wrong in both directions: window 1's real cross-arm drift is reported only as a disagreement string, window 2's benign post-capture drift looks like the same class of failure, and neither is checked. Prescription: stamp what each arm actually loaded, per module, instead of one window-level head.json -- for every script the page executes record (url, V8 Debugger.scriptParsed hash, served-content sha256, server's own serve sha) per arm, and gate on per-arm equality of that set. scripts/pinned-verify.mjs already computes the served-vs-snapshot-vs-live-tree sha256 triple CPU-side for packages/mapspinner/src, client/app.js and src/sdk/StaticHandler.js; that triple is what belongs in each arm's artifact. Pinning the served bytes (git archive <sha> into .gm/pinned/<sha>, node_modules/mapspinner and node_modules/streaming-gltf redirected to the snapshot's own packages/, snapshot's own server.js run with cwd=snapshot) makes both arms provably load identical bytes, which is the precondition the head check was trying and failing to establish.

    Cross-window agreement, recorded as corroboration and NOT as a result: run-amd-0043 and run-amd-0112 agree within ~7% on ground terrain (3.715 vs 3.989), ground grass (3.917 vs 3.892), ground vegColumn (3.588 vs 3.649), ground leftEdge (6.631 vs 6.794), grey terrain (4.024 vs 3.859) and greyRelief1 vegColumn (3.268 vs 3.354) -- roughly double the NVIDIA baseline (2.073 / 2.081 / 1.936). Both windows fail the vegetation gate and 0043 is cross-build, so this supports 'the two AMD arms reproduce each other' and nothing stronger.
  acceptance_criteria: A run whose two arms loaded byte-identical modules reports same-bytes and names the serve sha even when HEAD moved after the capture; a run whose arms loaded different bytes reports cross-bytes and names the differing modules. The head line is no longer the only provenance signal, and no run is called invalid on git rev-parse drift alone.
  status: pending
- session_id: f73df536-0f66-49a1-8888-2a064d23416a
  id: git-verb-message-file-bom-not-stripped
  title: A UTF-8 BOM in a @message file lands in the commit subject
  body: 'Witnessed live against the gm.wasm built from rs-plugkit 18ce835cdccc602f651d9d90b5864c79e156f9d8 and sideloaded into the isolated harness home: git_commit {message:''@C:/Users/user/iso-roots/verbtest/msg-ok.txt''} committed 4a99c7b6240fa784031c8d9d2b3310927b1ef6d0 whose subject is ''\ufeffverb witness: message came from the named file'' -- the file was written by PowerShell Set-Content -Encoding utf8, so it starts with U+FEFF, and expand_git_message_field in crates/plugkit-core/src/wasm_dispatch/verbs.rs does contents.trim(), which is whitespace-only and leaves the BOM in the message that reaches git -m. Every commit message taken from a BOM-encoded file therefore carries a leading zero-width character, which breaks subject comparisons, dedup keys and any grep on the subject. Fix: trim_start_matches(''\u{feff}'') (and the same for a leading U+FFFE) before the whitespace trim, applied in the same match arm that currently returns Ok(contents.trim().to_string()). Same blocker as sibling row git-verbs-must-force-lanmower-author-and-refuse-ai-trailers: the source fix is inert until the wasm is rebuilt with ''cargo build -p rs-plugkit --release --target wasm32-wasip1 --features slim'' (the recipe is rs-plugkit .github/workflows/release.yml, which ships target/wasm32-wasip1/release/rs_plugkit.wasm as asset plugkit-slim) and sideloaded.'
  acceptance_criteria: git_commit with a @file whose bytes start with EF BB BF produces a subject with no leading U+FEFF (verify with git log -1 --format=%s | hexdump of the first bytes), and the same dispatch with a BOM-free file is unchanged. Witnessed against a rebuilt and sideloaded gm.wasm in the isolated harness home.
  status: pending
- session_id: f73df536-0f66-49a1-8888-2a064d23416a
  id: plugkit-wasm-rebuild-and-sideload-into-live-home
  title: Ship the rebuilt plugkit wasm into the live plugin home so rs-plugkit source fixes take effect
  body: 'rs-plugkit source fixes are inert until the plugin binary is rebuilt and sideloaded, and nothing in the loop does that automatically. Established this session by reading the repo rather than guessing: rs-plugkit/.github/workflows/release.yml calls wasm-plugin-release.yml with build_command ''cargo build -p rs-plugkit --release --target wasm32-wasip1 --features slim'' and ships target/wasm32-wasip1/release/rs_plugkit.wasm as release asset plugkit-slim to AnEntrypoint/plugkit-bin (no wasm-opt/strip step -- the size difference is entirely the slim feature set; a non-slim build is ~139 MB, the slim release build is ~4.8 MB). Reproduced locally: 4,804,641 bytes from HEAD 18ce835cdccc602f651d9d90b5864c79e156f9d8. Sideload recipe, read off the live home: copy the wasm over ~/.agentplug/plugins/gm.wasm (keeping a gm.wasm.pre-<label> backup as every earlier sideload did) and write the marker file plugins/gm.version with a non-semver marker, which the runner treats as an intentional local-dev sideload and never auto-overwrites (daemon log: ''plugin gm is served from a NON-RELEASE marker ... The auto-updater will NOT overwrite it''). Done this session only in the isolated harness home C:\Users\user\.agentplug-iso (marker local-dev-sideload-gitverb-witness-FD4FC6F93E959441, verified live as loaded_plugin_content_sha256.gm fd4fc6f93e95944159325731c1feac796d372a69a1cfc7ddd29c6b1894dfb3b3 replacing 2fa67a9f15cd6159275b155b70b617cbc4d66e7e7ae64f29da4a6e2c371ea23a), which is where the git-verb witnesses were taken. NOT done in the live home C:\Users\user\.agentplug, because eleven dispatch lanes were mid-flight on it and swapping the plugin binary under them swaps the code under running verbs. Rows blocked on this: git-verbs-must-force-lanmower-author-and-refuse-ai-trailers (witnessed in the harness, not yet live), git-verb-message-file-bom-not-stripped, code-index-treesitter-failed-900-and-rebuild-thrash (rs-plugkit 18ce835), and gm-board row rs-plugkit-git-verb-defects-verified-need-rebuild-and-witness.'
  acceptance_criteria: 'The live home''s plugins/gm.wasm is a build of the rs-plugkit sha the parent gitlink names, verified three ways: the byte size is within a few percent of 4.8 MB, plugins/gm.version carries a new marker naming that sha, and the daemon''s status reports loaded_plugin_content_sha256.gm equal to the sha256 of the freshly built file. Witness the swap on a quiet box (no lane mid-dispatch), with the pre-swap gm.wasm kept as plugins/gm.wasm.pre-<label>, and re-run one git_commit and one codesearch dispatch afterwards against the live home to show the new code is serving.'
  status: pending
- id: tsl-parity-pinned-snapshot-bake-code-version-differs-from-tree
  title: git archive materialises LF, so a pinned snapshot computes a different bakeCodeVersion than the CRLF working tree and every pinned run falls back to exact CPU height
  body: 'The pinned serve built for the AMD parity pair (snapshot of b69c77545323 at .gm/pinned/b69c77545323, served on :3100, byte-verified by .gm/pinned-verify.json) logged two lines that matter: ''[terrain] ignoring baked heightfield /apps/world/tps-game.hf: baked with height code version 53ae5783eac2, this tree bakes 21f8cd916a26'' and ''[terrain] collider using EXACT CPU height (no baked artifact covers the spawn)''. MECHANISM: git archive writes the committed LF text, while this box checks out CRLF under core.autocrlf=true, and bakeCodeVersion hashed raw file bytes before f88ebb28 -- so the snapshot''s own digest (21f8cd916a26) can never equal the cached artifact''s (53ae5783eac2, itself the CRLF digest that CI computed as 1e14bb7bd0db, the check-cache-keys red). Re-baking inside the snapshot does not help while the pin predates the fix, because the re-bake records the same LF digest as the code that reads it -- which is only self-consistent, not equal to any other checkout. CONSEQUENCE for the pair: both arms read identical bytes, so the comparison stays valid, but the run exercises the exact-CPU-height path with terrainhash=1 forced by the URL while the world itself resolves to hashVersion 2, so it does not cover the baked-heightfield render path at all. PRESCRIPTION: re-pin onto a commit at or after f88ebb28 (LF-normalised hashing), re-bake inside the snapshot so the digest is computed from the bytes the server actually serves, and re-verify. Until then any pinned result must be reported as CPU-height-only.'
  acceptance_criteria: A pinned snapshot taken at or after f88ebb28 reports a bakeCodeVersion equal to the live tree's and to CI's, its server log shows the baked heightfield accepted with no 'ignoring baked heightfield' line, and both arms capture against the baked path with .gm/pinned-verify.json still reporting servedMatchesSnapshot true.
  status: pending
- id: fire-s2c-veg-sway-wind-vector-client
  title: 'S2c follow-on: vegetation sway uses the fire wind vector, not the scalar window.__vegWind'
  body: 'The sim carries an authoritative integer wind vector (ServerWeather on WEATHER_SYNC, seed+step field in src/shared/fire/fireWind.js) but client veg sway is still one scalar: VegetationBuild.js injects uniform float uVegWind, Vegetation.js/VegetationTSL.js set it from window.__vegWind, so sway has magnitude and no direction and cannot lean with the fire. Add a direction uniform fed from the same wind the kernel used (projected to the chart local east/north), keep the scalar as magnitude, and witness in a browser: opposite wind must lean the same canopy in opposite directions, asserted on the real uniform values plus screenshots.'
  acceptance_criteria: Wind vector reaches the direction uniform from the fire/weather source; browser witness (RTX 3060 + AMD iGPU) with opposite-lean screenshots and logged uniform values; magnitude-only path unchanged when no fire is defined.
