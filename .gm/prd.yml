- id: perf-after-arm-veg-cells-weather-grid
  title: 'GPU after-arm for 02a1feef36: veg LOD cells, weather ground grid, setTranslatedAt'
  body: 'Run the same harness as PF-nv-720/720b/720c (tps-game singleplayer, 1280x720, 120 s walk, rain 0.6) on bundle built from 02a1feef36 or later, 3 NVIDIA arms plus 1 AMD, buckets clean. Extract with scripts/cpuprofile-callers.mjs <PF-*.cpuprofile> ''^updateLOD$'' ''^composeHeight$'' ''^solveSurfaceY$'' ''^setMatrixAt$'' and the weather update entry. Headless baselines: veg updateLOD 7500 instances 1500-2200 us -> 120-320 us per frame; rain update 1290-2580 -> 280-520 us; solver calls per frame 29-31 -> 3.3. Compare against nv1-3 (updateLOD self 6.6-7.1 pct, inclusive 7.7-8.1; weather 10.8-11.7 pct inclusive; composeHeight 7.0-7.3 pct inclusive; setMatrixAt self 3.9-4.2 pct; allocation 189-201 MB/s; frame p95 20.84 ms / p99 27.78 ms in nv3). Visual criterion: fixed pose, fixed time of day, weather rain 0.6, vegetation on; capture 8 consecutive frame pairs at 1/72 s spacing before and after with the same renderer; tolerance = max of the same-renderer repeat floor (two captures of the same build) measured per region; compare (a) vegetation regions: per-region mean abs luminance difference between builds must be <= repeat floor + 0.5 percent, and no instance pop: count tier flips per frame pair via window.__vegProfile.meshInstances/impostorInstances deltas, must equal the old build''s at the same poses; (b) rain: drops are random so compare statistics, streak count visible and splash count (imSplash instances with spawnTime >= 0), within repeat floor; splash height error vs frame.groundHeightLocal read in-page must be mean <= 0.05 m, max <= 0.20 m.'
  acceptance_criteria: Four PF arms recorded with cpuprofile; inclusive pct of updateLOD, weather update, composeHeight, setMatrixAt, allocation MB/s and frame p95/p99 tabulated against nv1-3/amd1; visual tolerance results stated; memo written.
