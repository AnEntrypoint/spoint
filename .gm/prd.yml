- id: tsl-haze-ab-needs-far-ground-pose
  title: Haze on/off A/B needs a pose with ground beyond 3 km, verified nonzero on legacy first
  body: The aerial-perspective gate is smoothstep(3 km, 120 km), so the hills pose used in the AMD triplet had no haze-affected ground and the haze A/B was inconclusive. Find a pose (high altitude or long sightline) with >=10% of the frame on ground beyond 3 km, measure legacy hazeMul 0.4 vs 0 there and confirm meanAbs > 3 before using it for TSL parity.
  acceptance_criteria: A recorded pose where legacy haze on vs off differs by meanAbs > 3 in a masked far-ground region, then TSL vs legacy on that region within K=3 x max(floor,1) on AMD and NVIDIA.
  session_id: f73df536-0f66-49a1-8888-2a064d23416a
  status: pending
- id: render-parity-witness-harness-single-source
  title: One reusable render-parity witness harness instead of per-boot scratch scripts
  body: The 2026-10-05 parity work duplicated the hook (console classifier, input blocker, pointer-lock stub), setup (wait for app/terrain/veg, pin time of day, weather, haze, camera, settle on veg count), capture and pose-signature logic across w-hook/w-hook2/w-setup/w-pose*/w3-build and inline cdp bodies, and the decode/compare logic across w-compare.mjs and ad hoc exec_js. Fold into one generator (scripts/ or a gm verb mode) that takes {url, pose, regions, gpu} and emits a single-dispatch raw-CDP body plus a PNG decoder/comparator with K and floor as inputs, and asserts pose/ammo/blockedInput equality between frame pairs, failing loudly otherwise.
  acceptance_criteria: The sky-pose NVIDIA and AMD measurements reproduced from the single harness with the same numbers (+-0.2 per channel), and the scratch scripts deleted.
  session_id: f73df536-0f66-49a1-8888-2a064d23416a
  status: pending
- id: cdp-session-viewport-size-not-pinned
  title: cdp session viewport differs between sessions, so fixed-pixel clips compare different scene areas
  body: Canvas backing size was 1295x808 on most AMD sessions, 1297x812 once, and 1403x677 on the 2026-10-05 NVIDIA v2 session. The parity clip is in CSS pixels at a fixed rect, so a different viewport frames different sky/ground. The harness (or gm cdp session new) should pin the viewport with Emulation.setDeviceMetricsOverride and record it, and comparisons should refuse mismatched canvas sizes.
