  title: gm cdp NVIDIA session browser is recycled between consecutive dispatches, losing page state
  body: Three times on gpu=nvidia sessions, a dispatch following a successful setup dispatch found a fresh page (no window.__app), so setup/capture/signature had to be packed into one raw-CDP body. pa-9 (AMD) also reported 'no live session' at close after a successful run. chrome_idle_ttl_seconds is 300, so idle reap does not explain sub-minute gaps. Fix in c:/dev/gm.
