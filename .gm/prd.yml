- id: airborne-player-ground-solve-moving-cost
  title: A horizontally moving player far from the anchor still pays a full 14-evaluation solve (168 us at 52 km) every tick the ground height is asked
  body: 'The exact-position memo in groundHeightLocal only helps stationary players. A moving player (sprinting airborne, falling with horizontal velocity) misses the memo. At 52 km the solve takes 14.3 evaluations because the radial fixed point contracts at about 0.5 (tilt of the render ray), versus 2.0 near the anchor. Options measured nowhere yet: seed the solve with the previous y of the same player or slot (yGuess argument; row solve-surface-warm-start-cost covers sweeps), or a Newton step using the finite-difference slope of g, or caller-side throttling of the fall-kill ground check to once per N ticks for airborne players.'
  acceptance_criteria: At 64 players sprinting airborne at 52 km the physics phase is measured before/after (interleaved x10, median and IQR) and the per-solve evaluations at 52 km drop from 14.3 below 5 with outputs within 1e-4 m of the current solver; v2 baked heightfield outputs stay bit-identical or the hf is re-baked with the new key and error stats
  session_id: f73df536-0f66-49a1-8888-2a064d23416a
  status: pending
- id: veg-cell-lod-updatelod-regressed-7-to-21pct
  title: 'The 32 m cell vegetation LOD (02a1feef) made updateLOD three times more expensive: 6.9% to 20.9% of main-thread CPU on the same walk'
  body: 'Worktree-pinned arms 2026-10-05 16:17-16:39, NVIDIA ampere, same harness, world, route and 120 s walk. Before is commit 3de512cf (the parent of 2bc33d2b, W-before-nv-1, n=1). After is commit 3bf97f05, which contains 2bc33d2b, 02a1feef and ba70ef23 (W-after-nv-1 and -2, n=2, both clean worktrees, client bundle e38ff776285104b9). Exact shares from the saved .cpuprofile, attributing by bundle line, not name: old updateLOD (bundle H, line 1178) was 5.89% self and 6.86% inclusive; new updateLOD (bundle U, line 1178 col 9346, called only from the vegetation update) is 17.63%/17.67% self and 20.94%/20.95% inclusive. At main-thread CPU of 13.67 vs 12.46/11.94 ms per frame, that is about 0.94 ms to 2.5 ms per frame. Mechanism from the source: whenever the view changes (every frame while walking or turning) the new loop tests every cell of every instancer against the frustum and, for partially visible cells, runs the per-instance distance-tier and sphere-frustum test. The old code only re-tiered per instance when the eye moved 0.5 m. The other optimisations did land: updateShadow inclusive 19.5% to 5.3-5.5%, shadow renders per frame 1.58 to 0.34, composeHeight inclusive 8.0% to 3.0-3.3%, solveSurfaceY 6.3% to 1.0-1.1%, weather tick inclusive 12.3% to 2.0-2.4%, streaming-instancer setMatrixAt 4.3% to 0.05%, allocation 184 to 89-92 MB/s. These gains are partly given back by updateLOD.'
  acceptance_criteria: updateLOD inclusive share at or below the 6.9% baseline (or below its absolute ms per frame) on 3 worktree-pinned NVIDIA arms of the fixing commit against 3de512cf, with the tier and visibility outcome per instance unchanged at a fixed pose (tier counts equal), host CPU recorded per arm.
  session_id: f73df536-0f66-49a1-8888-2a064d23416a
  status: pending
- id: tsl-terrain-grey-lighting-residual
  title: TSL terrain is about 2 levels darker than legacy on every channel under a grey albedo
  body: 'Measured on AMD: TSL-grey minus legacy-grey = (-1.99,-1.90,-1.74); legacy-grey (202.4,200.8,193.9). My flat-patch Node model gives (194.2,196.5,180.7), off by 8-13, so it is not calibrated to the pose and cannot name the stage. Stages compared line by line (terrain.glsl 939-1022 vs terrain-lighting-tsl.js): ambient floor, sky irradiance, sun gain 1.25/pi, transmittanceToSun soft term, dayShade, exposure, ACES, lookSat, pow(1/2.2) and the display-referred round trip (identity within 0.4) are the same. Differences left: aerial perspective uses the scattering LUT in TSL vs the 4-step march in legacy (modelled TSL darker by 0.2-2.9 R at 20-48 atm-km, B only -0.4 to -1.1, so the profile does not match -1.74 B), sun shadow as luminance(lightColor)/sunLum with three PCF vs legacy 4-tap host shadow, LUT texture half-float quantisation of the transmittance read, vN vs vNrm normal. Not fixed.'
  acceptance_criteria: 'GPU A/B on both renderers with window.__hazeMul = 0 under grey albedo: if the -2 disappears the stage is aerial perspective (then the LUT zenith row row scattering-lut-zenith-undersampled and the 4-step integrator are the cause); else a second A/B with the shadow disabled; then a fix with a pre-registered prediction'
  session_id: f73df536-0f66-49a1-8888-2a064d23416a
  status: pending
- id: planet-snapshot-group-planner-needs-quiet-box
  title: 'Work-driven snapGroups planner is built and parked: needs a quiet box to validate'
  body: 'Planner (medians of 32 non-keyframe passes of fixed and per-viewer wall ms, groups=ceil(viewers*perViewerMs/(tickPeriod*0.35-fixedMs)), shrink at 80% fill, index membership) saved as scratchpad planner.patch + SnapshotGroupPlanner.js; deterministic simulation: 16 players 1 group even with 20x spikes every 5th pass, 64@71us 1 group, 64@140us 2, 64@190us 3. NOT committed: on the contended box (dilationFactor 0.1) wall-clock cost makes it shed to 3-7 groups (snapPerTick 0.14-0.36 vs base 0.46-0.50), and win32 process.threadCpuUsage is quantised to ~15 ms so it cannot time a pass. Re-measure when the box is idle (CPU per tick, snapshots per server tick, clustered/split100/spread-sphere n=16 and 64, interleaved), consider a cost-time source that is not wall clock, then commit. Interest, wire and adaptive stall logic untouched.'
  acceptance_criteria: 'On an idle box: n=64 spread (isolated players) 60 Hz per client (1 group), n=64 clustered no worse than 2 groups, n=16 always 1 group, 3 interleaved before/after runs, interest 0 missing, conditioner harness unchanged.'
  session_id: f73df536-0f66-49a1-8888-2a064d23416a
  status: pending
- id: planet-snapshot-prepacked-player-records
  title: Per-viewer snapshot cost is msgpack of the player records, not the tier sort
  body: 'Profile n=64 clustered 20 s main thread: msgpackr pack/writeRecord/packArray 3.3 s versus classifyPlayerTiers 0.37 s, nearby 0.28 s, buildAndSendSnapshots 0.17 s (so crowd-tier sort is under 2%). Bench: pack 12.5 us at 16 records, 21-24 us at 31-64; tiered filter 5 vs 17-22 us. Idea: pack each player record once per pass and splice the bytes into every viewer''s snapshot; blocked by Packr bundleStrings/structures framing, needs a byte-identity check against pack() over many payloads. Also share reduced-record encoding per pass instead of per viewer.'
  acceptance_criteria: Byte-identical packed snapshots for fixed inputs (hash), per-viewer pack time measurably lower at 30+ neighbours on 3 interleaved runs.
  session_id: f73df536-0f66-49a1-8888-2a064d23416a
  status: pending
- id: tsl-grass-region-excess-after-rock-fix
  title: TSL grass-region pixels still +4.2/+3.3/+3.0 over legacy on NVIDIA after the rock-colour fix 8bc9f9e5
  body: 'NVIDIA RTX 3060, HEAD 4c60929a, ground pose (singleplayer terrainhash=1 at=-2750,-750, fraction 0.45, clear, hazeMul 0.4, cam yaw 1 pitch 0, 1036x647 DPR 1.25, veg 233 both renderers): rule-mask grass region TSL (199.28,217.79,211.89) vs legacy (195.04,214.49,208.94), meanAbs 4.21, ratio 4.21 vs K=3 FAIL (before the fix +8.78/+6.16/+4.92, ratio 6.82). Terrain region after the fix Δ(+1.08,+1.01,+0.93) but meanAbs ratio 3.57 still FAIL. Under the grey albedo override grass-region Δ is (+3.31,+2.95,+2.69) on NVIDIA and (-0.14,-0.30,-0.22) on AMD before the fix, and the grass mask responds to the terrain hook on both renderers (greyVsMix0 ~3.0-3.3), so the grass mask is mostly ground under/through grass. The pre-registered prediction grass Δ ~ -0.1 +-1.5 MISSED on NVIDIA. Raw frames: scratchpad w9-nv-tsl.json / w9-nv-legacy.json.'
  acceptance_criteria: grass and terrain regions at the ground and sky poses within K=3 x max(floor,1) on NVIDIA and AMD, or a measured, named stage per remaining residual.
