- id: cpu-plan-interactables-gate-on-press
  title: Skip the interactable x player distance sweep on ticks where no player is pressing interact
  subject: Gate _tickInteractables on a per-tick any-player-pressed-interact flag so the whole interactable x player distance sweep is skipped on ticks where no player is pressing the interact key.
  body: |-
    TIER-0 parent: cpu-skip-and-replay-plan-browser. CPU-side, server tick path.

    WHAT RECOMPUTES, PER TICK
    src/apps/AppRuntimeTick.js:187 _tickInteractables(), invoked every tick from src/apps/AppRuntimeTick.js:26 (and :48 in the profiled branch). It runs a full nested sweep: for every id in this._interactableIds (src/apps/AppRuntimeTick.js:194) and for every player in this.getPlayers() (src/apps/AppRuntimeTick.js:196) it reads both positions and does a squared-distance test (src/apps/AppRuntimeTick.js:198-199). That is E_interactable * P_players distance tests per tick, plus one getPlayers() array build per tick and one Map.get for the cooldown key per pair that passes (src/apps/AppRuntimeTick.js:200-201).
    The interactable set is overwhelmingly static world props, so E is large and constant while the sweep result is almost always 'nothing happened'.

    STABLE STRUCTURE (the captured graph)
    The (interactable entity, player) pair graph, the per-pair cooldown table, and the radius test.

    CHANGING INPUTS
    Entity positions, player positions, and the per-player p.lastInput.interact bit.

    INVALIDATION KEY
    The whole subgraph's only observable effect is fireEvent(e.id,'onInteract',p) at src/apps/AppRuntimeTick.js:205, which is itself already gated on `if (p.lastInput?.interact && tick >= expiresAtTick)` at src/apps/AppRuntimeTick.js:203. Therefore: if no connected player has lastInput.interact truthy this tick, no distance test can produce any output, and the entire sweep is skipped. Key = one boolean computed once per tick from the player input state (a per-player input version already exists as PlayerState.inputSequence / lastInput, so the sweep can also be narrowed to only the players that pressed, which is the correct narrowing when at least one pressed: replace the inner `for (const p of players)` with an iteration over the pressing players only).
    No cached VALUE is produced by this skip, so there is no cache and therefore no input-hash stale-output exposure (deviation.build-cache-no-code-version-key) and no code-version key to fold in. This is a pure prune, not a memo.

    WORST-CASE BOUND
    The skip is total and bounded: one pass over players reading one boolean each. The miss path is identical to today's behaviour. When at least one player pressed, the sweep runs for the pressing players only, which is a strict subset of today's work; correctness is preserved because a player who did not press can never satisfy src/apps/AppRuntimeTick.js:203. There is no path by which this skip returns a plausible wrong value: skipping produces no value at all, and the gating condition is the same condition the event itself already tests.

    MEASUREMENT (integer work units, immune to timer inflation -- this box's zero-delta control arm is +/-10% and currently ~2.5x inflated, so nanosecond numbers are not admissible)
    Deciding counter: per tick, (a) interactable x player distance tests performed today, (b) number of ticks out of N in which no connected player has lastInput.interact truthy. Skippable distance tests per tick = (a) * (b)/N.
  acceptance_criteria: 'Live server witness with >=4 connected players on apps/world/tps-game.js over >=300 ticks: instrument a counter inside the distance test and report distance-tests-per-tick before and after. Pass requires: after the change, distance-tests-per-tick on ticks where no player pressed interact is exactly 0, and total distance tests over the run drop by at least 90%. Correctness: an entity the player is standing next to fires onInteract on the same tick the interact bit is observed set (witness by a real client sending interact and observing the app event that tick), and no onInteract fires for a player who did not press.'
