  title: perf-run 1920x1080 arms hang after the walk on both GPUs, and --gpu=igpu never selected the AMD adapter
  body: 'PF-nv-1080 and PF-amd-1080: after the 60 s walk the page stopped answering CDP (Page.captureScreenshot and Runtime.evaluate both timed out at 90 s) and the arm died (exit 1 / hard timeout 3). Cause unknown: a hung main thread, a lost device, or the 30000-frame in-page read at that size. Separately, GPU_ARGS.igpu used ''--igpu-select'', which is not a Chrome flag, so every earlier ''igpu'' arm ran on NVIDIA; --gpu=amd --adapter-luid=<low> (now in scripts/perf-run.mjs) does select the Radeon and the arm records navigator.gpu adapter info.'
