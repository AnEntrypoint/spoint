- id: preallocatepool-never-trims-resident-bodies
  subject: World.preallocatePool grows each shapeKey pool to peak demand and never trims, so resident bodies are a monotone high-water mark against a fixed 10240 cap
  why: 'Measured on collider-ring-scale-witness (commit 003fafdf): resident bodies climbed boot 266 -> 24 centres 1820 -> 64:5500 -> 128:6663 -> 192 settled 7572 -> 192 moving 10227, then the next add threw `[physics] body limit reached: 10240 of maxBodies 10240`. Stacking five arms on one world measured the union of every arm pool, because a pool that grows to demand is never reduced, so peak usage permanently occupies budget instead of returning it. A 192-centre walking ring on a fresh world is 9625 of 10240, i.e. 94% of one server world budget with 615 bodies of margin. Consequence for planet-wide multiplayer: a long-running world that sees many distinct shapeKeys (more models, more scales) accumulates pool high-water marks it can never give back, and a world can hit the body cap from pool residue alone rather than from live colliders. Options to evaluate: trim pools below a residency threshold on a timer or when a world goes idle, cap pool growth per shapeKey, or make the body budget account for pool residue explicitly so the cap is not silently consumed. Do not raise DEFAULT_MAX_CENTERS or the cap as the fix -- that spends the remaining 615 bodies on the symptom.'
