  status: pending
- id: cpu-plan-veg-lod-instancer-plane-sweep-index
  title: 'Index the vegetation LOD instancer plane sweep: updateLOD walks every instance with 6 plane tests and no spatial structure, costing 11.7 ms per frame at 50k instances whenever the camera moves'
  subject: client/core/WebGPULodInstancer.js:202-227 updateLOD runs up to 6 plane tests against every instance record with no hierarchy, grid or BVH, so its cost is linear in instance count regardless of how many survive; measured at 957 us per call with 10k instances and 11659 us with 50k whenever viewChanged is true, which is every frame of camera motion, and it is called twice per vegetation mesh record (branch and leaf) from Vegetation.js:703-704.
  body: |-
    TIER-0 parent: cpu-skip-and-replay-plan-browser. CPU-side, client per-frame, main thread.

    NOT A CACHE-KEY ROW -- READ THIS FIRST
    This is deliberately filed as a spatial-index / budgeted-slicing row, not a capture-and-replay row, and the distinction is the finding. The existing guard at client/core/WebGPULodInstancer.js:205 `if (!moved && !viewChanged) return` WORKS: measured 0.1 microseconds when it fires. But it cannot fire during play, because viewChanged comes from client/core/Vegetation.js:692 -- viewChanged = !_cullMat.equals(_lastCullMat) over proj x matrixWorldInverse -- which is true on essentially every frame of any camera motion or rotation. And when the camera rotates the frustum planes genuinely change and the cull results genuinely change, so the full sweep is legitimately required. There is no stable structure here whose output is a pure function of a slowly-changing key, so a capture key would be either always-miss or wrong. The cost is STRUCTURAL (no spatial index), not a bug someone introduced.

    WHAT RECOMPUTES, PER FRAME
    client/core/WebGPULodInstancer.js:202-227 updateLOD, reached from client/core/Vegetation.js:703-704 as rec.branch.updateLOD(...) and rec.leaf.updateLOD(...) inside updateVisibility -- TWO calls per vegetation mesh record per frame. When the :205 guard does not fire, the loop walks EVERY record and performs up to 6 plane tests against planeBuf, with no spatial hierarchy, no grid, no BVH; cost is linear in instance count regardless of how many survive.
    Measured this pass against the real module in node (createWebGPULodInstancer, 2 LOD levels, instances on a 3 m grid, 1080p frustum, 200 iterations):
      1000 instances:   256.6 microseconds (viewChanged true)  vs 0.6 us (guard fires)
      10000 instances:   957.1 microseconds                    vs 0.1 us
      50000 instances: 11659.0 microseconds                    vs 0.1 us
    At 10k instances that is roughly 1.9 ms per mesh record per frame (two calls); at 50k, roughly 23 ms.

    STABLE STRUCTURE (the thing worth building)
    A spatial index over instances: cell key -> contiguous instance range. Instance positions and LOD levels are stable between vegetation placement edits and LOD rebuilds.

    CHANGING INPUTS
    Instance positions and LOD levels; the 6 frustum planes (every camera-motion frame).

    THE FIX SHAPE (two admissible forms, pick one and justify)
    (a) Spatial index: bucket instances into cells so only cells intersecting the frustum are tested. Then per-frame work is bounded by the number of candidate instances, not the total.
    (b) Budgeted per-frame slicing over recs: cap the instances swept per frame at a measured budget and round-robin the remainder, so no frame exceeds its budget. This accepts one frame of LOD latency for far instances.
    Either way the bound must be EXPLICIT in the code -- a loop over unbounded input is a defect even when its mean is fine (worst case is what a user experiences).
    Do NOT solve this with a content-hash cache key: that is the wrong mechanism and will either never hit or serve stale LOD.

    OUT OF SCOPE OF THIS ROW (say so explicitly so it is not closed on a claim it cannot prove)
    Whether this is a REGRESSION from 7 percent to 21 percent, per veg-cell-lod-updatelod-regressed-7-to-21pct, is NOT established and is browser-blocked: it needs an A/B of the same loaded vegetation scene at two commits. This row is about the measured structural cost, which holds regardless of when it appeared.

    WORST-CASE BOUND
    With (a), bounded by cells intersecting the frustum -- strictly smaller than the total and worst-case still bounded by the total, so it can never be worse than today. With (b), bounded by the explicit per-frame budget. Failure mode if the index is wrong: an instance is assigned the wrong LOD or is culled when visible -- vegetation popping, which is visible, but NOT plausibly-correct-looking terrain, so it is caught by eye. The sharper risk is a stale index after a placement edit, so the index must be rebuilt on the same epoch the vegetation placement already bumps.

    MEASUREMENT (integer work units, immune to timer inflation -- this box's zero-delta control arm is +/-10% and currently ~2.5x inflated, so microsecond figures must be re-taken with a control arm)
    Deciding counters, per frame: (a) plane tests performed, (b) instance records walked, (c) updateLOD calls, (d) surviving instances. Compare against the brute-force loop for the same camera matrices.
  acceptance_criteria: 'Node witness against the real module at 10k and 50k instances (no GPU needed for the sweep counters) plus a browser witness on a loaded vegetation scene with gpu.accelerated confirmed true. Report per frame (a) plane tests, (b) records walked, (c) updateLOD calls, (d) survivors, with the camera both still and moving. Pass requires (a) and (b) to drop by at least 50 percent at 10k instances with a MOVING camera (the still case is already handled by the existing guard and proves nothing), with a zero-delta control arm in the SAME window. Correctness: for the same camera matrices the surviving instance id set must be IDENTICAL to the brute-force sweep, compared element by element, at both 10k and 50k; and after a vegetation placement edit the index must be rebuilt within one frame (witness a placement change, not just camera motion). Do NOT close this row on the 7-to-21-percent regression claim -- that attribution is unproven and browser-blocked.'
