- id: tsl-ground-lit-normal-relief-gpu-dependent
  title: 'TSL near-ground relief gain is larger than legacy at the same reliefShade: not the formula, test cell size and morph'
  body: 'NVIDIA w10: reliefShade 6 to 1 moves legacy terrain by -0.04 and TSL by -0.9 (left-lower TSL -1.64, legacy +0.22); at relief 1 terrain mean delta is +0.13 but per-pixel meanAbs stays 3.73. Code comparison (terrain.glsl 781-807,929-934 vs terrain-material-tsl.js 111-175) finds the same lit-normal chain, tap spacing and grid. Node CPU model: mean shift 6-vs-1 changes sign with tap cell size (1 m -0.127 ndl, 3 m -0.003, 10 m +0.027, 100 m -0.062); float32 cross-product rounding excluded (<=0.2 level, bias 0.00002); height noise explains per-pixel structure but not mean shift. So the TSL nearest ground must be built from a different effective cell size or morph state. Not fixed.'
  acceptance_criteria: 'log leaf levels and patch sizes within 100 m of the camera on both renderers (legacy __lastGLQuads, TSL patch.offsets): if different, name the selection rule and fix with predicted terrain relief shift within 0.3 of legacy; if equal, repeat the grey relief A/B with geomorphLod off on both: relief shift equal within 0.3 names morph; per-pixel structure: grey relief 1 with sun shadow disabled on both, terrain meanAbs from 3.7 to <=1.5 names shadow, unchanged names vertex height noise'
  session_id: f73df536-0f66-49a1-8888-2a064d23416a
  status: pending
- id: tsl-amd-left-edge-offset-untouched-by-geomorph
  title: AMD-only TSL left-edge and left-lower terms are one gradient; adapter-dependent candidates and the page-toggle A/B
  body: 'Saved AMD frames: AMD TSL minus NVIDIA TSL is -6..-8 G at x 0-100 decaying smoothly to -1 by x 250 (rows 180-347), legacy AMD equals legacy NVIDIA, so the left-edge -7 and the left-lower -4.8 are the same lower-left near-ground gradient, not a screen-aligned strip: no TSL screen-space term (vignette, FSR, ThreeVdrs residue) is involved, since sky and water match to 0.1. It responds to reliefShade 6->1 by +3.6 on AMD vs +0.15 on legacy and ignores the geomorph snap, so the vertex FD normals are not its only input. Adapter-dependent operations present in the TSL terrain path (terrain-material-tsl.js, surface-splat-tsl.js, ops-tsl.js, height-spec.js): (1) normal-map sampling with explicit textureSampleGrad from dFdx/dFdy(wt) at triplanar scales 4 and 1 (surface-splat-tsl.js:47-68, 112-118) where legacy uses implicit-LOD texture() with hardware anisotropy 8; the resulting texDn (texNrmK 0.4, added AFTER the relief term so its weight rises as reliefShade falls) is the only normal input that depends on texture filtering and LOD selection by vendor; (2) fwidth of vRelP for pxWorld, coarse vs fine derivative choice by backend; (3) pow in the height shaping and ridged fbm (exp2/log2 approximations differ by vendor) shared with legacy; (4) normalize/cross of 6.4e4-magnitude tap positions (excluded by an f32 model: <=0.2 level, bias 0); (5) fma contraction in ox + i*size and d*(R+h) (excluded for the snap by the integer index rewrite); (6) rgba8unorm-srgb mip generation of the albedo and normal arrays by three''s WebGPU blit passes vs gl.generateMipmap. Not proven.'
  acceptance_criteria: 'Page toggles, no code: both renderers read window.__texNrmK and window.__flatNormal (TSL hooks added, default no-op), plus __reliefShade, __geomorphLod, __albedoOverride, __hazeMul, __hostShadowOff. A/B1 __texNrmK=0 on both under grey: if the AMD left-lower grey delta (-4.8) and its relief response (+3.6) fall to within +-1.5 and +-0.5 the normal-map sampling is the AMD term. A/B2 __flatNormal=1 on both under grey: if A1 did not close it and this does, the vertex FD normal chain is. A/B3 both: any residual is lighting or shadow (then __hostShadowOff). Corrected path: AMD left-edge and left-lower ratio <= 3 and within +-1.5 of legacy.'
  session_id: f73df536-0f66-49a1-8888-2a064d23416a
  status: pending
