  body: The AMD triplet boots logged a pointer-lock rejection warning on every renderer when the page called requestPointerLock without a user gesture. The rejection should be handled at the call site (await with catch that records a named non-locked state), and the call should only happen on a user gesture. Not seen on the 2026-10-05 v2 look-checks, which stubbed requestPointerLock, so the stub masks it; reproduce without the stub.
