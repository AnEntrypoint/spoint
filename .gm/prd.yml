- id: cpu-plan-mapspinner-quad-replay-gate-tolerance
  title: Split the mapspinner frame cache into a pre-cull leaf capture plus a live frustum cull, and derive its position tolerance instead of pinning 1 m
  subject: 'The planet-orchestrator frame cache is all-or-nothing: its rotation term fires at ~0.256 degrees so every mouse-look frame misses, and its position term is a flat 1 m floor at deck altitude. The post-cull list genuinely does depend on direction, so the fix is not to loosen the rotation term -- it is to cache the pre-cull quadtree leaf set, which is direction-independent whenever the inside-quadtree cull is inactive (the near-nadir deck look), and keep the cull live.'
  body: |-
    TIER-0 parent: cpu-skip-and-replay-plan-browser. CPU-side, client per-frame.

    CORRECTION TO THIS ROW AS FIRST FILED -- READ THIS BEFORE ACTING
    The row was first filed with the premise "the gate never hits because moveTol collapses to 1.0 m at deck altitude." That premise is WRONG and is kept here only so a future session does not re-derive it. Reading the hit path shows the opposite: at 1.4 m/s and 60 fps a walking player moves 0.023 m per frame, which is well INSIDE the 1.0 m tolerance, so the position term is not the always-miss term for a walker (it does always-miss for flight: 100 m/s is 1.67 m per frame). The always-miss term is the ROTATION test, and it is not gratuitous -- see WHY ROTATION CURRENTLY MATTERS.

    WHAT RECOMPUTES, PER FRAME
    packages/mapspinner/src/planet-orchestrator.js:142 frame(); the 6-face loop at :277-350. TSL twin: packages/mapspinner/src/tsl/planet-tsl.js:154 writeQuads / :215 quadsFor.
    Per frame: qt.computeSplitDist (:194), hpf.sampleDir (:201-204), qt.setConfig (:210), render.cullMatrix (:254), extractFrustumPlanes (:262), then 6x (worldToFaceLocal -> qt.updateQuadtree :287 -> limb dot :298-312 -> quadOutsideFrustum :308/:313 -> pooled quad-object writes :344-348).
    Measured this pass in node against the real quadtree.js + planet-orchestrator-cull.js + three, R=63600, fov 70 degrees, 1080p, splitFactor 0.28:
      ground altitude: 556 leaves, 741 quadtree node visits, 556 quadOutsideFrustum calls, 7755 Math.tan, 4428 Math.sqrt, 562 Math.hypot (1 face kept by limb cull)
      with a looser limb test across 6 faces: 3336 leaves, 4446 node visits, 46515 tan, 26513 sqrt, 3342 hypot
      at 50 km: 112 leaves, 1539 tan
    quadOutsideFrustum alone is 6 Math.tan + 9 Math.hypot per quad (planet-orchestrator-cull.js:38-39,50).

    THE EXISTING GATE, EXACTLY
    :147 moveTol = min(250, max(1, (camDist - R) * 5e-5)) -- 1.0 m at deck altitude, 2.5 m at 50 km, 250 m cap at 5000 km.
    :150-153 moved = no cache || position delta > moveTol || (fwd . c.fwd) < c.fwdLen2 * 0.99999 || displayMode changed.
    The rotation clause is a half-angle test: with equal fwd lengths, cos(theta) < 0.99999 means theta > 0.256 degrees. Any mouse-look frame exceeds it.
    :154-166 is the hit path. It builds cam2 at :155 from THIS frame's inputs and calls render.render(c.quads, cam2, ...) at :156 -- so a hit is NOT a frozen render: the camera pose still updates and only the leaf list is reused. It also already publishes window.__cullStats.frame = 'cached' at :163 versus 'rebuild' at :361, so the hit rate is ALREADY observable in shipped code. That is the deciding counter; do not build a new one.

    WHY ROTATION CURRENTLY MATTERS (do not simply loosen it)
    The leaf-level frustum cull at :313 -- quadOutsideFrustum(face, ox, oy, l, R, vpr, camWorldPos) -- runs whenever cullActive && vpr. vpr = _cm.viewProjNoEye (:254-255) is non-null whenever cullActive, INDEPENDENTLY of hcOn. hcOn (:260) gates only extractFrustumPlanes into cullCtx (:262), and cullCtx is what is passed INTO qt.updateQuadtree (:289) as the inside-quadtree cull. So at the deck the emitted post-cull list is genuinely direction-dependent, and caching it across rotation would be wrong. The limb-cull path at :298-312 calls the same function (:308) whenever vpr is non-null.

    THE ACTUAL WIN: TWO-LAYER CAPTURE
    Layer A = the pre-cull leaf array returned by qt.updateQuadtree (:287). It is direction-dependent ONLY through cullCtx. When hcOn is false -- the near-nadir look, which is the deck case -- cullCtx is null and layer A is a pure function of (lodLocalCam, localCam, aimLocal, camDist - R, quadtree config). Cache that.
    Layer B = the limb test, leaf cull and pooled write (:298-348). It stays live; it is the part that legitimately depends on the current view.
    Capture A across rotation only when the recorded frame had cullCtx null; if the recorded frame had a cullCtx, A is direction-dependent and rotation must still invalidate it.

    POSITION TOLERANCE: DERIVE IT, DO NOT GUESS
    1 m is arbitrary in both directions -- too tight for flight, and unjustified even for walking. The correct tolerance is the distance the camera can move before any leaf's split decision changes, which is a function of splitDist, distFactor and the leaf level already computed at :194-199. Derive it from those and clamp it to a bounded maximum. A tolerance that grows without bound is a correctness hole; a tolerance derived from the LOD threshold is correct by construction.

    INVALIDATION KEY
    key = H(CODE) || STRUCT_EPOCH || CULLCTX_STATE || Q(inputs)
    - CODE = a hash of the UTF-8 bytes of the source files that implement the transform itself (quadtree.js, planet-orchestrator-cull.js, terrain-defaults.js, planet-orchestrator.js and their TSL twins), computed at boot. NOT a hand-bumped constant -- a key over inputs only is exactly the burned class (deviation.build-cache-no-code-version-key), where a build-artifact cache keyed on its input hash served stale output forever after the transform code changed. Hashing the producing source means any edit auto-invalidates with no human remembering to bump anything.
    - STRUCT_EPOCH = int bumped by setConfig / resize / material hot-swap / growCapacity.
    - CULLCTX_STATE = whether the captured frame had a live cullCtx; only a null-cullCtx capture is reusable across rotation.
    - Q(inputs) = position quantized to 1 mm, forward dot to 1e-5, plus exact fovy, w, h, displayMode.
    The new gate must be a SUPERSET of today's accept condition: anything that hits under the new key must also have hit under the old one. That makes the change monotone-safe, and it is checkable -- run both gates for the whole route and assert new-hit implies old-hit.

    RESOLVED: THE _pipelineQuads CONTROL FLOW (this row was filed with it open)
    _pipelineQuads is the PREVIOUS frame's array, assigned at :357. :274 renders that previous list with THIS frame's camera, then :277-350 rebuilds, and :353 renders the fresh list only on the first frame, when _pipelineQuads was still null. So the render is deliberately one frame behind the build. Implication for this row: the hit path returns at :164 before reaching :274, and renders the cached list with the current camera -- the same one-frame-behind content, so the existing behaviour is preserved. Not a bug; no separate row needed.

    DOWNSTREAM
    packages/mapspinner/src/gl-render.js:1382 _sortLeavesFrontToBack (called at :1498) is gated by `(quads !== _instQuadsRef) || (_thc !== _lastThc)`, and because the quad producer hands it a NEW array every frame that gate is always true too. Key it on the leaf producer's STRUCT_EPOCH rather than array identity, and when layer A hits the sort skip is free. Implement as one artifact.

    WORST-CASE BOUND
    Bounded: leaves <= patch capacity (hard grow at planet-tsl.js:185), node visits <= 4^depth clamped by maxLevel. Miss path is today's code, unmodified. Failure mode if the key is wrong: frozen terrain LOD or terrain popping at the frustum edge -- immediately visible and not plausibly correct, so it fails loud rather than silently.

    MEASUREMENT (integer work units, immune to timer inflation -- this box's zero-delta control arm is +/-10% and currently ~2.5x inflated, so ms figures must be re-taken with a control arm)
    Deciding counters, per frame: (a) window.__cullStats.frame == 'cached' vs 'rebuild' -- already shipped, use it; (b) quadtree node visits; (c) Math.tan calls; (d) quadOutsideFrustum calls; (e) leaves emitted.
  acceptance_criteria: 'Browser witness of the live page (the cache path is client-only and the hit indicator already ships) plus a node measurement against the real quadtree.js for the counters: report per frame (a) cached vs rebuild counts from window.__cullStats.frame, (b) quadtree node visits, (c) Math.tan calls, (d) quadOutsideFrustum calls, (e) leaves, over a scripted 120 s deck-altitude route that mixes still, walking, running and mouse-look frames, and a second route at 50 km. Pass requires the cached share of frames to rise by at least 40 percentage points over today''s gate on the same route AND (b) and (c) to drop by at least 50 percent summed over the route, measured with a zero-delta control arm in the SAME window (this box''s noise floor is +/-10% and is currently ~2.5x inflated, so a delta under that is unmeasurable-as-proposed). Correctness: with both gates instrumented, assert new-hit implies old-hit for every frame of the route (the superset property); the emitted post-cull leaf array must be element-for-element identical to the always-recompute build for the same camera poses; and a deliberate setConfig / resize must force a miss on the very next frame.'
  session_id: f73df536-0f66-49a1-8888-2a064d23416a
  status: pending
- id: cpu-plan-cluster-lod-mesh-cross-frame-capture
  title: 'Give ClusterLodMesh a cross-frame skip: it has no capture at all, so every frame rebuilds LOD decisions and re-uploads instance groups even when nothing changed'
  subject: packages/streaming-gltf/src/cluster-lod-mesh.js:105 rebuilds LOD decisions and re-uploads instance groups on every frame with no cross-frame skip, unlike its neighbours which at least have a keyed gate; the unchanging inputs are the mesh set and the LOD thresholds, and the only changing input is the viewer position, so a position-quantized key makes most frames a replay.
  body: |-
    TIER-0 parent: cpu-skip-and-replay-plan-browser. CPU-side, client per-frame. PARTIALLY BLOCKED on a GPU witness -- see MEASUREMENT.

    WHAT RECOMPUTES
    packages/streaming-gltf/src/cluster-lod-mesh.js:105. Per frame: LOD decision per cluster/mesh, instance-group assembly, and a group upload. There is no cross-frame skip at all -- this is a missing capture, not a mis-tuned one (contrast cpu-plan-mapspinner-quad-replay-gate-tolerance, where a gate exists but its tolerance collapses).

    STABLE STRUCTURE (the captured graph)
    The per-cluster LOD decision and the assembled instance groups. Fixed while the mesh set, the cluster set and the LOD thresholds are fixed.

    CHANGING INPUTS
    Viewer position; mesh/cluster set membership; LOD thresholds and distances; the streaming load state (a cluster whose mesh is not yet resident cannot be treated as decided).

    INVALIDATION KEY
    key = H(CODE) || MESHSET_EPOCH || LOD_CONFIG_EPOCH || LOAD_EPOCH || Q(viewerPos)
    - CODE = a hash of the UTF-8 bytes of cluster-lod-mesh.js, computed at boot. A key over inputs only is the burned class (deviation.build-cache-no-code-version-key). Hashing the producing source makes any edit auto-invalidate.
    - MESHSET_EPOCH bumps when a cluster or mesh is added or removed.
    - LOD_CONFIG_EPOCH bumps when thresholds or distances change.
    - LOAD_EPOCH is mandatory and easy to miss: a cluster whose mesh finishes streaming mid-frame has a different correct LOD decision than before it finished, so residency must be in the key or the capture serves a pre-load decision forever.
    - Q(viewerPos) quantized to 1 mm so sub-millimetre drift does not force a miss every frame.

    WORST-CASE BOUND
    Skipped path is one key compare plus a replay of the recorded groups. Miss path is today's rebuild. Bounded by cluster count. Failure mode if LOAD_EPOCH is omitted: a cluster stays at a coarse LOD after its fine mesh lands -- visible as a pop that never resolves, which is why the acceptance witness must cross a streaming load boundary, not just hold still.

    MEASUREMENT (partially blocked)
    The CPU half (LOD decisions, group assembly) is measurable in node against the real module with integer counters: (a) LOD decisions computed, (b) groups assembled, (c) group uploads attempted. The upload half needs a real GPU/GL context; do NOT claim a win on the upload cost from a CPU-only measurement -- a substitute context measures the harness, not the driver. Take the CPU counters in node, and take the upload counter under a browser dispatch with `gpu.accelerated` confirmed true.

    CROSS-REFERENCE (single-writer): this file is also the subject of cpu-model-pool-update-and-cluster-lod-prepare-7-8pct, the tier-0 profile census row that measured ClusterLodMesh.prepare at 6.4-8.0 percent inclusive and _selectClusters at 5.4-6.8. THAT row asked for exactly this skip ("apply the same cell/epoch skip logic if selection reruns on unchanged views"); this row is its concrete form. Close them together, and never have two writers in packages/streaming-gltf/src/cluster-lod-mesh.js at once.
