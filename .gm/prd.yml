- acceptance_criteria: The clicking source is identified and stopped, or the harness keeps the witness window unfocused and re-asserts Input.setIgnoreInputEvents plus Emulation.setDeviceMetricsOverride on every dispatch; a lane aborts and re-navigates as soon as any probe reports blockedInput > 0 instead of capturing through it.
  body: 'On the AMD lane (2026-10-05, session f73df536, gpu=amd) the boot probe reported blockedInput 0, but the next dispatch''s settle probe returned blockedInput 22: twelve logged events, all trusted:true, pointerdown/pointerup/click first on a SPAN then repeatedly on CANVAS. The canvas also changed from [1295,808] to [1445,717], so the device-metrics override had been lost and the viewport resized between dispatches. I re-navigated and captured against a clean document; the cost was one extra 125 s boot. NVIDIA''s lane saw none of this, so it is not a property of the renderer — it is something reaching the focused witness window while the lane is between dispatches.'
  id: tsl-parity-amd-window-input-contamination
  title: Trusted input reaches the focused witness window between dispatches and resizes the canvas
  session_id: f73df536-0f66-49a1-8888-2a064d23416a
  status: pending
  blockedBy:
  - external
  deferReason: 'Two of the three clauses landed at 92c5bb5a4e, the third cannot be closed without a live cdp session. Landed: bodies.mjs defines guardLines() = Input.setIgnoreInputEvents {ignore:true} plus Emulation.setDeviceMetricsOverride {1036,647,dsf 1.25} and prepends it to bootBody (before navigate and after), settleBody (which previously carried neither), captureBody and leftEdgeBody, so the viewport cannot stay resized across a dispatch boundary -- verified in the generated .cdp.txt for every body. Landed: grab.mjs prints `ABORT: blockedInput=<n> in <name> -- re-navigate and re-boot, do not capture through contaminated input` the moment a saved artifact reports blocked>0, analyze.mjs prints `INPUT CONTAMINATED: first blockedInput=23 at legacy-capture/skyPose` naming the arm and probe and records inputGuard {blocked, firstBlocked, canvasSizes, probes}, and manifest.abortPolicy states the re-navigate rule; the no-input gate already failed the pair before this session. Not landed, and not landable CPU-side: nothing keeps the witness window unfocused and nothing has identified what clicked it. Emulation.setFocusEmulationDisabled does not exist in ~/.gm-tools/agentplug-runner.exe -- only Emulation.setFocusEmulationEnabled, Emulation.setDeviceMetricsOverride and Emulation.setTouchEmulationEnabled -- and setFocusEmulationEnabled {enabled:false} only restores normal focus, it does not force blur. Identifying the source needs the live window. Filed as tsl-parity-witness-window-cannot-be-forced-unfocused. Resolution path: one session with the discrete GPU reserved, which boots a witness session with the re-asserted guards in place, clicks the desktop during a deliberate gap between two dispatches, and reads blockedInput off both probes; if it is 0 the re-assert alone is the fix and this row closes on that witness, otherwise the focus mechanism has to be built first.'
- acceptance_criteria: AMD lanes are booked at >= 15 min of lock time with no re-navigation contingency, and the boot body's settle budget is raised past AMD's measured settle time so AMD settles inside one boot dispatch.
  body: 'Measured AMD body times (2026-10-05, gpu=amd, rdna-2): tsl-boot 125 s and it still returned settle:false at its 115 s cap with veg 158, needing a separate 10 s settle dispatch to reach veg 227; tsl-capture 166 s. NVIDIA was 55.7 s and ~65 s. So AMD is ~2.4x on boot and ~2.5x on capture: the mandatory four need ~582 s of dispatch time alone (125+166+125+166), plus overhead. The 17-minute AMD window fit only the TSL half because one contamination re-navigation cost a further 125 s. Raising the in-boot settle loop from 115 s to ~240 s would let AMD settle in one dispatch and save ~2 min per renderer, which is what makes a 15-minute booking viable.'
  id: tsl-parity-amd-body-timings-measured
  title: 'AMD body timings measured: boot 125 s and still unsettled, capture 166 s — an AMD pair needs ~10 min of dispatch time'
  session_id: f73df536-0f66-49a1-8888-2a064d23416a
  status: pending
