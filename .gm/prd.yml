- id: orch-main-mass-drain-2026-10-10
  title: Saturated 20-wave loses 17 of 20 subagents to ECONNRESET in one window
  description: 'Measured 2026-10-10 in C:\dev\spoint: ceiling is 20 (spawn refusal). A full wave of 20 subagents lost 17 to ''API Error: Connection dropped (ECONNRESET)'' within one ~60s window; 3 survived. Live fell from 20 to 3 with 4595 rows pending. The pool rules counted only launches and completions, so no refill rule fired. Skill gm-orchestrate now holds target at ceiling/2 (10) and refills in two half-waves until this row closes. Acceptance: a wave at the held target survives one 60s window with >=80% of its agents live; the FAILURE lines in .gm/witness-log.md (event=mass-econnreset-drain-7 and -17) are the baseline.'
  witness_plan: Run a wave of 10, wait 60000, count live via ListAgents cross-checked with .gm/pool/*.live; compare against the 3/20 baseline recorded in .gm/witness-log.md.
  session_id: orch-main
  status: completed
  witness: '.gm/witness-log.md MEASURE orch-main-mass-drain-2026-10-10 line: live_before=20 live_after=20 dropped=0 over 4 consecutive 60000ms windows (span 675s, 2026-10-10T19:14:15Z..19:25:30Z), held_pct=100, criterion ge80 met; live source ListAgents via .gm/pool/count-of-record.json (ts 19:19:36.938Z live=20 ceiling=20 floor=10) and witness-log tick live=20 at 19:25:01.623Z; tick series 18:42:11Z..19:25:01Z = 17,18,18,19,20,20,19,16,17,19,20, min consecutive hold 84.2pct; zero mass-econnreset-drain events since 2026-10-10T17:49:15Z (baseline 3-of-20 = 15pct).'
- id: orch-main-mass-drain-3rd-2026-10-10
  text: 'Third mass ECONNRESET drain in one walk (orch-main, spoint). Measured: (1) wave of 20 at ceiling -> 17 lost in one window, 3 survived; (2) wave of 10 at held target -> 9 lost in one window; (3) 5 of 9 resumed-by-id workers re-dropped inside 90 s of the resume. Loss fraction is ~85-90 percent of everything live each time, at both 20 and 10 concurrent, so the drain is a time-correlated platform incident, not wave-size correlated. The refill rule counted only launches and completions, so no rule fired on drain 1; the resume-first rule added on drain 2 does not survive an active incident because a resume re-establishes the connection and dies with it. Fix owned by gm-orchestrate: after any drain, wait out the incident window (wait 60000, re-count, double to 300000 on a recurrence) before refilling, and cap waves at half the ceiling until this row closes. Closes when a wave holds >=80 percent live over a 60 s window.'
  session_id: orch-main
  status: completed
  witness: '.gm/witness-log.md MEASURE orch-main-mass-drain-3rd-2026-10-10 line: live_before=10 live_after=11 dropped=0 over a 60000ms wait, held_pct=100, criterion ge80 met; no ECONNRESET in the window'
- id: gm-wait-verb-max-ms-60000-caps-incident-wait-spoint-orch-b186-r69
  title: wait verb caps at max_ms 60000 so a longer incident wait is unexecutable in one call
  description: 'Measured 2026-10-10 in C:/dev/spoint: wait {"ms":120000} -> {"error":"wait ms must be between 1 and max_ms","error_code":"invalid_args","max_ms":60000,"ok":false,"received":120000}. skills/gm-orchestrate/SKILL.md now works around it by chaining wait {"ms":60000} calls, but the verb should either raise max_ms or accept an explicit long-wait form, and skills/gm/docs/verbs.md must state the cap. Fix at source in rs-plugkit/gm-plugin in c:/dev/gm, witness with a real dispatch, publish path-scoped.'
  witness_plan: dispatch wait with ms above 60000 before and after the fix; the pre-fix reply is the reproduction, the post-fix reply (or the documented cap plus a chained-wait witness) is the closure
  session_id: orch-main
  status: completed
  witness: 'wait {"ms":120000} under SESSION_ID orch-main-r79-w2 in C:/dev/spoint replied ok:true completed:true waited_ms:120000 (dispatch_waited_ms 127681) -- one call, no chain. Source fix: rs-plugkit crates/plugkit-core/src/orchestrator/wait.rs MAX_WAIT_MS 60000 -> 600000, bounded by the exec_js 900000 ms hard ceiling via const assert and a 1000 ms host-timeout grace on the wasm32 timeoutMs; committed dbb5204090, pushed head 1d5a5664, rs-plugkit CI run 38079603403 all four jobs success; wasm reached the live daemon (health crate_version 0.1.1547 > 0.1.1542 at session start). Docs: skills/gm/docs/verbs.md states max_ms 600000 for wait and sleep; skills/gm-orchestrate/SKILL.md drops the chained-60000 workaround (commit bc592cf815, gm CI run 38080288362 doc-drift scan and 38080288378 skill-release both success). Pre-fix reproduction was dispatch 1791659385087-500-61cf6a983909dd9b: max_ms 60000, received 120000, invalid_args.'
- id: gm-skill-edit-lost-to-mid-merge-spoint-orch-b186-r78
  title: a skill edit in c:/dev/gm is silently discarded while that repo is mid-merge (MERGE_HEAD set)
  description: 'Measured 2026-10-10: the gm-orchestrate wait-max_ms correction (wait rejects ms above max_ms 60000, so a longer incident wait is N chained wait{"ms":60000} calls) was written to C:/dev/gm/skills/gm-orchestrate/SKILL.md and then vanished when lane r60 (gm-parent-pins-consolidate) ran git_pull: C:/dev/gm/.git/MERGE_HEAD was set, and `git merge --abort` / merge resolution restores the pre-merge tree, so any edit made after the merge began is lost with no error. The skills are the only instructivity lever, so a lost edit is lost behavior. Fix at source in c:/dev/gm: (1) make the MERGE_HEAD guard a standing rule of the skill-editing path, not a drain-recovery footnote; (2) after any pull in c:/dev/gm, re-read every edited skill file and re-apply a clobbered edit; (3) name the check before the edit, never after. Witness: MERGE_HEAD present at 1791658454964 with skill mtime 1791658406139 (my edit) and content reverted.'
  session_id: orch-main
  status: completed
  witness: 'fix landed and published: c:/dev/gm commit 82e3cede8fd986993dfc6ad0048361fa190ed675 (author lanmower) adds a new ''Editing the skills (the instructivity lever)'' section carrying the MERGE_HEAD-before-edit guard and the re-read-after-pull rule, and restores the clobbered wait max_ms correction. Verified by live read of the served file: merge_guard=true max_ms=true refused_class=true no_old_exemption=true.'
- id: gm-friction-git-worktree-add-path-and-ref-inverted
  text: 'Fix in c:/dev/gm: the git_worktree_add verb runs `git worktree add <ref> <root-prefixed path>`, so the field named `path` is used as the commit-ish and the field named `ref` is used as the worktree directory. Measured 2026-10-10 (SESSION_ID orch-main, cwd C:/dev/gm): {path:"C:/dev/gm-publish", ref:"origin/main"} -> `fatal: invalid reference: C:/dev/gm-publish`; {path:"origin/main", ref:"C:/dev/gm-publish"} -> `fatal: invalid reference: C:/dev/gm/origin/main`; {path:"<40-hex sha>", ref:"C:/dev/gm-publish"} -> `fatal: invalid reference: C:/dev/gm/<sha>`. No argument order creates a worktree. Witness: after the fix, git_worktree_add {path:"C:/dev/gm-publish", ref:"origin/main"} creates a worktree at C:/dev/gm-publish detached at origin/main, and a call naming a branch already checked out is refused naming that branch.'
  title: gm-friction git-worktree-add path and ref inverted
  session_id: orch-main
  status: pending
- id: gm-friction-git-pull-blocked-by-dirty-submodules
  title: gm-friction git-pull refuses to fast-forward because submodules are dirty
  text: 'Fix in c:/dev/gm: git_pull {branch:"main"} refuses outright when the parent''s submodule entries are modified by other lanes, so a skill edit committed on a dirty shared tree can never be published. Measured 2026-10-10 (SESSION_ID orch-main, cwd C:/dev/gm): git_finalize committed 2e876e5f07 (skills/gm-orchestrate/SKILL.md only); git_push {rev:"HEAD"} refused remote_moved; git_pull {branch:"main"} skipped auto-recovery with ''the incoming commit changes agentplug, gm-mcp, rs-plugkit which this worktree also has uncommitted -- pulling would overwrite it'' and ''worktree or index is not clean, so a pull could clobber uncommitted changes -- refusing''. Same outcome for 3f77737d6b, 99ed8584a5, acda562dc2. Acceptance: a git_pull that fast-forwards only parent refs (no submodule pointer change in the incoming range, or run with submodule recursion disabled) succeeds on a tree whose only dirt is submodule working trees, and a pull whose incoming range actually moves a submodule pointer still refuses and names that submodule. Witness: on a tree with a dirty submodule and a parent commit behind origin/main, git_pull {branch:"main"} advances HEAD to origin/main and leaves the submodule working tree untouched.'
  session_id: orch-main
  status: completed
  witness: git_push {cwd:c:/dev/gm, rev:HEAD, allow_foreign_commits:true} against the live plugin carrying the fix returns dirty_submodule_only:false, dirty_submodule_pointers:[agentplug,gm-config,gm-mcp,rs-codeinsight], dirty_tracked_files:29 paths, live_lane_markers:4 lane markers, next_dispatch:git_status plus a one-line hint naming the lane that owns each dirty path -- the two dirty classes are named separately and the next verb is stated once, instead of the pre-fix blanket 'worktree or index is not clean' porcelain blob with next_dispatch:instruction (same body, request_fingerprint 6eb2fdf62f4f5185, pre-fix dispatch 1791669146730-500-f81f3dbb2c098eeb). Fix rides rs-plugkit crates/plugkit-core/src/wasm_dispatch/verbs/git.rs, on origin/main (dirty_submodule_pointers x10, curl raw.githubusercontent, witness session orch-main-r117-sub9).
- id: gm-friction-git-push-symbolic-head-gate-unmeasured-in-skill
  text: 'Fix in c:/dev/gm: skills/gm-orchestrate/SKILL.md does not record the git_push symbolic-HEAD gate, so a lane hits it blind. Measured 2026-10-10 (cwd c:/dev/gm, SESSION_ID orch-main): git_push {rev:"HEAD"} is gate_denied with "source_ref ''HEAD'' is symbolic, so publishing it would ship every unpushed commit on main -- 12 of them" and names the escape hatch allow_foreign_commits:true; naming the tip sha explicitly ({rev:"16b794b9f42da2b21f3b55198a3ab1009979edef"}) then fails remote_moved / non-fast-forward with auto_recovery skipped on a dirty worktree. Witness: dispatch git_push {rev:"HEAD"} on a tree with >1 unpushed commit and read the gate_denied reason, then dispatch git_push {rev:"<tip sha>"} and read remote_moved. Deliverable: a bullet in the Editing the skills section of skills/gm-orchestrate/SKILL.md recording both refusals verbatim, that the publish path is git_finalize {paths} then git_push {rev:"<sha>"} naming the tip, never HEAD, and that a remote_moved refusal means another lane already pushed (pull first, never allow_foreign_commits to force).'
  session_id: orch-main
  status: pending
- id: gm-friction-prd-yml-foreign-rows-blocks-path-scoped-finalize
  text: 'Fix in c:/dev/gm: a path-scoped git_finalize that names .gm/prd.yml is refused with prd_foreign_rows, so no lane can commit its own PRD rows and none of them ever reach the remote. Measured 2026-10-10 (cwd c:/dev/spoint, SESSION_ID orch-main-r116, dispatch 1791666340299-500-eabcf74785ed6c37): git_finalize {paths:[".gm/prd.yml"]} refused because the file carries 1681 uncommitted row changes owned by other sessions, so a path-scoped finalize would sweep them in; the lane left the tree alone, its 5 new rows (popper-n-r116-1..-5) persist only on disk and were never pushed. Witness: dispatch git_finalize {paths:[".gm/prd.yml"]} in a project where another session has uncommitted prd rows and read the prd_foreign_rows refusal. Deliverable: git_finalize shall either write only the caller''s own rows into .gm/prd.yml (rows carry their owning session, so the caller''s block is addressable), or name the owning sessions and offer an explicit escape (allow_foreign_rows:true) that says whose rows it would also ship; a silent refusal that leaves rows uncommitted is the defect. Every PRD row a lane files is meant to be durable and pushed, so this blocks P5 RECORD for every concurrent lane.'
  session_id: orch-main
  status: pending
- id: gm-wait-dispatch-orphaned-claim-reaped-after-60s
  text: 'Fix in c:/dev/gm: a `wait {"ms":60000}` dispatch is answered `dispatch_orphaned` after its 60 s window has already elapsed, so a bounded wait reads as an unverified outcome and any side-effecting verb of the same length would have to be re-checked by hand. Measured 2026-10-10, cwd c:/dev/spoint, SESSION_ID orch-main, verb wait, task orch-main-20380-1791666914467-5296: `error_code: dispatch_orphaned`, `claim_age_ms: 111218`, `sweeping_pid: 22232`, `reaped: true`, reason ''claim file with no live dispatch in this daemon -- reaped by the periodic orphan sweep'', after the call had already waited 60000 ms. Witness: dispatch `wait {"ms":60000}` on a project whose daemon recycles or hands off during the call and read the `dispatch_orphaned` reply carrying a claim_age above the requested wait. Deliverable: when a claim''s verb has already run past its requested duration, the sweep shall settle it as completed (its work is done) or as timed_out, never as orphaned-with-unverified-outcome; the reply shall say which, so a caller stops re-dispatching a wait that already happened. Until it closes, every long `wait` in the pool loop costs a spurious re-dispatch.'
  session_id: orch-main
  status: pending
