- id: perf-framemetrics-session-instrument-lies
  title: window.__perf.exportSession reports duration = samples / 60 and its frame times include rAF dispatch latency, so the app's own adaptive DPR/VDRS reads a value about 2x the real frame interval
  body: 'client/core/FrameMetrics.js: exportSession() computes duration as s.length / 60 (a hardcoded 60 fps assumption; 166.7 s reported for a 120 s run) and caps samples at 10000. client/app.js:2576 feeds _perf.sample(performance.now() - now) where now is the rAF timestamp argument, so the sample is dispatch latency plus JS work, p50 13.45-14.7 ms against a true rAF interval of 6.95-13.84 ms on the same run. _perf.lastMs drives _adaptDpr, _adaptTerrainVdrs and _adaptThreeVdrs and occlusionQueryBudget.reportFrameTime, so the adaptive resolution and query budget react to an inflated number. Measured on D-metric-v2 and W-walk120 (see recall project/perf-frame-time-instruments-disagree).'
  acceptance_criteria: The adaptive-quality inputs use the JS work time measured from callback entry (performance.now() at the top of animate, not the rAF timestamp) or the true inter-frame interval, whichever the controllers were tuned for, with the choice stated; exportSession duration is derived from summed frame time and not from sample count; a same-bundle A/B on the walk arm shows the DPR/VDRS decisions and p50/p95/p99 before and after, with reachability PASS.
  session_id: f73df536-0f66-49a1-8888-2a064d23416a
  status: pending
- id: chart-reanchor-collider-lattice-vs-client-ground-prediction
  title: 'Sustained 1.5-2.9 cm vertical corrections after some chart epochs: the freshly prepared heightfield collider ripples against the client''s exact-function ground model'
  body: 'Found by scripts/chart-reanchor-wire-harness.mjs on the final code: a 15-epoch chain on the reliefScale 0.0005 planet showed 0 corrections per epoch for epochs 2-12 and then 31 and 29 corrections within 1 s of epochs 14 and 15 (448 total, vertical error p50 1.5 cm, p95 2.3 cm, speed 7 m/s) in one run, while a repeat run of the same chain had 8 total and a service-off control walking 85 s had 7. tps-game chain (relief 0.01) showed 2-6 corrections per epoch from epoch 6. Server ground normals after an epoch alternate between triangle patches (n_z -0.056, -0.0025, -0.0716) where the pre-epoch collider was a single patch, so the new lattice phase (already measured up to 17 mm vs the exact function) exceeds RECONCILE_POS_EPS_M 0.015. Not a wire defect: wire, replay and mirror re-expression measured clean. Root cause lives in the terrain lattice (sample phase is anchored to the chart origin, so every epoch shifts it); do not tune the threshold.'
  acceptance_criteria: scripts/chart-reanchor-wire-harness.mjs --scenario=chain on the relief 0.0005 world and --world=tps --epochs=6 each report <= 1 correction within 3 s of every epoch over 5 consecutive runs, via either a world-fixed lattice phase for heightfield samples or per-region collider-offset calibration in PredictionEngine; service-off control unchanged.
  session_id: f73df536-0f66-49a1-8888-2a064d23416a
  status: pending
- id: chart-reanchor-browser-client-callbacks
  title: Browser client must consume onChartReanchoring / onChartReanchor / onChartResync
  body: 'The headless wire consumer (src/client/ChartEpochSync.js) is done; client/app.js passes none of the new BaseClient callbacks. Needed in the browser: in onChartReanchoring swap the terrain frame and call setPredictionGroundSurface with the new chart''s height function BEFORE the replay samples it; in onChartReanchor re-express camera/input yaw and pitch with transfer.look and rebase the floating origin from transfer.point; onChartResync must reposition the camera loudly. Also verify BrowserServer (singleplayer worker) and WireweaveJoinClient deliver CHART_REANCHOR (reliable, non-snapshot) in order with COLLISION_TILE and do not coalesce it away, and that dist/client/app.js carries the new modules. Complements chart-reanchor-browser-holders (placement caches, GPU patch fn, minimap).'
  acceptance_criteria: 'Browser walk across >= 3 epochs with chartReanchor enabled: PredictionEngine.stats.corrections unchanged across each epoch, camera and render position continuous (per-frame world step p95 within the no-epoch control), onChartResync never fires, numbers quoted; built bundle witnessed, not only source.'
