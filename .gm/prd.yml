- id: baseline-stabilization-wait-flake
  subject: 'packages/mapspinner/planet.html __diag.baseline() intermittently fails seam/haze at lowalt/closeup, reproducing at BOTH scale 0.001 and scale 1 (not a scale-dependent issue, discovered while resolving planet-default-scale-baseline-quality-fails). 2 of 3 fresh scale-0.001 runs passed cleanly (pass:true); the third showed lowalt/closeup seam strongHSteps in the tens of thousands and haze blueExcess over the 0.12 threshold. A scale-1 comparison run showed the same class of flake at orbit. Likely cause: the per-rung stabilization-wait loop (parkAt) settles on quad COUNT/fallbackCount stability, not on whether the shader/geometry has visually finished morphing, so a screenshot can land mid-settle. Pre: baseline() intermittently fails independent of scale. Post: either the settle heuristic is strengthened (e.g. wait for N consecutive stable frames of a pixel-level metric, not just quad count) or the flake is root-caused to something else and fixed; verify with >=5 consecutive fresh baseline() runs at each scale showing pass:true. route:execution'
