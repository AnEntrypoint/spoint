- id: netcode-krunker-style-flexible
  subject: 'Make the netcode ideal Krunker-style (fast authoritative FPS feel: server-authoritative simulation at a high tick rate, client-side prediction with smooth server reconciliation, entity interpolation with a small adaptive delay, server-side lag compensation/rewind for hit registration, bandwidth-efficient delta snapshots with interest management) while staying FLEXIBLE so any game can be built: pluggable netcode profiles selected per world/app config (authoritative-with-prediction as the default; rollback for fighting-game style; lockstep for RTS/deterministic sims), all through the same ctx/app APIs. The existing lockstep/rollback subsystem (client transports LockstepDesyncTransport/LockstepInputTransport/RollbackInputTransport, src/netcode Lockstep*/Rollback*/DesyncDetector/ConsensusVoter/CheatEjection/MispredictionDetector, replay recorder/player, lockstep-cheat scripts, wireweave transports) is KEPT (user decision) and must be wired, fixed and proven. Known facts: client-side prediction is collision-blind and drifts into held-against geometry until gated by a wedge flag; inputs are sanitised by InputGuard; snapshots use an int32 1 cm position bin format (23->29 bytes); jitter buffer/snapshot slot release window and interact cooldown are tick-indexed (recall netcode slugs).'
  acceptance_criteria: 'measured with a real network conditioner (added latency 0/50/100/150 ms, jitter, 1-5% loss) in real browsers and headless clients: input-to-visual latency, misprediction rate, correction magnitude and visibility, remote entity interpolation error, hit-registration accuracy versus shooter''s view (lag compensation), bandwidth per client, tick stability at the target tick rate; defects found are fixed with before/after numbers; profile switching (authoritative, rollback, lockstep) proven by an e2e harness per mode with two or more real clients (WebRTC where relevant); docs and recall updated; no regression in singleplayer or existing multiplayer'
