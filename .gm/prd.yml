- id: prediction-ignores-player-player-separation-push
  title: Client prediction cannot see other players, so walking into one mispredicts for real
  body: 'Measured while closing the speed-parity row (c8f4e160e7): applyPlayerCollisions (src/netcode/CollisionSystem.js, called from TickHandler.simulateTick) pushes overlapping players apart by overlap/2 per tick on the server, after the physics step. The client''s predictCharacterStep never models other players, so any contact between two players makes the local player''s prediction diverge from the server. In the harness default scenario (mover walking +z into a standing shooter at z=10) that read as 6.000 m/s vs the predicted 7.000, 0.1 m per ack against 0.11667, a 1.667 cm correction on ~59% of acks. This is not a harness artefact: any two players bumping in a real match mispredicts, and the correction is hidden only by the reconciliation offset decay. The 30 Hz and 120 Hz harness runs additionally mispredict heavily on a clear lane (51% and 80%) because the harness client input loop is fixed at 60 Hz; that is a harness limitation to fix separately.'
