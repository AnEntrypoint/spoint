  title: vegProfile vegDrawCalls and visibleInstances are also wrong on the WebGPU path
  subject: vegProfile.vegDrawCalls counts instancers, not draw calls, on the WebGPU path, and visibleInstances reads liveCount
  description: 'The meshInstances instrument bug (fixed at ee2e3baa) was one of three fields vegProfile derives from rec.branch.LODinfo, which WebGPULodInstancer never exposes. Two more are still wrong on the WebGPU path. countDraws() falls through to (im.count || 0) > 0 ? 1 : 0, so a WebGPU LOD instancer drawing three populated tiers reports 1 draw call and vegDrawCalls 73 actually means 72 instancers with instances plus the shared impostor, not 73 draw calls. visibleInstances sums rec.branch.count, which is the instancer liveCount over every instance ever added, so it always equals totalInstances on WebGPU and equals the parent-mesh count on legacy. Any perf row or witness gate reading these two fields on a WebGPU boot is reading a count of instancers, not of draws or visible instances.'
  acceptance_criteria: On a tps-game boot with the adapter asserted on both GPUs, vegProfile.vegDrawCalls equals the number of actually populated and visible LOD tier meshes plus the shared impostor draws, and vegProfile.visibleInstances equals the number of instances surviving frustum and distance culling; both are derived from the instancer tierIds/tierMeshes on the WebGPU path and from LODinfo on the legacy path, and neither regresses updateLOD cost.
  witness_plan: 'Extend the live probe used for ee2e3baa: boot tps-game at at=-15,-12.5 under gpulock on the NVIDIA and AMD arms, assert the renderer string, read the real per-tier mesh counts and the renderer.info.render.calls delta across one frame, and compare against the profile fields before and after.'
