  status: pending
- id: prediction-peer-forward-sim-regresses-corrections-per-ack
  title: PredictionEngine peer forward-sim is deterministic but regresses corrections/ack vs peerSeparation=off and vs HEAD
  body: |-
    Witnessed 2026-10-06 with scripts/netcode-conditioner-harness.mjs --world=arena --hold=forward --precise --duration=20000 --predict=on --cond=<c> (real server + real PhysicsNetworkClient, mock-free). Three arms, same session, same tree otherwise.

    corrections per ack (lower is better):
      cond        HEAD(old heuristic)  change IN(fwd-sim)  control(--peerSeparation=off)
      0/0/0       0.1943 / 0.2049      0.7428 / 0.7232     0.7422
      50/10/2     0.5658 / 0.5695      0.6878 / 0.6822     0.6594
      100/20/3    0.5370               0.5539              0.5441

    mispredict err p95 (cm):
      0/0/0     HEAD 1.563   IN 7.761 / 19.250   control 1.667
      50/10/2   HEAD 2.667   IN 12.185 / 11.632  control 2.667
      100/20/3  HEAD 12.333  IN 15.667           control 12.333

    The change never falls below the control at any condition (deltas +0.0006, +0.0284, +0.0098 for run 1; replicates confirm) and regresses err p95 by 3.3-9.5 cm (up to ~4.7x at 0/0/0). It is also a large regression versus HEAD at 0/0/0 (0.1943 -> 0.7428). The 0.1943 HEAD figure reproduces docs/netcode.md:32's documented 0.189, so HEAD's push is a real win that the forward-sim destroys.

    Per-tick mechanism (prototype hook on _separateFromPeers, --duration=8000, 0/0/0, real server+client):
      HEAD:       fires on 83.3% of fresh ticks, push p50 1.61 cm/tick, p95 1.96 cm, max 9.48 cm; snapshot peer dist p50 0.968 m
      change IN:  fires on 35.2% of fresh ticks, push p50 6.67 cm/tick, p95 6.74 cm, max 12.36 cm; snapshot peer dist p50 1.011 m, sim peer dist p50 0.927 m
    The forward-sim fires less often but shoves ~4.1x harder per tick, which is what drives predicted position away from the server's authoritative path.

    Separately PROVEN GOOD (keep this fact if the row is ever reopened): the resim replay path is exactly deterministic. Driving the real PredictionEngine module 120 ticks with separation active on every tick (separationDistM 0.8, max 0.2083 m/tick), a reconciliation resim with the recorded entry.sep replayed lands on the original predicted frame with drift 0 nm; forcing recompute instead (60 calls) diverges by 12.5 m. So entry.sep replay works and is load-bearing.

    Also established: _step( has no callers outside src/client/PredictionEngine.js (5 hits, all in-file), and applyMovement(state, input, movement, dt, overrides=null) is exported from src/shared/movement.js and matches the call shape used. applyMovement does not integrate position or gravity -- the peer sim's manual position += velocity*dt is the entire integration.

    NOT obtained: the per-tick SERVER separation delta for the pair versus the client predicted sep, which is what row prediction-peer-separation-over-pushes-in-contact-regime asks for. Blocker: the harness reports only run-level aggregates; per-tick server-side contact data needs either an edit to the tracked scripts/netcode-conditioner-harness.mjs (owned by another lane) or a mock-free per-tick driver duplicating it under data/. Only the client-side per-tick half (above) was witnessed.
  acceptance_criteria: Reopen only with a measurement in which corrections per ack with the change applied fall BELOW the --peerSeparation=off control at 0/0/0, 50/10/2 and 100/20/3 (currently 0.7428 vs 0.7422, 0.6878 vs 0.6594, 0.5539 vs 0.5441, i.e. above at all three) AND mispredict err p95 does not regress against the control (currently 7.76 cm vs 1.67 cm at 0/0/0, 12.19 cm vs 2.67 cm at 50/10/2) AND corrections per ack do not regress against HEAD (currently 0.7428 vs 0.1943 at 0/0/0, 0.6878 vs 0.5658 at 50/10/2). Any new attempt must also carry the per-tick server-separation-vs-client-predicted-sep trace that row prediction-peer-separation-over-pushes-in-contact-regime asks for, run on the real server+client path.
