- id: gl-invalid-operation-threejs-drawelements
  subject: '2412 GL INVALID_OPERATION (1282) errors on three.js drawElements during normal play on tps-game. All 40 distinct error records share one stack: WebGLRenderer.render -> renderScene -> renderObjects -> renderObject -> WebGLIndexedBufferRenderer.render -> drawElements, entered from app.js:1269:7795. No mapspinner frame in any stack, and errorTotalCount stayed exactly 2412 when drawElements more than doubled (57,659 -> 124,639) and when the HPF sampling path was toggled, so it is pre-existing and unrelated to the terrain fix. Root-cause which scene objects fail to draw and fix it; an INVALID_OPERATION per-draw can mean objects silently not rendering.'
  acceptance_criteria: errorTotalCount is 0 on a clean tps-game load; the offending object class is named and fixed, or the error is proven to be a benign known-driver false positive with a citation
  session_id: mcp-instruction-13080-1790541036346
  status: completed
  witness: 'Root cause: texture-binding cache desync between mapspinner raw gl.bindTexture/activeTexture (ensureTransmittanceLUT gl-render.js:549, ensureBake :267, background HPF bake) and three''s WebGLState.currentBoundTextures; renderer.resetState() only ran inside renderPlanet, which never ran while the terrain backdrop was still initialising, so three skipped the real bind of the shadow map on unit 0 and sampler2DShadow read a texture with compare mode NONE. Temporary diagnostic in three.module.js (no getError per draw) flagged exactly 2412 bad draws before; after fix 0 bad draws over 48293 draws; diagnostic removed, three.module.js restored byte-identical (650153 bytes). Fix: client/app.js animate() calls renderer.resetState() before frameGraph.run when not WebGPU. Three clean loads read gl.errorTotalCount 0 via gm wrapper (337954, 290564, 452465 drawElements). Not done: mapspinner raw binds themselves remain non-restoring; no recall memo yet.'
