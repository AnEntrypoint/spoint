- id: cluster-handoff-state-transfer-merge-split
  title: Move players between cluster worlds on merge and split with exact chart transfer
  body: Slice 3. clusterAssignment emits handoff {playerId, from, to}, merge {into, from}, drop events. A handoff exports the player's full chart-local state (PlayerManager state, buffered inputs, lag-comp history tail, Jolt character, inventory/app per-player state) re-expressed with createChartTransfer(fromChart, toChart) and re-seats it in the target world; measured 2026-10-05 that createChartTransfer between ANY two charts including antipodal round-trips points to 4e-11 m and vectors to 1e-14 (scratchpad/planet-arch/pT_transfer_far.out), so precision is not the risk; the risks are in-flight inputs, prediction continuity and entity ownership. Merge moves the smaller cluster into the survivor's chart; split starts the new cluster on the SAME chart (no transform) and lets its re-anchor service recentre. The existing RegionWorkerEntry handoff carries only position/rotation/velocity/health and must not be reused as is.
  acceptance_criteria: 'Two real worlds in one Node process (or two workers): a player walks to the stay boundary and is handed off with world position error <= 1e-9 m, velocity exact, no lost input (inputs with seq > handoff ack replayed in the target), 0 prediction corrections beyond the first resync, and the handoff stall in ms is quoted; merge and split repeated 50 times with wobble show exactly the hysteresis count of handoffs; rollback-duel and lockstep-rts 0 desyncs unchanged.'
  session_id: f73df536-0f66-49a1-8888-2a064d23416a
  status: pending
- id: cluster-world-hosting-process-per-cluster
  title: Host one server world per cluster in worker processes, several small worlds per process, empty clusters torn down
  body: 'Slice 2 of planet-wide multiplayer (recall project/planet-wide-multiplayer-architecture-2026-10-05). Generalise src/sharding/RegionRouter + RegionWorkerEntry from a flat 512 m grid to clusters named by src/shared/clusterAssignment.js (run assign at 2-4 Hz in the router, default off behind tcfg.clusters). Measured constraints: the Jolt wasm heap is fixed at 128 MB (about 21 MB per default PhysicsWorld, 6 worlds per module, 10 with joltLimits maxBodies 2048; the next PhysicsWorld.init aborts with ''Aborted(OOM)''), a one-world process is 81-84 MB RSS and about 1.3 s to create, so the host must cap worlds per process from a measured heap budget and refuse the next cluster loudly with a named reason instead of aborting. The router today proxies every client frame as base64 over IPC; a cluster worker should own its client sockets (router redirects), otherwise the router is the bottleneck. First measure createServerDeps plus appLoader per world in one process (apps and ctx per world are unmeasured) to pick worlds-per-process.'
  acceptance_criteria: 'Node harness on the real stack: a router plus 3 worker processes hosting 4 clusters for 16 real PhysicsNetworkClients; per-worker ms/tick p50/p99, RSS per worker, cluster creation latency and teardown (RSS returns after an empty cluster is dropped) are quoted; hosting one world more than the measured cap is refused with a named reason and no wasm abort; single-cluster behaviour byte-identical to today with the flag off.'
  session_id: f73df536-0f66-49a1-8888-2a064d23416a
  status: pending
- id: cpu-shadow-cascade0-static-dynamic-split
  title: 'Cascade 0 still re-renders about 0.85 per frame while walking: split static shadow map from a small dynamic-caster pass'
  body: 'After 2bc33d2b (cascade depth/lateral snapping: re-renders per frame 3.00 -> 1.07 straight walk, 0.04 along the light axis, measured on the real ShadowPipeline function over a 120 s walk at 7 m/s) cascade 0 still re-renders about 0.85 per frame because it keeps exact texel snapping so the local avatar''s shadow does not lag. A static shadow map for static casters (terrain, placed models, vegetation) plus a small dynamic-caster pass (players, projectiles, crates) would remove most of the remaining shadow CPU submission (updateShadow was 17.6/19.5/16.4% of the CPU frame for 0.049 ms of GPU). Not safe without a GPU witness: compositing two shadow maps needs a pixel A/B, a stale-static invalidation witness (editor edit, chart re-anchor epoch, floating-origin rebase, model load) and the remote-caster staleness row.'
  acceptance_criteria: updateShadow inclusive % and shadow renders per frame before/after on 3+ same-bundle arms on both GPUs (baseline nv2/nv3/amd1 PF arms, `node scripts/cpuprofile-callees.mjs <arm>.cpuprofile updateShadow 3`), shadow-region pixel comparison at a tolerance pre-registered as 3x a same-renderer repeat floor, an invalidation witness for every static-content change, and the avatar's shadow not trailing during a 10 s walk.
  session_id: f73df536-0f66-49a1-8888-2a064d23416a
  status: pending
- id: shadow-remote-casters-stale-when-local-still
  title: Shadows refresh only when the local target moves, so remote players' shadows go stale while the local player stands still
  body: 'Found by the CPU shadow agent (predates 2bc33d2b): the shadow pipeline''s refresh keys off movement of the local shadow target, so a standing local player sees remote players'' (and other moving casters'') shadows frozen until the target moves or the sun changes. Fix by including a moved-caster signal (count/hash of casters that moved since the last render, derived from the entity update stream, not a per-frame scene traversal) in the shadow invalidation, bounded by a cadence.'
  acceptance_criteria: 'A witness with the local player standing still and a remote player walking through the shadow region: the remote shadow updates within a stated number of frames; shadow renders per frame stay low when nothing moves (measured via window.__shadowCost); pixel check at a pre-registered tolerance.'
  session_id: f73df536-0f66-49a1-8888-2a064d23416a
  status: pending
- id: cluster-wire-handoff-message-and-client-resync
  title: 'Wire message for a cluster handoff: new world endpoint, session token, chart snapshot, epoch ledger reset'
  body: 'Slice 4. Each cluster world keeps its own chartEpochLedger, so CHART_REANCHOR needs no cluster id; a handoff is a hard resync reusing the existing resync:true path of src/client/ChartEpochSync.js: server sends CLUSTER_HANDOFF {clusterId, endpoint, sessionToken, chart snapshot (chartWireCodec), tick}, the client reconnects to the target worker with the session token (BaseClient already supports RECONNECT_ACK), clears prediction history, collision mirror tiles and snapshot timeline loudly and resets its ledger to the new chart. Bump WIRE_PROTOCOL_VERSION, add the key to the WIRE_STRUCTURES discipline, keep client callbacks in the BaseClient allowlist (onClusterHandoff). Coordinate with the netcode harness agent for src/netcode, src/client and TickHandler edits.'
  acceptance_criteria: 'Harness (scripts/planet-multiplayer-harness.mjs) with two cluster workers: a client is handed off with at most one snapshot gap, prediction corrections after the resync equal the service-off control, the old-epoch input stream is dropped with a named log, a client that misses the handoff message recovers via resync request in under 500 ms; WIRE PROTOCOL MISMATCH absent; conditioner presets (50/10/2 and 100/20/3) show no extra corrections.'
  session_id: f73df536-0f66-49a1-8888-2a064d23416a
  status: pending
- id: cpu-matrix-freeze-after-census
  title: Freeze static scene-graph subtrees only after an Object3D census says which objects update needlessly
  body: 'updateMatrixWorld is 9.5% inclusive and multiplyMatrices 3.2% self in the Tier-0 CPU profile. The freeze (matrixAutoUpdate/matrixWorldAutoUpdate off on static subtrees) needs a live census first: after a real walk, scene.traverse grouped by constructor, matrixAutoUpdate and visible, plus callers of updateMatrixWorld from `node scripts/cpuprofile-callees.mjs <arm>.cpuprofile updateMatrixWorld 4 callers` on the new arms'' .cpuprofile files. A freeze must re-update on a floating-origin rebase, a chart re-anchor epoch, a model load and an editor edit; each needs an invalidation witness (change the input, the frozen transform updates the same frame).'
  acceptance_criteria: 'Census table, callers table, the freeze with invalidation witnesses for all four triggers, and updateMatrixWorld inclusive % before/after on 3+ same-bundle arms on both GPUs (baseline nv2/nv3/amd1: 9.5/10.1/9.3% NVIDIA, 8.9% AMD).'
  session_id: f73df536-0f66-49a1-8888-2a064d23416a
  status: pending
- id: cluster-entity-home-partition-and-dormancy
  title: 'Entities need a home location: a cluster world instantiates only the entities within its coverage, the rest are dormant'
  body: 'Slice 5, the largest unsolved piece. Today every world instantiates the whole entity set (AppRuntime holds all entities; RegionWorkerEntry filters worldDef.entities by a flat x/z box only). With one world per cluster every cluster would replicate all statics and dynamic app state: statics cost 22 us per flip with tiles (7-8 us without) and diverge between clusters (a door, a flag, a pickup would differ per cluster). Define a home dir per entity in the planet base chart (canonical, f64, exact), instantiate in a cluster world only entities whose home is within coverage radius of the cluster anchor (cluster radius + physics ring), park the rest dormant in the base store, hand an entity off together with a player when it crosses (carried items, vehicles). Persistent app state mutated in a cluster is written back in the base chart (canonicalTransfer, as placed-models.json and serializeWorld already do).'
  acceptance_criteria: 'A tps-game style world with 3000 statics and 10 apps spread over the planet: a cluster world holds only the entities within coverage (count quoted per cluster), world memory and tick cost per cluster fall against the full-replication baseline (measured both), an entity edited in cluster A is read back identically after cluster B loads its location, and handing a vehicle with a player across a merge keeps both within 1 mm; named failure for an entity with no home position.'
  session_id: f73df536-0f66-49a1-8888-2a064d23416a
  status: pending
- id: cpu-allocation-weather-grass-per-frame-writes
  title: After the setMatrixAt clone fix, re-measure weather/grass instancer allocation and toArray writes with a heap-sampling arm
  body: '2bc33d2b removed the per-call Matrix4 clone and Map write in WebGPUInstancing.setMatrixAt (225-241 ns -> 99-106 ns per call over 3000 instances x 600 frames, identical instance matrices before/after). The 2.6 MB per frame (190-201 MB/s) allocation in the Tier-0 profile is still unattributed: re-measure with a raw CDP HeapProfiler sampling arm (HeapProfiler.startSampling/stopSampling through the cdp verb) and fix the next top sites (the weather/grass instancer toArray writes, per-frame vector/array allocation in the render loop).'
  acceptance_criteria: Allocation MB/s and bytes per frame before/after on 3+ same-bundle arms (baseline 190-201 MB/s NVIDIA, 168 MB/s AMD), with a sampled top-20 allocation-site table from the heap sampler.
  session_id: f73df536-0f66-49a1-8888-2a064d23416a
  status: pending
- id: cluster-global-bus-chat-scoreboard-events
  title: Cross-cluster bus for chat, scoreboard, match state and events, plus the hit-registration rule across clusters
  body: 'Slice 6. Rule: a shot, hit, collision, pickup or proximity event is resolved only inside one cluster; the cluster link distance (default 1000 m) must be >= max(relevance ring extent (relevanceRadius 200 m, 3x3 cells), max weapon range, lag-comp reach); assert it at world load with a named error. Global state (chat, scoreboard, match phase, kill feed, voice rooms) travels over a router bus; RegionRouter EVENT_REPLICATE with meta.crossShard is the precedent but is fire-and-forget with no ordering or replay. Decide per feature which are global (scoreboard, chat) and which are local (proximity chat, pickups), define ordering (router sequence number), and make late-joining clusters receive the current global snapshot.'
  acceptance_criteria: 'Harness with two clusters: a kill in cluster A appears on the scoreboard seen by a player in cluster B within one router round trip, chat from A reaches B in order across 1000 messages with 0 loss, a configured weapon range above the link distance fails at world load with the named error, a shot never registers against a target in another cluster (witnessed with a target 1.2 km away in the other cluster), and a cluster created late receives the scoreboard.'
  session_id: f73df536-0f66-49a1-8888-2a064d23416a
  status: pending
- id: cluster-persistence-rejoin-base-chart
  title: 'Persist players and rejoin by planet position: base-chart canonical position and cluster assignment on reconnect'
  body: 'Slice 7. pendingRejoinState and sessions hold chart-local positions of one world; in a cluster architecture a rejoin must find (or create) the cluster covering the saved position. Store the player''s last position in the planet base chart (ledger.canonicalTransfer: invertible in f64 between any two charts, round trip 4e-11 m even antipodal) and on reconnect run clusterAssignment against the live clusters (a rejoining player is a new pool member) so a player who left next to a friend returns into the friend''s cluster. Spectators join their target''s cluster and follow its handoffs. Replays record per cluster with an epoch/cluster field (row chart-reanchor-transform-ring-replay-region-epoch).'
  acceptance_criteria: 'Harness: a player disconnects in cluster A, the cluster is torn down, the player reconnects after a restart and is placed at the same planet position within 1 mm in a fresh cluster; a friend 300 m away who stayed online ends in the same cluster as the rejoiner; spectator follow across a handoff shows no gap longer than the handoff stall.'
  session_id: f73df536-0f66-49a1-8888-2a064d23416a
  status: pending
- id: terrain-streamer-upkeep-28ms-per-player-per-second
  title: Terrain upkeep costs about 28 ms of CPU per second per walking player, linear in separated players
  body: 'MEASURED 2026-10-05 (scratchpad/planet-arch/pA3_walk.out, real setupTerrainStreaming + PhysicsWorld, tps-game, players walking east at 7 m/s): 1 player 28.8 ms CPU per second (2.9% of a core), 8 separated players 28.1 ms per player per second (22.5% of a core). Every separated player owns a 256 m N=128 field that is fully resampled (16384 solveSurfaceY evaluations, mean 3 per point) each time the player leaves its cover radius, so 36 spread walking players saturate one core and 64 need about 1.8 cores; the physics step itself is 0.37 ms at 64 players. This is the load that scales with spread, and it is the reason clusters should run in separate processes. Root-cause candidates to test: scroll the lattice and resample only the new strip (about 1/8 of the field per 32 m instead of all of it), reuse the baked .hf where it covers, fill from the climate/anchor field once per chart patch, and move sampling to worker threads.'
  acceptance_criteria: Per-player upkeep ms/s measured before/after with the same harness at 1 and 8 players walking 7 m/s for 45 s (before 28.8 and 28.1), collider surface at the player bit-identical to a full rebuild within the existing 20 mm lattice tolerance, ring correctness witnessed by a raycast grid under each player, default single-player boot unchanged.
  session_id: f73df536-0f66-49a1-8888-2a064d23416a
  status: pending
- id: cluster-assignment-wire-into-router-and-config
  title: Wire clusterAssignment into a router tick behind tcfg.clusters with derived defaults and a loud config check
  body: 'Slice 1b. src/shared/clusterAssignment.js (3de512cf) is pure and unwired. Add the ClusterManager that feeds it each router player''s planet direction (frame.localToDir of the chart-local position, or the persisted base-chart position) at 2-4 Hz (measured 0.16 ms at 16 players, 0.67 at 64, 3.4 at 256, 8.9 at 1024), applies events (new cluster, handoff, merge, drop) to the hosting layer, and exposes the config (linkM, memberRadiusM, stay/join factors) with defaults derived from measured values: memberRadiusM = R * sin(cell worst angle 2.26 deg) = 2508 m at R 63600 and 32 anchors per face, linkM 1000 m. Fail at world load with a named error when linkM is below the relevance ring extent or any weapon range, or memberRadiusM exceeds the walkable chart (member-to-centroid plus the 2.26 deg anchor error must stay under 45 deg; the analytic bound at defaults is 3135 m + 2.26 deg = 5.08 deg).'
  acceptance_criteria: 'A Node run with the real router stub and 64 simulated players walking random routes for 10 minutes: every member stays within the stated bound of its cluster anchor, handoff count equals the hysteretic count (no flapping), the ClusterManager never throws on antipodal or rejected inputs (named rejected[] logged once), config errors are named.'
  session_id: f73df536-0f66-49a1-8888-2a064d23416a
  status: pending
- id: planet-multiplayer-two-browser-different-regions-gpu-witness
  title: 'Two real browsers at different planet regions: visible, hittable, events per the cluster rule, on both GPUs'
  body: 'GPU-window witness plan (no browser was launched by the architecture agent). Prerequisites: slices cluster-world-hosting-process-per-cluster, cluster-handoff-state-transfer-merge-split and cluster-wire-handoff-message-and-client-resync landed behind tcfg.clusters. Plan: start the cluster router with two worker worlds; browser A and browser B (separate profiles) join at spawn positions 20 km apart and again 10000 km apart (antipodal); verify each sees only its own cluster (no remote avatars, correct sky/terrain/minimap marker), walk A toward B across the link distance and watch the merge: B''s avatar appears, hit feedback works both ways, chat and the scoreboard cross the clusters, then walk apart and watch the split; run on the RTX 3060 and the AMD adapter with legacy GL and WebGPU. Record per browser: console errors, __scene player count, corrections stat, handoff stall ms, long tasks during handoff.'
  acceptance_criteria: 'Per GPU and backend: handoff stall in ms, zero console errors, remote avatar present exactly when the players share a cluster, prediction corrections within the single-cluster baseline, minimap marker and terrain continuous across the handoff (screenshots with ?v=<ts>), numbers quoted.'
  session_id: f73df536-0f66-49a1-8888-2a064d23416a
  status: pending
- id: peer-rooms-and-browser-host-assert-chart-extent
  title: Rollback, lockstep, P2P and host-in-browser rooms must fail loudly when the map or a joiner exceeds one chart
  body: 'These profiles simulate the whole world on every peer in ONE flat chart (ctx.peerSession already blocks the re-anchor; the Jolt wasm heap is fixed at 128 MB so a browser host cannot host extra cluster worlds). Beyond the chart radius (63.6 km) the ground was silent garbage (fixed in 3de512cf for the terrain streamers and solver); what remains is the room-level rule: a rollback-duel, lockstep-rts or ?room= P2P world whose spawn points or declared extent do not fit within the cluster member radius (2508 m stay 3135 m at defaults, walkable limit 45 deg) must refuse to start with a named reason, and a host-in-browser (BrowserServer) joiner whose position is farther than the cluster radius from the host''s chart must be refused with a named reason instead of being placed on curved ground.'
  acceptance_criteria: 'Node witnesses on the real peer harnesses: a rollback-duel world with spawn points 20 km apart and a lockstep-rts world declared 70 km wide each fail at start with the named reason, the shipped worlds start unchanged with 0 desyncs (22 and 11 checksums compared as before), a BrowserServer joiner placed 20 km from the host is refused with the named reason.'
  session_id: f73df536-0f66-49a1-8888-2a064d23416a
  status: pending
- id: fire-s1-kernel-lattice-spec-events
  title: 'S1 fire: deterministic cell kernel on the placement lattice, ctx.defineFire data spec, event wire (default off)'
  body: 'Design record: recall project/fire-system-design-2026-10-05. Landed: src/shared/fire/fireLattice.js (chart-independent 8 m cells on the cube-face placement lattice, integer cross-edge neighbours), fireKernel.js (SoA 8x8 tiles, per-tile active mask, integer order-independent spread, wind-biased weights, seeded ember spotting, moisture/rain, regrowth, active/tile budget with soft slow-down and hard activation cap, boundary snapshot/restore, order-independent checksum), fireTimeline.js (event log, boundary snapshots, late-event rewind, rewindTo, keyframe adopt), fireWire.js (compact rows, id = tick*4096+seq, strict decode), src/behaviours/fire.js + AppContext.defineFire + types. Witnesses (scratchpad/fire, run through gm exec_js): 11 determinism checks, 14 behaviour checks, chart re-anchor 0/80000 key mismatches, interior-skip on/off identical, quiet map 14-35 ns/tick, no GC in 12000 ticks.'
  acceptance_criteria: 'Pass: npm run check and check:sdk-types green; zero comments in new files; nothing instantiates the kernel unless an app calls ctx.defineFire; determinism, behaviour, lattice and interior-equivalence witnesses all pass; measured step ms at 1k/10k/30k/100k active and the budget and degradation mode are recorded in the design memo.'
  session_id: f73df536-0f66-49a1-8888-2a064d23416a
  status: pending
- id: fire-s1b-peer-sim-rollback-hook
  title: 'S1b fire: rewind the fire sim with PeerSimSession rollback and lockstep (app state is not rewound today)'
  body: 'Gap found by reading: PeerSimSession.capture/apply (src/netcode/PeerSimSession.js:65-83) saves Jolt exact state, players, tick sim maps and the runtime clock only; fire state is app state and would silently diverge after a rollback. Fix: capture records the tick, apply calls fire.rewindTo(tick) on every defineFire world registered with ctx (a small registry on AppContext/runtime, not a global), set spec.rewind true in peer-simulated profiles, and live/lockstep checksum folds fire.checksum() beside the body checksum so a fire desync trips ConsensusVoter/DesyncDetector. Strategy already measured: boundary snapshots every step + event-log replay (rewind 25 ticks = 1.0/8.4/17 ms at 118/4050/11429 touched tiles), because ignitions are re-emitted by the resimulated app update with deterministic ids tick*4096+seq. Witness: scripts/peer-profile-harness.mjs shapes (rollback and lockstep worlds) with an app that ignites from player fire input and a forced misprediction; two peers'' fire checksums equal at every checksum interval for 3000+ ticks including rollbacks, desync count 0; cost of the hook with no fire world is zero.'
  acceptance_criteria: 'Two-peer rollback harness run with a fire-starting app: fire checksum identical on both peers at every interval across >=20 rollbacks, stats.desyncs 0; same for lockstep; no per-tick cost when no defineFire world exists; npm run check green.'
  session_id: f73df536-0f66-49a1-8888-2a064d23416a
  status: pending
- id: fire-s1c-late-join-keyframe-and-checksum-resync
  title: 'S1c fire: late joiners and desync recovery through a compact keyframe plus the event log'
  body: 'Measured (bench-wire.mjs): a varint keyframe of the non-pristine cells is 2.4 KiB (1.1 deflated) for a small fire, 15 KiB (5.3) mid-growth, 199 KiB (61) for a 55k-scar forest; in-memory snapshot 0.05-0.8 ms, restore 0.9-4.8 ms; pure log replay of a 6000-tick forest fire costs 0.58 s. Build: encodeFireKeyframe/decodeFireKeyframe in src/shared/fire (scars as u16 step deltas, burning cells carry fuel, heated cells heat/timer/fuel, tile mask 8 B), server sends {type:''fire'', k:{tick, bytes}} plus events since that tick on PLAYER_JOIN and on a client''s checksum-mismatch report; mirror compares the periodic {c:[tick,hash]} row at its own tick (store the hash and check when simTick reaches it) and requests a keyframe after N mismatches; choose min(keyframe bytes, replay cost) per join. Witness: join a mirror at tick 3500 of the witness scenario by keyframe and compare checksums every 10 ticks to tick 6000; corrupt one cell on the mirror and show the checksum row detects it within 20 steps and the keyframe heals it; bytes on the real msgpack wire.'
  acceptance_criteria: Late-join and corruption-heal witnesses pass with 0 checksum mismatches after adopt; keyframe bytes and adopt ms recorded for 2k/15k/55k-scar fires; join path never blocks the server tick for more than 5 ms (encode sliced or cached per step).
  session_id: f73df536-0f66-49a1-8888-2a064d23416a
  status: pending
- id: perf-after-arm-veg-cells-weather-grid
  title: 'GPU after-arm for 02a1feef36: veg LOD cells, weather ground grid, setTranslatedAt'
  body: 'Run the same harness as PF-nv-720/720b/720c (tps-game singleplayer, 1280x720, 120 s walk, rain 0.6) on bundle built from 02a1feef36 or later, 3 NVIDIA arms plus 1 AMD, buckets clean. Extract with scripts/cpuprofile-callers.mjs <PF-*.cpuprofile> ''^updateLOD$'' ''^composeHeight$'' ''^solveSurfaceY$'' ''^setMatrixAt$'' and the weather update entry. Headless baselines: veg updateLOD 7500 instances 1500-2200 us -> 120-320 us per frame; rain update 1290-2580 -> 280-520 us; solver calls per frame 29-31 -> 3.3. Compare against nv1-3 (updateLOD self 6.6-7.1 pct, inclusive 7.7-8.1; weather 10.8-11.7 pct inclusive; composeHeight 7.0-7.3 pct inclusive; setMatrixAt self 3.9-4.2 pct; allocation 189-201 MB/s; frame p95 20.84 ms / p99 27.78 ms in nv3). Visual criterion: fixed pose, fixed time of day, weather rain 0.6, vegetation on; capture 8 consecutive frame pairs at 1/72 s spacing before and after with the same renderer; tolerance = max of the same-renderer repeat floor (two captures of the same build) measured per region; compare (a) vegetation regions: per-region mean abs luminance difference between builds must be <= repeat floor + 0.5 percent, and no instance pop: count tier flips per frame pair via window.__vegProfile.meshInstances/impostorInstances deltas, must equal the old build''s at the same poses; (b) rain: drops are random so compare statistics, streak count visible and splash count (imSplash instances with spawnTime >= 0), within repeat floor; splash height error vs frame.groundHeightLocal read in-page must be mean <= 0.05 m, max <= 0.20 m.'
  acceptance_criteria: Four PF arms recorded with cpuprofile; inclusive pct of updateLOD, weather update, composeHeight, setMatrixAt, allocation MB/s and frame p95/p99 tabulated against nv1-3/amd1; visual tolerance results stated; memo written.
  session_id: f73df536-0f66-49a1-8888-2a064d23416a
  status: pending
- id: weather-particle-motion-on-gpu-tsl
  title: Move rain, snow and far-sheet particle motion to the GPU in the TSL path
  body: 'After 02a1feef36 the TSL weather still writes 1800 rain + 1800 snow-capable + 300 far instance matrices per frame via setTranslatedAt and uploads the dirty range (writeBuffer self 4.2 pct is shared with veg and others). The legacy GL path already does this on the GPU (WeatherGpu.js makeFieldGeometry + makeWeatherShared uniforms, NEAR_BOX/FAR_BOX windows, splashes sampled separately by rate). Port to TSL: instance position from a per-instance seed attribute, uTime, uCam and the box extents in the vertex stage; hits/splashes by sampling GroundNodeGrid at a bounded rate as _updateGpuFields does. Visual change (drops no longer vanish exactly at the ground) needs the frame-pair criterion in perf-after-arm-veg-cells-weather-grid. Needs the mapspinner/TSL agent''s lane clear for WeatherMaterialsTSL.js.'
  acceptance_criteria: Weather update CPU inclusive < 1 pct in a rain 0.6 walk arm; no per-particle setTranslatedAt; visual tolerance met; legacy path unchanged.
  session_id: f73df536-0f66-49a1-8888-2a064d23416a
  status: pending
- id: fire-s1d-incremental-hash-and-delta-snapshots
  title: 'S1d fire perf: incremental state hash and dirty-tile delta snapshots (measured baselines are the problem)'
  body: 'Measured on the shipped kernel: full checksum scans every touched tile: 0.14 ms at 118 tiles, 13 ms at 4050, 21 ms at 11429; a boundary snapshot copies every touched tile: 0.05 / 2.4 / 5.2 ms every 30 ticks, times a window of 4-8 snapshots (up to ~20 MB). Both are O(scars), not O(active), which breaks the worst-case rule for big burnt-out forests. Fix: keep an order-independent running hash updated on every cell write (sum of per-cell mix hashes, remove old/add new) so checksum() is O(1); snapshot only tiles whose dirty bit is set since the previous boundary (scarred tiles never change) and chain deltas, restore by replaying deltas from the oldest full copy. Witness: checksum equals the full-scan checksum at every tick of the witness scenario (11 determinism checks still pass), then re-run bench-rollback.mjs: checksum <= 0.05 ms and boundary snapshot O(active tiles) at 4050 and 11429 touched tiles.'
  acceptance_criteria: Incremental hash bit-equal to full scan across the determinism suite; snapshot+checksum per boundary <= 0.3 ms at 11429 touched tiles with 15k active; restore equivalence witnessed; no per-cell allocation.
  session_id: f73df536-0f66-49a1-8888-2a064d23416a
  status: pending
- id: fire-s1e-per-tile-reclaim-and-placement-fuel
  title: 'S1e fire: per-tile reclamation and fuel classes derived from vegetation placement'
  body: 'Two follow-ups to the shipped kernel. (1) Tiles are reclaimed only when the whole map is idle (verified: 6 consecutive fires returned to 0 tiles), so a long session with one lingering scar keeps every touched tile and can hit maxTiles (deniedTiles counter). Add a free list: free a tile when it has no active cell, no scar and all cells pristine; unlink the 8 neighbour pointers, delete from the open-addressing table with backward-shift deletion; measure memory growth over 20 successive fires at different places with a lingering scar. (2) fuelClassAt currently comes from the spec (hash or data). Add a placement-derived fuel layer: classify a fire cell from the trees placementsForChunk(key, frame, anchorField, seed) puts in its 4 placement cells (grass/shrub/forest by count and species), reusing the ColliderStreamer chunk cache so the cost is shared; the trunkId -> (face,i,j) -> fire cell mapping is exact integer arithmetic. Risk to witness: placement is float-derived (tan/atan2/fround), so two engines could flip a rare tree; server-authoritative profiles use it, peer-simulated profiles stay on integer hash fuel; measure the cost of fuel classification per new tile (64 cells = 4 chunks) on the real frame+anchorField and the fraction of cells whose class would differ if one tree flips.'
  acceptance_criteria: 'Per-tile reclaim: no tile leak across 20 fires (tileCount returns to the lingering set), determinism suite unchanged. Placement fuel: measured ms per tile creation on a real planet frame, cached chunk reuse proven, class-flip sensitivity quantified, server-authoritative only until proven bit-stable across Chrome and Firefox.'
  session_id: f73df536-0f66-49a1-8888-2a064d23416a
  status: pending
- id: veg-lod-share-cell-classification-across-branch-leaf-instancers
  title: Share cell classification between the branch and leaf instancers of one species
  body: Vegetation.updateVisibility calls rec.branch.updateLOD and rec.leaf.updateLOD with identical camera, frustum and instance positions (4277 trees, ~8.5k records). Each WebGPULodInstancer now classifies its own cells (a few hundred plane tests per frame); a shared cell index keyed by position would halve that and let impostor instancing reuse it. Measure the classification cost per frame first (Node script like scratchpad lod-equiv.mjs) before building; only worth it if classification exceeds ~20 pct of the remaining updateLOD time in the after-arm profile.
  acceptance_criteria: Measured classification share from the after-arm cpuprofile; if above 20 pct of updateLOD inclusive, shared index implemented with the same 0-mismatch equivalence witness; otherwise closed with the number.
  session_id: f73df536-0f66-49a1-8888-2a064d23416a
  status: pending
- id: cpu-height-sampling-remaining-callers-after-weather
  title: 'Remaining main-thread solver callers after weather: prediction ground, camera clamp, placement streaming'
  body: 'Static caller census (no profile with callers existed; the Tier-0 JSONs hold only aggregated tops): weather was 29-31 solver calls per frame (23-57 us each) and is now 3.3. Remaining: client prediction ground provider (src/client/PredictionEngine.js setGroundSurface, app.js predictionGroundSurface) 1-2 calls per tick incl _calibrateSurface per snapshot, positions distinct each tick so an exact-point memo hits only on replay/stationary (not built: estimated 25-50 us per frame); client/core/camera.js:69 one call per frame; Grass.js:122, Vegetation.js:390, Rocks.js:164 and PlacementChart.surfaceAlongDir during chunk streaming (spikes, candidate for the patch-bake worker pattern). Next step is the real attribution: run scripts/cpuprofile-callers.mjs on the after-arm cpuprofile with ''^solveSurfaceY$'' --depth=4 and act on whatever remains above 1 pct; also solve-surface-warm-start-cost (2 evals per solve is the floor at the 1e-4 tolerance; a warm start cannot beat it without a tolerance change).'
  acceptance_criteria: After-arm caller table for solveSurfaceY with each caller's inclusive pct; each caller above 1 pct fixed or filed with its measured cost.
  session_id: f73df536-0f66-49a1-8888-2a064d23416a
  status: pending
- id: fire-s2a-damage-burning-status-navcost
  title: 'S2a fire gameplay: server-authoritative damage in burning cells, burning status, nav cost'
  body: 'Depends on S1. Server tick: for each living player look up the fire cell (measured 194 ns per player: local xz -> frame.localToDir -> cellOfDir -> tile hash, 100 players = 19 us per pass, run at 4 Hz = 0.078 ms/s) and, when the cell is BURNING, apply spec.damagePerSec by class through the same health path combat/shrinking-zone use (st.health, ''fire_death'' message, kill credit to the ignition source byte), with a burning status (buffs.js stack) that persists N seconds after leaving the cell. Skip entirely when kernel.activeCount===0 (O(1)). NPC/navmesh: extend ctx.navCostAt (AppContext.js:461) so BURNING cells cost high and scars normal; steering.js flee from heat gradient via cell heat. Client predicts visuals only; damage is never client-authoritative; lag compensation not needed (fire is slow and event-sourced). Witness (real code, headless): player teleported through a burning front takes damage only while inside burning cells, none in scars or unburnt cells, none after rain extinguish; damage is identical on server and on a mirror-run replay of the same events; measure per-tick cost at 100 players with 15k active cells.'
  acceptance_criteria: Damage-only-inside-burning-cells witnessed with positions logged against stateAt; burning status expires; nav cost raised only on burning cells; per-tick cost at 100 players < 0.1 ms; no cost with no fire.
  session_id: f73df536-0f66-49a1-8888-2a064d23416a
  status: pending
- id: cpu-model-pool-update-and-cluster-lod-prepare-7-8pct
  title: Model-pool update (7.3-8.8 pct) and ClusterLodMesh prepare (6.4-8.0 pct, _selectClusters 1.6-2.4 self) have no owner
  body: 'Tier-0 inclusive: model-pool update 7.3/7.6/8.8, ClusterLodMesh prepare 6.4/6.9/8.0, _selectClusters 5.4/5.8/6.8 inclusive. Not touched in the veg/weather/height pass. Decompose with scripts/cpuprofile-callers.mjs on the next arm''s cpuprofile (patterns ''^prepare$'' ''^_selectClusters$'' and the pool update entry), then apply the same cell/epoch skip logic if selection reruns on unchanged views.'
  acceptance_criteria: Caller/callee decomposition recorded and each part either optimised with before/after Node numbers or filed with a measured cost.
  session_id: f73df536-0f66-49a1-8888-2a064d23416a
  status: pending
- id: fire-s2b-smoke-occlusion-rule-los-query
  title: 'S2b fire gameplay: smoke that blocks sightlines and shots (documented rule, measured query)'
  body: 'Rule to implement and document: density(cell) = class smoke value (0..255) while BURNING; optical depth of a ray = sum(density * pathMetres / 255) over the cells it crosses whose plume the ray is inside (plume = spec.smokeHeightM above the shooter''s feet altitude, default 30 m; documented approximation: ignores terrain relief along the ray, tolerance on slopes stated); a shot or ctx.hasLineOfSight is blocked when depth >= 1. Query = cell-space DDA between the two endpoint cells (great circles are near-straight in cell space at gameplay range), measured 0.72 us at 100 m, 1.64 us at 300 m, 3.86 us at 1000 m with a busy map, O(1) when quiet; cross-face rays fall back to per-sample lookup. Hook into combat.js hit resolution (src/behaviours/combat.js near the world raycast) and AppContext.hasLineOfSight (AppContext.js ~440). Client draws the same smoke volume (S4c) from the same state so visuals match gameplay. Witness: headless rays through a burning forest block exactly when depth >= 1, a shot over the plume (high pitch) passes, results identical on mirror; 1000 rays/s costs < 0.5% of a core; and in a real browser on both GPUs a shot through visible smoke is blocked while one beside it hits.'
  acceptance_criteria: Rule documented in code names and the design memo; blocked/unblocked cases witnessed headless; browser witness on RTX 3060 and AMD iGPU with screenshots via window.__scene state; query cost recorded.
  session_id: f73df536-0f66-49a1-8888-2a064d23416a
  status: pending
- id: fire-s2c-weather-wind-rain-coupling
  title: 'S2c fire: wind source and rain/moisture events derived from the weather state'
  body: 'Gap found by reading: src/sdk/ServerWeather.js carries only type (clear|rain|snow) and intensity; there is no wind state in the sim (client wind is visual only, client/core/Vegetation.js:89 makeWindUniforms and Grass.js:49), so wind-biased spread needs a new authoritative wind. Add wind (integer vector +-16, direction+speed class) to ServerWeather and its WEATHER_SYNC payload (src/sdk/TickHandler.js:507-510) so the client wind uniforms and the fire sim share ONE source; when weather changes the server emits fire setWind/setMoisture/setRain events (rain intensity -> rain extinguish byte, time since rain -> moisture byte with a decay schedule driven by ticks, not wall clock). Singleplayer and peer-simulated profiles derive the same events locally from the shared world config. Witness: a front driven by wind 3,0,1 advances measurably faster downwind than upwind (cells per minute logged), rain event halts the front within a bounded number of steps (rain 90/255 witnessed 0 new ignitions after N steps), clear sky resumes spread only on unburnt fuel; client visual wind equals sim wind in a real browser.'
  acceptance_criteria: Downwind/upwind speed ratio and rain halt witnessed with logged numbers; WEATHER_SYNC change is backward compatible or WIRE_PROTOCOL_VERSION bumped consciously; vegetation sway uses the same wind vector.
  session_id: f73df536-0f66-49a1-8888-2a064d23416a
  status: pending
- id: fire-s2d-weapons-incendiary-explosion-extinguisher
  title: 'S2d fire gameplay: incendiary ammo, grenades/explosions, extinguisher, water, firebreaks'
  body: 'Hooks exist: ctx.defineCombat onWorldHit(ctx,{shooterId,position}) at src/behaviours/combat.js:242 (incendiary ammo = fire.ignite(position, shooterId & 255)); item grenade is defined (apps/_lib/item-definitions.js:6) with no effect: add explosion = ignite radius + extinguish none + impulse via ctx.world.applyImpulse; extinguisher/water bomb = fire.extinguish(position, radiusM) (event, radius <= 16 cells); firebreaks: fuelClassAt returns class 0 for water (position below ctx.seaLevelAt), rock, road/river (ctx.terrainKindAt, AppContext.js:457) -- these depend on float terrain queries so they are baked at tile creation on the authority and verified by the checksum row, with an integer-only mirror mode for peer profiles. tps-game gets a tuning object only (apps/world/tps-game.js), default off. Witness: shooting incendiary at the ground starts exactly one ignition event on the wire (44 B), a road/river cell never ignites, an extinguish event of radius 6 halts a front inside that radius, all witnessed in real code and then in the browser on both GPUs.'
  acceptance_criteria: Ignite/extinguish through combat witnessed headless with event bytes; firebreak cells never ignite; tps-game integration behind a spec flag, off by default; no regression of combat tests.
  session_id: f73df536-0f66-49a1-8888-2a064d23416a
  status: pending
- id: fire-s3-vegetation-burn-state-cell-texture
  title: 'S3 fire: vegetation burn stage via a cell-state texture, zero extra draws, charred collider and shadow removal'
  body: 'Measured on the real client/core/WebGPULodInstancer.js (bench-vegburn.mjs, 30000 instances): per-instance writes (setUniformAt of a burn float or a recoloured tint) upload 2.2-2.4 MiB next frame for 10-1000 SCATTERED changes and 72-533 KiB for coherent fronts, because markSlotDirty keeps one contiguous dirty window over instanceMatrix (64 B) plus every attribute. Design instead (disagrees with the row: no variant attribute exists, shape variants are separate meshes, and it is not a prerequisite): write a per-instance fireCell float ONCE at load next to windPhase/tint (rides the padded .w of the WebGPU vec3 tint; one extra uniform channel on the legacy InstancedMesh2 path), derived by exact integer arithmetic from trunkId (i = floor(id/cps) mod cps ...; I = i>>1); stage, ignition age and intensity live in one shared RGBA8 DataTexture indexed by tile slot*64+cell, so N stage changes upload N texels * 4 B (4 B for 1, 4 KB for 1000) and the vegetation vertex/fragment stage animates green -> flicker -> char -> scaled-down stump from ignition age with NO per-tree CPU work, zero new draw calls (draws are per rec/tier/branch|leaf already) and zero new pipelines (the lookup is added to the existing TSL/GLSL vegetation materials before boot warmup). Collider: add excludePlacement(trunkId) and release(trunkId) to src/terrain/ColliderStreamer.js (calls its own scheduleRemove at :178) so charred trunks lose their box body on server and on the client mirror; shadows: the shadow LOD pool skips or collapses instances whose cell is charred. Client keys state by trunkId/cell, never instance id (Vegetation.js loadChunk thins trees by distance). NOTE: another agent currently has uncommitted edits in WebGPULodInstancer.js and Vegetation lanes; coordinate before touching.'
  acceptance_criteria: 'GPU window, both RTX 3060 and AMD iGPU, before/after per-pass GPU ms (timestamp queries), CPU ms/frame, draw calls unchanged (renderer.info) with N burning trees vs 0, WebGPU calls/frame, contamination buckets clean, reachability PASS; re-run the same diagnostic: count of charred trunk colliders == count of charred cells'' trees on server and client; a stage change of 1000 cells uploads <= 4 KB.'
  session_id: f73df536-0f66-49a1-8888-2a064d23416a
  status: pending
- id: witness-visual-after-arms-shadow-snap-and-veg-weather
  title: 'Visual witnesses for the landed CPU optimisations are not in the first comparison arms: shadow-region pixel compare vs the pinned old bundle, veg tier-flip counts, rain streak/splash statistics'
  body: 'Landed without a visual witness: shadow cascade snapping and coarse far cascades (2bc33d2b), vegetation LOD by 32 m cells and the weather ground node grid (02a1feef). The comparison arms (N2-*, bundle built at HEAD c0ff9360, recorded in data/perf-run/Q2-state.txt) measure CPU, frame time and shadow render counts only, because each visual capture costs more than the 2 extra minutes allowed per arm and the old pinned bundle 36eeffe47396b8e7 has to be booted at the same pose for the pixel compare. Pre-registered plan, from the two agents'' after-arm plans: (1) shadow regions at a fixed pose, 3 repeat captures of the OLD bundle give the same-renderer repeat floor, tolerance = 3x that floor, then 1 capture of the NEW bundle compared per region; (2) vegetation tier-flip counts per tier at the same pose and camera path, old versus new, must be equal within the cell quantisation (32 m); (3) rain: streak count and splash count statistics over a fixed 10 s window, old versus new, within the old bundle''s own repeat spread.'
  acceptance_criteria: Each of the three witnesses recorded with the pinned old bundle as the control, contamination buckets clean, the repeat floor stated, and the verdict per region stated against the pre-registered tolerance; any region failing the tolerance is filed as a regression row with the commit named.
  session_id: f73df536-0f66-49a1-8888-2a064d23416a
  status: pending
- id: fire-s4a-flames-embers-one-draw
  title: 'S4a fire render: flames and embers from ONE instanced draw, bounded budget, GPU animation, both backends'
  body: 'One InstancedMesh of K <= 2048 camera-facing quads (K independent of burning area): the CPU picks the K nearest / most-visible burning cells at step cadence (not per frame; 64 KiB rewrite per 0.5 s), each instance carries cell position (chart-local, rewritten on re-anchor), cell slot and a seed; flame shape, flicker, height and fade animate entirely in the vertex/fragment stage from the S3 cell texture and time (same pattern as client/core/WeatherMaterialsTSL.js:29-58 spawnTime splash). Embers are analytic ballistic motion in the vertex stage from seed + time + wind: stateless, so no compute pipeline, identical on WebGPU and legacy GL (compute via instancedArray/computeAsync, three r185 Arrays.js:47, only if a state-carrying particle is ever needed; computeAsync is already used by mapspinner height-probe-tsl.js:16). Far fire: beyond a distance the quads collapse to a billboard impostor strip per tile. Materials (MeshBasicNodeMaterial/SpriteNodeMaterial, customProgramCacheKey like the weather materials) are created and warmed at boot behind the overlay with async pipeline creation; zero pipeline creation at the first ignition. Legacy path: ShaderMaterial on InstancedMesh2 like client/core/WeatherMaterials.js.'
  acceptance_criteria: 'GPU window both GPUs: draws added == 1 (flames) + 1 (embers if separate) regardless of burning area; per-pass GPU ms via timestamp queries at 100/1000/10000 burning cells identical within noise because K is capped; first-ignition frame shows no pipeline compile (WebGPU calls/frame, no long task); screenshots of the live scene on both backends; p95 frame time stated.'
  session_id: f73df536-0f66-49a1-8888-2a064d23416a
  status: pending
- id: fire-s4b-heat-shimmer-pass
  title: 'S4b fire render: heat shimmer as one half-resolution distortion pass gated to burning cells in view'
  body: 'One half-resolution pass that offsets the scene colour with a scrolling noise inside screen-space regions that contain burning cells (viewportSharedTexture, three r185 ViewportSharedTextureNode.js:73; legacy GL: the existing RenderGraph render-target path used by client/core/SSR.js / Bloom.js). Gate: skip the pass entirely when the S3 cell texture reports no burning cell inside the frustum (CPU flag from the step cadence list), so a quiet map costs zero GPU. Register as a RenderGraph node (client/core/RenderGraph.nodes.js) with a RenderControls quality switch and the mobile tier off. Depends on S4a for the burning-cell list; no new runtime pipeline (warmed at boot).'
  acceptance_criteria: 'GPU window both GPUs: per-pass GPU ms of the shimmer pass (timestamp queries) with and without fire in view; zero ms and zero draws when nothing burns in view; screenshots before/after; mobile tier disables it; contamination buckets clean, reachability PASS.'
  session_id: f73df536-0f66-49a1-8888-2a064d23416a
  status: pending
- id: fire-s4c-smoke-layer-and-light-pool
  title: 'S4c fire render: low-resolution smoke layer matching the gameplay rule, pooled importance-chosen lights'
  body: 'Smoke: a quarter-resolution alpha layer built from the same K flame quads'' plume (height spec.smokeHeightM, drift with wind) so what the player sees equals the S2b occlusion rule; depth-aware blend, no per-frame CPU. Lights: a FIXED pool of 4-8 THREE.PointLight created at boot (client/core/SceneSetup.js:257 already warms a zero-intensity PointLight so the forward-light pipeline variant exists; changing the light count recompiles pipelines, so the pool never changes size) re-assigned every 0.25 s to the burning cells with the highest screen-space importance (distance, intensity, in-frustum), intensity 0 when unused, flicker animated by a uniform; never one light per flame. Both backends.'
  acceptance_criteria: 'GPU window both GPUs: draw calls +1 for smoke, light count constant (no pipeline recompile when fires start/stop, WebGPU calls/frame flat), per-pass GPU ms for smoke at 1/4 resolution, p95 frame time with a large front in view; screenshot evidence that smoke and the S2b blocked shot agree.'
  session_id: f73df536-0f66-49a1-8888-2a064d23416a
  status: pending
- id: fire-s4d-scorch-ash-terrain-grass
  title: 'S4d fire render: scorched ground and ash from the cell texture (terrain and grass shaders), not chart-local stamps'
  body: 'Existing scorch is src/terrain/GrassDecal.js markScorched: chart-local x,z stamps with a Date.now half-life (client/core/Grass.js:282, RenderControls.js:78), so it is neither chart-independent nor deterministic. Replace for fire with a burn mask derived from the S3 cell texture: terrain splat/albedo darkening and ash tint in the terrain material (packages/mapspinner TSL, another agent''s lane: coordinate and keep default-off), grass blades shrink/tint from the fire cell of the blade (grass placement shares the cube-face lattice, src/terrain/GrassPlacement.js), regrowth fades the mask by the scar timer. Editor-stamped decals stay as they are.'
  acceptance_criteria: 'GPU window both GPUs: terrain pass GPU ms before/after (timestamp queries) with and without a scorched area in view (target: unchanged within noise since it is one extra texture fetch), draw calls unchanged, screenshots of burnt vs unburnt ground on both backends, chart re-anchor mid-fire leaves the scorch in place (forced re-anchor witness).'
  session_id: f73df536-0f66-49a1-8888-2a064d23416a
  status: pending
- id: fire-s5a-audio-editor-brushes
  title: 'S5a fire: spatial audio from the active-front centroid, editor ignite/extinguish and fuel-paint brushes'
  body: 'Audio: per active tile centroid (not per flame) feed the existing spatial mixer (src/client/AudioMixer.js) one looped crackle emitter per nearest 4 tiles with gain from burning count; no per-cell audio. Editor: ignite/extinguish brush through the existing editor op path (src/sdk/EditorHandlers.js, MSG ids 0x94-0x96 region precedent; a new id must be added to MessageTypes.js after 0xc6 with a WIRE_PROTOCOL_VERSION decision) emitting the same fire events; fuel-paint brush stores integer fuel-class patches as an append-only edit-op-log entry (EDIT_OP_LOG 0xbb precedent) keyed by cell key, applied through spec.fuel.classAt at tile creation so every peer agrees; chart-independent because patches key on cells. All GUI lives in AnEntrypoint/design (AGENTS.md rule): build the brush UI there first, then integrate on a later commit.'
  acceptance_criteria: 'Headless: brush events produce the same checksum on authority and mirror; fuel patches survive a forced chart re-anchor and a late join; audio emitter count bounded at 4 regardless of burning area; GUI built in the design repo and verified on the live URL with ?v=<ts>.'
  session_id: f73df536-0f66-49a1-8888-2a064d23416a
  status: pending
- id: fire-s5b-game-modes-objectives
  title: 'S5b fire: modes built on fire (spreading hazard zone, burn-the-base, last-unburnt)'
  body: 'Follow the defineShrinkingZone pattern (src/behaviours/shrinking-zone.js): a spreading hazard zone that is the fire front itself (ignition schedule + wind chosen by the mode, onPhaseChange-style hooks), burn-the-base objective counting BURNING/BURNT cells inside a polygon of cell keys (cell-keyed so chart independent), last-unburnt-refuge scoring via fire.stateAt, all through ctx.defineGameMode/defineGameFSM hooks (src/behaviours/gamemode.js, game-fsm.js). Server-authoritative scoring from the deterministic sim; mirrors only display.'
  acceptance_criteria: A mode runs headless for 3000 ticks with identical scoring on authority and mirror; objective counters match a brute-force scan of the kernel state; mode is default off and documented in src/behaviours/README.md.
  session_id: f73df536-0f66-49a1-8888-2a064d23416a
  status: pending
- id: fire-s5c-persistence-replay-heatmap
  title: 'S5c fire: persistence and replay as the ignition event log plus tick, heatmap hooks'
  body: 'Persist the fire as its event log (rows already compact: 16-44 B each) plus the tick, not cell dumps: src/sdk/WorldPersistence.js writes a fire block {events since oldest still-active ignition, tick, spec hash}; on load the kernel replays the log (measured 0.58 s for a 6000-tick forest fire) or adopts the stored keyframe (S1c) when cheaper. Replay: src/netcode/ReplayRecorder.js / ReplayPlayer.js record the fire rows beside input frames so a replay reproduces the fire exactly; heatmap: kernel exposes per-tile burn counts (scar ring) for a debug overlay and analytics. Chart: log keyed by cell keys so a persisted fire survives chart snapshots and re-anchors (WorldPersistence stores the chart separately).'
  acceptance_criteria: Save, reload and compare checksum at the saved tick equals; replay of a recorded session reproduces the fire checksum at every recorded interval; persisted size for a 1-hour session stated.
  session_id: f73df536-0f66-49a1-8888-2a064d23416a
  status: pending
- id: fire-s5d-far-fire-lod-and-mobile-tier
  title: 'S5d fire: far-fire LOD with a coarser sim and mobile/low-end quality tier'
  body: 'Far fire: render beyond a distance as billboard impostor strips per tile; sim stays at the same lattice (it is already cheap: <= 0.2 ms/tick at 100k active), but a coarser step cadence is available through the soft cap (interval doubles above softActiveCells) and a lazily fast-forwarded far tile is possible because the sim is a pure function of the event log. Tiers in the spec data: low = K 256 flames, no shimmer, 1/8 smoke, 2 pooled lights, maxActiveCells 16384; mid = K 1024; high = K 2048, shimmer, 8 lights. RenderControls/QualityPresets (client/core/QualityPresets.js) pick the tier; the SIM budget is a server decision, the render budget is per client.'
  acceptance_criteria: Per-tier GPU window numbers on both GPUs; low tier holds p95 frame time under the stated target with a 30k-active fire in view; changing tier at runtime creates no pipeline (all variants warmed at boot).
  session_id: f73df536-0f66-49a1-8888-2a064d23416a
  status: pending
- id: fire-s6-burning-forest-scenario-both-gpus
  title: 'S6 fire: end-to-end wind-driven burning forest on tps-game or a planet biome, both GPUs, p95 stated'
  body: 'Integration witness after S1-S5. Scenario script (headless first, then a real browser harness like scripts/perf-run.mjs shapes): incendiary shot ignites a forest, wind 3,0,1 drives a front across a biome, players are pushed around, a player standing inside burning cells is damaged only there, a shot through smoke is blocked per the rule, rain halts the front, trees char (collider and shadow gone), scorch persists across a forced chart re-anchor, a late joiner sees the same fire (checksum row equal). Report per GPU (RTX 3060 and AMD Radeon iGPU): p50/p95/p99 frame time, per-pass GPU ms via timestamp queries, CPU ms/frame, draw calls with N burning trees vs 0 (unchanged), WebGPU calls/frame, contamination buckets clean, reachability PASS, kernel ms/tick and active cells over time.'
  acceptance_criteria: One recorded run per GPU with the numbers above, screenshots at ignition / mid front / charred / after rain, determinism checksum equal between server and browser mirror throughout, p95 frame time stated and within the project budget; no pipeline compile after boot (async creation, warm at boot).
  session_id: f73df536-0f66-49a1-8888-2a064d23416a
  status: pending
- id: veg-instancer-dirty-window-per-attribute-ranges
  title: 'Vegetation instancer: per-attribute dirty ranges (scattered setUniformAt uploads the whole pool)'
  body: 'Found while costing fire burn state, independent of fire: client/core/WebGPULodInstancer.js createDensePool.markSlotDirty (lines 23-32) extends ONE contiguous [dirtyLo, dirtyHi] window and applies it to instanceMatrix AND every attribute, so a single attribute write (tint, windPhase, any future per-instance value) uploads 64 B of matrix + all attributes for every slot between the min and max touched slot. Measured with the real instancer (30000 instances, 3 attributes incl. burn): 10 scattered setUniformAt calls upload 2.2 MiB next frame (needed: 840 B); coherent 100 changes 146-165 KiB. Fix: separate dirty ranges per attribute (matrix untouched when only an attribute changes) and a small sorted multi-range set (or per-chunk slot ordering) instead of one span; keep the existing once-per-frame reset. Measure with bench-vegburn.mjs shape before/after, then GPU-window it (upload bytes via renderer info, CPU ms/frame during streaming). NOTE: another agent has uncommitted edits in this file right now; do not start until they land.'
  acceptance_criteria: Same 10-scattered-change scenario uploads <= 2 KiB; chunk streaming (addInstances/removeInstances) upload bytes not worse; both GPUs before/after per the project witness rules.
  session_id: f73df536-0f66-49a1-8888-2a064d23416a
  status: pending
- id: terrain-field-sampling-worker-pool
  title: Move heightfield sampling off the main thread into a core-sized worker pool
  body: After the 2026-10-05 yield fix a field outside the baked .hf costs 0.55-0.7 s of solver CPU on the main thread; 64 spread players need ~38 s of one core and the server tick shares it. Workers need the planet sampler and chart frame (loadPlanetSampler, createPlanetFrame) loaded per worker, with the height delta, spline, cave and biome layers excluded or replayed. Measure serial vs 2/4 workers at 64 spread players before building.
  acceptance_criteria: At 64 players on a 1 km grid time-until-all-covered measured before (56.2 s) and after with 2 and 4 workers, field sample hashes identical to the main-thread build on the default world, server tick overrun count during the build not above the current run, workers stopped on streamer.stop, zero comments
  session_id: f73df536-0f66-49a1-8888-2a064d23416a
  status: pending
- id: fire-agents-md-index-entry
  title: 'AGENTS.md: add the fire design slug and ctx.defineFire entry point to the caveat index'
  body: 'AGENTS.md was dirty from another writer while the fire slice landed, so committing it would have swept their edits into the fire commit (the documented hazard). When AGENTS.md is clean: add under the entry-point paragraph `ctx.defineFire(spec)` in src/behaviours/fire.js (default off, kernel in src/shared/fire/) and the recall slug project/fire-system-design-2026-10-05; keep the file under 30 KB (currently ~25 KB). Slug-only, no narrative.'
  acceptance_criteria: AGENTS.md carries the slug and entry point in one or two lines, committed with explicit paths, size still < 30 KB.
  session_id: f73df536-0f66-49a1-8888-2a064d23416a
  status: pending
- id: terrain-collider-streamers-yield-and-center-cap
  title: Trunk and rock collider streamers keep maxCenters 8 and a Windows-clamped setTimeout(0) yield
  body: src/terrain/ColliderStreamer.js clusterCenters stops at maxCenters (default 8, vegetation.colliderMaxCenters) so players beyond the 8th cluster have no trunk or rock colliders, and its budgeted add loop yields with setTimeout(r,0) (about 15 ms on Windows) the way HeightfieldStreamer did. The shared body cap (384/128) means raising maxCenters alone thrashes the LRU, so the cap must scale with centers. Measure initial ring and steady rebuild wall at 16 and 64 spread players.
  acceptance_criteria: With 16 and 64 spread players every player has a trunk and rock ring or is named in a loud one-time line; ring build wall before/after with a setImmediate yield; body cap scaled by centers with the byte budget quoted; single-player rings identical by body count and positions
  session_id: f73df536-0f66-49a1-8888-2a064d23416a
  status: pending
- id: terrain-groundless-player-hold-by-name
  title: A player over no heightfield collider is only counted in a warning, never held or named
  body: HeightfieldStreamer logs only the number uncovered when the cap is hit, and while a field is still building the player falls. Expose the groundless players (chart-local position) from the streamer and wire the spawn-hold / refusal path (recall spawn-hold-until-static-colliders-and-floor-probe-2026-09-30) so a player over no collider is held by name until its field lands.
  acceptance_criteria: A Node run placing a player 1 km from every field shows the hold named with its position, zero fall below the terrain, released within one field build after the field lands; single-player boot unchanged
  session_id: f73df536-0f66-49a1-8888-2a064d23416a
  status: pending
