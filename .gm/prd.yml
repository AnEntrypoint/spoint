- id: tsl-parity-left-edge-arms-never-captured
  title: The left-edge discriminating arms have never been captured on any GPU, so nothing separates a normal-shading defect from a shadow or distance one
  body: |-
    The analyzer can already score four discriminating arms (analyze.mjs leftEdgeScore/geomorphOff, frames le-grey, le-greyRelief1, le-texNrmK0, le-texNrmK0Relief1, le-flatNormal, le-texNrmK0FlatNormal, le-texNrmK0FlatNormalShadowOff and gm0-grey-a, gm0-greyRelief1-a), but every analysis JSON in .gm/tsl-parity has leftEdgeScore and geomorphOff undefined and leftEdge empty: nv/analysis-nv.json, run-nv-2111/analysis-nv.json, run-amd-pinned-0115, run-amd-pinned-nohmr, run-amd-pinned-vegwarm. No captured window on either GPU has ever produced them, and no script under scripts/tsl-parity writes those frame names (grab.mjs takes the name as an argument; codesearch for gm0-grey-a returns no real hit). So the one diagnostic designed for this defect has never run.

    Why it matters now: a CPU-only re-analysis of the two valid pairs (scripts in .gm/scratch, row-profile.mjs and lum-bucket.mjs) shows the framing of the existing rows is wrong. The gap is not AMD-only. On run-nv-2111/ground the terrain+grass mean |TSL-legacy| by column band runs 2.38 at the left edge down to 0.83 at the right edge; on run-amd-pinned-vegwarm/ground it runs 6.74 down to 2.7. Same left-concentrated shape on both GPUs, AMD roughly 2.5x the amplitude, and both show the same unrelated spike near column band 10 (NV 6.76, AMD 7.66, also present under relief: AMD 7.36, NV 7.01) which is a fine-detail feature, not the defect. By legacy-luminance decile the bulk of the population sits in deciles 7-8 (106k of 112k AMD pixels) with |delta| 5.58 and 2.88 (signed -0.90, -1.85) on AMD against 2.98 and 1.36 (signed +0.72, -0.48) on NVIDIA, so the dominant term is a broad, mildly TSL-darker shift about twice NVIDIA's, on top of which the left-edge excess rides. The relief-shaded pose collapses the AMD region delta from -1.45 (terrain, ground/grey) to +0.06 (greyRelief1) while leaving NVIDIA's essentially unchanged (+0.04 to +0.18), which is the signature of the two renderers agreeing once relief supplies the surface normal and disagreeing when they derive it themselves.

    Prediction to test: le-flatNormal collapses the gap. If flattening the normal removes the left-edge excess and the broad darkening on the non-relief poses, the defect is in the normal the TSL path derives (texture normal decode, derivative precision, or geomorph-driven vertex normals) and le-texNrmK0 and le-texNrmK0FlatNormal will separate which; if the gap survives a flat normal, look at le-texNrmK0FlatNormalShadowOff and the distance-dependent aerial-perspective path instead. geomorphOff distinguishes a geomorph-driven vertex-normal difference from a texture-normal one; that arm has also never run.

    Caveat to respect while capturing: the AMD pair is only valid when vegetation is settled (run-amd-pinned-vegwarm: tslVeg 233, legVeg 233, settled true), and NVIDIA's only valid pair is 21 commits behind HEAD, so any new NVIDIA arm must be re-captured at the current pin before an AMD-vs-NVIDIA amplitude comparison means anything.
  acceptance_criteria: A pinned window on AMD (and ideally a re-pinned NVIDIA pair at the same sha) whose analysis JSON contains a populated leftEdgeScore covering at least le-texNrmK0, le-flatNormal and le-texNrmK0FlatNormalShadowOff, each with its leftLower/leftEdge/terrain deltas and its closesWithin1p5/reliefResponseWithin0p5 verdicts, plus a statement of which arm closes the gap and which does not; and the two AMD-only rows (tsl-parity-amd-valid-pair-fails-terrain-grass-leftedge-on-non-relief-poses and tsl-parity-amd-pinned-pair-fails-terrain-grass-leftedge-not-sky) re-filed or closed against that answer, since the same signature is measurable on NVIDIA.
  status: pending
- id: terrain-lattice-recentre-field-resample-cost
  title: 'A lattice recentre re-solves every field on the CPU: 2.1-2.7 s per N=128 field'
  body: |-
    Measured 2026-10-06 on tps-game (radius 63600 m) with the real exported sampleTerrainGridChunked at a real resident field corner (-126.99212598425197, -126.99212598425197), N=128, spacing 2.016 m, and with the real chartReanchor service driven through two follow hops to 6.166 deg of tilt (data/planet-harness/lattice-cost.mjs, logs lc-baked.log, lc-baked-fixed.log, lc-cpu-fixed.log):
      - baked identity chart, baseHeightFn of a world whose .hf verifies: 9.2 / 9.8 ms per field
      - exact CPU, no baked artifact (heightSource cpu): 1185.2 ms baseHeightFn, 1258 ms liveHeightFn
      - lattice heightFn at 6.166 deg: 2142.1 ms on the baked world, 2681.8 ms on the CPU world
      - the streamer's own logged recentre builds on the lattice: sample 1502 ms and 3028 ms (baked world), 891 ms and 2377 ms (CPU world)
    So a follow switch costs roughly 2.3 s of solver CPU per field it has to recentre, in 2 ms slices, and the lattice frame evaluates the same planet over the same physical ground as the chart frame does. Not shipped: nothing here is a cost change, the measurement is the deliverable. The open question is whether a recentre can start from the resident field's samples re-expressed through the chart transfer (plus a residual solve over the cells the transfer moves most) instead of re-solving all 16384 cells, and whether the result stays inside the collider's own quantization bound (about range/30000, 2.1 mm on a 64 m range field).
  acceptance_criteria: Report per-field sample ms for a lattice recentre before and after seeding the new field from the resident field's samples re-expressed through createChartTransfer, on the same world and the same 6.166 deg tilt, with the per-cell residual against a full solve and the raycast difference over a 64x64 grid between the seeded build and the full solve. Ship the seeded form only if the raycast difference stays at or below the collider quantization bound (range/30000). If the residual is bounded but not small enough, say so and close with the measured residual instead.
  status: pending
