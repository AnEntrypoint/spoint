- id: cpu-terrain-height-sampling-main-thread-7pct
  title: 'Terrain height sampling runs on the main thread during a walk: msH3i 2.8% + msSnoise3 2.5% + composeHeight 1.9% self, composeHeight 7.3% and PlanetFrame.solveSurfaceY 5.4% inclusive (AMD: 10.0% and 7.7%)'
  body: 'Tier-0 profile, 3 NVIDIA arms medians and 1 AMD arm. The CPU fractal height function (height-gen noise via mapspinner height-cpu, composeHeight, solveSurfaceY, groundHeightLocal 5.3% inclusive in the first arm) is called from the main thread every frame of a walk. Callers are not attributed by the aggregate lists; the raw .cpuprofile now saved per arm names them. Earlier fixes (5fabf8d1, 96baf453) removed weather respawn sampling and a 1 m memo, so the remaining callers must be re-found: candidates are weather droplet impact, grass/veg/rocks placement ring, minimap marker, prediction collision mirror, camera ground clamp, spawn probes. Related existing row ground-height-callers-unguarded-or-silent.'
