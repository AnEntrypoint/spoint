  title: 'Sustained 1.5-2.9 cm vertical corrections after some chart epochs: the freshly prepared heightfield collider ripples against the client''s exact-function ground model'
  body: 'Found by scripts/chart-reanchor-wire-harness.mjs on the final code: a 15-epoch chain on the reliefScale 0.0005 planet showed 0 corrections per epoch for epochs 2-12 and then 31 and 29 corrections within 1 s of epochs 14 and 15 (448 total, vertical error p50 1.5 cm, p95 2.3 cm, speed 7 m/s) in one run, while a repeat run of the same chain had 8 total and a service-off control walking 85 s had 7. tps-game chain (relief 0.01) showed 2-6 corrections per epoch from epoch 6. Server ground normals after an epoch alternate between triangle patches (n_z -0.056, -0.0025, -0.0716) where the pre-epoch collider was a single patch, so the new lattice phase (already measured up to 17 mm vs the exact function) exceeds RECONCILE_POS_EPS_M 0.015. Not a wire defect: wire, replay and mirror re-expression measured clean. Root cause lives in the terrain lattice (sample phase is anchored to the chart origin, so every epoch shifts it); do not tune the threshold.'
