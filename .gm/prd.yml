- id: sealevel-visual-vs-gameplay-mismatch
  subject: 'Player drowns before visually reaching the water: the rendered sea surface sits lower than the gameplay sea level used for drowning/underwater state. Find which of the two is wrong, make them agree, and witness the waterline live.'
  session_id: mcp-instruction-13080-1790541036346
  status: completed
  witness: 'Gameplay waterline correct (server/client anchorHeight 40.685444, on sphere to 1e-11 m). Rendered sea was wrong in terrain.glsl: vertex swell heaved -0.40..+0.40 m (mean +0.254) and fragment ray-march seaHeight was +0.154..+1.087 (mean +0.862). Fix: water vertex hR=0, oceanSeaMean uniform subtracted in fragment march (sea-waves.js seaHeightMean, set per frame in gl-render.js), SHADER_CACHE_TAG bumped. Live real Chrome tps-game: real served GLSL run in WebGL2 transform feedback: vertex min/max 0.000/0.000, shaded mean -0.002 (was +0.862); oceanSeaMean=1.29742 uniform observed via gl.uniform1f spy on the live page, no page errors. WebGPU water-render.js got hR=0 but is not live-tested and lacks the mean subtraction.'
- id: rain-drops-invisible-only-splats
  subject: Falling raindrops are not visible; only their ground splats render. Find the rain renderer, root-cause why the drop streaks/particles are not drawn (culling, size/alpha/depth, camera-relative placement, instancing, shader), fix, and witness live that drops are visible in mid-air.
  acceptance_criteria: live screenshot/pixel readback shows falling drop streaks between camera and ground in rain, in both WebGL and WebGPU paths if both exist; splats still render; no console errors
  session_id: mcp-instruction-30232-1790658115841
  status: completed
  witness: 'Root cause: makeRainMaterial in client/core/WeatherMaterials.js computed vFade = 1-abs(uv.x*2-1) in the vertex shader; streak quad vertices only have uv.x 0 or 1 so vFade was 0 everywhere, alpha<0.01 discarded every streak pixel. Fix: fade computed in fragment from interpolated vUv.x with 1-smoothstep(0.85,1.0,x). Live tps-game page pixel diff vs rain hidden (splashes hidden): before 0 changed pixels (solid-red fragment shader test proved the geometry draws: 14015 px), after 6023 px. Screenshots .gm/witness/rain_gpu_current.png (before) and rain_after_fix2.png (after) show thin streaks between camera and ground. WebGPU/TSL path already evaluated fade per fragment. Not tested: splash-only pixel check, hardware-GPU fps.'
- id: rocks-vs-live-jolt-bodies
  subject: User still sees rocks not lining up with their colliders after the input-parity fix. The prior witness compared render matrices to offline-computed hull inputs, not to the live Jolt bodies. Re-witness against the actual bodies in the running physics world and fix what remains (COM offset of convex hull shapes, pooled-body placement, rotation convention, scale handling, stale served bundle).
  acceptance_criteria: in the live tps-game page, for >=100 rocks, the world-space vertices of the real Jolt body (position+rotation+shape incl. center-of-mass offset) match the rendered instance vertices within 1cm; a visual debug overlay of the colliders on top of the rocks confirms alignment; the served bundle is proven fresh
  session_id: mcp-instruction-30232-1790658115841
  status: completed
  witness: 'Two root causes found and fixed with the live singleplayer worker''s real Jolt bodies. (1) src/physics/ShapeBuilder.js buildConvexShape filled a J.VertexList (Float3, 12-byte stride) but ConvexHullShapeSettings.mPoints is ArrayVec3 (16-byte stride): misaligned memory, garbage hulls for every convex collider (Node real Jolt 3300 rays: mean 14.7 m, max 62.9 m off; after fix mean 0.8 mm, max 9.9 cm). (2) client/core/Rocks.js placed chunks once using non-blocking frame.groundHeightLocal that silently falls back to fractal height before GPU patches bake: rocks 1.6-3.1 m above server collider ground and client/server accepted different sets; now chunks are placed only with exact patch heights (deferred+retried). Rocks are static so colliders are exact triangle-mesh shapes (buildMeshShape, World ''mesh'' type). Live page: 169/169 client rock instances matched server bodies, position 0, y 0, rotation <=6.7e-4 rad, type/scale mismatches 0, unmatched 0; 752 instances up to 400 m y deviation 0; worker-Jolt rays vs rendered mesh 1835 compared mean 0.07 mm max 3.5 cm, 0 misses. Screenshots rocks_gamecam_wire.png / rocks_gamecam_nowire.png (real body transforms as wireframes over rocks). Debug hook DEBUG_COLLIDER_RAYS kept. Stale dist/client/app.js still to be rebuilt.'
