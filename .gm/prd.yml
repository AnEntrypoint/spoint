- id: cpu-plan-model-pool-tier-assignment-capture
  title: 'Capture the ModelPool tier assignment: orderStable already skips the sort but the hero/mid/far classification loop runs unconditionally every frame'
  subject: packages/streaming-gltf/src/model-pool.js:2191 orderStable skips the distance sort when nothing moved, but the tier-assignment loop at :2200-2218 runs on every frame regardless, classifying every entity against _heroDist/_midDist -- thresholds the loop itself mutates in-frame, so the capture key must fold in the budget state or it is the textbook plausible-wrong-value case.
  body: |-
    TIER-0 parent: cpu-skip-and-replay-plan-browser. CPU-side, client per-frame. RANKED BELOW THE OTHER ROWS ON PURPOSE -- see EXPECTED HIT RATE.

    WHAT RECOMPUTES, PER FRAME
    packages/streaming-gltf/src/model-pool.js:2002 update(). Per frame: camera.updateMatrixWorld, _tmpMatrix.multiplyMatrices(proj, matrixWorldInverse), _frustum.setFromProjectionMatrix, _frustumCache.updatePlanes (:2077-2082), _fovTanHalf, camera-moved/rotated detection, a projViewMatrix.value write per _instancedSlots (:2099-2101), then the loop over this._entities calling e._update(...) filling ents[n]/dists[n].
    The sort is ALREADY gated: orderStable = !_cameraMoved && movingCount === 0 && n === _lastSortN (:2191-2197). The tier-assignment loop at :2200-2218 is NOT gated -- it runs unconditionally, a full pass classifying hero/mid/far against _heroDist/_midDist, and then calls _enforceBudget().

    STABLE STRUCTURE (the captured graph)
    The order array and the tier assignment array. Tier thresholds and budget caps are stable only between _enforceBudget calls.

    CHANGING INPUTS
    Camera matrix; entity world positions (summarized by movingCount); n; _currentCeilingLod; and -- load-bearing -- the budget state, because the loop MUTATES the very thresholds it reads.

    INVALIDATION KEY
    key = H(CODE) || ENTITY_SET_EPOCH || MOVERS_EPOCH || BUDGET_STATE || Q(camMatrixWorld, projScreen, fovTanHalf) || n || ceilingLod
    - CODE = a hash of the UTF-8 bytes of model-pool.js, computed at boot. A key over inputs only is the burned class (deviation.build-cache-no-code-version-key). Hashing the producing source makes any edit auto-invalidate with no human bumping a number.
    - ENTITY_SET_EPOCH bumps on entity add/remove.
    - MOVERS_EPOCH bumps when any entity's world position changes.
    - BUDGET_STATE is MANDATORY and is the whole reason this row is not simply 'cache the array': the classification loop feeds back into _heroDist/_midDist in-frame, so a key without the budget state serves a tier assignment computed under different thresholds. That is a plausible-wrong value, the worst class, not a visible failure.
    - Q quantizes the camera matrix at 1e-4 relative so a camera mutated back to an identical pose still hits.
    Record the captured tier array's length as a header and assert it on replay; a length mismatch is a miss, never a truncated read.

    EXPECTED HIT RATE (why this ranks last of the surviving rows)
    The thresholds are adaptive, so the budget state changes often and the hit rate will be low. That is a property of the mechanism, not of the key. File it, but do not spend the session's measurement budget here before the higher rows are closed.

    WORST-CASE BOUND
    Skipped path is one key compare plus a replay of two arrays. Miss path is today's loop. Bounded by entity count. Failure mode if the key is wrong: an entity renders at the wrong LOD tier -- visible as a pop, but the sharper risk is a stale order array, which feeds the dot-material instance writes and would attach dots to the WRONG entity. That is why the acceptance witness asserts order.length === n and that every id in the roster is present, not merely that the render looks fine.

    MEASUREMENT (integer work units, immune to timer inflation -- this box's zero-delta control arm is +/-10% and currently ~2.5x inflated)
    Deciding counters, per frame: (a) entities classified in the :2200-2218 loop, (b) _enforceBudget calls, (c) camera-moved/rotated detections, (d) capture hits vs misses over a scripted route with a still camera and a moving camera.

    CROSS-REFERENCE (single-writer): this file is also the subject of cpu-model-pool-update-and-cluster-lod-prepare-7-8pct, the tier-0 profile census row that measured model-pool update at 7.3-8.8 percent inclusive. That row decomposes the whole update; this row is the capture/replay form of its unconditional tier-assignment half (model-pool.js:2200-2218). Close them together, and never have two writers in packages/streaming-gltf/src/model-pool.js at once.
  acceptance_criteria: 'Live witness with a real ModelPool (renderer plus loaded assets -- this row is browser- or server-blocked, NOT measurable in bare node, and a substitute renderer would measure the harness rather than the path): report per frame (a) entities classified, (b) _enforceBudget calls, (c) capture hits vs misses, over a scripted 120 s route with the camera both still and moving. Pass requires (a) to drop by at least 50 percent on frames where the key hits, with a zero-delta control arm in the SAME window. Correctness: with a still camera and no entity motion, the replayed (order, tier) pair must be element-for-element identical to the always-recompute result; and on every replay assert order.length === n and that every roster id is present in order exactly once -- a stale order attaches dot instances to the wrong entity, which renders plausibly and would otherwise pass a visual check.'
  session_id: f73df536-0f66-49a1-8888-2a064d23416a
  status: pending
- acceptance_criteria: 'The witness goes green on a real page through the real server AND is proven to be able to go red: a control arm in which pointer lock is deliberately prevented (e.g. the canvas click handler removed, or the lock request stubbed to reject) must FAIL the witness. A witness that passes only because it cannot observe the lock is worth nothing. Then, if lock genuinely fails in the CDP environment, the row is satisfied by naming the precise reason (which user-activation or permission condition headless Chrome requires that a CDP-synthesized click does not supply) and by supplying the alternative that does prove it, or by removing the assertion and recording explicitly that pointer lock is unwitnessed in CI.'
  body: |-
    MEASURED 2026-10-06, commit 892089f9 era, under the GPU lock, software rasterizer class (asserted: renderer `ANGLE (Google, Vulkan 1.3.0 (SwiftShader Device (Subzero) (0x0000C0DE)), SwiftShader driver)`, rasterizer=software, which the script now prints correctly).

    scripts/pointer-lock-boot-witness.mjs prints `RESULT: FAIL -- clicking the canvas did not lock the pointer (state=null)`, i.e. lockAfterClick=false, pointerLockState=null.

    It is NOT a regression from the gpu-probe threading pass: the HEAD (pre-change) copy of the script was run as a control under the same conditions and produced the identical `lockAfterClick=false pointerLockState=null / RESULT: FAIL`. So the defect predates that commit and the conversion is exonerated.

    Why this matters: pointer lock is the input mode the whole first-person game depends on. A witness that has never once observed a successful lock means pointer lock is currently UNWITNESSED -- the assertion is not protecting anything, and it is red only because it happens to check for a state it can never reach. Either the assertion can fire and the product is broken in this environment, or the assertion can never fire and CI is carrying a permanently-red witness nobody reads.

    Leading hypothesis to test rather than assume: Chrome gates `Element.requestPointerLock()` on user activation, and a CDP `Input.dispatchMouseEvent` may not establish the same activation state as a real trusted click, so the lock request is rejected (or the pointerlockchange event never fires) regardless of the app's own correctness. If that is the cause, the witness needs a way to supply real activation (or the app's lock path needs to be exercised directly and its result read), not a loophole that makes the assertion pass.

    Related rows: cdp-witness-harness-delivers-input-to-page, cdp-input-suppression-lost-across-navigate, cdp-nvidia-browser-recycled-between-dispatches.
  id: pointer-lock-unwitnessed-cdp-click-never-locks
  title: 'Pointer lock is unwitnessed: the boot witness never observes a successful lock and fails identically at HEAD'
  session_id: f73df536-0f66-49a1-8888-2a064d23416a
  status: pending
- id: tsl-parity-texdn-direction-decorrelated
  acceptance_criteria: 'On the accelerated class, same pose and same pin, no blank applied: per-pixel cos-similarity of the texDn direction field between TSL and legacy >= 0.90 on both terrain and leftEdge, AND the structure-function ratio t/l within 10% of 1.0 at every stride in 1..64, AND leftEdge and leftLower pass the K=3 criterion with no blank. Every witness must name its rasterizer class. Discriminating instrument if the fix is still not pinned: add one fsCheap band (>=3.5) to BOTH arms emitting the raw near-octave normal tap plus the layer index -- legacy `texture(uSurfNrm, vec3(wt4.y, wt4.z, lA), TEX_LOD_BIAS).rg` (terrain.glsl, after line 902), TSL `planeTap(u.surfNrm, gNear, ''xz'', li).rg` (surface-splat-tsl.js:47, exposed out of layerSample) -- compare texel-to-texel; that separates a decode/sign/assembly error from a texture-content error in one capture. If it still cannot be made to agree, resolve with the live-GPU numeric comparison plus the bound on the pixel delta.'
  body: |-
    Carrier localized to term level; the whole fetch path is RULED OUT. All numbers: accelerated class, ANGLE (NVIDIA, NVIDIA GeForce RTX 3060 Laptop GPU (0x00002520) Direct3D11 vs_5_0 ps_5_0, D3D11); TSL=WebGPURenderer/webgpu, legacy=WebGLRenderer/webgl2-legacy; both hv:1, veg 233, pose -2750,-750, no blank, floor=1.0, K=3.

    CARRIER: texDn, the triplanar detail normal added into the lit normal. terrain.glsl:902 `if (texFade != 0.0) texDn = normalize(texNrm) * (uTexNrmK * k) * texFade;` | surface-splat-tsl.js:61-68 triNrm, :149-150 `safeNrm = select(dot(texNrm,texNrm)>1e-12, texNrm/length(texNrm), vec3(0)); texDn.assign(safeNrm.mul(k.mul(u.texNrmK)).mul(texFade))` | terrain-material-tsl.js:179 `nLit = normalize(nRelief + texDn)`.

    BOUND ON THE PIXEL DELTA: blanking texDn in BOTH arms (__texNrmK=0) collapses leftEdge 2.172 -> 0.062 and leftLower 2.266 -> 0.094 -- 97.1% of leftEdge, 95.9% of leftLower. Blanking the vertex normal (__flatNormal=1) does NOT: 1.849 / 2.152. __flatNormal is a confounded probe: flat n also changes tw and sign(n) in the triplanar blend, so it does not remove vNrm.

    THE REMAINING DIFFERENCE (live GPU, same pixels): |texDn| agrees (0.11930 TSL vs 0.12246 legacy, 2.5%), but |texDn| = k*texNrmK*texFade is a PURE SCALAR -- normalize() discards the texel -- so it proves only k and texFade agree and carries ZERO texel information. The DIRECTION is uncorrelated: per-pixel cos-similarity 0.1337 (terrain) / 0.1911 (leftEdge); region meanAbs 100.8/255 (terrain), 96.8 (leftEdge), 109.8 (leftLower). Region mean vectors: terrain tsl=[0.04083,0.07768,0.06040] vs legacy=[-0.00277,-0.00712,0.00102]. TSL concentrated (resultant |mean|/mean|v|=0.893, ~27 deg cone); legacy isotropic (resultant 0.063). Legacy's near-zero mean is what a correctly decoded zero-mean normal map gives; TSL's 0.1065 of a 0.1193 magnitude is a systematic bias. Rotation-invariant structure function S(s)=mean|v(p+s)-v(p)| normalized by S(64): TSL 0.475 at s=1 vs legacy 0.245; ratio t/l = 1.323 (s=1), 0.999 (s=3), 0.680 (s=64). TSL = near-constant direction plus per-pixel jitter; legacy = smoothly varying, widely spread, band-limited.

    FETCH PATH RULED OUT BY A NEW WITNESS (data/tsl-parity-nv-alb). Raw albedo (__albedoOverride=[0,0,0,0] disables the override in BOTH arms -- terrain.glsl:925 `albedo = mix(albedo, uAlbedoOverride.rgb, uAlbedoOverride.a)` == TSL) shares the same triplanar UV, triplanarGrads, tw weights, layer index and triTap fetch, but is independent of texDn. With texDn off (albRawTexNrmK0): per-pixel Pearson r = 0.9787 on terrain, and blurring TSL only degrades it (0.9787 at radius 0 -> 0.9310 at radius 8), so TSL is neither sharper nor blurrier. albRaw structure-function ratio t/l = 1.318 (s=1) -> 0.970 (s=64): same spatial scale, both band-limited. Region meanAbs albRaw 2.308/2.149/2.172 (terrain/leftEdge/leftLower), falling to 1.279/0.461/0.430 with texDn off. => UV alignment, mip level, array layer, gradients, tw weights and texture content all agree. The divergence is specific to what triNrm does that triTap does not.

    TWO SURVIVING CANDIDATES: (1) the normal-texture assembly -- `.rg.mul(2).sub(1)` decode, the `vec3(0,px.x,px.y)` plane projection and `sign(n)` in triNrm (surface-splat-tsl.js:61-68) vs legacy surfTriNrm (terrain.glsl:620-627). Source reads term-for-term identical including sign(n), so if this is it the cause is what `n` actually is at runtime, not the written expression. (2) The NRM texture content differing between arms -- the albedo witness validates the ALB texture and the machinery, NOT the NRM data. Legacy: gl-render.js mkArray(nrmAll, gl.RGBA8) + gl.generateMipmap(TEXTURE_2D_ARRAY). TSL: terrain-material-tsl.js:51-56 makeSurfaceTextures -> makeLayerTexture(nrmAll, sz, matCount, THREE.NoColorSpace, true).

    ALSO RULED OUT: grid geometry; FD tap spacing (duP=1/uGrid vs gridInv=1/gridSize, both TD.gridMeshSize); vRel/vTexRel (terrain.glsl:360 == terrain-material-tsl.js:152); the snoise3 warp (fp32-mirror artifact: glsl-rt.js:2 uses Math.fround, ops-jsgen.js does not -- both GPUs evaluate fp32); texture filtering/mip/aniso in source (makeLayerTexture LinearMipmapLinear + generateMipmaps + aniso 8 == legacy LINEAR_MIPMAP_LINEAR + generateMipmap + aniso 8); three's WebGPU backend DOES build a full mip chain for array textures (WebGPUTexturePassUtils._mipmapCreateBundles loops baseArrayLayer; Textures.js:296 levels=floor(log2(max(w,h)))+1); .depth(layer) is the sanctioned array selector (TextureNode.js:87) emitting correct WGSL textureSampleGrad(tex,samp,uv,arrayIndex,ddx,ddy) (WGSLNodeBuilder.js:854-882); sRGB decode of the normal map (getFormat picks -srgb only for SRGBTransfer, so NoColorSpace -> linear, same as legacy gl.RGBA8); the nrmLow gate asymmetry (legacy on uNrmLow!=0, TSL on texFade!=0) is benign since TD.nrmLow=0.4 puts both on the same branch; surfReady placeholder (a 1x1 flat normal would force |texDn|=0; measured 0.119).

    MEASUREMENT CAVEAT: the nrm/nrmFlat debug bands are NOT cross-arm comparable -- with __flatNormal the two arms' n differ by a near-constant 56-59 deg per pixel (tsl mean [0.222,0.575,0.688] vs legacy [-0.630,0.216,0.657]), which shading contradicts (0.064/255 with texDn off), so the band is basis-transformed in at least one arm. Use only frame-invariant statistics: mean angle(n, own up) = 1.922 deg (TSL) vs 4.561 deg (legacy). The texDnMag band is also not a clean per-channel scalar broadcast (tsl [0.1193,0.11671,0.11857]), so the PNG may carry chroma subsampling; the TSL/legacy gap is ~100x larger than that artifact.

    Distinct, do not conflate: tsl-terrain-grass-brighter-than-legacy-unexplained, tsl-terrain-grey-lighting-residual. The ~0.4/255 albedo residual surviving texDn blanking (0.461 leftEdge, 0.430 leftLower vs 0.062/0.094 grey) is that separate brightness row. Sky and water already match (0.183 / 0.117).
