  subject: 'A world that declares a peer-simulated netcode profile boots authoritative in silence whenever the URL carries no ?room=. Found 2026-10-02 while setting up the solo-lockstep leg: the peer-simulated path in client/app.js is gated at line 1180 on `if (_wwRoom && _netcodeProfile?.peerSimulated)` with `_wwRoom = _params.get(''room'')` at line 691, so loading apps/world/lockstep-rts.js without a room never reaches `formPeerRoster` and falls through to the ordinary BrowserServer client, running authoritative in the browser worker. The world''s own config says `profile: ''lockstep''`. This is the second silent profile downgrade on the same surface: docs/netcode.md already documents the first, where a world declaring `netcode.lockstep{...}` with no `profile` field runs authoritative because `resolveNetcodeProfile` falls back to `authoritative`. That one is a config authoring mistake; this one is unavoidable by the person who opens the URL -- anyone loading a lockstep world without knowing to append `?room=` gets a different netcode model than the world declares, with no message. A silent downgrade is worse than a failure: the operator sees a working game running the wrong protocol, and lockstep worlds exist precisely because app state of any size is safe under them, which is not true of the authoritative path they actually land on.'
- acceptance_criteria: 'Re-run on a quiet box to confirm the sim-rate figure is not load-induced, then find the mechanism: report simHz, timeSyncYields, advantage and catchUpTicks at 25/5/1 with inputDelayTicks 3 and 6, and at 0/0/0 with both, so the delay and the network are separated. If frame-advantage time sync is over-yielding under jitter, fix the yield policy and show simHz back to within about 1 Hz of the 30 Hz target at every condition, with desyncs still zero. If instead the honest answer is that 25/5/1 cannot sustain 30 Hz lockstep at any delay, say so and correct docs/netcode.md, which currently tells the reader that about 75 ms with 5 percent loss needs inputDelayTicks 6 -- a documented configuration that measures 24 Hz.'
  id: lockstep-sim-rate-collapses-to-24hz-at-documented-input-delay
  session_id: f73df536-0f66-49a1-8888-2a064d23416a
  status: pending
  subject: 'Lockstep runs its simulation at 24.2 Hz against a 30 Hz target when configured the way docs/netcode.md recommends for a lossy link, because frame-advantage time sync over-yields under jitter. MEASURED 2026-10-02 with `node scripts/peer-profile-harness.mjs --world=lockstep-rts` (no --profile flag needed now that the world declares it, which also confirms that fix). At cond=25/5/1 with inputDelayTicks=3: simHz 29.2 and 29.1, stalls 32 and 1, timeSyncYields 11 and 0, advantage 2, inputLatencyMs p50 100.5. At cond=25/5/1 with inputDelayTicks=6: simHz 24.2 and 23.9, stalls 22 and 4, timeSyncYields 86 and 79, advantage 6, inputLatencyMs p50 204.3. So raising the delay to the value the docs recommend for a lossy link cuts stalls roughly in half but costs about 20 percent of the simulation rate, and the cost lands on timeSyncYields, which go from 11 to 86 on peer-a. The delay is not the cause: the zero-latency control at the same inputDelayTicks=6 gives simHz 28.9 and 28.9 with timeSyncYields 15 and 3 and advantage 0, so with no jitter to amplify the sync barely yields and the sim holds its rate. The cause is the advantage term driving the yield loop once per-tick arrival times vary. A lockstep sim below its tick rate is not a throughput statistic -- the world advances slower than the game intends, which reads as slow motion to the player. CAVEAT ON THE WITNESS: all four runs were taken while other agents were loading the box, and simHz is exactly the kind of figure CPU contention depresses, so the 24.2 number needs a quiet-box re-run before it is quoted as the defect''s size. The 28.9 versus 24.2 contrast was measured within the same session and is the part I trust.'
- acceptance_criteria: 'Name the mechanism for the 12 ticks and the asymmetry: which peer starts the session, what the other is waiting for, and why the wait is exactly 12 ticks rather than however long the peer takes. Then either fix it so both peers begin on the same tick, or exclude the startup run from the stall statistic operators read and say so in docs/netcode.md, which documents `client.peerStats.loop` stalls without mentioning that a healthy session reports about 12 of them on one peer. If the stall is instead unavoidable session-start cost, say that and leave the count, but make it legible.'
  id: lockstep-peer-a-stalls-12-consecutive-ticks-at-startup-peer-b-none
  session_id: f73df536-0f66-49a1-8888-2a064d23416a
  status: pending
  subject: 'NARROWED 2026-10-02: the 12-tick run is a single contiguous startup stall, not a steady-state rate. The decisive measurement is cond=0/0/0 with inputDelayTicks=6, where peer-a reports stalls 12 and maxStallRun 12 and peer-b reports stalls 0. Total equal to max run means every stall peer-a recorded belongs to one unbroken 12-tick episode; and with zero latency, zero jitter and zero loss there is no network term that could produce a steady-state stall at all, so the episode is at session start. corroborating runs: cond=0/0/0 inputDelayTicks=3 gives peer-a stalls 13 maxStallRun 12 (one episode plus one), peer-b 1; cond=25/5/1 delays 3 and 6 give peer-a 32 and 22 against maxStallRun 12 in both, so the extras above the 12 -- 20 and 10 -- are the part that tracks the link. Desyncs zero in all four runs and checksumsCompared 11-14, so agreement is never at risk; this is a measurement-legibility and cold-start defect, not a correctness one. What remains open is the mechanism: why exactly 12, and why the cost falls entirely on one peer. Both peers end with simTicks differing by at most 6 ticks, so they are not drifting apart -- one simply waits at the start. It is about 400 ms of frozen simulation at 30 Hz for that peer, and it is baked into the statistic an operator reads.'
- body: 'MECHANISM FOUND, and it voids every draws number quoted from the WebGPU arms. The harness read three''s renderer.info.render.calls, which the WebGPU (renderers/common) renderer increments ONCE PER SCENE RENDER (Renderer.js: this.info.render.calls++) and never resets -- Info.reset() is only called from three''s own Animation helper, and spoint drives its own rAF loop -- so the value ramps 0 to max across a run. The arms'' own data carries the signature of a linear ramp: W-v1j avg/max=0.512 p95/max=0.948 max/frames=3.81 and W-v1k 0.515 / 0.948 / 3.84, where a ramp''s mean is 0.5*max and its p95 is 0.95*max; 3.8 is scene renders per frame, not draws. So 19,336 was never a draw count and there is no 43x regression -- the metric was undefined on this backend. Fixed in 8f5214d1 (pushed): per-frame DELTA of info.render.drawCalls (WebGL keeps render.calls, which WebGLInfo increments per draw), triangles per frame the same way, and because WebGPU has no GL context the rig wraps GPUDevice/GPUQueue/GPU{CommandEncoder,RenderPassEncoder,ComputePassEncoder,RenderBundleEncoder}/GPUCanvasContext prototypes to report wgpuCallsPerFrame + wgpuDrawsPerFrame in the same 10 s window. REMAINING: 8f5214d1 is not yet witnessed end-to-end. Run one 25 s no-walk arm and confirm draws/frame now lands in the hundreds; if it does not, the metric is still wrong and every downstream row that depends on a draw count stays blocked. Counting this row closed requires that witness, not the commit.'
  id: draw-counter-reads-19336-against-established-450-draw-figure
  title: Establish what the draws.avg witness counter counts before quoting it as a draw-call measurement
  session_id: f73df536-0f66-49a1-8888-2a064d23416a
