- id: amd-veg-prewarm-loses-4-of-6-4-seconds-to-yield-waits
  title: AMD vegetation prewarm spends 4109 of 6407 ms in yield waits; the work-sliced prewarm overshoots the +2 s boot bound on AMD
  body: 'Measured 2026-10-07 on the built bundle with the adapter asserted, tps-game at=-15,-12.5. The work-sliced prewarm (45b67de9bc, PREWARM_SLICE_MS = 24, macrotask yield) costs NVIDIA 2601 ms wall with 1042 ms of actual work -- faster than the 3509 ms wall-clock prewarm it replaced. On AMD it costs 6407 ms wall with only 2281 ms of work, about 2.4 s SLOWER than the ~4000 ms pre-fix AMD prewarm, which is just over the +2 s bound the pop-in row allowed. The whole difference is waiting, not compute: AMD''s rAF period is 49.99 ms versus NVIDIA''s, and 4109 ms of AMD''s 6407 ms is yield waits. So the slice size that is right for NVIDIA is wrong for AMD. Two admissible fixes, in order of preference: (1) size PREWARM_SLICE_MS per vendor from a measured frame period instead of a fixed 24 ms -- AMD''s frame is ~3x NVIDIA''s, so a larger slice is the same fraction of a frame; (2) move placement off the main thread entirely, which removes the yield dependency rather than tuning it. Do not fix it by lowering the AMD coverage or by reintroducing a chunk cap -- that is the bug that was just fixed. Measure: AMD prewarm wall and work ms before/after, and veg coverage at reveal must stay above 80%.'
  acceptance_criteria: AMD prewarm wall time is within +2 s of its pre-45b67de9bc value with veg coverage at reveal still above 80%, witnessed on the built bundle with the AMD adapter asserted; AMD's work ms and wait ms are both reported so the win is provably not a coverage loss.
  session_id: f73df536-0f66-49a1-8888-2a064d23416a
  status: pending
