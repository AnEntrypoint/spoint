- id: cpu-weather-tick-11pct-inclusive
  title: The rain/snow weather tick takes 11.1% of main-thread CPU on a walk; the streaming-instancer matrix writes (setMatrixAt 4.0% + F 1.2% self) and part of writeBuffer (4.2%) are probably its per-particle uploads
  body: 'Tier-0 profile, 3 NVIDIA arms medians (AMD n=1: 12.9%): the weather tick (bundle app.js:1801 dt, client/core/Weather.js) is 11.1% inclusive. The hot self function setMatrixAt at bundle app.js:1162 (4.0%, plus F 1.2%) is client/core/WebGPUInstancing.js createStreamingInstancer (add/update/setMatrixAt with a Matrix4.toArray per call), whose consumers are Weather.js and Grass.js, so the rain/snow particles write one instance matrix on the CPU per particle per frame and upload dirty ranges through GPUQueue.writeBuffer (4.2% self, also feeds from the vegetation LOD pools). This attribution is from source reading plus self-time identity, not from a caller tree; the raw .cpuprofile now saved per arm gives the caller tree. Earlier fixes 5fabf8d1 and 96baf453 moved droplet impact height sampling; terrain height sampling is split into its own row cpu-terrain-height-sampling-main-thread-7pct. Structural candidate: animate particles in the vertex shader from a per-instance seed and a time uniform, with zero per-frame CPU writes (GPU Gems 3 ch. 23 style), keeping only impact splashes on the CPU.'
  acceptance_criteria: Caller tree from the saved .cpuprofile confirms the Weather share of setMatrixAt and writeBuffer; weather tick inclusive share and writeBuffer bytes per frame drop by a root-cause change over 3 same-bundle arms on both GPUs (AMD n>=3) with rain and snow visibly unchanged at a fixed pose (pixel compare against the pre-registered criterion).
  session_id: f73df536-0f66-49a1-8888-2a064d23416a
  status: pending
