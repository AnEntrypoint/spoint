  title: Lattice-mode heightfield builds sample the CPU shadow frame and streamer.fields reports lattice coordinates
  body: 'While a lattice is active, recentre builds sample shadow.groundHeightLocal on the CPU: 1.5-2.5 s per N=128 field in 2 ms slices, versus the baked heightfield path of the identity chart. streamer.fields (read by WorkerEntry DEBUG_COLLIDER_RESULT) returns field centres in the lattice frame, not the live chart. Measure sample time per field baked vs CPU, and either map centres through lattice.toChart in the getter or document the frame in the debug reply.'
  acceptance_criteria: Per-field sample ms for identity (baked) vs lattice (CPU) reported before/after any change; DEBUG_COLLIDER_RESULT terrainFields centres equal live-chart coordinates while a lattice is active, witnessed with a real follow switch.
  session_id: f73df536-0f66-49a1-8888-2a064d23416a
  status: pending
- id: cpu-shadow-render-17pct-cpu-for-0.05ms-gpu
  title: Shadow rendering costs 17.5% of main-thread CPU while its GPU pass is 0.05 ms
  body: 'Tier-0 profile (recall project/tier0-cpu-gpu-profile-2026-10-05, 3 NVIDIA arms): updateShadow/renderShadow inclusive 17.5% of 131 s of main thread on a 120 s real walk; the shadow render contexts (1024x1024 ortho, about 1.8 per frame) take 0.049 ms of GPU each. The cost is per-caster CPU submission (renderObject, binding updates, projectObject) per cascade, not GPU work. Candidates: render the far cascade only when the light moves a texel (the same skip already exists for vegetation via onBeforeShadow on legacy, check the WebGPU path), cull casters per cascade with the existing BVH instead of per-object, or record the static caster set once.'
  acceptance_criteria: 'Same 120 s walk arm, 3 same-bundle arms, reachability PASS: updateShadow inclusive share and frame p50/p95/p99 before and after, shadow image unchanged at a fixed pose (pixel compare).'
  session_id: f73df536-0f66-49a1-8888-2a064d23416a
  status: pending
- id: cpu-veg-lod-instancer-full-scan-per-move
  title: 'WebGPULodInstancer.updateLOD rescans every instance of every instancer each time the camera moves 0.5 m: 6.7% self CPU, top function'
  body: 'client/core/WebGPULodInstancer.js updateLOD: when the eye moves LOD_REEVAL_MOVE_SQ (0.5 m) it loops over every rec of the instancer and recomputes its tier; there are 90 instancers (15 species x 3 variants x branch+leaf), so on a walk at 7 m/s this runs about 14 times a second over all ~4300 vegetation instances per instancer set. Measured top self function on 3 NVIDIA arms (bundle app.js:1178 ''H'') 6.7%, 6.8% on AMD. Candidates: bucket instances by distance ring so only buckets near a threshold are re-tiered, or collapse variants into one instancer per species-part (also veg-variation-doubles-draws-and-halves-fps).'
  acceptance_criteria: updateLOD self share and frame p50/p95/p99 on the same 120 s walk arm, 3 same-bundle arms, before and after; tier assignment identical (count per tier at a fixed pose equal).
  session_id: f73df536-0f66-49a1-8888-2a064d23416a
  status: pending
- id: cpu-weather-tick-11pct-inclusive
  title: The rain/snow weather tick takes 11.1% of main-thread CPU on a walk
  body: 'Tier-0 profile, 3 NVIDIA arms: the weather tick (bundle app.js:1801 ''dt'', client weather rain/snow update) is 11.1% inclusive; it respawns particles and samples ground height (terrain height noise msH3i/msSnoise3/composeHeight together ~7% self, PlanetFrame.solveSurfaceY 5.4% inclusive). Earlier fixes (5fabf8d1, 96baf453) moved droplet impact height sampling; the remaining cost should be re-attributed: which callers of composeHeight/solveSurfaceY run per frame on a walk (weather, placement, minimap, prediction).'
  acceptance_criteria: Callers of composeHeight/solveSurfaceY named with per-caller ms from a CPU profile on the walk arm; weather tick inclusive share reduced by a root-cause change over 3 same-bundle arms with rain/snow visibly unchanged.
  session_id: f73df536-0f66-49a1-8888-2a064d23416a
  status: pending
- id: cpu-allocation-2.6mb-per-frame-unattributed
  title: The client allocates 190-200 MB/s (2.6 MB per frame) on a walk; 430 minor GCs per 132 s
  body: 'Tier-0 profile, 3 NVIDIA arms, precise-memory heap sampled every frame: 427-446 heap drops over 128 KB per 132 s, 12.7-13.2 GB freed, 190-201 MB/s allocated. GC self time is only 0.7% of the profile, but 2.6 MB/frame is far above what a steady-state frame should allocate and is the likely source of minor-GC frame jitter. Not yet attributed: needs HeapProfiler.startSampling on the walk arm to name the allocation sites.'
  acceptance_criteria: Top allocation sites from a sampling heap profile on the walk arm, each with MB/s; root-cause fixes (pooling/in-place mutation) bring allocation below a stated target over 3 same-bundle arms, with p95/p99 before and after.
