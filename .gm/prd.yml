  status: pending
  subject: 'Lockstep runs its simulation at 24.2 Hz against a 30 Hz target when configured the way docs/netcode.md recommends for a lossy link, because frame-advantage time sync over-yields under jitter. MEASURED 2026-10-02 with `node scripts/peer-profile-harness.mjs --world=lockstep-rts` (no --profile flag needed now that the world declares it, which also confirms that fix). At cond=25/5/1 with inputDelayTicks=3: simHz 29.2 and 29.1, stalls 32 and 1, timeSyncYields 11 and 0, advantage 2, inputLatencyMs p50 100.5. At cond=25/5/1 with inputDelayTicks=6: simHz 24.2 and 23.9, stalls 22 and 4, timeSyncYields 86 and 79, advantage 6, inputLatencyMs p50 204.3. So raising the delay to the value the docs recommend for a lossy link cuts stalls roughly in half but costs about 20 percent of the simulation rate, and the cost lands on timeSyncYields, which go from 11 to 86 on peer-a. The delay is not the cause: the zero-latency control at the same inputDelayTicks=6 gives simHz 28.9 and 28.9 with timeSyncYields 15 and 3 and advantage 0, so with no jitter to amplify the sync barely yields and the sim holds its rate. The cause is the advantage term driving the yield loop once per-tick arrival times vary. A lockstep sim below its tick rate is not a throughput statistic -- the world advances slower than the game intends, which reads as slow motion to the player. CAVEAT ON THE WITNESS: all four runs were taken while other agents were loading the box, and simHz is exactly the kind of figure CPU contention depresses, so the 24.2 number needs a quiet-box re-run before it is quoted as the defect''s size. The 28.9 versus 24.2 contrast was measured within the same session and is the part I trust.'
