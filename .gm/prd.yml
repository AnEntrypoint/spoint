- id: veg-lod-share-cell-classification-across-branch-leaf-instancers
  title: Share cell classification between the branch and leaf instancers of one species
  body: Vegetation.updateVisibility calls rec.branch.updateLOD and rec.leaf.updateLOD with identical camera, frustum and instance positions (4277 trees, ~8.5k records). Each WebGPULodInstancer now classifies its own cells (a few hundred plane tests per frame); a shared cell index keyed by position would halve that and let impostor instancing reuse it. Measure the classification cost per frame first (Node script like scratchpad lod-equiv.mjs) before building; only worth it if classification exceeds ~20 pct of the remaining updateLOD time in the after-arm profile.
  acceptance_criteria: Measured classification share from the after-arm cpuprofile; if above 20 pct of updateLOD inclusive, shared index implemented with the same 0-mismatch equivalence witness; otherwise closed with the number.
  session_id: f73df536-0f66-49a1-8888-2a064d23416a
  status: pending
  blockedBy:
  - external
  deferReason: Confirmed real and measured, but it is a different subsystem change than this fix. After the pending-rebuild fix, rebuildRecords is 12797.5 of the 16311.3 remaining instance visits per frame in real90, and client/core/Vegetation.js builds the branch and leaf instancers of one species with identical level distances (0, D1, D2), identical hysteresis LOD_HYS and one shared bounding box/sphere, so the pair classifies the same cells twice per frame. Sharing it needs a shared immutable index (CSR offsets computed over slots plus per-cell posMin/posMax/cenMin/cenMax/minR/maxR) rebuilt once per pair while each instancer keeps its own order/cellOf/mode/tier/stamp/active; that is a construction-site change in Vegetation.js, outside this lane single-writer surface, and it depends on an add/remove-sequence alignment invariant between the pair that has to be asserted in loadChunk/unloadChunk. It also needs its own witness shape (a branch/leaf pair) and its own before/after browser proof, which this session has no budget left to run. Measured opportunity recorded as mem-bb97f2b8f054e4b4-1157.
