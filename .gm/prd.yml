- id: gpu-main-pass-9.5ms-amd-no-subpass-attribution
  title: On the AMD iGPU one render pass (the 1280x720 main scene) is 9.5 ms of a 10.6 ms GPU frame; three's per-render-context timestamps cannot split terrain, vegetation, sky or water inside it (plan gpu-optimization-plan-browser-webgpu Tier 0 gap)
  body: 'Timestamp-query is available on both adapters (hasFeature true: NVIDIA ampere, AMD rdna-2). Covered render contexts per frame: ctx0 main scene 1280x720 PerspectiveCamera (NVIDIA 2.62-2.94 ms avg, AMD 9.51 ms avg, max 30.5), ctx2 shadow 1024x1024 OrthographicCamera about 1.8 per frame (NVIDIA 0.049 ms, AMD 0.099 ms), ctx1 final canvas blit (0.039 / 0.181 ms), plus one unnamed minor context in one arm (0.08 ms). There are no separate post, SSAO, bloom, sky or terrain passes: sky, terrain, water and vegetation are all draws inside ctx0, so Tier-0''s per-pass table cannot rank them. Both shadow cascades share ctx2 and are not distinguishable. AMD GPU frame p50 10.6, p95 19.2, p99 23.1 ms and a frame p99 of 34.8 ms (NVIDIA p99 27.8) make AMD the GPU-bound target; the 1920x1080 and 1440p resolutions are not measured (both 1080p arms hung).'
  acceptance_criteria: 'A per-draw-group GPU cost for ctx0 on AMD at 1280x720: either (a) three timestampWrites split by render bundle or by splitting terrain/sky/water/vegetation into separate render passes behind a debug flag, or (b) an ablation series (terrain off, vegetation off, sky off, water off, shadows off) of GPU frame ms on the same walk pose, n>=3 per condition with AMD variance reported, contamination buckets and adapter vendor recorded. The 1080p arm on both GPUs completes.'
