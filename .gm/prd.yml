- id: legacy-glsl-terrain-cannot-evaluate-hashversion-2
  title: Legacy GLSL terrain pipeline cannot evaluate hashVersion 2 or carves
  body: 'Reachable configuration: a device with no working WebGPU adapter at all, so client/app.js falls back to the legacy THREE.WebGLRenderer, joining a remote server whose world is hashVersion 2 (the default). The client cannot pin the remote server to hashVersion 1, so mapspinner draws hashVersion 1 while the server simulates hashVersion 2 and TerrainBackdrop.js:37 logs the mismatch. packages/mapspinner/src/shaders/terrain.glsl has no hashVersion switch and no carve term (and no integer hash), and src/height-gen.js is generated from it, so both the drawn ground and the CPU sampler are v1-only. Not fixable by pinning at the client: either port the v2 integer hash, the octave-rotation table and the carve term into the GLSL pipeline (and regenerate height-gen.js), or move the legacy fallback onto a TSL/WebGL2-backend path. mapspinner/terrain-render surface.'
  acceptance_criteria: Boot with WebGPU forced unavailable (?webgpu=1 is refused or adapter absent) against a remote hashVersion 2 world and show collider height == rendered surface at the same seven points used by the v1/v2 parity witness, with no TerrainBackdrop mismatch error. Regenerate src/height-gen.js from the ported GLSL and show scripts/height-parity.mjs agreeing with the TSL path at hashVersion 2.
