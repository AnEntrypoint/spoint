  id: prd-row-id-backdrop-4s-contradicts-its-own-body
  area: boot
  title: PRD row boot-terrain-backdrop-4s-webgpu-8s-legacy has an id that contradicts its own body, and the id is what readers quote
  body: 'MEASURED 2026-10-06 by reading .gm/prd.yml: row boot-terrain-backdrop-4s-webgpu-8s-legacy carries id text ''4s-webgpu-8s-legacy'' while its own body says ''backdrop 5.2-6.5 s from boot:backdrop:start to returned'' on WebGPU and ''Legacy: planet init 6.2 s plus 1.4 s uninstrumented GL setup'' -- so neither number in the id matches the measurement the row records (the legacy 6.2 s is also a sub-phase, planet init, not the whole legacy backdrop phase, so it is not comparable to the WebGPU start-to-returned figure at all). A coordinator directive reconciling this row against an AMD 21.74 s measurement quoted the figures as ''the 4/8 s figure'', i.e. it read the id and not the body, which is the harm: a stale id outlives the body it summarises and every downstream reader takes it as the number.'
