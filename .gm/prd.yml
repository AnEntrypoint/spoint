- id: gpu-plan-instance-transform-quantized-layout
  title: Vegetation instance pools upload a full 16-float matrix per instance into a dirty-range buffer; a quantized per-instance transform cuts the bytes fourfold and the CPU compose with them
  body: |-
    Parent row: gpu-optimization-plan-browser-webgpu. Bottleneck attacked: per-instance CPU matrix composition and upload bytes; instance vertex-fetch bandwidth is a secondary, expected-negligible term.

    EXACT SITES. client/core/WebGPULodInstancer.js:76 -- writeSlot does "mesh.instanceMatrix.array.set(rec.matrix, slot * 16)", a raw 16-float (64-byte) copy per instance straight into the InstancedMesh instanceMatrix array; markSlotDirty at line 24-33 then calls setDirtyRange(mesh.instanceMatrix, 16, n, newWindow) at line 29, so the upload is a contiguous floored window from dirtyLo to dirtyHi over the whole matrix array. build() at line 36 doubles capacity and copies "mesh.instanceMatrix.array.subarray(0, ids.length * 16)" (line 47). There are 90 instancers (15 species x 3 variants x branch+leaf) over roughly 4300 vegetation instances per instancer set, plus a shadow-only pool on SHADOW_CASTER_ONLY_LAYER (lines 56-59).

    ATTRIBUTION CORRECTION (load-bearing, do not re-merge). The tier-0 profile figure "setMatrixAt 4.0% CPU self" belongs to the WEATHER particle streaming instancer, not to this vegetation path -- row cpu-weather-tick-11pct-inclusive states it as "the streaming-instancer matrix writes (setMatrixAt 4.0% + F 1.2% self)" under the weather tick at 11.1% inclusive. This row therefore claims only GPUQueue.writeBuffer at 4.2% self (which covers all buffer uploads, so this path share of it is unmeasured) and the allocation census at 190-201 MB/s, about 2.5-2.6 MB per frame. Do not cite setMatrixAt here.

    CHANGE. Replace the 64-byte per-instance matrix with a quantized transform -- position as three f32 or three i16 in a local frame, uniform scale, and orientation as a smallest-three quaternion in four i16, or as a single yaw where the species allows it -- and compose the matrix in the vertex stage. Upload bytes per instance fall roughly fourfold and the CPU-side compose (rec.matrix is built by the caller) disappears from the write path.

    SCOPE BOUNDARY. This is the data-layout half only. Sibling rows own the others: cpu-veg-lod-instancer-full-scan-per-move (the tier rescan), veg-variation-doubles-draws-and-halves-fps (90 instancers from 3 variants), veg-instancer-dirty-window-per-attribute-ranges (upload windowing), cpu-allocation-2.6mb-per-frame-unattributed (the allocation census). Do not re-litigate those here.

    RISK. The vegetation wind displacement reads the instance matrix and client/core/Vegetation.js patches it through onBeforeCompile on the legacy path with a TSL wind path alongside, so the vertex-stage composition must reproduce instance-local orientation exactly or wind direction and impostor billboard orientation shift. Fix a pose and compare before trusting any number. This row does NOT touch the normal or the lighting arithmetic, so it is outside the active TSL-vs-legacy terrain darkening investigation.

    MEASUREMENT CLASS: the primary metrics are CPU-measurable without a GPU window -- bytes uploaded per frame (encoder hook plus the dirty-range n x 16 sizes), writeBuffer CPU self share from the existing profile, and allocation MB/frame from the existing census. Only the frame-time claim needs a GPU window queued through C:/dev/train/tools/gpulock.mjs. UNMEASURED: no predicted delta; the GPU-side vertex-fetch saving is expected to be negligible at these instance counts and is not the reason to do this.
    GPU ATTRIBUTION (required for every browser arm in this row). scripts/lib/gpu-probe.mjs exports probeGpu(page), assertGpu(page, { requireAccelerated, expectVendor }), gpuArgs({ accelerated }), SOFTWARE_ARGS and ACCELERATED_ARGS, and its CLI takes --accelerated, --require-accelerated and --expect-vendor=<regex>. Take every measurement with --accelerated --require-accelerated and --expect-vendor set to the adapter under test, and record the returned rasterizer class ("accelerated" vs "software") and adapter vendor/architecture next to each number. This is not optional: scripts/frame-time-gate.mjs:92 and scripts/cold-load-gate.mjs:48 both launch --use-angle=swiftshader, so an unasserted browser session can silently be software and neither CI gate would object. A number taken under a different rasterizer class than its baseline is not comparable and does not close this row.
  acceptance_criteria: 'CPU-measurable half first, no GPU window: bytes uploaded per frame (encoder hook plus the markSlotDirty window sizes), GPUQueue.writeBuffer self share, and allocation MB/frame, live scene, before and after, n>=3 runs. Frame-time claim via C:/dev/train/tools/gpulock.mjs on both adapters, n>=3 same-bundle arms with a zero-delta control arm in the same window, PASS only if the delta exceeds that control arm delta. Correctness: per-instance world transforms at a fixed pose match the 16-float matrix build within a stated tolerance, vegetation wind displacement direction and impostor orientation pixel-compare unchanged, and the per-tier visible-instance histogram is identical. Every browser arm must additionally pass --accelerated --require-accelerated with --expect-vendor set to the adapter under test (scripts/lib/gpu-probe.mjs CLI), and each number must be reported together with its rasterizer class and adapter vendor; a software-rasterizer arm is a failed arm, never a baseline.'
