- id: terrain-heightfield-residency-change-raycast-drift-and-misses
  title: Terrain raycast drift and misses when the resident heightfield set changes under a point
  body: |-
    Separate mechanism from terrain-heightfield-raycast-drift-between-identical-builds (Jolt height quantization re-anchored by a field's own min/max, fixed by snapping samples to 1 mm in sampleTerrainGridChunked). Here the samples are fine and the collider still moves, because WHICH field answers the ray changes.

    Measured with data/planet-harness/drift-churn.mjs (8 players, tps-game world, 45 s at 7 m/s, then all players shifted +128 m to force residency churn, 64x64 grid per field):
      - maxDiffWhereHitBodyChangedM: 0.016933 (16.9 mm) over 12800 grid points whose hit bodyId changed
      - hitBodySamePoints: 0 -> every point in the grid changed owner, so no same-owner comparison was possible in that run
      - missesAfterChurn: 19968 (a point that was covered before the churn is not answered at all afterwards)
      - back to back with no churn: 0.000000 m, 0 misses

    This is the shape the original row reported as 'misses track machine load': data/planet-harness/upkeep.mjs awaits the streamer between captures and has no settle, so under load a rebuild or a retire is in flight when the grid is taken and points read uncovered or read off a different corner's field. Two distinct sub-cases: (a) a different snapped corner covers the point (snapCorner quantizes centre to spacing, so a field's footprint jumps by up to one cell), and (b) the covering body was retired and its replacement is not installed yet.

    Not addressed by the 1 mm snap: the snap makes two builds of one corner bit-identical, it does not make two different corners agree at their seam, and it does not stop a point from being momentarily uncovered.
  acceptance_criteria: 'Either remove the drift or state the bound terrain-correctness claims must respect. Concretely: (1) measure the seam - at a point covered by two neighbouring resident fields, report the raycast difference between the two bodies that can answer it, and state whether cross-field disagreement is bounded by the same range/30000 quantization or exceeds it; (2) measure the uncovered window - report how long a covered point can read as a miss across a retire+build, and whether the streamer can keep the old body until the replacement is installed; (3) re-run the churn harness and report maxDiffWhereHitBodyChangedM and missesAfterChurn after the change, or state the bound: a before/after terrain comparison is only meaningful on points whose covering field corner is unchanged on both sides, and a miss at a previously covered point is a residency event, not a height defect.'
  status: pending
- id: tsl-parity-amd-valid-pair-fails-terrain-grass-leftedge-on-non-relief-poses
  title: 'First valid AMD TSL-vs-legacy pair: sky and water match, terrain grass leftLower and leftEdge do not, and greyRelief1 passes'
  body: 'The AMD window .gm/tsl-parity/run-amd-pinned-vegwarm is the first in this project to come back ''amd pair valid''. It is admissible on every proof available: served bytes verified 63/63 against a materialized git archive of b69c775453232fcd9d734d0477c11d3d4675d2c6 both before the first arm (2026-10-06T02:55:36Z) and after the last (2026-10-06T03:05:36Z), the same server pid 141124 at both ends with root C:\dev\spoint\.gm\pinned\b69c77545323, node_modules materialized rather than symlinked to the live tree, all 37 mapspinner modules byte-identical across arms (hashDiffers=0), and executed mapspinner bytes equal disk PASS with checked 37 and mismatched []. Adapters: legacy cls=WebGLRenderer backend=webgl2-legacy gpu=ANGLE (AMD, AMD Radeon(TM) Graphics (0x00001681) Direct3D11 vs_5_0 ps_5_0, D3D11); TSL cls=WebGPURenderer backend=webgpu gpu=amd rdna-2. Both arms settled at 233 vegetation instances with the last five samples constant, zero page errors and zero console errors. Region ratios (ratio = meanAbs/floor, K=3, floorMin=1): sky passes everywhere at 0.045 to 0.131 and water passes everywhere at 0.112 to 0.526. terrain fails on the three plain poses at 3.799 (skyPose), 3.817 (ground), 4.030 (grey) and passes on greyRelief1 at 2.605. grass fails at 3.575, 3.713, 3.731 and passes at 2.129. leftLower fails at 4.474, 4.506, 4.451 and passes at 2.016. leftEdge is the worst at 7.089, 6.627, 6.560 and passes at 2.036. vegColumn passes at skyPose 2.832, fails at ground 3.455, grey 3.485 and greyRelief1 3.137. Two shapes stand out. The sign flips with the pose: terrain, leftLower and leftEdge deltas are consistently negative on the plain poses (TSL darker, leftEdge about -7 to -5.4 per channel) while on greyRelief1 the terrain and grass deltas are small and positive (about +0.86, +0.77, +0.67). And the magnitude is ordered leftEdge > leftLower > terrain ~ grass > vegColumn, which is a spatial gradient toward the left edge of the frame rather than a uniform shading offset. So the divergence lives in the terrain and grass shading path that the greyRelief1 albedo-relief override bypasses, and it is largest at the frame''s left edge. Next step is to bisect that path on a GPU arm: the relief override is the cheapest lever, since it already makes every land region pass.'
  acceptance_criteria: 'A GPU arm isolates which stage of the TSL terrain and grass path diverges: the same poses captured with and without the relief override, and with the sky and water paths left alone, showing which stage''s removal or substitution makes terrain grass leftLower and leftEdge pass on the plain poses, with the left-edge gradient explained.'
  status: pending
- id: terrain-lattice-recentre-field-resample-cost
  title: 'A lattice recentre re-solves every field on the CPU: 2.1-2.7 s per N=128 field'
  body: |-
    Measured 2026-10-06 on tps-game (radius 63600 m) with the real exported sampleTerrainGridChunked at a real resident field corner (-126.99212598425197, -126.99212598425197), N=128, spacing 2.016 m, and with the real chartReanchor service driven through two follow hops to 6.166 deg of tilt (data/planet-harness/lattice-cost.mjs, logs lc-baked.log, lc-baked-fixed.log, lc-cpu-fixed.log):
      - baked identity chart, baseHeightFn of a world whose .hf verifies: 9.2 / 9.8 ms per field
      - exact CPU, no baked artifact (heightSource cpu): 1185.2 ms baseHeightFn, 1258 ms liveHeightFn
      - lattice heightFn at 6.166 deg: 2142.1 ms on the baked world, 2681.8 ms on the CPU world
      - the streamer's own logged recentre builds on the lattice: sample 1502 ms and 3028 ms (baked world), 891 ms and 2377 ms (CPU world)
    So a follow switch costs roughly 2.3 s of solver CPU per field it has to recentre, in 2 ms slices, and the lattice frame evaluates the same planet over the same physical ground as the chart frame does. Not shipped: nothing here is a cost change, the measurement is the deliverable. The open question is whether a recentre can start from the resident field's samples re-expressed through the chart transfer (plus a residual solve over the cells the transfer moves most) instead of re-solving all 16384 cells, and whether the result stays inside the collider's own quantization bound (about range/30000, 2.1 mm on a 64 m range field).
  acceptance_criteria: Report per-field sample ms for a lattice recentre before and after seeding the new field from the resident field's samples re-expressed through createChartTransfer, on the same world and the same 6.166 deg tilt, with the per-cell residual against a full solve and the raycast difference over a 64x64 grid between the seeded build and the full solve. Ship the seeded form only if the raycast difference stays at or below the collider quantization bound (range/30000). If the residual is bounded but not small enough, say so and close with the measured residual instead.
  status: pending
- id: tsl-parity-geomorph-off-null-control-has-no-legacy-arm
  title: The TSL-vs-legacy geomorph-off null control exists for the TSL arm only, and neither geomorph boot has a settle body
  body: 'Every normal-path toggle the divergence hunt needs is already reachable from the page, so no new exposure is required: window.__texNrmK and window.__flatNormal are read per frame by BOTH renderers (legacy through gl-render.js:419 _g(n,d) which reads window[''__''+n] and coerces with +v, called at gl-render.js:1270 for uTexNrmK and :1300 for uFlatNormal; TSL through planet-tsl.js:258-259 in frame()), and window.__geomorphLod is read at planet-init through RenderControls.get (RenderControls.js:231 globalName=''__''+key, :237 reads window[globalName]) and passed as opts.geomorphLod by TerrainBackdrop.js:65 for TSL and :70 for legacy, landing in planet-tsl.js:95 and planet-orchestrator.js:25. bodies.mjs:88-101 already emits le-texNrmK0, le-flatNormal, le-texNrmK0FlatNormal and le-texNrmK0FlatNormalShadowOff for BOTH arms (build.mjs:28 tsl-left-edge and :32 legacy-left-edge), so the four discriminating arms are drivable today. The gap is the null control: build.mjs:33-34 defines only tsl-geomorph-off-boot and tsl-geomorph-off-capture, so a geomorph-off measurement exists for one renderer and there is no legacy twin to difference against, and neither geomorph boot runs settleBody, so its capture can be taken before the world has settled. Fix, on the scripts/tsl-parity owner''s surface (a6863b77c190b0512): add legacy-geomorph-off-boot with url(true,''g'') and the same flags string ''window.__geomorphLod=false;'' plus a legacy-geomorph-off-capture, and run settleBody for both geomorph arms. The flag lands through Page.addScriptToEvaluateOnNewDocument before Page.navigate (bodies.mjs:57-58), which is early enough for a construction-time opt. Witness already present: bodies.mjs:32 stamps geomorphLod:String(window.__geomorphLod) into the settle artifact, so a working arm reads "false" and an untoggled arm "undefined". Second, smaller trap in the same surface: the two arms coerce differently -- legacy accepts any value via +v while TSL requires Number.isFinite (planet-tsl.js:258), so an --extra=__texNrmK=false no-ops on the TSL arm and takes effect on legacy; every extra global must be a number.'
  acceptance_criteria: A geomorph-off boot and capture exists for both the legacy and the TSL arm, both geomorph arms run a settle body, and both geomorph artifacts stamp geomorphLod "false" while the plain arms stamp "undefined".
  status: pending
- id: tsl-parity-pxworld-camdist-fp32-precision-asymmetry
  title: TSL and legacy derive the terrain pixel scale from different position bases at fp32 ulp scale
  body: |-
    TSL terrain-material-tsl.js:166 derives pxWorld from the floating-origin-relative position: max(length(fwidth(vRelP)), 0.001). Legacy terrain.glsl:806 derives it from the absolute world position: max(length(fwidth(vWorld)), 0.001). The two agree in real arithmetic and disagree in fp32: at planet radius 6.36e6 m the ulp of vWorld is 0.5 m, while vRelP is a small number of metres from the render origin, so the same surface point quantises differently on the two arms before either computes a pixel scale.

    Magnitude, measured against the band it feeds: texFarFade spans 0..10 m (terrain-defaults.js:49-50) and octFarFade 0.0015..0.015 m, so a 0.25 m quantisation of the input moves the fade factor k by a few percent. That is a contributor to the left-edge delta, not the carrier: the AMD left-edge ratio is 6.74 against an NV 2.38 and this term is present on both GPUs identically, so it cannot produce the GPU-dependent part of the gap. It is still the one difference in the ranked divergence list that no window toggle can blank, because it is inside the value both arms compute rather than in a term either arm can be asked to drop.

    Consequence: every downstream LOD and normal-map fade decision inherits it, so a left-edge window that blanks texDn and the geometric normal will still show a residual floor that this term explains, and that floor must not be read as a third carrier.
  acceptance_criteria: 'A witness that isolates the term rather than a window that guesses at it: either (a) a parity pair in which both arms compute pxWorld from the same position basis - fp64 in the shader, or a shared relative basis promoted identically on both - showing the left-edge and leftLower ratios before and after, or (b) a numeric bound stating the induced shift in k at the left-edge region and showing it is below that region''s measured noise floor. A row that only restates the ulp arithmetic without one of those two is not the acceptance evidence.'
  status: pending
- id: tsl-parity-pinned-server-stamps-process-start-not-window
  title: 'Reopened: the pinned server''s /__identity sha is the enclosing repo''s HEAD at process start, not the snapshot''s pin, and it never changes per window'
  body: |-
    Reopened deliberately. This row was marked resolved on the grounds that scripts/tsl-parity/analyze.mjs (ca481eee) no longer trusts the boot stamp and derives the capture sha from pin.json instead. That resolution left the server's behaviour exactly as it was, which is what this row is about, so it was a hedge and it is reopened here.

    The defect: GET /__identity (src/sdk/StaticHandler.js:107, stamped by src/sdk/ServerIdentity.js) reports sha = the git HEAD resolved once when the server process starts. A pinned snapshot directory has no .git of its own, so that resolution walks up to the enclosing repository and returns the repo's HEAD at process start. Observed directly: a server started with cwd C:\dev\spoint\.gm\pinned\b69c77545323 while the repo was at a318f025 reported sha=a318f025, and it kept reporting that value for every later window, including windows whose served bytes were a different pin. The endpoint therefore names neither the served content nor the window; it names whatever the tree happened to be when the process booted.

    Why it still matters with the analyzer fixed: the analyzer's pin.json fallback makes the verdict correct, but every other consumer of /__identity - run drivers, cross-session bookkeeping, anyone who curls the endpoint to ask 'what is this server serving' - gets a sha that is wrong for the whole life of the process. A stamp that is only safe because the one tool that reads it has stopped believing it is a trap for the next reader.

    Fix, scoped to the server: stamp per window, or rather per snapshot, which is what the window actually pins. scripts/pinned-snapshot.mjs materializes the snapshot; have it write the resolved pin sha into the snapshot directory (a pin.json or .pin-sha next to the served tree), and have ServerIdentity report that file's sha for the served root, falling back to the git resolution only when no such file exists. The value then describes the served bytes for the life of the server and cannot drift with the tree.
  acceptance_criteria: Start the pinned snapshot server while the enclosing repository is at a HEAD that differs from the pin, then GET /__identity and show sha equal to the pin sha b69c775453232fcd9d734d0477c11d3d4675d2c6 and not to the repo HEAD; repeat the read after moving the repo to a third HEAD without restarting the server and show the value unchanged. Also show a server started from a directory with no pin marker still reports a sane git-derived sha, so the fallback path is exercised rather than assumed.
  status: pending
- id: bake-code-version-input-list-is-hand-maintained
  title: 'Deriving the bake code version input list is blocked: the import closure is 15 files vs the hand list''s 25, misses all 11 mapspinner inputs, and hashes itself'
  body: 'Measured 2026-10-07. The relative-import closure of scripts/bake-heightfield.mjs is 15 files against the hand-maintained list''s 25. Switching to it moves the version 44ca24c0ef7b -> 7a0d67589336, which invalidates the committed apps/world/tps-game.hf (it would need re-baking and the gitlink/artifact churn that comes with it). Two structural blockers beyond that: (1) the closure misses ALL 11 packages/mapspinner inputs because the script imports them by BARE PACKAGE SPECIFIER, so a relative-import walk cannot see them; (2) it picks up ./BakeCodeVersion.js itself, i.e. hashing the file that computes the hash. So ''derive it'' is not a small change: it needs package-specifier resolution, self-exclusion, and a coordinated re-bake of every committed .hf. Until then a file outside the hand list ships stale bytes with no diagnostic — the failure mode that motivated this row. Interim mitigation already shipped (896f3351): a stale bake now throws `stale bake: stamped with height code version X, this tree bakes Y`, so at least the change is LOUD once noticed; it is only silent while nobody re-bakes.'
  acceptance_criteria: The bake code version input list is derived, not hand-written; it sees packages/mapspinner inputs; it excludes the version-computing file itself. The derived version is proven equal to the hand list's for at least one committed .hf, or every committed .hf is re-baked in the same change and the world boots with collider=baked. A source file outside the list, when edited, moves the version.
  session_id: f73df536-0f66-49a1-8888-2a064d23416a
  status: pending
- id: gpu-plan-terrain-height-compute-cache
  title: Terrain vertex stage evaluates the full height fractal five times per vertex; a compute pass writing height once per vertex into a storage buffer removes four of the five
  body: |-
    Parent row: gpu-optimization-plan-browser-webgpu. Bottleneck attacked: vertex-stage fractal math, not draw count and not fragment work.

    EXACT SITES. packages/mapspinner/src/tsl/terrain-material-tsl.js:134-146 -- Loop({ start: int(0), end: u.fdTaps.add(u.loopBoundDelta), type: "int", condition: "<" }) with FD_TAPS = 5 (constant, line 15) calls spec.composeHeight(d) at line 139 five times per vertex to build the central-difference normal; the cross product at line 147 and the lit normal at lines 162-163 consume the result. The raw-WGSL twin does the identical thing at packages/mapspinner/src/webgpu/patch-grid-render.js:341-356. The instance payload is minimal (iOffset vec4 plus iFace float, makePatchGeometry at packages/mapspinner/src/tsl/planet-tsl.js:53-65) and the whole terrain is one instanced draw (mesh at planet-tsl.js:112, single drawIndexed at patch-grid-render.js:930, about 143 quads at spawn), so the vertex cost is almost entirely the five fractal evaluations rather than fetch or submission.

    WHY THIS IS THE RIGHT TARGET. packages/mapspinner/AGENTS.md records the deck measurement "RUNTIME FPS is VERTEX-SHADER-bound (96% VS+raster at the deck, FS is a dead lever)". The AMD rdna-2 main scene context is 9.51 ms average (max 30.5) against a 1024x1024 shadow context at 0.099 ms (row gpu-main-pass-9.5ms-amd-no-subpass-attribution) -- comparable pixel counts, two orders of magnitude apart in cost, so ctx0 is dominated by shader math rather than fill. No measurement has yet split ctx0 into terrain, sky, water and vegetation, so the ceiling here is unknown.

    CHANGE. An instanced compute pass over the live patch set (instanceCount quads x GRID_SIZE grid vertices, roughly 143 x 289 at spawn) that evaluates composeHeight once per vertex into a storage buffer, with the vertex stage reading its own and its four finite-difference neighbours out of that buffer. This is the one mechanism packages/mapspinner/AGENTS.md records as genuinely untried: it is distinct from the removed terrain-phase1/2/3 pipeline and from the THC height pool, because THC was MEASURED NET-NEGATIVE for a different reason (it moved cost from VS to FS by adding a per-pixel texture fetch), whereas this keeps the cost in the vertex stage and only removes duplicate evaluations of the same field at the same lattice site.

    VALUE-PRESERVING AND PARITY. Read at exactly the same absLocal + (ox,oy)*step sites, so h0, the four w* taps and n0 are unchanged and no normal or lighting expression is edited. Two hazards to honour: (1) the finite-difference taps must remain inside ONE loop instance per the FXC / ANGLE d3d11 rule in packages/mapspinner/AGENTS.md -- never difference composeHeight across separate call sites, and keep the runtime bound u.loopBoundDelta, never a constant, so FXC cannot unroll the octave loop; (2) three.js WebGL2 backend has no storage buffers, so this is a WebGPU-only path and needs a guarded fallback to the current five-tap vertex stage or it breaks the automatic fallback. Because it is WebGPU-only it cannot regress the legacy GLSL parity arm directly, but it must not change the TSL arm either.

    MEASUREMENT CLASS: needs a GPU window queued through C:/dev/train/tools/gpulock.mjs (timestamp queries on real adapters; no CI gate measures a real GPU -- scripts/frame-time-gate.mjs:92 and scripts/cold-load-gate.mjs:48 both launch SwiftShader). UNMEASURED: the 5x-to-1x reduction in fractal evaluations is an arithmetic fact about the code, not a measured speedup, and its effect on frame time is bounded by the terrain share of ctx0, which is not yet measured.
    GPU ATTRIBUTION (required for every browser arm in this row). scripts/lib/gpu-probe.mjs exports probeGpu(page), assertGpu(page, { requireAccelerated, expectVendor }), gpuArgs({ accelerated }), SOFTWARE_ARGS and ACCELERATED_ARGS, and its CLI takes --accelerated, --require-accelerated and --expect-vendor=<regex>. Take every measurement with --accelerated --require-accelerated and --expect-vendor set to the adapter under test, and record the returned rasterizer class ("accelerated" vs "software") and adapter vendor/architecture next to each number. This is not optional: scripts/frame-time-gate.mjs:92 and scripts/cold-load-gate.mjs:48 both launch --use-angle=swiftshader, so an unasserted browser session can silently be software and neither CI gate would object. A number taken under a different rasterizer class than its baseline is not comparable and does not close this row.
  acceptance_criteria: 'GPU window via C:/dev/train/tools/gpulock.mjs, same walk pose, n>=3 same-bundle arms on BOTH the NVIDIA and AMD rdna-2 adapters, contamination buckets clean and adapter vendor recorded. (1) The ctx0 ablation in gpu-main-pass-9.5ms-amd-no-subpass-attribution must run first and report the terrain-off delta for ctx0, so this candidate ceiling is known before any code is written. (2) Before/after GPU frame p50/p95 and ctx0 ms. (3) A zero-delta control arm run in the same window whose measured delta sets the noise floor; PASS only if the improvement exceeds that control arm delta. (4) Bit parity: terrain height probe values and the shaded output at a fixed pose pixel-compare equal to the current build within the existing TSL/legacy parity tolerance. (5) The WebGL2-backend fallback arm renders with the five-tap vertex stage and no console error. Every browser arm must additionally pass --accelerated --require-accelerated with --expect-vendor set to the adapter under test (scripts/lib/gpu-probe.mjs CLI), and each number must be reported together with its rasterizer class and adapter vendor; a software-rasterizer arm is a failed arm, never a baseline.'
  status: pending
- id: gpu-plan-sky-march-and-ap-unconditional
  title: The sky background runs an 8-step Rayleigh/Mie march twice per pixel and the terrain runs an aerial-perspective march on every pixel, then mixes both away with a factor already computed
  body: |-
    PROVENANCE CHECKED -- the double march is deliberate, not accidental. Recall project/tsl-sky-legacy-8step-march-vs-undersampled-scattering-lut-2026-10-05 (memo mem-240f8d70540b88ce-1406) records that the legacy GL sky program never receives uUseScatteringLUT (default 0) and so integrates inscatter with an 8-step midpoint march over the transmittance LUT, while TSL originally used the single-tap baked scattering LUT; that difference was the measured root cause of a TSL-vs-legacy sky red gap (hills pose, tod 0.45: legacy 56,176,236 vs TSL 92,180,238). Fix bdc4409d47 ported the legacy 8-step march into createSkyTSL for BOTH sky and ground, and left marchRadiance (the LUT path) in place for terrain aerial perspective. So the two marches at sky-tsl.js:153-154 are load-bearing for the parity that fix bought, and reducing SKY_MARCH_STEPS or replacing a march with a LUT tap is a VALUE CHANGE that must clear the parity harness -- it is not the free win this row originally read it as.

    WHAT SURVIVES THE CHECK, AND WHAT IT ADDS. (a) The guard proposed below is still value-identical: skipping a march only when wSky already mixes it out, and skipping marchRadiance only when apGate is 0, changes no output. That part stands. (b) A much larger win becomes available, and it is the one worth planning: the memo also measures that the scattering LUT v axis is linear in distance-to-top with 32 rows, so at 5.8 atm-km altitude every ray steeper than about 55 degrees shares row 0 and LUT inscatter is 1.30-1.33x a 256-step truth there (0.99x below 50 degrees), while the 8-step march is within about 5% of truth at zenith and up to about 11 eight-bit levels off at 60 degrees. If row scattering-lut-zenith-undersampled lands and the LUT becomes accurate at zenith, the sky can go back to the single-tap LUT path and drop BOTH 8-step marches -- roughly 16 LUT samples and 32 exp per sky pixel down to about 4 -- which is several times the saving available from the guard alone. That is a value-changing change and is gated on the parity harness, not on this row. Treat the guard as the always-admissible half and the LUT route as the larger, gated half.

    Parent row: gpu-optimization-plan-browser-webgpu. Bottleneck attacked: per-pixel transcendental and LUT-fetch work that is computed and then discarded.

    EXACT SITE 1 (sky). packages/mapspinner/src/tsl/sky-tsl.js:153-154 -- "const sky = marchSteps(camera, ray, sun, distToTop(r, mu))" and "const ground = marchSteps(camera, ray, sun, max(distToGround(r, mu), 1e-3))" are both executed unconditionally and then blended at line 156 by wSky = smoothstep(muTangent - ATM_HORIZON_BLEND_MU, muTangent + ATM_HORIZON_BLEND_MU, mu) (line 152), whose blend window is 0.012 wide, so it is 0 or 1 for essentially every background pixel. The sky background node only shades pixels where no geometry was drawn, so on nearly all of them the ground march is computed and thrown away. Each marchSteps (lines 117-139) is SKY_MARCH_STEPS = 8 (line 26) iterations of two exp() plus a transmittanceToSun LUT sample at line 133, so the discarded branch costs 8 LUT samples and about 16 exp per background pixel.

    EXACT SITE 2 (terrain aerial perspective). packages/mapspinner/src/tsl/terrain-lighting-tsl.js:81-89 -- apGate = smoothstep(AP_GATE_KM[0], AP_GATE_KM[1], dKm) with AP_GATE_KM = [3.0, 120.0] is computed at line 81, "ap = sky.marchRadiance(...)" runs unconditionally at line 83, and line 89 then does mix(lit, hazed, apGate.mul(u.hazeMul)), discarding it entirely for any fragment nearer than 3 km. marchRadiance (sky-tsl.js:89-108) is four scattering/transmittance LUT fetches plus phase functions.

    CHANGE. Guard each with the gate already computed: wrap the ground march in If(wSky less than 1.0) and wrap terrain-lighting-tsl.js:83-89 in If(apGate greater than 0.0), leaving every expression inside unchanged. Both are value-identical by construction because the discarded path is mix/select-ed out when the guard is false, so this does not alter the normal or the lighting arithmetic -- it is parity-safe in a way the other candidates on this list are not. Hazard: a non-uniform branch around a texture LUT fetch must keep the fetch at uniform control flow (the FXC / ANGLE d3d11 class); this codebase already solves the analogous problem for the terrain splat with .grad() at packages/mapspinner/src/tsl/surface-splat-tsl.js:47, so either hoist the fetches or select on the result rather than branching inside a march loop.

    WHY IT CAN ONLY PAY OFF ON ONE OF THE TWO ADAPTERS. The AMD rdna-2 GPU frame is p50 10.6 ms / p95 19.2 / p99 23.13 with the main scene context at 9.51 ms average, so per-pixel work is the only GPU lever with room there. The NVIDIA adapter is CPU-bound (frame p50 13.86-13.88 ms against GPU p50 3.08-3.34 ms, project/tier0-cpu-gpu-profile-2026-10-05), so removing per-pixel GPU work cannot move the NVIDIA frame at all and this row must not be judged on NVIDIA numbers.

    MEASUREMENT CLASS: needs a GPU window queued through C:/dev/train/tools/gpulock.mjs. UNMEASURED: no number exists for the sky or the aerial-perspective share of ctx0; if the ablation shows ctx0 is vertex-bound (candidate gpu-plan-terrain-height-compute-cache), this row ceiling is small and it should be closed as measured-and-negligible rather than implemented.
    GPU ATTRIBUTION (required for every browser arm in this row). scripts/lib/gpu-probe.mjs exports probeGpu(page), assertGpu(page, { requireAccelerated, expectVendor }), gpuArgs({ accelerated }), SOFTWARE_ARGS and ACCELERATED_ARGS, and its CLI takes --accelerated, --require-accelerated and --expect-vendor=<regex>. Take every measurement with --accelerated --require-accelerated and --expect-vendor set to the adapter under test, and record the returned rasterizer class ("accelerated" vs "software") and adapter vendor/architecture next to each number. This is not optional: scripts/frame-time-gate.mjs:92 and scripts/cold-load-gate.mjs:48 both launch --use-angle=swiftshader, so an unasserted browser session can silently be software and neither CI gate would object. A number taken under a different rasterizer class than its baseline is not comparable and does not close this row.
  acceptance_criteria: 'GPU window via C:/dev/train/tools/gpulock.mjs, n>=3 same-bundle arms, both adapters, fixed walk pose. (a) Ceiling first: ctx0 ms with the sky background node removed and with marchRadiance forced to a constant, reported separately. (b) Before/after GPU frame p50/p95 and ctx0 ms with the two guards in place. (c) A zero-delta control arm in the same window defining the noise floor; PASS only if the measured delta exceeds it. (d) Fixed-pose pixel-compare against the unguarded build within the TSL/legacy parity tolerance, and the active TSL-vs-legacy terrain darkening investigation (rows tsl-terrain-grass-brighter-than-legacy-unexplained and tsl-terrain-grey-lighting-residual) re-run and still passing, since this row edits a file on the lighting path. Every browser arm must additionally pass --accelerated --require-accelerated with --expect-vendor set to the adapter under test (scripts/lib/gpu-probe.mjs CLI), and each number must be reported together with its rasterizer class and adapter vendor; a software-rasterizer arm is a failed arm, never a baseline.'
  status: pending
- id: gpu-plan-webgpu-dynamic-resolution-three-scene
  title: Dynamic resolution is unavailable on the WebGPU path for the THREE scene, and the only GPU-bound adapter may be shader-bound rather than fill-bound, so a resolution sweep must decide this before any code is written
  body: |-
    Parent row: gpu-optimization-plan-browser-webgpu. Bottleneck attacked: fill/raster cost on the one adapter where GPU work sets the frame.

    EXACT SITES. client/core/ThreeVdrs.js:248 records THREE_VDRS_WEBGPU_UNSUPPORTED, so the FSR1 EASU + RCAS plus depth-composite path in that file (259 lines, auto controller TARGET 6.94 ms, MIN 0.5 / MAX 1.0 / STEP 0.1) never engages under WebGPURenderer. packages/mapspinner/src/webgpu/vdrs-composite.js (493 lines: BilinearUpscale, Fsr1Upscale, DepthWriteback, readBackDepthF32) already implements the upscale for the mapspinner WebGPU path, so the missing piece is the THREE-scene half only. client/core/SceneSetup.js:189-190 constructs the WebGPURenderer and 148-159 sets pixel ratio min(dpr, 2) desktop / min(dpr*0.5, 1) mobile -- that is a static ratio, not a dynamic one.

    THE MEASURED FACTS THAT MOTIVATE AND ALSO THREATEN THIS CANDIDATE. AMD rdna-2 GPU frame p50 10.6 ms / p95 19.2 / p99 23.13 with the main scene pass at 9.51 ms average, against NVIDIA GPU p50 3.08-3.34 ms where the frame is CPU-bound at 13.86-13.88 ms (project/tier0-cpu-gpu-profile-2026-10-05). The measured canvas blit context is 0.039 ms NVIDIA / 0.181 ms AMD, so one extra upscale pass is cheap. But the same profile shows the 1024x1024 shadow context at 0.099 ms on AMD while the 1280x720 main pass is 9.51 ms -- similar pixel counts, roughly a hundredfold cost ratio -- which says ctx0 is dominated by per-pixel shader math, not by rasterizing pixels, and resolution scaling would then buy close to nothing. The deciding measurement is a sweep, not an implementation.

    CONSTRAINTS. FSR1 EASU/RCAS is a plain full-screen fragment shader with no vendor extension, no compute and no CUDA, so it qualifies for both the NVIDIA and AMD rdna-2 devices in a browser. Vendor upscalers (DLSS, FSR3/4, XeSS) do not: they are not exposed to WebGPU in Chrome and are therefore out of scope for this plan. 1920x1080 and 1440p arms have never completed (both hung in the tier-0 run), so any sweep must start at or below 1280x720.

    RISK TO MEASURE, NOT ASSUME. readBackDepthF32 in vdrs-composite.js is a GPU-to-CPU readback; if the depth writeback sits on the frame critical path it converts a GPU win into a stall. Time the composite with and without DepthWriteback.

    MEASUREMENT CLASS: needs a GPU window queued through C:/dev/train/tools/gpulock.mjs for both the sweep and the implementation. UNMEASURED: no predicted delta is claimed here.
    GPU ATTRIBUTION (required for every browser arm in this row). scripts/lib/gpu-probe.mjs exports probeGpu(page), assertGpu(page, { requireAccelerated, expectVendor }), gpuArgs({ accelerated }), SOFTWARE_ARGS and ACCELERATED_ARGS, and its CLI takes --accelerated, --require-accelerated and --expect-vendor=<regex>. Take every measurement with --accelerated --require-accelerated and --expect-vendor set to the adapter under test, and record the returned rasterizer class ("accelerated" vs "software") and adapter vendor/architecture next to each number. This is not optional: scripts/frame-time-gate.mjs:92 and scripts/cold-load-gate.mjs:48 both launch --use-angle=swiftshader, so an unasserted browser session can silently be software and neither CI gate would object. A number taken under a different rasterizer class than its baseline is not comparable and does not close this row.
  acceptance_criteria: 'GPU window via C:/dev/train/tools/gpulock.mjs. Step 1 decides whether to build it: fixed walk pose, render scale 1.0 / 0.75 / 0.5 / 0.35, n>=3 arms per scale, on AMD and NVIDIA, reporting ctx0 ms and GPU frame p50/p95 per scale plus a zero-delta control arm; if ctx0 ms is not proportional to pixel count beyond that control arm delta, close this row as measured-and-inapplicable with the table attached. Step 2 only if proportional: implement the WebGPU THREE-scene dynamic resolution, same arms, PASS on GPU frame p95 improving beyond the control arm delta, with a fixed-pose pixel-compare of the upscaled frame against the 1.0 reference within a stated tolerance, and with the DepthWriteback variant timed separately so a readback stall cannot hide inside the win. Every browser arm must additionally pass --accelerated --require-accelerated with --expect-vendor set to the adapter under test (scripts/lib/gpu-probe.mjs CLI), and each number must be reported together with its rasterizer class and adapter vendor; a software-rasterizer arm is a failed arm, never a baseline.'
  status: pending
- id: gpu-plan-wire-gpu-instanced-slot-cull-and-hiz
  title: 'The shipped GPU culling passes are not on the live vegetation path: instanced-slot-cull-tsl.js has zero importers and WebGpuHizTier is reached only through a caught dynamic import'
  body: |-
    CAPABILITY CHECK ANSWERED (node-side, no browser, no GPU window). Installed three is 0.185.1 (node_modules/three/package.json, exports map "three/webgpu" -> ./build/three.webgpu.js). Importing three/webgpu in node yields 629 exports, of which the relevant ones are BundleGroup, IndirectStorageBufferAttribute and RenderPipeline; there is NO RenderBundle export. Scanning the build file confirms the WebGPU backend implements indirect draw natively: the draw path reads renderObject.getIndirect() and renderObject.getIndirectOffset(), and indirectOffset may be an ARRAY that the backend loops over calling passEncoderGPU.drawIndexedIndirect(buffer, offset) per entry. Consequence, and it corrects a constraint stated below: multi-draw-indirect as a browser flag is indeed unavailable, but three r185 already gets the same effect by looping an offset array on one render object, so "one indirect draw per tier" is NOT the only admissible shape -- a single render object can emit N indirect draws from N offsets. The raw-WGSL route webgpu-hiz-tier.js takes is therefore a choice, not a necessity; a TSL/three-idiomatic route through getIndirect/getIndirectOffset is available and is the one the project TSL-only direction wants.

    Parent row: gpu-optimization-plan-browser-webgpu. Bottleneck attacked: CPU draw submission and per-instance CPU culling, which is the binding constraint on NVIDIA.

    EXACT SITES. packages/streaming-gltf/src/instanced-slot-cull-tsl.js (TSL compute slot cull, CULL_SENTINEL = 1e7) has zero references anywhere in the tree -- it is shipped but unwired. packages/streaming-gltf/src/webgpu-hiz-tier.js (raw-WGSL hierarchical-Z buffer plus CULL_LOD plus IndirectStorageBufferAttribute indirect draw args, HZB_WORKGROUP_DIM 8, CULL_WORKGROUP_SIZE 64) is reached only from packages/streaming-gltf/src/model-pool.js:1806 through "await import('./webgpu-hiz-tier.js')" with a console.warn catch at line 1816, and its supported() gate requires backend.isWebGPUBackend. By contrast packages/streaming-gltf/src/batched-far-tier.js IS live (model-pool.js:1876, updateNow at 2014), so the tier machinery itself is proven. docs/webgpu-shader-audit.md:153 already classifies the HIZ tier as "Raw WGSL, port to TSL compute", i.e. shipped, not adopted, and not in the project TSL-only direction.

    WHY IT MATTERS. The CPU side is the binding constraint on NVIDIA: frame p50 13.86-13.88 ms against GPU p50 3.08-3.34 ms, about 87.9 draws/frame and 924 WebGPU calls/frame, with WebGPULodInstancer.updateLOD at 6.7% CPU self, setMatrixAt 4.0% and GPUQueue.writeBuffer 4.2% (project/tier0-cpu-gpu-profile-2026-10-05). GPU-driven culling moves that into a compute pass and lets one indirect draw cover a whole LOD tier. There is also a second gap: packages/streaming-gltf/src/occlusion-query-tier.js is WebGL2-only and correctly fail-open, so on the WebGPU path there is currently no occlusion culling at all.

    CHANGE. Port webgpu-hiz-tier.js to TSL compute per the audit own disposition, and route the live client/core/WebGPULodInstancer.js instance pools through the instanced slot cull so culling and LOD selection happen GPU-side, keeping the CPU path as the WebGL2-backend fallback.

    CONSTRAINT THAT SHAPES IT. Multi-draw indirect is an experimental Chrome flag and is NOT available in a browser; one indirect draw per tier is the admissible shape, which is already what webgpu-hiz-tier.js emits. Must no-op on the WebGL2 backend.

    MEASUREMENT CLASS: split. The primary metrics -- draws/frame, WebGPU calls/frame from the existing encoder hook, and updateLOD CPU self share -- are CPU-measurable without holding a GPU. The frame-time claim needs a GPU window queued through C:/dev/train/tools/gpulock.mjs. UNMEASURED: runVegetationScalePerfAB in client/core/WebGPUCullingHubIntegration.js is a proof-of-concept at 12000/30000 instances and is not the live path; its numbers are not evidence for live instance counts.

    ADJACENT-ROW INTERACTION TO EXERCISE. This row edits the same surface as cpu-veg-lod-instancer-full-scan-per-move (CPU tier rescan) and veg-variation-doubles-draws-and-halves-fps (90 instancers from 15 species x 3 variants x branch+leaf). Whatever is built here must stay correct when variants are later merged into one instancer, and the merged-instancer change must be re-witnessed against it.
    GPU ATTRIBUTION (required for every browser arm in this row). scripts/lib/gpu-probe.mjs exports probeGpu(page), assertGpu(page, { requireAccelerated, expectVendor }), gpuArgs({ accelerated }), SOFTWARE_ARGS and ACCELERATED_ARGS, and its CLI takes --accelerated, --require-accelerated and --expect-vendor=<regex>. Take every measurement with --accelerated --require-accelerated and --expect-vendor set to the adapter under test, and record the returned rasterizer class ("accelerated" vs "software") and adapter vendor/architecture next to each number. This is not optional: scripts/frame-time-gate.mjs:92 and scripts/cold-load-gate.mjs:48 both launch --use-angle=swiftshader, so an unasserted browser session can silently be software and neither CI gate would object. A number taken under a different rasterizer class than its baseline is not comparable and does not close this row.
  acceptance_criteria: 'CPU-measurable half, no GPU window needed: draws/frame and WebGPU calls/frame from the existing encoder hook plus updateLOD self share, live scene, before and after. GPU half via C:/dev/train/tools/gpulock.mjs: n>=3 same-bundle arms on both adapters, GPU frame p50/p95 and CPU main-thread share, with a zero-delta control arm in the same window and PASS only if the delta exceeds that control arm delta. Correctness: the visible-instance set at a fixed pose equals the CPU cull set (count and per-tier histogram identical), the WebGL2-fallback arm renders with the CPU cull and no console error, and the merged-variant instancer case from veg-variation-doubles-draws-and-halves-fps is re-witnessed against the new path. Every browser arm must additionally pass --accelerated --require-accelerated with --expect-vendor set to the adapter under test (scripts/lib/gpu-probe.mjs CLI), and each number must be reported together with its rasterizer class and adapter vendor; a software-rasterizer arm is a failed arm, never a baseline.'
  status: pending
- id: gpu-plan-render-bundles-static-scene-subsets
  title: 924 WebGPU calls per frame are re-recorded every frame for scene parts whose command structure never changes; render bundles would replay them
  body: |-
    CAPABILITY CHECK ANSWERED (node-side, no browser, no GPU window): YES, three r185 exposes render bundles, so step 2 of this row IS worth writing. Installed three is 0.185.1 (node_modules/three/package.json; "three/webgpu" -> ./build/three.webgpu.js). Importing three/webgpu in node gives 629 exports and includes BundleGroup -- a Group subclass with isBundleGroup = true, a static flag ("whether the bundle is static or not... no new objects are added to the group") and a needsUpdate accessor, i.e. public API you add objects to and invalidate on change. There is no RenderBundle export and no raw GPURenderBundle export. The backend is implemented, not stubbed: the build file contains createRenderBundle (3), executeBundles (3), GPURenderBundle (6), GPURenderBundleEncoder (6) plus a GPURenderBundleEncoderDescriptor and a _currentRenderBundle field, and 17 references to bundleGroup. The constraint below still binds: a bundle cannot contain commands whose bindings change, so the terrain uniform block must move to a dynamic offset or its own small bind group or the bundle is invalid.

    Parent row: gpu-optimization-plan-browser-webgpu, which already names GPURenderBundle replay under Tier 2. Bottleneck attacked: CPU command recording and submission, the binding constraint on NVIDIA.

    EXACT SITES. client/core/RenderGraph.js (273 lines) drives every node through renderer.render(scene, camera) and already carries single-writer enforcement, deadPasses(), unreadResources(), aliasHazards() and per-node CPU timing via setProfileHook -- it is the natural host for a bundle-replay node. The two candidate bundle contents are the terrain (one mesh, packages/mapspinner/src/tsl/planet-tsl.js:112, one instanced draw whose per-frame cost is uniform writes in frame() at lines 232-269 and instance buffer upload at 192-194) and the dense vegetation pools (client/core/WebGPULodInstancer.js, one InstancedMesh per LOD tier with dirty-range partial uploads).

    WHY IT CAN ONLY PAY OFF ON ONE ADAPTER. NVIDIA frame p50 13.86 ms against GPU p50 3.08-3.34 ms: submission, not GPU work, sets that frame. AMD GPU frame p50 10.6 ms with p99 23.13 against a frame p99 of 34.8 ms, so AMD also carries a non-GPU tail, but the AMD GPU side is the larger term. Bundles reduce CPU recording; they do not reduce GPU work.

    FIRST STEP IS A CAPABILITY CHECK, NOT CODE. three.js r185 WebGPURenderer does not publicly expose GPURenderBundle in any API this codebase uses; the only precedent for reaching the raw device is packages/streaming-gltf/src/webgpu-hiz-tier.js, which calls renderer.backend.device.createShaderModule / createComputePipeline directly. If three exposes no bundle path, the alternatives in order are (a) a three-level API if one exists, (b) a raw device path like the HIZ tier uses, which then needs its own WebGL2 no-op, or (c) close this row as unavailable and fall back to the cheaper redundant-bind-write reduction below.

    CHEAPER SUBSET THAT SURVIVES EITHER WAY. Cut redundant bind-group and uniform writes by caching on a version stamp: planet-tsl.js frame() writes about twenty uniforms unconditionally every frame including several (albedoOverride, texNrmK, flatNormal, reliefShade, poolLo/Hi/Spec/Cover, wetness) that change only when a window knob or pool resolution changes, and WebGPULodInstancer maintains dirty ranges only for instance attributes, not for bind state.

    CONSTRAINTS. Bundles are core WebGPU, available in Chrome on both adapters, no vendor extension. Bundles cannot contain commands whose resource bindings change, so the terrain uniform block must move to a dynamic-offset or a separate small bind group or the bundle is invalid.

    MEASUREMENT CLASS: WebGPU calls/frame and draws/frame come from the existing encoder hook and are CPU-measurable without a GPU window, but the hook has only produced numbers on real-adapter sessions so far, so treat the count claim as needing a browser session either way; the frame-time claim needs a GPU window queued through C:/dev/train/tools/gpulock.mjs. UNMEASURED: no predicted delta.
    GPU ATTRIBUTION (required for every browser arm in this row). scripts/lib/gpu-probe.mjs exports probeGpu(page), assertGpu(page, { requireAccelerated, expectVendor }), gpuArgs({ accelerated }), SOFTWARE_ARGS and ACCELERATED_ARGS, and its CLI takes --accelerated, --require-accelerated and --expect-vendor=<regex>. Take every measurement with --accelerated --require-accelerated and --expect-vendor set to the adapter under test, and record the returned rasterizer class ("accelerated" vs "software") and adapter vendor/architecture next to each number. This is not optional: scripts/frame-time-gate.mjs:92 and scripts/cold-load-gate.mjs:48 both launch --use-angle=swiftshader, so an unasserted browser session can silently be software and neither CI gate would object. A number taken under a different rasterizer class than its baseline is not comparable and does not close this row.
  acceptance_criteria: 'Step 1, CPU-only: a capability check against the installed three r185 reporting whether WebGPURenderer exposes any render-bundle path, with the file and symbol named. Step 2 if available: WebGPU calls/frame from the encoder hook before and after, live scene, plus GPU frame p50/p95 and CPU main-thread share over n>=3 same-bundle arms on both adapters via C:/dev/train/tools/gpulock.mjs, with a zero-delta control arm in the same window and PASS only if the delta exceeds that control arm delta. Fixed-pose pixel-compare unchanged within the TSL/legacy parity tolerance. Step 3 regardless of bundle availability: the redundant-uniform-write subset, witnessed by WebGPU calls/frame and by the per-node ms in window.__renderGraph stats. Every browser arm must additionally pass --accelerated --require-accelerated with --expect-vendor set to the adapter under test (scripts/lib/gpu-probe.mjs CLI), and each number must be reported together with its rasterizer class and adapter vendor; a software-rasterizer arm is a failed arm, never a baseline.'
