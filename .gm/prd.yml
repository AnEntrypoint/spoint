tinued serving HTTP 200 + real app.js content post-reload -- confirming the new code is syntactically/structurally sound in the actual running process, not just isolated node --check. Could NOT complete a full live edit-worldDef-then-observe-hot-apply cycle this session: the cdp/browser verb repeatedly failed to return any result for a page-load dispatch against this exact running server (empty output after 50+ seconds, non-deterministic per the already-documented cdp-async-eval-and-url-prefix-result-undefined-bug), and one dispatch returned a stale cross-session cached response from an unrelated prior session''s world/port -- consistent with that same known tooling defect, not a new one. Known real limitation of this fix (documented, not hidden): capsuleRadius/capsuleHalfHeight/crouchHalfHeight only affect NEWLY spawned characters going forward -- an already-spawned character''s Jolt CapsuleShape is not resized in place, since that would require destroying and rebuilding its live collision shape while the character may be mid-simulation, a materially riskier change not attempted here (matches the row''s own prior investigation calling out the tick-loop driver as the higher-risk surface).'
