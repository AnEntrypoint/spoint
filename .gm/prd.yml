- id: gpu-plan-render-bundles-static-scene-subsets
  title: 924 WebGPU calls per frame are re-recorded every frame for scene parts whose command structure never changes; render bundles would replay them
  body: |-
    Parent row: gpu-optimization-plan-browser-webgpu, which already names GPURenderBundle replay under Tier 2. Bottleneck attacked: CPU command recording and submission, the binding constraint on NVIDIA.

    EXACT SITES. client/core/RenderGraph.js (273 lines) drives every node through renderer.render(scene, camera) and already carries single-writer enforcement, deadPasses(), unreadResources(), aliasHazards() and per-node CPU timing via setProfileHook -- it is the natural host for a bundle-replay node. The two candidate bundle contents are the terrain (one mesh, packages/mapspinner/src/tsl/planet-tsl.js:112, one instanced draw whose per-frame cost is uniform writes in frame() at lines 232-269 and instance buffer upload at 192-194) and the dense vegetation pools (client/core/WebGPULodInstancer.js, one InstancedMesh per LOD tier with dirty-range partial uploads).

    WHY IT CAN ONLY PAY OFF ON ONE ADAPTER. NVIDIA frame p50 13.86 ms against GPU p50 3.08-3.34 ms: submission, not GPU work, sets that frame. AMD GPU frame p50 10.6 ms with p99 23.13 against a frame p99 of 34.8 ms, so AMD also carries a non-GPU tail, but the AMD GPU side is the larger term. Bundles reduce CPU recording; they do not reduce GPU work.

    FIRST STEP IS A CAPABILITY CHECK, NOT CODE. three.js r185 WebGPURenderer does not publicly expose GPURenderBundle in any API this codebase uses; the only precedent for reaching the raw device is packages/streaming-gltf/src/webgpu-hiz-tier.js, which calls renderer.backend.device.createShaderModule / createComputePipeline directly. If three exposes no bundle path, the alternatives in order are (a) a three-level API if one exists, (b) a raw device path like the HIZ tier uses, which then needs its own WebGL2 no-op, or (c) close this row as unavailable and fall back to the cheaper redundant-bind-write reduction below.

    CHEAPER SUBSET THAT SURVIVES EITHER WAY. Cut redundant bind-group and uniform writes by caching on a version stamp: planet-tsl.js frame() writes about twenty uniforms unconditionally every frame including several (albedoOverride, texNrmK, flatNormal, reliefShade, poolLo/Hi/Spec/Cover, wetness) that change only when a window knob or pool resolution changes, and WebGPULodInstancer maintains dirty ranges only for instance attributes, not for bind state.

    CONSTRAINTS. Bundles are core WebGPU, available in Chrome on both adapters, no vendor extension. Bundles cannot contain commands whose resource bindings change, so the terrain uniform block must move to a dynamic-offset or a separate small bind group or the bundle is invalid.

    MEASUREMENT CLASS: WebGPU calls/frame and draws/frame come from the existing encoder hook and are CPU-measurable without a GPU window, but the hook has only produced numbers on real-adapter sessions so far, so treat the count claim as needing a browser session either way; the frame-time claim needs a GPU window queued through C:/dev/train/tools/gpulock.mjs. UNMEASURED: no predicted delta.
  acceptance_criteria: 'Step 1, CPU-only: a capability check against the installed three r185 reporting whether WebGPURenderer exposes any render-bundle path, with the file and symbol named. Step 2 if available: WebGPU calls/frame from the encoder hook before and after, live scene, plus GPU frame p50/p95 and CPU main-thread share over n>=3 same-bundle arms on both adapters via C:/dev/train/tools/gpulock.mjs, with a zero-delta control arm in the same window and PASS only if the delta exceeds that control arm delta. Fixed-pose pixel-compare unchanged within the TSL/legacy parity tolerance. Step 3 regardless of bundle availability: the redundant-uniform-write subset, witnessed by WebGPU calls/frame and by the per-node ms in window.__renderGraph stats.'
  status: pending
- id: gpu-plan-instance-transform-quantized-layout
  title: Vegetation instance pools upload a full 16-float matrix per instance into a dirty-range buffer; a quantized per-instance transform cuts the bytes fourfold and the CPU compose with them
  body: |-
    Parent row: gpu-optimization-plan-browser-webgpu. Bottleneck attacked: per-instance CPU matrix composition and upload bytes; instance vertex-fetch bandwidth is a secondary, expected-negligible term.

    EXACT SITES. client/core/WebGPULodInstancer.js:76 -- writeSlot does "mesh.instanceMatrix.array.set(rec.matrix, slot * 16)", a raw 16-float (64-byte) copy per instance straight into the InstancedMesh instanceMatrix array; markSlotDirty at line 24-33 then calls setDirtyRange(mesh.instanceMatrix, 16, n, newWindow) at line 29, so the upload is a contiguous floored window from dirtyLo to dirtyHi over the whole matrix array. build() at line 36 doubles capacity and copies "mesh.instanceMatrix.array.subarray(0, ids.length * 16)" (line 47). There are 90 instancers (15 species x 3 variants x branch+leaf) over roughly 4300 vegetation instances per instancer set, plus a shadow-only pool on SHADOW_CASTER_ONLY_LAYER (lines 56-59).

    ATTRIBUTION CORRECTION (load-bearing, do not re-merge). The tier-0 profile figure "setMatrixAt 4.0% CPU self" belongs to the WEATHER particle streaming instancer, not to this vegetation path -- row cpu-weather-tick-11pct-inclusive states it as "the streaming-instancer matrix writes (setMatrixAt 4.0% + F 1.2% self)" under the weather tick at 11.1% inclusive. This row therefore claims only GPUQueue.writeBuffer at 4.2% self (which covers all buffer uploads, so this path share of it is unmeasured) and the allocation census at 190-201 MB/s, about 2.5-2.6 MB per frame. Do not cite setMatrixAt here.

    CHANGE. Replace the 64-byte per-instance matrix with a quantized transform -- position as three f32 or three i16 in a local frame, uniform scale, and orientation as a smallest-three quaternion in four i16, or as a single yaw where the species allows it -- and compose the matrix in the vertex stage. Upload bytes per instance fall roughly fourfold and the CPU-side compose (rec.matrix is built by the caller) disappears from the write path.

    SCOPE BOUNDARY. This is the data-layout half only. Sibling rows own the others: cpu-veg-lod-instancer-full-scan-per-move (the tier rescan), veg-variation-doubles-draws-and-halves-fps (90 instancers from 3 variants), veg-instancer-dirty-window-per-attribute-ranges (upload windowing), cpu-allocation-2.6mb-per-frame-unattributed (the allocation census). Do not re-litigate those here.

    RISK. The vegetation wind displacement reads the instance matrix and client/core/Vegetation.js patches it through onBeforeCompile on the legacy path with a TSL wind path alongside, so the vertex-stage composition must reproduce instance-local orientation exactly or wind direction and impostor billboard orientation shift. Fix a pose and compare before trusting any number. This row does NOT touch the normal or the lighting arithmetic, so it is outside the active TSL-vs-legacy terrain darkening investigation.

    MEASUREMENT CLASS: the primary metrics are CPU-measurable without a GPU window -- bytes uploaded per frame (encoder hook plus the dirty-range n x 16 sizes), writeBuffer CPU self share from the existing profile, and allocation MB/frame from the existing census. Only the frame-time claim needs a GPU window queued through C:/dev/train/tools/gpulock.mjs. UNMEASURED: no predicted delta; the GPU-side vertex-fetch saving is expected to be negligible at these instance counts and is not the reason to do this.
  acceptance_criteria: 'CPU-measurable half first, no GPU window: bytes uploaded per frame (encoder hook plus the markSlotDirty window sizes), GPUQueue.writeBuffer self share, and allocation MB/frame, live scene, before and after, n>=3 runs. Frame-time claim via C:/dev/train/tools/gpulock.mjs on both adapters, n>=3 same-bundle arms with a zero-delta control arm in the same window, PASS only if the delta exceeds that control arm delta. Correctness: per-instance world transforms at a fixed pose match the 16-float matrix build within a stated tolerance, vegetation wind displacement direction and impostor orientation pixel-compare unchanged, and the per-tier visible-instance histogram is identical.'
  status: pending
- id: terrain-collider-initial-ring-per-cluster-batches
  title: 'Build the initial collider ring in per-cluster batches: the boot is 96% placement generation and 94.7 ms of it per cluster'
  body: 'MEASURED 2026-10-06 while resolving terrain-collider-initial-ring-cpu-at-many-clusters (harnesses data/planet-harness/ring-boot.mjs and ring-classify.mjs, real tps-game world module, real PhysicsWorld, real createTrunkColliderStreamer/createRockColliderStreamer, 1000 m player grid, radius 64 cap 384 trunk / radius 32 cap 128 rock). Budgeting the initial ring was measured and rejected (5x worse at 16 players, unfinished after 4001 passes / 200 s at 64 players) because COMPUTE_BUDGET_MS is 2.5 ms while a placement chunk costs 2.242 ms. The remaining lever is to keep each pass unbudgeted but narrow it to a batch of clusters. Costs measured: at 64 players the trunk initial ring is 6289.4 ms wall and placement generation for its 2705 ring chunks is 6063.4 ms (2.242 ms/chunk), i.e. 96% of the ring; rock is 1163 chunks, 1027.3 ms, 0.883 ms/chunk, all of its 944.6 ms ring. Body adds are the remainder (pool prewarm 43.3 ms trunk, 91.3 ms rock). So a cluster costs a measured 94.7 ms of placement work at 64 players and 2705/64 = 42.3 chunks. Today every one of the 25 players that gets a trunk collider waits for the whole ring: first collider min 7261.9 / max 7267.7 ms, one contiguous 7.26 s event-loop stall, then everybody is covered at once. Batching would give the first batch its colliders after one batch''s work and the last batch after roughly the same total as today.'
  acceptance_criteria: 'Implement the initial ring as a sequence of cluster batches (unbudgeted within a batch, yield to the event loop between batches, first pass sized so a batch is about 8 clusters) and witness at 16 and 64 spread players with the real streamer and a real PhysicsWorld: per-player time-to-first-collider, total initial-ring CPU, and the event-loop stall per pass. Ship only if no player''s first collider lands later than it does today (16 players 3734 ms, 64 players 7276 ms) and if the final ring is the same set as today''s single pass (compare liveCount, per-cluster counts and a position hash: 1594 bodies, hash d9cf02ca at 64 players; 768, hash 77096680 at 16). The byte budget, the per-cluster quota and the cap must not change.'
  status: pending
- id: terrain-collider-deferred-rebuild-exceeds-body-cap
  title: 'A deferred collider rebuild exceeds the body cap: desired is capped per pass, the quota resets per pass, and only the byte budget evicts'
  body: 'MEASURED 2026-10-06 with data/planet-harness/ring-boot.mjs (arm=budgeted) on the real tps-game world module, a real PhysicsWorld and the real createTrunkColliderStreamer: 16 players on a 1000 m grid, radius 64, baseCap 384, centreScale 2 so effectiveCap 768. Running the initial ring as repeated budgeted passes (what _check does whenever chunkPlacements refuses chunks) ended with 983 live trunk colliders against a cap of 768, 28% over, and a different body set from the single unbudgeted pass (position hash 8c5b065d vs 77096680). Mechanism: classifyRings builds desired with a per-pass length limit of effectiveCap and a per-cluster quota of cap/centres, both of which reset every pass, while live keeps everything added by earlier passes; the only thing that removes bodies afterwards is the keep set (everything stayed inside keepRadius) and evictOverBudget, which fires on resident bytes alone - 263444 of 3145728 B here, so it never ran. Any deferred rebuild reaches this state: _rebuildMulti returns _deferred when MAX_NEW_CHUNKS_PER_PASS (64) or COMPUTE_BUDGET_MS (2.5) bites, which is reachable in steady state whenever more than 64 ring chunks are new, and then curCenters is not updated and removals are skipped, so the next pass adds a fresh batch on top. The body cap therefore bounds one pass, not the resident set.'
  acceptance_criteria: 'Witness the overrun on a steady deferred rebuild (not just boot): clearChunkCache or move a cluster so more than 64 chunks are new, run _rebuildMulti until it stops deferring, and report liveCount against effectiveCap plus residentBytes against byteBudget. Fix so the resident set respects the cap - trim to effectiveCap (nearest-first, the same order desired already uses) whenever a pass leaves more bodies live than the cap, and evict on body count as well as bytes - then re-witness that liveCount <= cap in both the deferred and the single-pass case and that the resulting set matches the unbudgeted ring.'
  status: pending
- id: prediction-peer-separation-over-pushes-in-contact-regime
  title: The client peer separation push makes prediction worse, not better, wherever it changes anything
  body: 'docs/netcode.md:32 claims prediction applying separationPush against the other players snapshot positions took corrections per ack from 0.754 to 0.189 at 0/0/0. Measured today it does neither: with --world=arena --hold=forward --precise --duration=20000, 6 arms, corrections per ack are 0.737 push-on against 0.717 control at 0/0/0, 0.674 against 0.667 at 50/10/2 and 0.530 against 0.540 at 100/20/3 - equal within noise - while mispredict rate is 69.8 percent against 3.6 percent at 0/0/0 and 33.7 against 6.4 at 50/10/2, and mispredict err p95 is 10.79 cm against 1.67 cm and 11.71 against 2.67. The push is not neutral, it is harmful: the client predicts a separation the server does not reproduce at that magnitude, so the predicted path lands further from the server than the path that ignores other players entirely. Corrections per ack do not move because nearly every ack already exceeds RECONCILE_POS_EPS_M in both arms, so the rate saturates and hides the regression; err p95 and mispredict rate are the metrics that see it. Candidate causes to check first: _reseedPeerSim (PredictionEngine.js:344) resets every peer to its newest snapshot on every snapshot while the replay rebases from the older acked state, so live steps after a replay advance a peer that is one RTT ahead of the local rebased position; and the recorded entry.sep replays a push magnitude captured against a peer sim at a different phase.'
  acceptance_criteria: 'Diagnose why the client push exceeds the server push, then make the push help or remove it. Concretely: instrument one 0/0/0 contact arm to print, per tick, the server separation delta for the pair and the client predicted sep, and find where they diverge. Then fix so that at 0/0/0, 50/10/2 and 100/20/3 corrections per ack fall below the --peerSeparation=off control and mispredict err p95 does not rise above it, with 30 Hz mispredict below 75 percent and the clear-lane control (--at=0,1.2,-95) unchanged. Re-measure on an idle box: the baseline above was taken under concurrent load and is a diagnosis, not a gate. If the honest outcome is that the push cannot be predicted well enough to help, remove it and rewrite docs/netcode.md:32 to say so.'
  session_id: f73df536-0f66-49a1-8888-2a064d23416a
  status: pending
- id: gpu-plan-terrain-fd-taps-five-to-three
  title: Terrain normals use five finite-difference taps of the height fractal; a three-tap forward-difference stencil cuts the vertex fractal evaluations 40% but changes the normal, so it is gated behind the open TSL-vs-legacy darkening investigation
  body: |-
    Parent row: gpu-optimization-plan-browser-webgpu. Bottleneck attacked: the same vertex-stage fractal math as gpu-plan-terrain-height-compute-cache, by a cheaper and riskier route.

    EXACT SITE. packages/mapspinner/src/tsl/terrain-material-tsl.js:15 (FD_TAPS = 5) driving the loop at lines 134-146, which evaluates spec.composeHeight five times per vertex -- the centre plus +/-step in each of the two patch-tangent directions -- and feeds the central difference to n0 at line 147. The raw-WGSL twin repeats it at packages/mapspinner/src/webgpu/patch-grid-render.js:341-356. Dropping to a forward-difference stencil (centre plus +step in each direction, three taps) removes two of the five evaluations, a 40% cut in the vertex stage fractal work.

    WHY THIS IS THE RISKIER ROUTE. Unlike gpu-plan-terrain-height-compute-cache, this is NOT value-preserving: a forward difference is a one-sided derivative, so the resulting geometric normal is asymmetric and shifts by roughly half a grid step on any slope. That feeds vN (line 154), the lit normal at lines 162-163 and 178-179, material.normalNode at line 192, and every downstream gate keyed on slope -- rockSlope at line 165, and the whole surface splat in surface-splat-tsl.js. That is precisely the surface the two open rows tsl-terrain-grass-brighter-than-legacy-unexplained and tsl-terrain-grey-lighting-residual are investigating. DO NOT START THIS WHILE THOSE ARE OPEN; a normal change made during an unexplained darkening difference is uninterpretable.

    CEILING IS POSE-DEPENDENT AND PROBABLY SMALL AT SPAWN. GRID_SIZE is 9 (packages/mapspinner/src/terrain-defaults.js:3) and the live patch set is on the order of 10^2 quads at spawn with growCapacity doubling from INITIAL_QUAD_CAPACITY 2048 (packages/mapspinner/src/tsl/planet-tsl.js:25, 199-206), so the vertex count -- and therefore this row value -- rises with altitude and view distance. Its ceiling at a high-altitude pose is unknown; at spawn it is likely small. This is the cheap fallback to gpu-plan-terrain-height-compute-cache, not the preferred route.

    HAZARD TO HONOUR. Per the FXC / ANGLE d3d11 rule in packages/mapspinner/AGENTS.md, the taps must remain in ONE runtime-bounded loop (u.loopBoundDelta, never a constant) and composeHeight must never be differenced across separate call sites; recucing the tap count must not split the loop.

    MEASUREMENT CLASS: needs a GPU window queued through C:/dev/train/tools/gpulock.mjs. UNMEASURED: no predicted delta.
  acceptance_criteria: 'Precondition: tsl-terrain-grass-brighter-than-legacy-unexplained and tsl-terrain-grey-lighting-residual both closed. Then, GPU window via C:/dev/train/tools/gpulock.mjs, n>=3 same-bundle arms on both adapters at a spawn pose and at a high-altitude wide-view pose, with a zero-delta control arm in the same window and PASS only if GPU frame p50/p95 improves beyond that control arm delta. Visual gate is separate and binding: an oblique-sun fixed-pose A/B of the five-tap and three-tap stencils reviewed as images for normal asymmetry on slopes and at LOD seams, plus the TSL/legacy parity harness re-run clean.'
  status: pending
- id: cpu-plan-mapspinner-quad-replay-gate-tolerance
  title: 'Fix the mapspinner per-frame quad replay gate: moveTol collapses to 1 m at deck altitude so the existing capture never hits'
  subject: planet-orchestrator frame() rebuilds the entire quadtree leaf set every frame because its existing replay gate uses moveTol = min(250, max(1, (camDist-R)*5e-5)), which is 1.0 m at deck altitude -- the capture exists but is effectively always-miss exactly where the quad work is largest.
  body: |-
    TIER-0 parent: cpu-skip-and-replay-plan-browser. CPU-side, client per-frame.

    WHAT RECOMPUTES, PER FRAME
    packages/mapspinner/src/planet-orchestrator.js:142 frame(); the 6-face loop at :277-350. TSL twin: packages/mapspinner/src/tsl/planet-tsl.js:154 writeQuads / :215 quadsFor.
    Per frame: qt.computeSplitDist (:194), hpf.sampleDir (:201-204), qt.setConfig (:210), render.cullMatrix (:254), extractFrustumPlanes (:262), then 6x (worldToFaceLocal -> qt.updateQuadtree :287 -> limb dot :298-312 -> quadOutsideFrustum :308/:313 -> pooled quad-object writes :344-348).
    Measured this pass in node against the real quadtree.js + planet-orchestrator-cull.js + three, R=63600, fov 70 degrees, 1080p, splitFactor 0.28:
      ground altitude: 556 leaves, 741 quadtree node visits, 556 quadOutsideFrustum calls, 7755 Math.tan, 4428 Math.sqrt, 562 Math.hypot (1 face kept by limb cull)
      with a looser limb test across 6 faces: 3336 leaves, 4446 node visits, 46515 tan, 26513 sqrt, 3342 hypot
      at 50 km: 112 leaves, 1539 tan
    quadOutsideFrustum alone is 6 Math.tan + 9 Math.hypot per quad (planet-orchestrator-cull.js:38-39,50).

    THE DEFECT
    There is already a replay gate at packages/mapspinner/src/planet-orchestrator.js:149-166 (mirrored at packages/mapspinner/src/tsl/planet-tsl.js:218-225). Its tolerance is moveTol = min(250, max(1, (camDist - R) * 5e-5)), which at deck altitude (camDist - R small) collapses to the 1.0 m floor. So the gate is effectively always-miss precisely where the quad work is largest. This is not a missing capture -- it is a capture whose key is mis-tuned, which is the cheapest kind of win available.

    STABLE STRUCTURE (the captured graph)
    The quadtree topology decision chain: maxLevel, distFactor, splitDist, the FACE_FRAME tables, CULL_ELEV_FRAC, CULL_NDC_MARGIN, patch capacity -- all fixed until setConfig / resize / material hot-swap / growCapacity. Capture = the emitted leaf array (ox, oy, l, level, face) plus camDist/near/far.

    CHANGING INPUTS
    camWorldPos[3], camTarget[3] (forward), camUp, fovy, displayMode, surfElev, viewport w/h, window.__splitFactor / __maxLevel / __distFactor, lodRefPos, aimGroundPt.

    INVALIDATION KEY
    key = H(CODE) || STRUCT_EPOCH || Q(inputs)
    - CODE = a hash of the UTF-8 bytes of the source files that implement the transform itself: quadtree.js, planet-orchestrator-cull.js, terrain-defaults.js, planet-orchestrator.js (and their TSL twins), computed at boot. NOT a hand-bumped constant -- a key over inputs only is exactly the burned class (deviation.build-cache-no-code-version-key), where a build-artifact cache keyed on its input hash served stale output forever after the transform code changed. Hashing the producing source means any edit auto-invalidates with no human remembering to bump anything.
    - STRUCT_EPOCH = int bumped by setConfig / resize / material hot-swap / growCapacity.
    - Q(inputs) = position quantized to 1 mm, forward dot to 1e-5, plus exact fovy, w, h, displayMode.
    The new key must be a SUPERSET of the current one so a hit under it implies a hit under the old gate -- that makes the change monotone-safe.

    DOWNSTREAM, IN THE SAME CAPTURE
    packages/mapspinner/src/gl-render.js:1382 _sortLeavesFrontToBack (called at :1498) is gated by `(quads !== _instQuadsRef) || (_thc !== _lastThc)`, and because the quad producer hands it a NEW array every frame that gate is always true too. Key it on the quad producer's STRUCT_EPOCH rather than array identity, and when this row's capture hits, the sort skip is free. Implement as one artifact.

    UNRESOLVED BEFORE IMPLEMENTING
    planet-orchestrator.js:273-276 renders _pipelineQuads while :353-355 renders `quads` only when _pipelineQuads is null. If that is the real control flow, the freshly built list is never drawn on frames >= 2 and a cache would freeze a stale list. Resolve that control flow first.

    WORST-CASE BOUND
    Bounded: leaves <= patch capacity (hard grow at planet-tsl.js:185), node visits <= 4^depth clamped by maxLevel. Miss path is today's code, unmodified. Failure mode if the key is wrong: frozen terrain LOD -- immediately visible and not plausibly correct, so it fails loud rather than silently.

    MEASUREMENT (integer work units, immune to timer inflation -- this box's zero-delta control arm is +/-10% and currently ~2.5x inflated, so the ms figures must be re-taken with a control arm)
    Deciding counter: per frame, (a) quadtree node visits, (b) leaves emitted, (c) Math.tan calls, (d) quadOutsideFrustum calls, (e) capture hits vs misses over a scripted camera route.
  acceptance_criteria: 'Node measurement against the real quadtree.js + planet-orchestrator-cull.js (no GPU needed for the counters) plus a browser witness of the live page: report per frame (a) quadtree node visits, (b) leaves, (c) Math.tan calls, (d) quadOutsideFrustum calls, (e) capture hit rate, over a scripted 120 s route at deck altitude and at 50 km. Pass requires capture hit rate >= 60% over the route AND (a)-(d) to drop by at least 50% summed over the route, measured with a zero-delta control arm in the SAME window (this box''s noise floor is +/-10% and is currently ~2.5x inflated, so a delta under that is unmeasurable-as-proposed). Correctness: the emitted leaf array must be element-for-element identical to the always-recompute build for the same camera poses, and a deliberate setConfig / resize must force a miss on the very next frame.'
  session_id: f73df536-0f66-49a1-8888-2a064d23416a
  status: pending
- id: cpu-plan-cluster-lod-mesh-cross-frame-capture
  title: 'Give ClusterLodMesh a cross-frame skip: it has no capture at all, so every frame rebuilds LOD decisions and re-uploads instance groups even when nothing changed'
  subject: packages/streaming-gltf/src/cluster-lod-mesh.js:105 rebuilds LOD decisions and re-uploads instance groups on every frame with no cross-frame skip, unlike its neighbours which at least have a keyed gate; the unchanging inputs are the mesh set and the LOD thresholds, and the only changing input is the viewer position, so a position-quantized key makes most frames a replay.
  body: |-
    TIER-0 parent: cpu-skip-and-replay-plan-browser. CPU-side, client per-frame. PARTIALLY BLOCKED on a GPU witness -- see MEASUREMENT.

    WHAT RECOMPUTES
    packages/streaming-gltf/src/cluster-lod-mesh.js:105. Per frame: LOD decision per cluster/mesh, instance-group assembly, and a group upload. There is no cross-frame skip at all -- this is a missing capture, not a mis-tuned one (contrast cpu-plan-mapspinner-quad-replay-gate-tolerance, where a gate exists but its tolerance collapses).

    STABLE STRUCTURE (the captured graph)
    The per-cluster LOD decision and the assembled instance groups. Fixed while the mesh set, the cluster set and the LOD thresholds are fixed.

    CHANGING INPUTS
    Viewer position; mesh/cluster set membership; LOD thresholds and distances; the streaming load state (a cluster whose mesh is not yet resident cannot be treated as decided).

    INVALIDATION KEY
    key = H(CODE) || MESHSET_EPOCH || LOD_CONFIG_EPOCH || LOAD_EPOCH || Q(viewerPos)
    - CODE = a hash of the UTF-8 bytes of cluster-lod-mesh.js, computed at boot. A key over inputs only is the burned class (deviation.build-cache-no-code-version-key). Hashing the producing source makes any edit auto-invalidate.
    - MESHSET_EPOCH bumps when a cluster or mesh is added or removed.
    - LOD_CONFIG_EPOCH bumps when thresholds or distances change.
    - LOAD_EPOCH is mandatory and easy to miss: a cluster whose mesh finishes streaming mid-frame has a different correct LOD decision than before it finished, so residency must be in the key or the capture serves a pre-load decision forever.
    - Q(viewerPos) quantized to 1 mm so sub-millimetre drift does not force a miss every frame.

    WORST-CASE BOUND
    Skipped path is one key compare plus a replay of the recorded groups. Miss path is today's rebuild. Bounded by cluster count. Failure mode if LOAD_EPOCH is omitted: a cluster stays at a coarse LOD after its fine mesh lands -- visible as a pop that never resolves, which is why the acceptance witness must cross a streaming load boundary, not just hold still.

    MEASUREMENT (partially blocked)
    The CPU half (LOD decisions, group assembly) is measurable in node against the real module with integer counters: (a) LOD decisions computed, (b) groups assembled, (c) group uploads attempted. The upload half needs a real GPU/GL context; do NOT claim a win on the upload cost from a CPU-only measurement -- a substitute context measures the harness, not the driver. Take the CPU counters in node, and take the upload counter under a browser dispatch with `gpu.accelerated` confirmed true.
  acceptance_criteria: 'Node witness against the real module: report per frame (a) LOD decisions computed, (b) groups assembled, (c) upload attempts, over a scripted 120 s route with the viewer both still and moving. Pass requires (a) and (b) to drop by at least 50 percent with a still viewer, with a zero-delta control arm in the SAME window (noise floor +/-10 percent, currently ~2.5x inflated). Then a browser witness with gpu.accelerated true confirming (c) drops to 0 on frames where the CPU key hits. Correctness: the rendered LOD assignment must match the always-recompute build for the same viewer positions, AND a cluster whose mesh completes streaming mid-route must adopt its finer LOD within one frame of completing (the LOAD_EPOCH case) -- witness that specifically, since it is the case a naive key misses.'
  session_id: f73df536-0f66-49a1-8888-2a064d23416a
  status: pending
- id: cpu-plan-player-tier-classify-capture
  title: 'Cache classifyPlayerTiers per frame: the client recomputes every player''s distance, frustum dot and LOD tier on every frame it runs'
  subject: client/core/PlayerLOD.js:26 classifyPlayerTiers is invoked from tick (:209), itself driven from client/app.js:2204, and on every invocation it re-sorts the tier chain, re-reads every player's position, recomputes a distance and a frustum dot per player and allocates a fresh result array; measured at 82 us/call with 200 players and 704 us/call with 1024, which is a meaningful slice of a 16 ms budget spent on values that only change when a player moves or the camera moves.
  body: |-
    TIER-0 parent: cpu-skip-and-replay-plan-browser. CPU-side, client per-frame, main thread.

    WHAT RECOMPUTES
    client/core/PlayerLOD.js:26 classifyPlayerTiers, called from :209 tick, driven by client/app.js:2204. Per invocation: sortTierChain, then per player a position read, a distance computation, a frustum dot, a tier assignment, and a fresh result array.
    Measured this pass against the real module in node: 82 microseconds per call at n=200, 704 microseconds per call at n=1024. Cost grows with player count, so this is precisely the load where the frame budget is already tightest.
    Note a same-named server function exists at src/netcode/SnapshotEncoder.js:89; that one is server-side and out of scope here. This row is the client one only.

    STABLE STRUCTURE (the captured graph)
    The tier assignment array: for each player id, its tier index.

    CHANGING INPUTS
    Every player's position, the camera position and forward vector, the tier thresholds and radii, the player-set membership and count.

    INVALIDATION KEY
    key = H(CODE) || TIER_CONFIG_EPOCH || MEMBERSHIP_VERSION || Q(camPos, camForward) || Q(each player position)
    - CODE = a hash of the UTF-8 bytes of client/core/PlayerLOD.js itself, computed at boot. A key over inputs only is the burned class (deviation.build-cache-no-code-version-key): a build artifact keyed on its input hash serves stale output forever after the transform code changed. Hashing the producing source makes any edit auto-invalidate with no human bumping a number.
    - TIER_CONFIG_EPOCH bumps when the tier chain, thresholds or radii change.
    - MEMBERSHIP_VERSION bumps on join/leave/entity add/remove.
    - Q = position quantized to 1 mm and forward to 1e-5, so sub-millimetre jitter from interpolation does not force a miss every frame. Quantization is the whole point: the raw values drift every frame by design, and a key over unquantized floats is guaranteed-always-miss -- the same defect as the mapspinner gate in cpu-plan-mapspinner-quad-replay-gate-tolerance.
    Reuse the per-frame identity already maintained for client/app.js:2204 so the key cannot miss a camera change.

    WORST-CASE BOUND
    Skipped path is one key compare plus an array reuse. Miss path is today's classify. Bounded by player count, which is bounded. Failure mode if the key is wrong: a player is rendered at the wrong LOD tier -- visible, and it fails on the very next camera rotation, so it does not persist silently.

    MEASUREMENT (integer work units, immune to timer inflation -- this box's zero-delta control arm is +/-10 percent and is currently ~2.5x inflated, so the microsecond figures must be re-taken with a control arm)
    Deciding counter: per call, (a) player position reads, (b) distance computations, (c) frustum dots, (d) result-array allocations, (e) cache hits vs misses over a scripted 120 s route with the camera both still and rotating.
  acceptance_criteria: 'Real-module witness in node (no GPU needed for the classify path) plus a browser witness of the live page: report per call (a) player position reads, (b) distance computations, (c) frustum dots, (d) result-array allocations, (e) hit rate, at n=200 and n=1024. Pass requires hit rate >= 50 percent with a still camera over the route and (a)-(d) to drop proportionally, measured with a zero-delta control arm in the SAME window. Correctness: the tier array must be element-for-element identical to the always-recompute classify for the same camera and player poses; a camera rotation of 1 degree must force a miss; and a player joining or leaving must force a miss on that same frame.'
  session_id: f73df536-0f66-49a1-8888-2a064d23416a
  status: pending
- id: apps-manifest-generated-at-repo-root-never-served
  title: apps-manifest.json is generated at the repo root, but the dev server serves client/
  body: 'postinstall now runs scripts/bundle-apps-manifest.mjs (7ab16e28), and that script resolves its default outFile against ROOT (scripts/bundle-apps-manifest.mjs:117, OUT = resolve(ROOT, outFile)), so it writes ./apps-manifest.json at the repo root. The browser fetches new URL(''apps-manifest.json'', _root) at client/BrowserServer.js:108, where _root is the client root (the same base used for src/sdk/WorkerEntry.js), and the dev server serves client/ at /, so the file postinstall generates is never served and the boot still 404s. Witnessed twice with scripts/page-boot-witness.mjs --world=tps-game --params=singleplayer --gl=none --port=3118: with only the root file present (451568 bytes, 68 apps, generated by node scripts/bundle-apps-manifest.mjs) the run reports HTTP 404 http://localhost:3118/apps-manifest.json among 3 failed requests; after copying those same bytes to client/apps-manifest.json the 404 is gone and only the two ERR_ABORTED entries remain. scripts/bundle-client.mjs:173 and src/sdk/ServerBoot.js:82 both expect the manifest beside the bundle (dist/client/apps-manifest.json), so the dev path and the bundle path disagree on where it lives. BrowserServer already falls back to the live app walk when the fetch is not ok, so today the only cost of the missing file is a 404 on every page load plus the manifest never being used in dev.'
  acceptance_criteria: A boot on a tree whose manifest was produced by postinstall alone must report no failed request for apps-manifest.json, witnessed with scripts/page-boot-witness.mjs without --allow-failed-requests, and the same run must show the manifest actually resolving apps instead of BrowserServer falling back to the live app walk.
  session_id: f73df536-0f66-49a1-8888-2a064d23416a
  status: pending
- id: prediction-contact-beyond-150ms-unacked-window-needs-peer-forward-sim
  title: Contact with another player is mispredicted at 50 ms one way and above because the 150 ms window gate closes and prediction ignores the peer
  body: 'REOPENED after a retracted premise. I first reported that the 150 ms gate did not exist in code; that was wrong. git show HEAD:src/client/PredictionEngine.js has PEER_FRESH_WINDOW_S = 0.15 at line 23 and gates the push with it at line 228, (this._inputSeq - 1 - this._lastAckedSeq) * dt <= PEER_FRESH_WINDOW_S, and HEAD _separateFromPeers(dt, ticksPastSnapshot) extrapolates the peer linearly by its snapshot velocity times lead before separationPush, so docs/netcode.md:32 is accurate about the committed code. The error came from searching the working tree: another lane has an uncommitted change to this file (git diff --stat: 64 insertions, 13 deletions) that deletes PEER_FRESH_WINDOW_S and replaces the linear extrapolation with a real peer forward-sim, and every disk scan sees that instead of HEAD. That lane owns this surface now, so this row should be worked by them or handed back explicitly rather than by a second writer. The six contact-regime arms I ran (--world=arena --hold=forward --precise --duration=20000, push-on against --peerSeparation=off) measured that working-tree forward-sim, not HEAD: corrections per ack 0.737 against 0.717 at 0/0/0, 0.674 against 0.667 at 50/10/2, 0.530 against 0.540 at 100/20/3, with mispredict err p95 10.79 against 1.67 cm, 11.71 against 2.67 and 12.33 against 12.33. Those numbers are a measurement of the in-progress version and must be re-taken against a committed tree before anyone concludes the forward-sim does not help.'
  acceptance_criteria: Simulate the peer forward under the same push inside the prediction replay (its velocity decaying through the shared applyMovement friction path when it has no input, pushed by separationPush) so the predicted path does not move when a fresher peer snapshot arrives. Done when, with --hold=forward (contact regime) at 50/10/2 and 100/20/3 against the --peerSeparation=off control, corrections per ack fall below the control (0.726 and 0.546) AND rendered-offset p95 stays at or below the control (10.9 and 23.5 cm) AND pops per minute do not exceed the control (268 and 192); 30 Hz mispredict falls below 75%; clear-lane control unchanged; rollback-duel and lockstep-rts 0 desyncs. Every arm must run against a committed tree with no concurrent lane editing src/client/PredictionEngine.js, and be repeated on an idle box.
  session_id: f73df536-0f66-49a1-8888-2a064d23416a
  status: pending
