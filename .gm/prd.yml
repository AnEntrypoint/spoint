- area: planet
  id: minimap-seam-continuity-degrades-at-36-anchors-per-face
  text: 'RE-SCOPED 2026-10-02: the original framing (a denser anchor lattice degrades minimap seam continuity) is WRONG and its headline metric is uncontrolled. (1) The two-bases-in-one-window hypothesis is REFUTED by the probe: minimapGrid computes each grid wholly in ONE base -- `before` in the pre-reanchor frame, `after` in the post-reanchor frame, `truth` in a frame anchored at dir. A window never mixes bases, and afterVsTruth max is 1 at both densities. There is no per-window base decision to fix. (2) The comparator is uncontrolled: needsReanchor is a continuous angle test, so A3 and A6 visit DIFFERENT windows (183 vs 174, only 43 shared). On the 43 shared windows: A3 worse on 2, A6 worse on 4, tie on 37; mean beforeVsTruth 0.093 vs 0.140 -- identical. The alarming max (maxRouteVsTruthBefore 7 -> 96) came from a non-shared window where A6''s worst sits on 27.69 m of terrain relief and A3''s on 4.36 m. meanRouteSeamDiff (0.0007 vs 0.0024) and the shared-window comparison are the only metrics that mean anything; max-of-N over mismatched window sets cannot measure this. (3) What the error actually is: minimapGrid maps each cell direction to chart-local through dirToLocalXZ, and at ~28 deg from the anchor that conversion is where the relocation TWO-CYCLE lived (pre-D5 up to 35.5 m of horizontal mis-location). Post-D5 the residual is the best-miss fallback at directions with no exact root (11 of 25 such cells in the D5 witness, worst residual 3.2 m). Mis-location times local terrain gradient is the pixel error: on the SAME window corner-nx-py-nz/23, beforeVsTruth went 96 -> 36 and rawSeam 66 -> 1 purely from the D5 two-cycle fix in src/shared/relocation.js. Also note maxSeamHeightDiffM equals maxTruthHeightDiffM in every run, so it is terrain relief inside the window and must not be read as a defect. NEW ACCEPTANCE: reduce pre-reanchor grid mis-location at large chart angle (the residual best-miss fallback), measured by meanRouteSeamDiff and by a like-for-like shared-window comparison, never by max over two different window sets. anchorsPerFace stays 3 -- on the walkability evidence (17/60 -> 22/60, chart-excess failures 17 -> 11, but 27 genuine terrain failures either way), not on this row.'
  session_id: f73df536-0f66-49a1-8888-2a064d23416a
  status: pending
- area: mapspinner
  id: mapspinner-gl-render-has-no-dispose
  text: 'The legacy WebGL renderer packages/mapspinner/src/gl-render.js (~1900 lines) has no `dispose` at all; its allocations are 10 programs, 17 textures, 4 VAOs plus buffers and FBOs. 94e2f5f5 added dispose() to planet-orchestrator.js (cancels the background HPF bake chain, clears the frame cache, deletes the two anchor-field TEXTURE_2D_ARRAYs it created) and dropped the isTslTerrain gate in client/core/TerrainBackdrop.js, so the legacy planet is now freed at all five live teardown sites (client/app.js:345, :357, :443, :851, :869 -- world teardown, boot swap, terrain reseed, HMR swap). Every WebGL session creates a legacy planet (isTslTerrain = isWebGPU) and the GL context outlives it, so each of those previously leaked a whole planet. WHAT REMAINS: gl-render''s own objects are still not released. Deliberately scoped out of 94e2f5f5 rather than folded in, because a teardown that misses objects is worse than a documented leak and this file is the one the TSL flip lands against. Acceptance: a dispose covering programs, textures, VAOs, buffers and FBOs, witnessed by renderer.info.memory not growing across repeated create/dispose cycles on the legacy WebGL path, plus zero console errors on the live legacy page.'
  session_id: f73df536-0f66-49a1-8888-2a064d23416a
  status: pending
- id: terrain-boot-refine-browser-isready-witness
  title: Witness nav-to-world-ready on the real client boot before and after the coarse-then-refine heightfield change
  body: 'The coarse field lands in 2ba79e9cfe on the strength of a real-server-boot A/B: setupTerrainStreaming 1383 ms median before, 514 ms after, and terrain-start to server-ready 2475 ms to 1802 ms, measured from the terrain log lines across seven real boots of WORLD=tps-game node server.js. That measures the authoritative server. It does not measure what the client actually waits for. In multiplayer the build is server-side so the client waits on the network; in singleplayer the same await sits in the SDK Worker (src/sdk/WorkerEntry.js:109), which blocks world-ready without producing a main-thread long task at all. So the player-visible number is nav-to-world-ready, and that number has not been taken on both sides of this change. Take it: run the browser harness against a real boot, capture performance.now() from navigationStart to the world-ready signal with git stash of 2ba79e9cfe for the before arm and it applied for the after arm, on a box with no other agent holding the GPU -- the one arm attempted on 2026-10-02 reached terrain-ready at 61321 ms against 3227 ms in a clean measurement, so a contended arm is noise, not evidence. Report both medians over at least three arms each.'
  acceptance_criteria: nav-to-world-ready medians over three or more uncontended arms on each side of 2ba79e9cfe, plus the long-task list from the same window. If the after arm is not faster, the refine did not buy what the server numbers promised and the row stays open with that measurement; if it is faster, close with both numbers.
  session_id: f73df536-0f66-49a1-8888-2a064d23416a
  status: pending
