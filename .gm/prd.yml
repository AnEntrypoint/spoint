- id: cluster-harness-teardown-uv-handle-double-close
  title: cluster-world-harness aborts at exit with a libuv double-close assertion
  body: '`node scripts/cluster-world-harness.mjs --scenario=handoff` prints its RESULT JSON and then dies with `Assertion failed: !(handle->flags & UV_HANDLE_CLOSING), file src\win\async.c, line 76` and exit code 127. Witnessed 2026-10-05 at commit bfee57e5b1 and once before at 3d0c82d425. The abort is in teardown: after the result is printed the harness disconnects both clients and destroys every hosted world (server.stop -> wss.close, httpServer.close, connections.destroy, sessions.destroyAll, terrain streamer stop, physics.destroy), so some libuv handle is closed while already closing and the whole process aborts instead of exiting 0. The handoff witnesses are printed before the abort and stand, but a nonzero exit means CI cannot use the script as a gate. `--scenario=tilt` exits 0 with the same disconnect-then-destroy shape, so the trigger is specific to the handoff teardown: three worlds created, one destroyed mid-run, and per-world streamer timers still scheduled when the worlds go away. Fix: find the handle closed twice (instrument the ws/http/streamer close paths) and make teardown idempotent rather than papering over it with process.exit.'
