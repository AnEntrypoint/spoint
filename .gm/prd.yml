  id: minimap-seam-continuity-degrades-at-36-anchors-per-face
  text: 'RE-SCOPED 2026-10-02: the original framing (a denser anchor lattice degrades minimap seam continuity) is WRONG and its headline metric is uncontrolled. (1) The two-bases-in-one-window hypothesis is REFUTED by the probe: minimapGrid computes each grid wholly in ONE base -- `before` in the pre-reanchor frame, `after` in the post-reanchor frame, `truth` in a frame anchored at dir. A window never mixes bases, and afterVsTruth max is 1 at both densities. There is no per-window base decision to fix. (2) The comparator is uncontrolled: needsReanchor is a continuous angle test, so A3 and A6 visit DIFFERENT windows (183 vs 174, only 43 shared). On the 43 shared windows: A3 worse on 2, A6 worse on 4, tie on 37; mean beforeVsTruth 0.093 vs 0.140 -- identical. The alarming max (maxRouteVsTruthBefore 7 -> 96) came from a non-shared window where A6''s worst sits on 27.69 m of terrain relief and A3''s on 4.36 m. meanRouteSeamDiff (0.0007 vs 0.0024) and the shared-window comparison are the only metrics that mean anything; max-of-N over mismatched window sets cannot measure this. (3) What the error actually is: minimapGrid maps each cell direction to chart-local through dirToLocalXZ, and at ~28 deg from the anchor that conversion is where the relocation TWO-CYCLE lived (pre-D5 up to 35.5 m of horizontal mis-location). Post-D5 the residual is the best-miss fallback at directions with no exact root (11 of 25 such cells in the D5 witness, worst residual 3.2 m). Mis-location times local terrain gradient is the pixel error: on the SAME window corner-nx-py-nz/23, beforeVsTruth went 96 -> 36 and rawSeam 66 -> 1 purely from the D5 two-cycle fix in src/shared/relocation.js. Also note maxSeamHeightDiffM equals maxTruthHeightDiffM in every run, so it is terrain relief inside the window and must not be read as a defect. NEW ACCEPTANCE: reduce pre-reanchor grid mis-location at large chart angle (the residual best-miss fallback), measured by meanRouteSeamDiff and by a like-for-like shared-window comparison, never by max over two different window sets. anchorsPerFace stays 3 -- on the walkability evidence (17/60 -> 22/60, chart-excess failures 17 -> 11, but 27 genuine terrain failures either way), not on this row.'
  session_id: f73df536-0f66-49a1-8888-2a064d23416a
  status: pending
- area: mapspinner
  id: mapspinner-gl-render-has-no-dispose
  text: 'The legacy WebGL renderer packages/mapspinner/src/gl-render.js (~1900 lines) has no `dispose` at all; its allocations are 10 programs, 17 textures, 4 VAOs plus buffers and FBOs. 94e2f5f5 added dispose() to planet-orchestrator.js (cancels the background HPF bake chain, clears the frame cache, deletes the two anchor-field TEXTURE_2D_ARRAYs it created) and dropped the isTslTerrain gate in client/core/TerrainBackdrop.js, so the legacy planet is now freed at all five live teardown sites (client/app.js:345, :357, :443, :851, :869 -- world teardown, boot swap, terrain reseed, HMR swap). Every WebGL session creates a legacy planet (isTslTerrain = isWebGPU) and the GL context outlives it, so each of those previously leaked a whole planet. WHAT REMAINS: gl-render''s own objects are still not released. Deliberately scoped out of 94e2f5f5 rather than folded in, because a teardown that misses objects is worse than a documented leak and this file is the one the TSL flip lands against. Acceptance: a dispose covering programs, textures, VAOs, buffers and FBOs, witnessed by renderer.info.memory not growing across repeated create/dispose cycles on the legacy WebGL path, plus zero console errors on the live legacy page.'
  session_id: f73df536-0f66-49a1-8888-2a064d23416a
  status: pending
- area: netcode
  id: netcode-tcp-head-of-line-blocking-dominates-high-loss-latency
  text: 'At 150 ms added latency / 25% jitter / 5% loss the remote interpolation buffer already runs dry on 7.1% of frames, so the residual error at that cell is NOT the buffer constant -- it is TCP head-of-line blocking. Measured same-condition: stream transport 899 ms / 171 cm versus datagram transport 458 ms / 89 cm. The buffer itself is adaptive and is not the thing to tune further: chosen delay p50 goes 40.2 -> 259.6 ms (6.4x) across conditioner cells, driven by the measured jitter estimate 15.2 -> 209.6 ms and by the snapshot interval doubling 16.7 -> 33.3 ms when adaptive pacing halves the snapshot rate. Attempts to buy more: interval margin 1.0 instead of 1.5 buys 6 ms clean and 20 ms at 150/25/5 but starts producing held frames on 1% of frames, and a p10 base offset is 1-2 cm worse at every condition. ACCEPTANCE: a datagram (UDP / WebTransport / WebRTC data channel) snapshot transport witnessed at the same conditioner cells, or a measured demonstration that head-of-line blocking is not the residual. COMPARABILITY CAVEAT to carry into any re-measure: the 150/25/5 cell above was measured on a box at cpu 91-100%, so its RTT was 631 ms against the baseline''s 346 ms -- 114 cm vs the 86 cm ceiling is therefore not a same-rig comparison. Re-measure both transports on a quiet box before quoting a delta.'
  session_id: f73df536-0f66-49a1-8888-2a064d23416a
  status: pending
- area: netcode
  id: lockstep-rts-missing-lockstep-profile
  text: 'apps/world/lockstep-rts.js does not declare `profile: ''lockstep''`, so a world written for the lockstep netcode profile runs on whatever profile the default resolves to. Reported as a cross-surface observation while closing the wall-plane row; not investigated, and I have not read the file. ACCEPTANCE: determine whether that world is intended to be lockstep -- if yes, declare the profile and witness it actually running the lockstep path (agreed-drop and pacing, deterministic dt, checksum folding raw f64 in id order), since a profile that is named but not selected is the same silent-fallback class as the combat config bug; if the name is historical, rename or document it. Then sweep every other app/world for the same mismatch -- a netcode profile that is declared but not honoured, or implied by a name but not declared.'
  session_id: f73df536-0f66-49a1-8888-2a064d23416a
  status: pending
- id: terrain-height-sampling-dominates-main-thread-during-movement
  subject: 'Measured on the built bundle with real worker-physics movement (674 m travelled over a full 120 s walk, RTX 3060, WebGPU, pinned bundles at f2ba5961, refreshHz 144.0-144.1): terrain height sampling is 43-47% of the main thread during steady-state walking - msH3i 18.9-20.9%, msSnoise3 12.5-14.6%, composeHeight 11.5-13.1%. Every target previously listed in perf-remaining-measured-targets-and-startup is an order of magnitude smaller: updateMatrixWorld 1.9%, _selectClusters 0.94%, the InstancedMesh2 BVH cull not in the top 12, vegetation shadow cull 11.3% of a much smaller slice. So that row''s target list is aimed at the wrong ~5%. The caller is NOT yet attributed: it is unknown whether the cost is the collider streamer rebuilding as the ring moves during a walk, per-frame ground queries, or a third path. Until the caller is named this is a measurement, not a fixable defect. Harness fact that invalidates earlier arms: CDP Input.dispatchKeyEvent reaches Chrome but never changes the app''s input bucket (nav->inputReachedGame stayed null, 0.9 m over 120 s of held W), so any arm driven by synthetic keys measured a stationary player; the walk must go through window.__spoint.route(waypoints,{mode:''walk''}) plus ?at= and whenSettled.'
  acceptance_criteria: the height-sampling call sites are attributed to a named caller with per-caller ms and call count during a real 120 s walk; that caller is fixed or budgeted with before/after p50/p95/p99 frame time, fps and long-task count over the same route and duration; fps during real movement rises measurably; no regression in terrain correctness (ground matches physics, sampled heights unchanged) or in startup; the rig asserts inputReachedGame is non-null before an arm is accepted
  session_id: f73df536-0f66-49a1-8888-2a064d23416a
  status: pending
- id: colliderstreamer-start-unbudgeted-initial-ring-build-stalls-boot
  subject: 'src/terrain/ColliderStreamer.js:253, inside start(), calls _rebuildMulti(centers, true). The unbudgeted flag is passed to _beginBudget at line 195 and disables all three pacing gates: the ADD_BUDGET_MS = 2 yield at line 204, COMPUTE_BUDGET_MS = 2.5 and MAX_NEW_CHUNKS_PER_PASS = 64. The initial collider ring build is therefore one synchronous un-yielded loop. Scale: a measured 0.637 ms per frame.groundHeightLocal times ~1016 height samples per terrain chunk ((extent/resolution)^2 = (510/16)^2) is roughly 0.65 s per chunk, so a 4-6 chunk initial ring is 2.6-4 s - which matches the single 2.6-4 s main-thread stall measured ~45-55 s after navigation in startup-overlay-dismisses-17s-after-world-ready, but is NOT yet a witness: the arithmetic is a match to test, not a proven cause. TerrainPhysics.repaintBiome (TerrainPhysics.js:199-201) passes the same unbudgeted flag, but its only caller is src/sdk/EditorHandlers.js:533 behind a biomeOverride guard, so it is editor-only and is NOT a cause of in-play hitches (that hypothesis was raised this session and withdrawn on evidence).'
  acceptance_criteria: the wall-clock duration of the ColliderStreamer start() call is instrumented during a real boot on the built bundle and either accounts for the 2.6-4 s stall or rules it out by name; if it accounts for it, the initial build is budgeted or otherwise paced, with before/after long-task count in the first 60 s, navigation->inputAccepted and navigation->overlayHidden; collider correctness unchanged (same collider set present after boot, ground walkable)
  session_id: f73df536-0f66-49a1-8888-2a064d23416a
  status: pending
