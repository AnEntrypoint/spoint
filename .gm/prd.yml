  body: 'src/behaviours/fireGameplay.js already sends { type: ''fire_burn'' } when a player starts burning, { type: ''fire_burn_end'' } when the burn status ends and { type: ''fire_death'' } on a fire death (all three witnessed server-side in scripts/fire-tps-game-witness.mjs). Nothing renders them. The cue itself (screen-edge vignette / status pip) must be built as a component in AnEntrypoint/design and reach spoint only through the pinned importmap (project/gui-kit-architecture-2026-08-21); client/app.js and client/hud/PauseMenu.js are currently owned by another lane, so this row must not hand-edit them. Needs a GPU window for the browser witness.'
