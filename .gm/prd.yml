  body: 'Measured: rebuildRecords is ~76% of remaining instance visits (12797.5 of 16311.3). Vegetation.js feeds both instancers identical level distances, LOD_HYS, _treeBox and _treeSph, yet each keeps its own uniform-grid index and reruns the full rebuild walk, so the same cells are classified twice per frame. Share one classification per species: needs a slot->id map or an id-alignment assertion because order/cellOf hold per-instancer ids. Gate on counted instance visits per frame (not wall clock) before and after, on BOTH GPUs, with a placement-identical control so LOD tiers must not move.'
