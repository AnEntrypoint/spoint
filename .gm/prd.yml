- id: prediction-rebase-replay-uses-latest-ground-normal
  title: PredictionEngine._rebaseAndReplay replays every unacked input with the newest server ground normal; history entries now store the normal each step used
  body: 'Seen while building the chart replay: replaying with one latest normal differs from the original per-step prediction by 1.85 mm per input on a 4-5.6 percent slope (20 mm over 10 inputs). Entries now carry normal/hasNormal (PredictionEngine.makeEntry, saveStepNormal) and the chart replay uses them; the ordinary rebase path still passes none. Unmeasured whether using stored normals there lowers the correction rate on slopes.'
