  blockedBy: []
  body: 'Measured gap, found by mutation in the s1e sweep: zeroing interiorLo/interiorHi on restore (the state a pre-4 keyframe used to produce) leaves every comparison bit-equal - scripts/fire-tile-reclaim-witness.mjs still reports 2 of 2 rewinds bit-equal and 99 vs 99 step checksums with 0 disagreements. checksum() (src/shared/fire/fireKernel.js:914) folds hashSum/hashXor, which come from hashCellValue (state, fuel, heat, timer plus the cell''s face/I/J), and then stepIndex, moisture, rain, wind, activeCount and scarCount - the interior bitmaps are not in it. The bit decides whether burnCell spots or pushes heat, so a peer that loses it does eventually diverge in cell state and the resync detector catches that; what is missing is detection at the moment of loss. hashCellValue is on the per-cell refresh path, so folding the bit in costs an isInterior lookup per refreshed cell; the alternative is a separate O(popcount) fold at checksum time, which measured 0.5 ms at 216k active cells and is too slow for the per-boundary path.'
