  cwd: C:\dev\spoint
  title: AMD iGPU loses the GPU context during tps-game boot, after which Chrome blocks every new context on the page
  body: |-
    Witnessed 2026-10-07 with scripts/.amd-gpu-diag.mjs (AMD Radeon(TM) Graphics, LUID 62340, --use-gl=angle --use-angle=d3d11 --use-adapter-luid=0,62340):

    - about:blank in the same browser: webgl2 context OK, UNMASKED_RENDERER_WEBGL = 'ANGLE (AMD, AMD Radeon(TM) Graphics (0x00001681) Direct3D11 vs_5_0 ps_5_0, D3D11)'.
    - After navigating to http://localhost:3099/?singleplayer&world=tps-game&at=-15,-12.5 (and to the same URL with &legacygl=1), a fresh canvas.getContext('webgl2') fails with creationError 'Web page caused context loss and was blocked', navigator.gpu.requestAdapter() returns null, and from then on page.evaluate stops answering (probe stalls 30 s+), so every AMD arm hangs instead of failing.
    - The app's own renderer is constructed (rendererCtor WebGLRenderer, info.render.calls 6) before the loss, so the loss happens during boot, not at first paint. This is the cause behind the 'no renderer strings exposed' gpu-probe failures and the wedged runs 4-13 of scripts/frame-time-gate.mjs on AMD; AMD run 3 of the same script did complete earlier in the day, so it is a race, not a hard block.
    - The legacy GL arm also logs '[minimap] baked tps-game.1337.h1.minimap.png ... in 60909ms', so a boot-time bake runs for a minute on this box.

    Fix direction: a GPU submission or a synchronous GPU wait long enough to trip the Windows TDR / Chrome GPU watchdog loses the device on the integrated adapter while the RTX 3060 completes it. Bound every boot-time GPU submission and readback wait (terrain/environment/minimap bakes, getBufferSubData-after-fence waits) to well under the 2 s TDR window and resume across frames, then re-witness the AMD arm. Until then the AMD frame-time baseline cannot be captured and the gate fails loudly there.
  id: amd-igpu-loses-the-gpu-context-during-tps-game-boot-after-which
  status: pending
