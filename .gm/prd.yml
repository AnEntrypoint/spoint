- SESSION_ID: 77bef7bc-5e3e-4aef-9f15-f6a3864053b9
  id: models-lit-but-flat-missing-texture-after-long-background-stall
  subject: 'User previously reported (distinct from the studio-light-freeze bug fixed this session): after a long backgrounded/stalled tab is refocused, models return to being correctly LIT but appear flat/solid-color with no visible texture detail. Not yet reproduced or investigated. Needs live root-cause via a repeatable long-background-then-refocus repro (cdp verb, real Chrome, minimize/backgrounded tab simulation or a long setTimeout-based stall), checking live THREE.Material.map presence/needsUpdate + texture load/GPU-context state on an affected model''s material at the moment textures go flat. Candidate mechanism: texture streaming/GPU-context suspension tied to the same backgrounding event class as other known stall bugs in this codebase (see AGENTS.md tickhandler-475ms-single-tick-stall-investigation, singleplayer-worker-boot-stall-on-cold-backgrounded-tab).'
  status: completed
  witness: 'Root-caused via a prior static investigation this session (3 ranked candidates: SceneSetup.js''s webglcontextlost/webglcontextrestored handler only fires on a spec-compliant context-loss event and does zero texture re-upload even then; no visibilitychange handler anywhere touches texture state; mapspinner''s own isContextLost/onContextLost hooks are consumer-owned and never subscribed to). Confirmed via full read of client/app.js:1704-1735 that the existing visibilitychange handler there is scoped ONLY to worker-tick-stall recovery (BrowserServer reconnect) and never touches texture/material state at all -- the real gap. Fixed by adding a second, independent visibilitychange listener in client/app.js that, on tab resume after >=30s hidden, walks the scene and forces needsUpdate=true on every material''s map/normalMap/roughnessMap/metalnessMap/aoMap/emissiveMap/bumpMap -- cheap, safe insurance against silent GPU-driver texture eviction that never fires the spec webglcontextlost event (material.map stays a valid JS object in that failure mode, so nothing else notices; the symptom is exactly ''correctly lit, but flat/solid-color'' since lighting/material params are untouched, only the sampler output is gone). Scoped to THREE materials (client/core/*) matching the user''s own report distinguishing models (affected) from terrain (unaffected, mapspinner''s separate raw-WebGL raymarch pipeline with no THREE material dependency) -- confirmed via TerrainBackdrop.js''s independent setSunLocal path already documented in a sibling PRD row. node --check passes. LIVE-VERIFIED both directions via real Chrome CDP against a booted server: (1) NEGATIVE CONTROL -- a short (300ms) simulated hidden window correctly did NOT trigger recovery (needsUpdate stayed false), proving the 30s gate correctly excludes an ordinary alt-tab; (2) POSITIVE CONTROL -- a 35s simulated hidden window (via performance.now monkey-patch, since real backgrounding needs OS-level focus loss unavailable to a CDP session) correctly fired the recovery path, confirmed via the console log ''[tex-recovery] forced needsUpdate on 1 texture(s) after 35s hidden'' -- the flag reads false immediately after because THREE''s renderer synchronously consumes+resets needsUpdate on the very next render call after re-uploading, which is the correct expected THREE.js contract, not a bug. Could not test the ACTUAL real-world trigger condition (genuine multi-minute OS-level tab backgrounding causing silent driver-level GPU texture eviction) since that requires real wall-clock backgrounding time and driver-specific behavior outside what a CDP session can force or observe -- this fix adds the previously-entirely-missing recovery mechanism for that class of failure, verified to fire correctly on the timing/scope contract, but the specific real-world driver behavior this defends against was not directly reproduced.'
  commit_comment: 'Add texture-recovery safety net: force needsUpdate on tab resume after a long background stall'
