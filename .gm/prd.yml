- id: singleplayer-boot-fails-on-second-origin-proxy
  title: Singleplayer page never reaches world-ready when served through a pass-through proxy on another port
  body: A plain Node http pass-through proxy on localhost:3091 forwarding every request (plus WebSocket upgrades) to :3000, swapping one module, served index 200 with COEP require-corp / COOP same-origin intact, but the page never reached window.__veg within 120 s and a later Runtime.evaluate hung. The proxy logged no errors. Likely an absolute origin/port dependency in boot (worker URL, HMR or dev-supervisor socket, a hard-coded :3000) or a CORP check failing for subresources on the second origin. Matters because same-session one-file A/B is the cleanest render-parity method. Find the dependency and either remove it or document it.
