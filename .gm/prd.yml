  status: pending
- id: cluster-client-session-adoption-and-router-redirect
  title: A client cannot adopt a session minted by another cluster world, and no router sends a connecting client to its cluster's world
  body: Found while building the cluster handoff harness (2026-10-05). src/client/ReconnectManager.sendReconnectMessage only sends MSG.RECONNECT while the client is in the waiting/reconnecting state, so a fresh PhysicsNetworkClient pointed at world B never presents the token that admitPlayerHandoff (src/sharding/ClusterHandoff.js) minted there; the harness has to send RECONNECT by hand. A product needs (a) a client API adoptSession({url, token, chart}) that reconnects to a new endpoint, presents the token, clears prediction history and collision-mirror tiles loudly and resets its chart ledger to the target world's chart (browser-testable pieces stay in chart-reanchor-browser-client-callbacks and cluster-wire-handoff-message-and-client-resync), and (b) a router entry that takes a connecting socket, asks ClusterManager for the cluster of its spawn or rejoin position, creates the world on first member (ClusterWorldHost.ensure) and redirects the client to that world's url (the current RegionRouter proxies every frame as base64 over IPC and is flat-grid only).
  acceptance_criteria: 'Node: a real PhysicsNetworkClient is handed from world A to world B by calling adoptSession with the token from admitPlayerHandoff and no manual RECONNECT; a connecting client with a saved base-chart position is redirected to the world of its cluster, with the world created on demand and refused loudly (cluster-world-capacity-exhausted) at the heap cap; browser A/B witness stays in planet-multiplayer-two-browser-different-regions-gpu-witness.'
  session_id: f73df536-0f66-49a1-8888-2a064d23416a
  status: pending
- id: fire-kernel-cost-rerun-low-priority
  title: 'Fire kernel: re-run the 1k/10k/100k step-cost bounds and the S2/S3 soak at low priority after 21:00'
  body: 'Deferred by the CPU quiet window (until 21:00): scratchpad/fire/bench-kernel.mjs (0,0,0 and 3,0,1 wind, 5 repeats, best-of per step), bench-sliced.mjs (default and tight caps), bench-alloc2.mjs, bench-rollback.mjs, and witness-s2.mjs/witness-s3.mjs under --expose-gc with CPU-time (process.cpuUsage) and process priority low (common.mjs sets PRIORITY_LOW). Record ms per step at 1-3k/3-10k/10-30k/30-100k active, sliced ms per tick, allocation, snapshot/checksum costs, against the S1 numbers.'
  acceptance_criteria: Numbers recorded in the design memo next to the S1 numbers; no regression above 15% on step ms per active cell; no GC event over 12000 ticks.
