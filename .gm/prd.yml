- id: cpu-plan-entity-bin-double-buffer-flip-on-change
  title: 'Snapshot entity encode: double-buffer the 29-byte bin record and flip only when its bytes change'
  subject: 'Stop re-allocating and re-hashing the snapshot entity bin record for every active dynamic entity every tick: pack into one of two reused buffers and flip only when the packed bytes actually differ, so unchanging entities skip the allocation, the FNV key build, the primeEntryDecode unpack and the computeFieldDelta byte scan.'
  body: |-
    TIER-0 parent: cpu-skip-and-replay-plan-browser. CPU-side, server tick path.

    WHAT RECOMPUTES, PER TICK, PER ACTIVE DYNAMIC ENTITY
    - src/netcode/SnapshotEncoder.js:420 refreshDynamicCache() -> fillEntityEnc(e, entry.enc) for every id in getActiveDynamicIds() (plus unmanaged and sleep-transition ids), unconditionally, every tick.
    - src/netcode/SnapshotEncoder.js:136 packBinRecord(...) is called with no `into` argument, so src/netcode/SnapshotBinFormat.js:18 allocates a NEW Uint8Array(29) for every entity every tick. This is one allocation per active dynamic entity per tick, forever.
    - src/netcode/SnapshotEncoder.js:136 also runs packQuat (src/netcode/SnapshotBinFormat.js:55: 4 abs, 3 compares, up to 4 round+clamp) and 11 byte writes.
    - src/netcode/SnapshotEncoder.js:263 resolveKey() -> buildEntityKey() (src/netcode/SnapshotEncoder.js:234-242): FNV-1a over the model string, the 29 bin bytes, the bodyType string, the custStr string (a JSON string when custom is set) and one float32. _dirty is true for every refreshed entry (src/netcode/SnapshotEncoder.js:427), so this runs for every entity every tick.
    - src/netcode/SnapshotEncoder.js:297 primeEntryDecode() -> unpackBinRecord() (src/netcode/SnapshotBinFormat.js:45): 10 field reads plus 7 object writes, once per non-env entity per tick via nearestViewerDist2 (src/netcode/SnapshotEncoder.js:307), called from applyEntry (src/netcode/SnapshotEncoder.js:335).
    - src/netcode/SnapshotEncoder.js:198 computeFieldDelta(): its `a !== b` fast path and its 29-byte scan are reached only for entities whose key changed, so it is already gated -- but only because the key is a hash; it currently always falls through the byte scan for changed entities.

    THE DEFECT THIS ALSO FIXES
    Two identity memos in this file are dead today and a flip-on-change buffer makes them live:
    - src/netcode/SnapshotEncoder.js:298 `if (entry._pBin === entry.enc[2]) return entry` can never hit, because fillEntityEnc replaces enc[2] with a freshly allocated buffer every tick. So primeEntryDecode re-unpacks every entity every tick even when it did not move.
    - src/netcode/SnapshotEncoder.js:202 `let binChanged = a !== b` is always true for the same reason, so the 29-byte scan runs even when the two records are byte-identical.
    The player path already uses exactly the flip trick this row proposes: src/netcode/SnapshotEncoder.js:48-49 `rec.flip ^= 1` with `rec.bins[rec.flip]`. Apply the same shape to entities, with the flip conditional on the bytes actually differing.

    STABLE STRUCTURE (the captured graph)
    The set of dynamic entities, the field schema of the 29-byte record (BIN_RECORD_BYTES, src/netcode/SnapshotBinFormat.js:4), the FNV key function, and the per-entry cache object.

    CHANGING INPUTS
    Entity position(3), rotation(4), velocity(3), scale(3), model, bodyType, custom.

    INVALIDATION KEY AND WHY IT IS SAFE
    The key is the packed bytes themselves, not an input hash. Each entry owns two reused Uint8Array(29) buffers. Each tick: pack into bins[flip^1] (src/netcode/SnapshotBinFormat.js:17 already accepts an `into` argument), compare the 29 bytes against bins[flip]; equal -> keep flip, reuse the cached key k, and enc[2] keeps its identity so both memos above hit; different -> commit the flip, set _dirty, recompute k. Because the skip is decided by comparing the actual output, there is no input-hash stale-output exposure for the CHANGE DETECTION itself.
    The value that IS cached across ticks is the derived FNV key k, and that one does depend on the code that produces it. It must be invalidated by the version of the producing code, never by its inputs alone (deviation.build-cache-no-code-version-key). Concretely: add BAKE_INPUTS_SNAPSHOT_ENTITY_ENC = ['../netcode/SnapshotBinFormat.js','../netcode/SnapshotEncoder.js','../shared/fnv1a.js'] to src/static/BakeCodeVersion.js and export SNAPSHOT_ENTITY_ENC_CODE_VERSION = bakeCodeVersion(BAKE_INPUTS_SNAPSHOT_ENTITY_ENC), following the existing HEIGHTFIELD_BAKE_CODE_VERSION shape at src/static/BakeCodeVersion.js:78-108, and register the row in BAKE_TRANSFORMS (src/static/BakeCodeVersion.js:110-116) so scripts/check-cache-keys.mjs fails when the packing code changes. Store the version on each entry; on mismatch, drop k and force one repack. No human has to remember to bump anything -- the version is a content hash of the producing source.

    WORST-CASE BOUND
    Skipped work is bounded by the active dynamic entity count times a constant (1 pack, 1 29-byte compare, no allocation). The miss path is byte-for-byte today's behaviour. A false 'unchanged' verdict is impossible: the verdict is produced by comparing the packed bytes that would have been sent. The one way this can go wrong is a cached k surviving a change to packBinRecord/packQuat/buildEntityKey, which the code-version field above closes.

    MEASUREMENT (integer work units, immune to timer inflation -- this box's zero-delta control arm is +/-10% and currently ~2.5x inflated, so nanosecond numbers are not admissible)
    Deciding counter: over N ticks on a live server, (number of active dynamic entities whose 29-byte bin record is byte-identical to the previous tick) and (number of active dynamic entities). The first number is the count of (allocation + FNV key build + unpackBinRecord) units skippable per tick. Second counter: primeEntryDecode memo hits per tick, measured by wrapping SnapshotEncoder.refreshDynamicCache (a writable static class property) and counting entries where entry._pBin === entry.enc[2].
  acceptance_criteria: 'Live server witness over >=300 ticks with >=4 connected players on apps/world/tps-game.js: report (a) active dynamic entities per tick, (b) byte-identical bin records per tick, (c) fraction (b)/(a). Pass requires (c) >= 0.20 AND, after the change, primeEntryDecode memo hits per tick equal to (b) within 1% AND zero Uint8Array(29) allocations per tick attributable to fillEntityEnc (verified by an allocation-count delta, not by a timer). Correctness: the decoded snapshot a real PhysicsNetworkClient receives must be byte-identical before and after the change over the same seeded tick range (compare decoded entity arrays field by field), and a moved entity must appear moved on the very next tick (inject a teleport and assert the client sees it that tick).'
