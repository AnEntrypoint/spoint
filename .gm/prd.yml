  id: server-applies-only-half-the-movement-when-the-input-backlog-is-deep
  title: Server applies only ~half the client's movement while the input backlog is deep
  body: |-
    Measured 2026-10-07 on the nvidia accelerated arm, e2e-ci-arena, scripts/prediction-drift-witness.mjs --gpu=nvidia --server-tick=10 --hold-ms=8000 with the prediction lead clamped (MAX_PREDICTION_LEAD_STEPS 16): clientTravel 109.433 m vs serverTravel 107.800 m, serverAppliedFraction 0.986, 39.9 inputs/s against a 10 Hz loop. Same arm with the clamp removed (injected MAX_PREDICTION_LEAD_STEPS = Number.POSITIVE_INFINITY): clientTravel 32.550 m vs serverTravel 16.800 m, applied 0.516, 57.6 inputs/s, unacked 127-152. So a deep backlog does not just make the predicted position run ahead -- it roughly halves how much of the movement the server actually applies, i.e. the client walks at half speed relative to its own input while the backlog is deep.

    The known mechanism is in src/sdk/TickHandler.js processPlayerMovement: one input per tick, then accrueStepBudget adds elapsedSteps (1/tick) minus stepsTaken (1), so inputStepBudget sits near 0 and the catch-up loop -- gated on inputs.length > INPUT_BUFFER_CATCHUP_DEPTH (8) AND player.inputStepBudget >= 1 AND no sequence gap ahead, capped at MAX_CATCHUP_STEPS_PER_TICK 3 -- rarely fires. Consumption stays near 1 input/tick however deep the queue is. The client-side clamp (bbb96d1a) bounds the symptom but does not make the server drain.

    Fix direction: make consumption track real elapsed time so a deep queue drains at a bounded multiple of real time without letting a fast client move faster than real time -- AGENTS.md records that the inputStepBudget >= 1 gate is the only thing preventing 4x-real-time movement, so the change has to keep that gate and raise the drain rate another way (accrue budget from wall clock rather than from ticks, or scale the catch-up cap by measured backlog). Witness the change with the same --server-tick arm and report serverAppliedFraction before/after; it must stay <= 1.000 (a client must never move faster than real time).
  status: pending
- session_id: f73df536-0f66-49a1-8888-2a064d23416a
  id: veg-painted-surface-witness-passes-with-zero-snow-and-zero-baresand
  title: veg-painted-surface-witness passes while measuring snow 0 and bareSand 0
  body: |-
    Observed in the npm run check gpu-free arm at HEAD 8683a05e, 2026-10-07: `check: gpu-free witness veg-painted-surface-witness.mjs 1.7 s, exit 0, RESULT: PASS snow 0 bareSand 0 determinism true`. A witness whose two measured quantities are both 0 is asserting nothing about the painted-splat path it exists to cover — it reports determinism of an empty result. AGENTS.md records that veg density must gate on painted snow because 1-2% of grass weight survives a snow cell, and `veg-placement-reads-painted-splat-weights` landed the acceptance multiply, so the live assertion should be a NON-ZERO painted snow count over cells the world actually paints, plus the veg result changing with and without the multiply (injection proof), not a determinism check over zeros.

    Fix direction: find why the harness paints nothing (no splat weights in the gpu-free world, or the painted layer is never written before placement runs), make the witness load or synthesise real painted weights, and assert a non-zero count with a before/after injection proof on the acceptance multiply. `veg-painted-surface-browser-arm` (pending) is the live-GPU counterpart and should end up asserting the same quantity. Memo tier: `mem-1c7e5d3a0f2b9846-2315`.
  status: pending
