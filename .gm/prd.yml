  body: 'Tier-0 profile, 3 NVIDIA arms at 1280x720 (medians) and 1 AMD arm: updateMatrixWorld self 6.4% (AMD 6.0), inclusive 9.5%; _projectObject 3.5%; multiplyMatrices 3.3%; Box3.setFromPoints 2.2%; Matrix4/Vector3 applyMatrix4 1.1+0.8%. Vegetation pools already set matrixAutoUpdate=false (Vegetation.js:248), so the walk is over other objects; the owners are unknown: rocks, grass, model-pool entities, ClusterLodMesh children, players, editor helpers. Witness plan: a diagnostic arm that traverses the scene once after the walk and reports object count by (constructor, matrixAutoUpdate, visible, isInstancedMesh, children) plus the raw .cpuprofile now saved per arm (data/perf-run/<label>.cpuprofile) analysed for callers of updateMatrixWorld. Fix candidates by evidence: matrixAutoUpdate=false on every static object, scene.matrixWorldAutoUpdate=false with explicit updates on edit or chart re-anchor, skip updateMatrixWorld for hidden subtrees.'
