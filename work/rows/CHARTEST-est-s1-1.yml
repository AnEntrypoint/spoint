title: "[CHARTEST-est-s1-1] [fixed] src/terrain: the ground-source port installs an adapter it never probes, so one that drops yGuess or returns a non-number is accepted where it registers"
body: "- id: CHARTEST-est-s1-1\n  title: 'src/terrain: the ground-source port installs an adapter it never probes, so one that drops yGuess or returns a non-number is accepted where it registers'\n  claim: 'CHARTEST characterization, surface src/terrain. installGroundSource (src/terrain/PlanetFrame.js:224-231) validates only that `name` is a non-empty string and `fn` is a function; it never calls fn. Witnessed live: installing a two-parameter source `(x,z)=>1.5` as ''patch-1arg'' succeeds and a later frame.groundHeightLocal(0,0,12) returns 1.5 with yGuess silently dropped (check P04); installing `()=>NaN` as ''nan-src'' succeeds and frame.groundHeightLocal(0,0) returns NaN with no throw (check P05). The port''s own error text (PlanetFrame.js:226) already states the contract `(x, z, yGuess) => number that throws SurfaceSolveError where there is no ground`, so the port declares a contract it does not check; the first failure surfaces at the use site, which AGENTS.md records as ~63.6 km from the chart anchor.'\n  witness: 'scripts/ground-source-port-witness.mjs dispatch 1791704838265-500-19e97f5d075d8453, exit 0, RESULT: PASS checks=18 failed=0; check P04-port-installs-a-source-that-drops-yGuess-and-never-notices installed=patch-1arg y(yGuess=12)=1.5 arity=2; check P05 y=NaN (no throw)'\n  notes: 'CLOSE (not closable by this hop, characterization first): the fix is one probe at install -- call fn with a finite (x,z,yGuess) at install time and throw a TypeError naming the source when the result is not a finite number or when a thrown error is not a SurfaceSolveError. The probe has to be admitted only for sources the port is told how to seed, so pin the probe point with the witness before changing behaviour; this row is the pinning step. Files: src/terrain/PlanetFrame.js.'\n  session_id: orch-main-terrain-contracttest-s1\n  _agentplug_lane_wait_ms: 120000\n  status: fixed\n  witness_path: .gm/witness-out/CHARTEST-est-s1-1-verdict.txt\n  note: registerGroundSource refuses a source that declares fewer than 3 parameters; probe shows two-arg refused, three-arg accepted"
status: "resolved"
