id: "ILLEGAL-r250-2"
kind: "prd"
title: "[ILLEGAL-r250-2] [fixed] client/hud/Chat.js destroy() sets destroyed but leaves joined true, so a destroyed HUD reports a live join"
body: "- id: ILLEGAL-r250-2\n  SESSION_ID: orch-main-r250\n  status: fixed\n  subject: client/hud/Chat.js destroy() sets destroyed but leaves joined true, so a destroyed HUD reports a live join\n  acceptance: 'Carry the lifecycle as one value instead of two booleans: a single phase of ''idle''|''joined''|''destroyed'' with get joined() === (phase === ''joined''), so no state can be both destroyed and joined. A browser witness (this module cannot be imported under node) creates the HUD, joins, calls destroy(), and reads get joined() === false.'\n  why: Hop ILLEGAL over client/hud, session orch-main-r250. Chat.js holds joined and destroyed (lines 28-29) as independent booleans, four combinations, one illegal. destroy() (line 118) sets destroyed and removes the card but never clears joined, and render() early-returns on destroyed (line 34), so the returned object keeps advertising joined true; callers read chatHUD?.joined to decide whether a chat exists (client/app.js:946 and :2795).\n  text: 'No duplicate: a regex scan of .gm/prd.yml for chatHUD?.joined (dispatch 1791679901677-500-97ac8a0c32129dc1, exhaustive over the file) returns no row owning this finding.'\n  witness: 'CLOSED, red then green on one live script. Before the fix destroy() left joined true while the card was already removed - {joinedAfterDestroy:true, cardRemoved:true}, dispatch 1791688205299-500-b7eb546ac4e3dc5b. After collapsing the two booleans into one phase of idle|joined|destroyed the identical script reports {joinedBeforeJoin:false, joinedAfterJoin:true, joinedAfterDestroy:false, cardRemoved:true}, dispatch 1791688241645-500-b36480a9861e0e50, so a destroyed HUD can no longer report a live join. The earlier blocker claim that client/hud cannot run under node was false: registerHooks redirects only the unresolvable specifier. Static: an exhaustive regex over Chat.js finds no joined/destroyed declaration or assignment left (dispatch 1791688242605-500-1a2762f7b01096c1). Callers client/app.js:946 and :2795 read chatHUD?.joined and now see the truth after destroy.'\n  session_id: orch-main-r250"
status: "resolved"
createdAt: "2026-11-05T13:14:33.629Z"
