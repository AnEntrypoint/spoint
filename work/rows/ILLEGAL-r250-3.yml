title: "[ILLEGAL-r250-3] [refuted] client/hud/MinimapPlacements.js exposes begin/step before bind, so an unbound scanner is representable"
body: "- id: ILLEGAL-r250-3\n  SESSION_ID: orch-main-r250\n  status: refuted\n  subject: client/hud/MinimapPlacements.js exposes begin/step before bind, so an unbound scanner is representable\n  acceptance: bind() returns the scanner ({ begin, step, cache, ... }) so begin and step cannot be reached without a bound lattice and field, and the module-level nullable frame/baseField/field/lattice/cell plus the strokes = -1 sentinel disappear into the returned object. A node witness constructs two scanners from two different binds and shows they hold independent state.\n  why: 'Hop ILLEGAL over client/hud, session orch-main-r250, RESCOPED after commit 2373bc58. The five nullable fields are per-scanner closure state (MinimapPlacements.js:96), not module level, and 2373bc58 arms nothing on a rejected begin (lines 179-195), so the original danger - begin/step dereferencing an unbound lattice - is no longer live - step on a never-begun scanner answers true with 0 glyphs. RESIDUAL - begin returns a bare boolean the caller may ignore, and after a rejected begin step() answers true with 0 glyphs, so refused-to-scan and scan-complete-with-nothing-to-draw are one observable state. Fix - begin returns the armed scan, or null on refusal, so a refused window cannot be stepped and step/glyphSnapshot are reachable only through it. BLOCKER (verified live, replaces the earlier caller-dirty claim): client/hud is clean - git_status paths-scoped dispatch 1791691634221-500-2c359414f9faccfc reports changed_paths 0, dirty false over client/hud - so the caller is writable, but the module''s own tracked witness pins the boolean contract: scripts/ClientHudMinimapPlacements-witness.mjs:274 and :278 assert begin(...) === true for a valid window and :259 asserts armed === false and then steps the refused scanner to completion (:250-258), so begin returning the scan or null moves three files together - the module, the caller (MinimapHUD.js:131 discards the return, :181 steps, :264 exposes glyphSnapshot/cachedChunks) and that tracked witness. A tracked pre-existing file is not edited by this walk and a hop resolves no row, so this is logged with its witness for a resolver lane.'\n  text: 'No duplicate: the existing row witness-gap-ClientHudMinimapPlacements (prd.yml line 32031, status completed) covers only witness coverage and is silent on this encoding; regex scan of .gm/prd.yml dispatch 1791679901677-500-97ac8a0c32129dc1.'\n  witness: 'Live, dispatch 1791688870426-500-12c5c85121440144: registerHooks maps the root-relative /src/terrain/* specifiers onto the real files, so the module imports under node and the earlier cannot-import blocker is withdrawn. begin({}, {}, {vegetation:{_meshes:[]}}, 1, 0, 0, 0) logs [minimap-contract] halfM is 0 and returns false; the following step() returns true with glyphSnapshot() [] and cachedChunks [0,0], identical to a finished scan of an empty region - that is the residual gap. step() on a never-begun scanner also returns true with 0 glyphs and never dereferences the unbound lattice, so the original claim in this row is closed. Caller and blocker confirmed live: codesearch literal over client/hud/MinimapHUD.js dispatch 1791691347228-500-dc56a0e5e05584f0 (exhaustive, 1 file, 4 scanner sites: :99 construct, :131 begin with the return discarded, :181 step, :264 glyphSnapshot/cachedChunks) and codesearch literal MinimapPlacements dispatch 1791691371656-500-2d3e9a7be22366c3 (16 files: the only production caller is MinimapHUD.js:2, MinimapGlyphs.js:1 takes only the glyph constants), so the blast radius of returning the scan instead of a boolean is those two files plus the tracked witness named above; git_status dispatch 1791691634221-500-2c359414f9faccfc. codesearch literal over the witness itself dispatch 1791692061431-500-499e2c183c4036bd (exhaustive, 1 file, 4 begin sites: :82 drive, :249 refused, :274 and :278 the two === true assertions), so every pin is named.'\n  session_id: orch-main-r250"
status: "resolved"
