title: "[PARNAS-ringbranch-ub2-p1] [refuted] src/spatial: the 2D-vs-3D relevance decision lives in TickHandlerAOI, and the snapshot path never takes it"
body: "- id: PARNAS-ringbranch-ub2-p1\n  title: 'src/spatial: the 2D-vs-3D relevance decision lives in TickHandlerAOI, and the snapshot path never takes it'\n  status: refuted\n  witness_path: .gm/witness-out/PARNAS-ringbranch-ub2-p1-verdict.txt\n  note: the per-player path (TickHandler.js:399) passes planetRadius into resolveDeliveredIds, so the 2D-vs-3D choice is taken on the snapshot path\n  body: |-\n    WITNESS codeinsight callers (index complete:true) + exec_js 1791694019322-500-622920e4fc76130e + aoi-ring-postcondition-witness.mjs PASS 4/4 (dispatch 1791694174312-500-a62b2a83afa1b452).\n\n    BYPASS TickHandlerAOI.js:150-154 cellBaseIds branches on `planetRadius <= 0` OUTSIDE the module: flat => stageLoader.getRelevantEntitiesHorizontal (2D, Octree.js:113); planet => appRuntime.relevantEntities (3D, AppRuntime.js:727 -> Stage.getRelevantEntities:58-60 -> nearby:90). The module exports both primitives and lets a caller-side `if` decide, so the decision is re-derived at every call site.\n\n    CONSEQUENCE AppRuntime.js:546 getSnapshotForPlayer, :548 getRelevantDynamicIds and :550 getRelevantDynamicIdsWithStarvation all call relevantEntities with NO planetRadius branch, so they stay spherical. AGENTS.md: no shipped app declares planetRadius and resolvedPlanetRadius maps undeclared to 0, so on every shipped world the AOI ring cache is cylindrical while the player snapshot for the same entities is spherical. Two live answers to one question.\n\n    DUPLICATION Stage.js:54-60 makes getNearbyEntities and getRelevantEntities byte-identical bodies (both `this.spatial.nearby(position, radius || this.spatial.relevanceRadius)`) one line above getRelevantEntitiesHorizontal, so \"nearby\" and \"relevant\" are names without a decision between them; StageLoader.js:123-136 re-declares all three as pass-throughs.\n\n    FIX move the choice into src/spatial behind one entry point and delete the duplicated facade bodies. Verify by live execution on a shipped world, not by reading the branch.\n  session_id: orch-main-r310-sub2-p1"
