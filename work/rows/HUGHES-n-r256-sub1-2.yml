title: "[HUGHES-n-r256-sub1-2] [fixed] worldMobileButtons silently relocates a declared out-of-range grid and drops declared buttons past the 3x3 cap"
body: "- id: HUGHES-n-r256-sub1-2\n  SESSION_ID: orch-main-r256-sub1\n  action: reject (never rewrite) a declared grid cell outside 1..3 and a declaration that does not fit the 3x3 grid, so a world author's layout is either honoured or refused\n  claim: 'executed input-class sweep (dispatch 1791681155262-500-d3f7c116742a69ca) over src/shared/worldDefaults.js:30-47: two silent rewrites of a declared button set that no caller can observe. A declared grid cell outside the 1..3 range is not rejected by normalizeGridCell but relocated: {action:''jump'', grid:[9,9]} comes back at grid [1,1], so the world author''s layout is silently rewritten to the first free cell rather than refused. A declaration that exceeds the 3x3 grid loses its tail: 10 distinct declared actions yield 9 buttons, the 10th vanishing at the cap with no signal.'\n  evidence: 'live dynamic import of src/shared/worldDefaults.js: worldMobileButtons({input:{mobileButtons:[{action:''jump'', grid:[9,9]}]}}) -> [{action:''jump'', grid:[1,1], ...}], the declared [9,9] gone; worldMobileButtons({input:{mobileButtons: ten distinct ''a0''..''a9'' entries}}) -> 9 buttons, ''a9'' absent; worldMobileButtons({input:{mobileButtons:[]}}) -> the same three DEFAULT_MOBILE_BUTTONS an undeclared world gets, so declared-empty and undeclared are indistinguishable in the output'\n  principle: HUGHES\n  status: fixed\n  surface: src/shared\n  title: worldMobileButtons silently relocates a declared out-of-range grid and drops declared buttons past the 3x3 cap\n  witness: 1791681155262-500-d3f7c116742a69ca\n  session_id: orch-main-r256-sub1"
status: "resolved"
