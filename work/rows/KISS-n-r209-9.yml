body: "- id: KISS-n-r209-9\n  subject: 'client/xr: _tmp1/_tmp2 scratch vectors are cloned at every use, so the scratch buys nothing'\n  description: 'KISS / client/xr. XRWidgets.js:32 allocates _tmp1/_tmp2 as scratch, but both use sites copy out of them anyway: :157 origin = _tmp1.clone(); direction = _tmp2.clone().multiplyScalar(-1), and :165 origin = _tmp1.clone(); direction = _tmp2.clone(). The values are then held across updateTeleportArc and handed to computeParabolicArc, so the shared temporaries cannot be reused in any case -- two allocations per frame dressed up as zero. EVIDENCE codesearch literal client/xr clone() dispatch 1791674780005 (exhaustive:true, 4 occurrences, all on those two lines). FIX: write into pre-allocated origin/direction vectors and keep them, or delete _tmp1/_tmp2 and allocate at the use site; do not keep both.'\n  notes: 'witness: codesearch literal 1791674780005 (exhaustive:true). node-only row; not resolved by this hop.'\n  status: fixed\n  session_id: orch-main-r209"
