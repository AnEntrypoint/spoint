title: "[CHARTEST-est-s1-2] [refuted] src/terrain: the port''s auto-name ''substituted'' is one key for every anonymous adapter, so a second install silently clobbers the first"
body: "- id: CHARTEST-est-s1-2\n  claim: 'CHARTEST characterization, surface src/terrain. The `groundHeightLocal` setter (src/terrain/PlanetFrame.js:256-261) invents the name ''substituted'' for every install that is not the original cpu-solve closure, so two unrelated adapters share one registry key. Witnessed live (check P08): assigning fn1 then fn2 through the setter leaves groundSources as [\"cpu-solve\",\"substituted\"] with one entry, and groundSourceOf(''substituted'') returns fn2 -- fn1 is unreachable. Two callers in the tree reach this setter: client/core/SculptOverlay.js:30 (`frame.groundHeightLocal = _wrappedGround`) and, via Object.assign onto Object.create(frame), client/core/ExactPatchFrame.js:6-11. Whichever installs last owns the name, so the other''s own unwrap path (SculptOverlay.js:36 restores _baseGround) can hand the registry back to an adapter that is no longer current.'\n  notes: 'CLOSE (not by this hop): make the anonymous install path derive a unique name, or refuse an install that would overwrite a live name the port did not assign, and have SculptOverlay.js:30 and ExactPatchFrame.js:6 install under names they own. Pin first: this row is the pin. Related, not duplicate: GUARD-succ1-2 (unguarded call sites) is a different defect.'\n  title: 'src/terrain: the port''s auto-name ''substituted'' is one key for every anonymous adapter, so a second install silently clobbers the first'\n  witness: 'scripts/ground-source-port-witness.mjs dispatch 1791704838265-500-19e97f5d075d8453, exit 0, RESULT: PASS checks=18 failed=0; check P08 groundSourceOf(''substituted'')===second=true names=[\"cpu-solve\",\"substituted\"]; check P06/P07 confirm the setter is the naming path'\n  session_id: orch-main-terrain-contracttest-s1\n  _agentplug_lane_wait_ms: 120000\n  status: refuted\n  witness_path: .gm/witness-out/CHARTEST-est-s1-2-verdict.txt\n  note: anonymousSourceName numbers each install: substituted, substituted#2, ... so no two anonymous adapters share a key"
