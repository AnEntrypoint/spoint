title: "[ILLEGAL-r250-4] [open] client/hud/VoiceIndicator.js: the voice lifecycle is two booleans over four states, so {joined:true,destroyed:true} and {session:null,joined:true} are representable"
body: "- id: ILLEGAL-r250-4\n  witness: 'Live dispatches, all this session: callers createVoiceIndicator dispatch 1791694170365-500-e9644645a34ae43d (index complete:true; defined_at client/hud/VoiceIndicator.js:23-246; exactly 2 call sites, client/app.js:2792 and :2828, both `window.__app.voiceIndicator = createVoiceIndicator(uiRoot, () => window.__app.wireweave, engineCtx, MSG)`); codesearch literal voiceHUD over client/app.js dispatch 1791694229815-500-989ef8d3ce843343 (exhaustive, 0 matches - no voiceHUD binding); codesearch literal createVoiceIndicator over client/app.js dispatch 1791694269468-500-76f932cdcddaf42e (exhaustive, 4 lines: two dynamic imports at :2791/:2827 and the two assignments at :2792/:2828); codesearch literal voiceIndicator over client dispatch 1791694310458-500-adb589e64eacb7c1 (exhaustive, 3 lines, 46790 lines read - no reader of the exported `joined` getter, so the stale post-destroy `joined` is latent, not yet observed by a caller); fs_read client/hud/VoiceIndicator.js dispatch 1791694036546-500-9a12b448d22e032d (lines 1-129) and dispatch 1791694104328-500-9988a778b28569cb (lines 130-246) read the whole 246-line module on the work tree: :29-32 the four declarations, :52 `if (destroyed) return`, :163 the `disconnected` listener setting joined=false while session stays non-null, :186 joined=true only after connect, :213 `get joined()`, :232 `destroyed = true` in destroy with joined left set; git_show at the shipped row -2 commit 2f4b3c31df dispatch 1791693989228-500-e7b4c192a939bc71 shows the same file already carrying teamChannelTeamId, i.e. this is the tip of the module. LIVE EXECUTION (added after gm 0.1.1579 started persisting exec_js bodies): exec_js dispatch 1791698084802-500-d2d4c37a14865133 imported the real module under DOM stubs and failed at the import stage - `Cannot find package ''anentrypoint-design'' imported from C:\\dev\\spoint\\client\\hud\\VoiceIndicator.js`, ERR_MODULE_NOT_FOUND, exit 0. Both outcomes were predicted before dispatch; this is outcome B. Consequence, now part of the row: this module has NO node-runnable witness path - `anentrypoint-design` is an import-map name resolved only in the browser from the pinned CDN design bundle, not an installable package - so the illegal state cannot be driven by exec_js and must be witnessed on the browser surface, or carried on source truth as here. The probe is persisted and re-runnable at .gm/witness-out/witness-1791698084802-500-d2d4c37a14865133.mjs; it prints RESULT: FAIL with the error today and will print RESULT: PASS the moment the module becomes importable in node, so a resolver lane gets a red-then-green signal for free.'\n  principle: ILLEGAL\n  session_id: orch-main-r250\n  status: refuted\n  witness_path: .gm/witness-out/ILLEGAL-r250-4-verdict.txt\n  note: the voice lifecycle is one phase string (idle, connecting, joined, destroyed), not two booleans\n  surface: client/hud\n  title: 'client/hud/VoiceIndicator.js: the voice lifecycle is two booleans over four states, so {joined:true,destroyed:true} and {session:null,joined:true} are representable'\n  why: 'createVoiceIndicator keeps `let session = null` next to `let joined = false`, `let muted = true` and `let destroyed = false` (client/hud/VoiceIndicator.js:29-32). The lifecycle really has four states - idle, session created but not connected, connected, destroyed - because `joined` is NOT redundant with session: after a failed `s.connect` or the session''s `disconnected` event the session stays non-null while joined goes false, so those two booleans were presumably kept precisely because the pair encodes three live states. The encoding still admits combinations no transition ever produces: {session:null, joined:true} (joined is only set after ensureSession returned a session) and {joined:true, destroyed:true} (destroy sets destroyed but never clears joined, so the exported `joined` getter keeps reporting true after teardown). destroy''s only path that could reset joined is `await session?.disconnect()` at :234, wrapped in a swallowing `catch (_) {}`, so if disconnect rejects the flag stays true with no signal. Minsky: make the illegal state unrepresentable - one `phase` of ''idle''|''connecting''|''connected''|''destroyed'', with `joined` derived as phase === ''connected'', exactly the shape row ILLEGAL-r250-1 gave Chat.js. NOT resolved here: a hop logs rows by live execution and resolves none, and the change moves render plus the `disconnected` and `destroy` paths and the exported `joined` getter together, so it belongs to a resolver lane that owns client/hud.'"
