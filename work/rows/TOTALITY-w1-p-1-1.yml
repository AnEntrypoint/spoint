body: "- id: TOTALITY-w1-p-1-1\n  status: refuted\n  witness_path: .gm/witness-out/TOTALITY-w1-p-1-1-verdict.txt\n  note: setPlayerPosition calls vec3 first; a bad position throws instead of returning silently\n  node: TOTALITY\n  session_id: orch-main-r270-sub1-w1-p-1\n  surface: src/apps/AppRuntime.js:628 (setPlayerPosition), :690-694 (attachEntityToPlayer); src/shared/vecGuard.js\n  depends_on: DBC-n-r270-1\n  title: 'src/apps/AppRuntime.js: setPlayerPosition:628 refuses an invalid position with a silent return and attachEntityToPlayer:692 replaces an invalid offset with the default, so both answer success for input outside their domain'\n  claim: 'TOTALITY (Total Functional Programming - David Turner) over src/apps/AppRuntime.js. NODE-ONLY: filed by hop orch-main-r270-sub1-w1-p-1, not executed by it. WITNESS exec_js 1791694111360-500-af2f38c61f3fac24 against the real module: setPlayerPosition(''p1'', null) and setPlayerPosition(''p1'', [1,NaN,3]) both return with the player still at [1,2,3] -- no throw and no return value, so a caller cannot distinguish ''moved'' from ''your input was outside my domain''. WITNESS exec_js 1791694168853-500-54df9dbb43b90f6f: attachEntityToPlayer(''e2'',''p1'',null) and attachEntityToPlayer(''e3'',''p1'',[0,1]) both return true and store offset [0,1,0], byte-identical to a genuine [0,1,0] attach. Both are the same shape this hop closed at :23-29 (_nonNegOrDefault): an input outside the declared domain is answered with a value of the declared type that really means ''I refused''. Both sinks sit on the same surface as the radii this hop already parses (:571, :625), so the surface is still not total.'\n  acceptance_criteria: A live node dispatch against the real AppRuntime shows setPlayerPosition with a non-vecOK(p,3) position rejected by a named TypeError raised from src/shared/vecGuard.js (never a silent return), and attachEntityToPlayer with a non-vecOK offset rejected the same way, while setPlayerPosition('p1',[1,2,3]) and attachEntityToPlayer('e1','p1',[0,5,0]) behave exactly as at HEAD.\n  witness: exec_js 1791694111360-500-af2f38c61f3fac24 (setPlayerPosition null and [1,NaN,3] are no-ops, player stays at [1,2,3]); exec_js 1791694168853-500-54df9dbb43b90f6f (attach null/[0,1] -> true, stored offset [0,1,0])"
