title: "[PARSEDV-ub1-s2-1] [fixed] src/game/QuestSystem.js: every refusal is an untyped sentinel — startQuest returns one false for unknown-quest and already-started, completeObjective one false for four causes (:78,:81,:83,:87), claimReward one null for not-complete and unknown-quest"
body: "- id: PARSEDV-ub1-s2-1\n  SESSION_ID: orch-main-r260-sub1-s2\n  status: fixed\n  title: 'src/game/QuestSystem.js: every refusal is an untyped sentinel — startQuest returns one false for unknown-quest and already-started, completeObjective one false for four causes (:78,:81,:83,:87), claimReward one null for not-complete and unknown-quest'\n  body: |-\n    PARSEDV over src/game. WITNESS: gm dispatch 1791688076056-500-c0b761c3bf95d6e2 (QuestSystem-witness 114/114 PASS after the parse fix; StatsSystem 112/112, EventChainManager 214/214, AbilityTree 59/59, ProgressionSystem 54/54, game-index 47/47).\n\n    WHAT THIS HOP CLOSED: startQuest admitted any inherited Object.prototype key ('constructor', 'toString', '__proto__') because the guard was `!quests[questId]` — a truthiness test, not a parse — and then threw TypeError at `questDef.objectives.map`. Now `_declaredQuest()` parses the id against the declared table with hasOwnProperty, and `restore()` parses each record through `_parseRestoredQuest()` (state must be in {active,complete,claimed}, progress must be an array) instead of coercing. That is the parse side; the result side is untouched.\n\n    WHAT REMAINS (this row): the refusals carry no cause. startQuest:54 false means either \"no such quest\" or \"already active/claimed and not repeatable\". completeObjective false at :78 (quest absent or not active), :81 (unknown objective index), :83 (non-finite or <=0 amount), :87 (objective already at target). claimReward null at :121 (absent or not complete) and :124 (unknown def). A caller cannot branch on the cause without re-deriving the state with getQuestState — which is exactly validate-then-re-validate.\n\n    WHY NOT CLOSED HERE: the boolean/null contract is pinned in two places that are not this hop's to move. scripts/QuestSystem-witness.mjs (UNTRACKED and pre-existing at session start; left byte-identical) asserts `startQuest(...) === false` and `=== true` at :112,:113,:137,:139,:144,:149,:161,:166,:271,:274,:276,:280 and `claimReward(...) === null` at :343. apps/tutorial-rpg/index.js:118 does `if (!ctx.quests.startQuest(playerId, questId)) return`. Widening the result type reddens a live witness and an app in the same turn.\n\n    NEEDED: 'one declared result type per entry point (e.g. {ok:true} | {ok:false, reason:''unknown-quest''|''already-started''|...}) landed together with the witness update and the tutorial-rpg call site, in one commit, on a surface no other lane holds.'\n  session_id: orch-main-r260-sub1-s2"
status: "resolved"
createdAt: "2026-11-05T13:14:33.675Z"
