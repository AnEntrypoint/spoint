title: "[KISS-n-r209-6] [fixed] client/xr: update() throttles on the absolute clock with now % 66 < 16 and now % 100 < 16"
body: "- id: KISS-n-r209-6\n  subject: 'client/xr: update() throttles on the absolute clock with now % 66 < 16 and now % 100 < 16'\n  description: 'KISS / client/xr. XRSystem.js:151 gates the wrist-UI refresh on (now % 66 < 16) and :155 gates updateControllerVisibility on (now % 100 < 16). now is not a frame counter: client/app.js:2586 calls xrSystem?.update(ctx.res.frameDt, local, ctx.now), a millisecond clock, so both are modulo samples of wall time whose firing count per second tracks the frame rate instead of expressing a rate. EVIDENCE exec_js dispatch 1791674660915-500-e4bb063fa0da389c stepping the real expressions over 1000 ms at four frame rates: 30fps modulo66=15 modulo100=8, 60fps modulo66=16 modulo100=6, 120fps modulo66=30 modulo100=16, 144fps modulo66=32 modulo100=24, against a dt accumulator holding 15/15/15/14. The claim under test (the refresh rate scales with frame rate, so the wrist UI and controller visibility update at whatever rate the device happens to run) is confirmed; the pre-declared expectation missed by one at 60 and 144 fps from float stepping, and the observed numbers above are the record. FIX: accumulate dt and refresh when it crosses the interval.'\n  notes: 'witness: exec_js 1791674660915-500-e4bb063fa0da389c (live); codesearch literal xrSystem scoped to client/app.js 1791674734849 (exhaustive:true, 7 lines) pins now = ctx.now at :2586. node-only row; not resolved by this hop.'\n  status: fixed\n  session_id: orch-main-r209"
status: "resolved"
