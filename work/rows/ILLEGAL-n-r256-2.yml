title: "[ILLEGAL-n-r256-2] [fixed] worldMobileButtons makes a declared-empty button set unrepresentable and drops declared buttons silently"
body: "- id: ILLEGAL-n-r256-2\n  title: worldMobileButtons makes a declared-empty button set unrepresentable and drops declared buttons silently\n  principle: ILLEGAL\n  surface: src/shared\n  status: fixed\n  claim: 'src/shared/worldDefaults.js:46 `return out.length > 0 ? out : DEFAULT_MOBILE_BUTTONS.map(...)` turns a world that declares `input.mobileButtons: []` into a world with three default buttons, so ''no mobile buttons'' cannot be expressed; lines 37, 38 and 42 `continue` on a malformed entry, a duplicate action and a full 3x3 grid, so a declared button can vanish with no signal'\n  evidence: 'live read of the module: an empty declared array is an Array, so the `!Array.isArray(declared)` branch at line 32 is not taken; the loop yields nothing and the length check silently substitutes the default three'\n  action: fall back to the default only when mobileButtons is undeclared (undefined), and reject (not drop) a malformed or duplicate entry and a declaration that exceeds the 3x3 grid\n  witness: 'duplicate of HUGHES-n-r256-sub1-2: both rows describe worldMobileButtons in src/shared/worldDefaults.js dropping declared buttons silently. codesearch literal ''worldMobileButtons'' (dispatch 1791688283781-500-5b11dead8747c829) shows the only definition at src/shared/worldDefaults.js:41 and the only consumers at client/app.js:101,667,671 and client/hud/MobileControlsUI.js:1,86; prd.yml:261 and :439 carry the two duplicate row titles for the same single surface.'\n  callers: client/app.js:667, client/app.js:671, client/hud/MobileControlsUI.js:57\n  session_id: orch-main-r256\n  commit_comment: retired as duplicate of HUGHES-n-r256-sub1-2 (same worldMobileButtons surface, src/shared/worldDefaults.js:41)"
status: "resolved"
createdAt: "2026-11-05T13:14:33.631Z"
