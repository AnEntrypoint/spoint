title: "[PARNAS-cylinder-ub2-p1] [fixed] src/spatial: the flat relevance ring is a cylinder of infinite height and only a method name says so"
body: "- id: PARNAS-cylinder-ub2-p1\n  title: 'src/spatial: the flat relevance ring is a cylinder of infinite height and only a method name says so'\n  status: fixed\n  witness_path: .gm/witness-out/PARNAS-cylinder-ub2-p1-verdict.txt\n  note: nearbyCylinder takes halfHeight as an explicit argument and refuses a missing one\n  body: |-\n    WITNESS exec_js 1791694019322-500-622920e4fc76130e (live, SpatialIndex from src/spatial/Octree.js): nearbyHorizontal([0,0,0],200) returns [\"deep\",\"ground\",\"high\"] -- an entity at y=+5000 and one at y=-90000 are both inside a 200 m relevance ring. nearby([0,0,0],200) over the same index returns [\"ground\"].\n\n    CAUSE Octree.js:113-133 computes dx and dz only and never reads position[1], so the horizontal ring has no vertical extent at all. CELL_SIZE/cellCoord/cellKey (:3-14) bucket on X and Z only, which is correctly hidden.\n\n    DEFECT the contract is not stated at the boundary. The only signal is the substring \"Horizontal\" in the method name at :113, and the module's sibling queries nearby (:90) and nearest (:173) are spherical over the same XZ buckets. src/spatial has no type, parameter or return encoding that tells a caller which ring it is buying, so choosing between them requires reading three method bodies. Every caller must re-derive the decision, which is exactly the secret the module exists to hold.\n\n    FIX give the ring semantics one named owner inside the module (an explicit radius-semantics argument or a distinct type), rather than three methods distinguished only by name. Note the landed half: nearbyHorizontal now honours the same `out` buffer protocol as nearby (:113-116), so a caller passing out is no longer silently ignored.\n  session_id: orch-main-r310-sub2-p1"
status: "resolved"
createdAt: "2026-11-05T13:14:33.721Z"
