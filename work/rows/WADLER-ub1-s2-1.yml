body: "- id: WADLER-ub1-s2-1\n  status: fixed\n  witness_path: .gm/witness-out/WADLER-ub1-s2-1-verdict.txt\n  note: addXpResult carries invalid-amount, xp-saturated and accepted-with-level-up as distinct reasons; addXp keeps its boolean API for existing callers and is a thin wrapper over addXpResult\n  title: src/game/ProgressionSystem.js:70 addXp returns one false for refused-invalid, u32-saturated and accepted-with-no-level-up (:71,:80,:106)\n  body: |-\n    WADLER over src/game. addXp conflates three cases in one boolean: :71 refuses a non-finite or negative amount with no mutation; :76-81 MUTATES (clamps totalXp to 0xFFFFFFFF, sets level to cfg.maxLevel) and then returns false; :106 returns leveledUp, so false also means 'accepted, no level-up'. A caller cannot destructure the refusal, and the saturation branch is the only one that writes before refusing.\n\n    Witness-pinned (cannot be edited by this walk, tracked test file, byte-identical): scripts/ProgressionSystem-witness.mjs:107 'add-xp-rejects-invalid-amounts' wants [false,false,false,false]; :133 'add-xp-below-threshold-no-level' wants [false, {...}]; :154-159 'u32-overflow-clamps-and-rejects' wants [false, 4294967295, 100]. src/game/PROGRESSION.md:36 documents addXp(playerId, amount): boolean and :308 documents the u32 saturation returning false, so the conflation is contractual, not accidental.\n\n    Target shape: return {ok, reason, leveledUp} with reason in 'invalid-amount' | 'xp-saturated' | null, and update the three witness expectations plus PROGRESSION.md:36/:308 in the same commit. src/game/EventChainManager.js runChain already ships the in-repo shape to copy ({success, reason}).\n  session_id: orch-main-r260-sub1-s2"
