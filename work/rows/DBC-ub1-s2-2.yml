title: "[DBC-ub1-s2-2] [open] src/game/EventChainManager.js:18 addChain states no precondition and writes its postcondition into the caller's object (:20)"
body: "- id: DBC-ub1-s2-2\n  title: src/game/EventChainManager.js:18 addChain states no precondition and writes its postcondition into the caller's object (:20)\n  status: fixed\n  witness_path: .gm/witness-out/DBC-ub1-s2-2-verdict.txt\n  note: spec-not-mutated and throws-on-non-object refuted; the no-id name defect (\"Event Chain undefined\") fixed in src/game/EventChainManager.js\n  principle: DBC\n  surface: src/game/EventChainManager.js\n  witness: 1791691840225-500-58d3785e9706fcb4\n  detail: 'codesearch literal over src/game (1791691840225-500-58d3785e9706fcb4, exhaustive:true, 2579 lines) finds ZERO `throw` in EventChainManager.js -- unlike QuestSystem.js:2/:10-13 and StatsSystem.js:2, none of its 29 members enforces a precondition. addChain is the worst case and is reached from client/editor/EventChainPanel.js (createEventChainPanel, loadPresetTemplate) and from its own fromJSON (:432). Two contract holes: (a) no precondition -- `chainSpec.id` at :19 on a null/undefined spec raises an incidental TypeError from property access, not a stated contract error, so a malformed spec and a legal one are indistinguishable to the caller; (b) :20 assigns `chainSpec.id = ''chain_'' + Math.random()...` -- a postcondition on an INPUT, mutating the caller''s spec, so a generated id leaks into any spec the editor later serialises. It also silently replaces an existing chain of the same id with no ''created''/''replaced'' distinction, while removeChain (:36) does log. Fix: reject a non-object spec and a spec with no id by throwing a named [chain] error, build the chain without touching chainSpec, and report create-vs-replace.'\n  session_id: orch-main-r260-sub1-s2"
status: "open"
