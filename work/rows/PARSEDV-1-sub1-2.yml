body: "- id: PARSEDV-1-sub1-2\n  title: 'scripts/lib/verify-doc-claims.mjs: the figure predicate still requires an ASCII digit, so docs/measurement-figures.md:129 ([ADAPTER:AMD iGPU] [UNSOURCED], no digit) parses as prose and its provenance is never checked'\n  body: 'Witness 1791698264682-500-e66513d7cf2ca62d. parseDocRow admits a row as a figure only when bullet && /[0-9]/ && (slots.length>0 || provenanceCount>0); the digit test is a proxy for ''quotes a measurement'' and it drops every row whose number is spelled out or absent. Live tree run prints ''prose bullets the figure rule does not admit ... : 52 59 129'', and :129 carries a slot AND a provenance tag -- exactly the rows :12 says must carry provenance -- yet it is never counted. Fix: derive the figure predicate from the shape the file declares (a bullet carrying a slot or a provenance tag) and carry quotesNumber as a reported field, not as admission; re-measure the three line numbers before changing gate semantics, since admission changes which rows :12 governs.'\n  session_id: orch-main-r302-sub1-i1-sub1\n  status: retired"
