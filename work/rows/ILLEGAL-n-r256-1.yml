id: "ILLEGAL-n-r256-1"
kind: "prd"
title: "[ILLEGAL-n-r256-1] [refuted] equipCodeOf represents an unresolvable weapon name as unarmed and breaks the name round trip"
body: "- id: ILLEGAL-n-r256-1\n  SESSION_ID: orch-main-r256-sub1\n  action: return null (or throw) for an unresolvable name so 0 means only 'explicitly unarmed', and update AppRuntime.js:661-667 plus the witness in the same change\n  blocker: scripts/equipment-witness.mjs:47,48 pins equipCodeOf(LIST,'axe')===0 and equipCodeOf([],'sword')===0, so the fix moves the module, the caller and that witness together\n  claim: src/shared/equipment.js:3-7 maps three distinct causes (equipment not an array, name not a non-empty string, name absent from the list) onto EQUIP_UNARMED (0), which is also the code for a deliberately unarmed player, so 'unarmed' and 'could not resolve the name' are the same value\n  evidence: 'executed falsifier (dispatch 1791681155262-500-d3f7c116742a69ca), live import of src/shared/equipment.js: equipCodeOf(['''',''pistol''],'''') === 0, equipCodeOf(['''',''pistol''],''axe'') === 0 and equipCodeOf(null,''sword'') === 0 are three distinct causes with one answer, and the round trip equipNameOf(eq, equipCodeOf(eq, name)) === name fails silently for every one of them: it answers the empty string for code 0''s neighbour equipNameOf(['''',''pistol''],1) === '''', so code 0 is not even ''the player holds nothing distinguishable''. The only production caller re-derives the distinction out of band: src/apps/AppRuntime.js:664 `if (code === EQUIP_UNARMED && name)`, i.e. the difference lives in the truthiness of an argument the function already consumed; a caller that omits that guard silently disarms the player'\n  witness: 1791681155262-500-d3f7c116742a69ca\n  principle: ILLEGAL\n  session_id: orch-main-r256-sub1\n  status: refuted\n  surface: src/shared\n  title: equipCodeOf represents an unresolvable weapon name as unarmed and breaks the name round trip"
status: "resolved"
createdAt: "2026-11-05T13:14:33.631Z"
