body: "- id: ILLEGAL-n-r256-5\n  title: chartAnchorDecision returns overlapping shapes discriminated by a field's absence\n  principle: ILLEGAL\n  surface: src/shared\n  status: fixed\n  claim: 'src/shared/chartReanchorPolicy.js:32-47 returns four shapes: null (no players, same anchor, below hysteresis), {refusal:''players-straddle-the-planet''} with no worstPlayerAngleDeg, {refusal:''party-spread-exceeds-walkable-chart'', worstPlayerAngleDeg, walkableLimitDeg}, and the success {anchorDir, centroidDir, gainDeg, worstPlayerAngleDeg}; success and one refusal share worstPlayerAngleDeg, so callers discriminate out of band'\n  evidence: src/terrain/ChartReanchorService.js:38 tests `decision.worstPlayerAngleDeg === undefined` to decide whether the refusal carries an angle, and line 35 tests `decision.refusal` to tell refusal from success; a decision with neither anchorDir nor refusal is representable and would be treated as success\n  action: return a tagged union ({kind:'stay'|'reanchor'|'refusal', ...}) so 'accepted with no anchorDir' and 'refused with no reason' are unrepresentable\n  witness: 'Live execution against origin/main content (same dispatch asserted worktree == origin/main for all 8 files): src/shared/chartReanchorPolicy.js chartAnchorDecision now returns disjoint outcomes, each with a kind and a reason, so success no longer overlaps refusal. antipodal dirs -> {kind:''refusal'', reason:''players-straddle-the-planet''} and no anchorDir key at all; dirs [] -> {kind:''stay'', reason:''no-players''}; single dir -> kind stay|reanchor with a string reason and never kind ''refusal''; missing lattice -> throws ChartAnchorDecisionError reason ''decision-needs-a-lattice'' instead of returning a silent null. Also reanchorChartFor throws rather than reporting ''no re-anchor needed''. Landed in 5ee4c29e, now on origin/main.'\n  session_id: orch-main-r256"
status: "resolved"
