body: "- id: MILNER-n-r260-3\n  SESSION_ID: orch-main-r260\n  body: 'MILNER: a player id has two domains inside one surface, so the type does not pin the fact. QuestSystem.js:20 normalises with `const key = String(pid)` and StatsSystem.js:38 does the same, but ProgressionSystem.js:36/37/46/107 keys playerProgression by the raw argument and AbilityTree.js:82 keys playerAbilityStates by the raw argument. addXp(1, 10) and addXp(''1'', 10) therefore create two progression entries while the quest and stats systems read them as one player; conversely getPlayerState(''1'') and getPlayerState(1) are different players. Events add a third spelling (QuestSystem.js:70/93/108, StatsSystem.js:240 send String(pid)). Fix direction (not applied): one playerId parser at the surface boundary - every system keys on the parsed value and no function accepts the unparsed one.'\n  principle: MILNER\n  surface: src/game\n  title: 'src/game: player identity is String(pid) in QuestSystem/StatsSystem and the raw argument in ProgressionSystem/AbilityTree'\n  witness: codesearch regex 'String\\(pid\\)|playerProgression\\.(has|get|set)\\(' over src/game (exhaustive, 11 hits, dispatch 1791681251171-500-2676217125e5caf0)\n  session_id: orch-main-r260\n  status: refuted"
