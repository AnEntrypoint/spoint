title: "[CHARTEST-est-s1-4] [open] src/terrain: the patch adapter encodes ''no ground'' as NaN where the port''s contract demands a thrown SurfaceSolveError, so the guard the port ships cannot catch it"
body: "- id: CHARTEST-est-s1-4\n  claim: 'CHARTEST characterization, surface src/terrain. Where there is no ground the port''s own contract requires a thrown SurfaceSolveError, and the cpu-solve source does that (witnessed: ChartRangeError instanceof SurfaceSolveError, check P03). The patch adapter does not: client/core/ExactPatchFrame.js:7-9 returns NaN and sets `missing`. Witnessed live (check P10) placementFrame.groundHeightLocal(0,0) === NaN with threw=false, missing=true. NaN is not a SurfaceSolveError, so guardedGroundHeight (src/terrain/PlanetFrame.js:54-65) does not convert it: check P11 records throwing(1,2)=null but nanning(1,2)=NaN. The NaN then travels: src/terrain/PlacementChart.js:80-81 `const y = groundAt(x,z); if (!Number.isFinite(y)) return NaN`, so surfaceAlongDir silently returns NaN for the whole shot, and src/terrain/FieldLattice.js:30-31 substitutes GROUND_FALLBACK_Y only for a throw. Two encodings of ''no ground'' cross one port.'\n  notes: 'CLOSE (not by this hop): one encoding -- the patch adapter throws NoGroundHeightError (already exported, src/terrain/PlanetFrame.js:36) instead of returning NaN, and `missing` stays the placement-side bookkeeping flag it already is. Pin first: this row is the pin. Merged rather than re-filed: the guardedGroundHeight fallback half is already carried by PARSEDV-sub1-5-1 (retired) and PARSEDV-sub1-5-2 (pending), so no new row duplicates it. Related, not duplicate: GUARD-succ1-2 (call sites with no guard) -- a guard does not help while the value is NaN, which is exactly what this row pins.'\n  title: 'src/terrain: the patch adapter encodes ''no ground'' as NaN where the port''s contract demands a thrown SurfaceSolveError, so the guard the port ships cannot catch it'\n  witness: 'scripts/ground-source-port-witness.mjs dispatch 1791704838265-500-19e97f5d075d8453, exit 0, RESULT: PASS checks=18 failed=0; check P10 y=NaN threw=false missing=true; check P11 throwing(1,2)=null nanning(1,2)=NaN; contrast check P03 threw=ChartRangeError instanceof SurfaceSolveError=true'\n  session_id: orch-main-terrain-contracttest-s1\n  _agentplug_lane_wait_ms: 120000\n  status: fixed\n  witness_path: .gm/witness-out/CHARTEST-est-s1-4-verdict.txt\n  note: the patch adapter throws NoGroundHeightError, a SurfaceSolveError, where there is no ground, instead of returning NaN"
