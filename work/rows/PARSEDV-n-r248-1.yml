body: "- id: PARSEDV-n-r248-1\n  SESSION_ID: orch-main-r248\n  title: 'src/shared/terrainConfig.js has no parse boundary: every accessor re-validates the same config'\n  status: refuted\n  body: 'PARSEDV (Parse, Don''t Validate) over src/shared. resolveTerrainConfig (src/shared/terrainConfig.js:13) is a getter, not a parser: it returns the raw entity config or worldDef.terrain untouched, so the interior re-validates and re-derives defaults at every read: minimapExtentOf:54 re-checks Number.isFinite(tcfg.minimapExtent) and re-derives the radius default, minimapResOf:58 re-checks minimapRes, minimapDescriptor:62 re-checks isWorldName/enabled/Number.isFinite(tcfg.seed), terrainHashVersionOf:19 re-derives hashVersion on every call, terrainCarvesOf:33 re-validates carve center/radius/falloff. Two sources (entity.config, unvalidated by worldResolve.checkSlices, and worldDef.terrain, validated) feed one untyped shape, so the checks are duplicated rather than paid once. Fix: one parseTerrainConfig(tcfg) at the source boundary returning a normalized typed config (seed, radius, hashVersion, extent, res, center, carves resolved once) and accessors that read it without re-checking. Evidence: codesearch literal Number.isFinite over src/shared, dispatch 1791678775821-500-2f531e02bf1d2452.'\n  session_id: orch-main-r248"
status: "resolved"
