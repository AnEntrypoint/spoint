title: "[PARSEDV-0-sub1-2] [retired] client/hud/MinimapHUD.js worldSeedOf re-derives and re-validates the world seed at every call and encodes unknown as 0"
body: "- id: PARSEDV-0-sub1-2\n  SESSION_ID: orch-main-r250-sub1\n  acceptance: 'Parse the seed once where the sources and the terrain frame are bound: one seedOf(sources, terrain) evaluated at bind that returns a seed or refuses, with the frame-staleness test and the window.__terrain fallback decided there, so the reader uses a parsed seed with no `!= null` test and no 0 default. Acceptance witness: a bind with no cfg.seed, then a cfg.seed of 0, then a stale window.__terrain frame, each resolving to a stated value or a stated refusal instead of a silent 0.'\n  session_id: orch-main-r250-sub1\n  status: retired\n  subject: client/hud/MinimapHUD.js worldSeedOf re-derives and re-validates the world seed at every call and encodes unknown as 0\n  text: 'BLOCKER (file held): client/hud/MinimapHUD.js carries another lane''s uncommitted modification (git_status paths-scoped dispatch 1791680333367-500-bd43875439bb6a0d lists it modified), so the single-writer rule forbids editing it in this hop and the finding is filed instead. No duplicate: literal scans of .gm/prd.yml dispatch 1791680935806-500-14eadef5db36c7d4 (MinimapPlacements) and 1791680931247-500-60e708b2248eb5b6 (latestScores) return no row owning this finding.'\n  why: 'Hop PARSEDV over client/hud, session orch-main-r250-sub1. worldSeedOf (MinimapHUD.js:66-71) reads three sources -- vegetation.cfg.seed, rocks.cfg.seed, window.__terrain -- and validates each at the point of use: cfg.seed != null at :68 and published.frame === terrain.frame && published.seed != null at :70, both falling through to `| 0`. An absent seed is therefore indistinguishable from a real seed of 0, and the staleness test on the published frame is repeated on every call rather than decided when the frame is bound. strokesOf (:57) repeats the same shape for the biome override, defaulting to 0.'\n  witness: 'Read off MinimapHUD.js:57,66-71 via codesearch dispatch 1791680356685-500-554458c9fd53945 (literal ''!= null'' under client/hud, exhaustive, 5 lines: MinimapHUD:68 and :70) and 1791680329191-500-b4e531ef6b62c065 (literal strokes, 6 lines: MinimapHUD:57,61,62). Not executed live.'"
status: "resolved"
