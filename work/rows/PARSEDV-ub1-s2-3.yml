body: "- id: PARSEDV-ub1-s2-3\n  SESSION_ID: orch-main-r260-sub1-s2\n  body: |-\n    PARSEDV over src/game, the two files this hop did not touch. WITNESS: gm dispatch 1791688127929-500-8be9be1e69b50d84 (StatsSystem-witness 112/112 PASS, EventChainManager-witness 214/214 PASS) — both pass, so this row is a contract finding, not a live failure.\n\n    StatsSystem.js returns one bare false for six distinct causes: :95 (amount not a finite number, or <= 0), :111 (stat not an own key of baseStats), :112 (amount === 0), :183 (no such item), :213 (loadoutName not a non-blank string), :230 (no such loadout). A caller that gets false cannot say whether the name was bad or the amount was.\n\n    EventChainManager.js returns one bare false for five trigger-mismatch causes: :106 (no trigger, or trigger.type !== eventType), :110 (target !== trigger.entityId), :114 (zoneId mismatch), :118 (targetEntityId mismatch), :122 (timerId mismatch). The cause is fully known at each site and thrown away.\n\n    ProgressionSystem.js :71 returns false for a non-finite or negative amount and :80 for the level cap — commit 14746964d2e04d408e07ce1980591a640064c64f already moved u32 level saturation and the xp remainder into this file and left both as bare false.\n\n    NEEDED: one declared refusal type per file, landed with each file's witness. Do not start while scripts/StatsSystem-witness.mjs and scripts/EventChainManager-witness.mjs (both untracked and pre-existing; left byte-identical by this hop) still pin the boolean, and while another lane holds apps/tps-game/* and client/core/*.\n  status: fixed\n  title: 'src/game: StatsSystem.js (:95,:111,:112,:183,:213,:230), EventChainManager.js (:106,:110,:114,:118,:122) and ProgressionSystem.js (:71,:80) return one bare false for every refusal cause'\n  session_id: orch-main-r260-sub1-s2"
