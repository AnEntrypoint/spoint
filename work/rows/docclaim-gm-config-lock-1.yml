body: "- id: docclaim-gm-config-lock-1\n  SESSION_ID: orch-main-r275-w1\n  status: retired\n  severity: MEDIUM\n  surface: gm-mcp/src/release-bridge.js (the only live lock acquire in the gm tree)\n  title: 'docclaim rerun: gm-config-lock-native-acquire-reads-as-busy -- no AGENTS.md basis remains; live lock still answers busy on contention'\n  subject: Re-filed under docclaim-<tag>-1 because the original row id is absent from every .gm/prd.yml under C:/dev; the doc-claim half is moot, the code half is live and unfixed.\n  text: 'Doc-claim half: neither the current spoint AGENTS.md nor C:/dev/gm/AGENTS.md carries any line about a config lock or a native acquire (literal ''config-lock'' -> 0 hits in gm/AGENTS.md and 0 hits across 2075 gm files / 483876 lines), so there is no stale doc sentence left to re-run. Code half, re-derived live: gm-mcp/src/release-bridge.js:338 acquireLock() takes the lock with openSync(lockPath,''wx'') and, on EEXIST with a live holder younger than LOCK_STALE_MS, returns null after at most 2 attempts with no wait; runReleaseBridge line 378 maps a null lock to { outcome: ''busy'' }. So a contended native acquire is reported as busy rather than queued. Open: whether that is intended backpressure or the defect the retired row named; needs the gm lane, not this AGENTS.md slice.'\n  witness: 'codesearch 1791695763388-500-16e32c82863c71b8 (literal config-lock in C:/dev/gm/AGENTS.md -> 0, 107 lines, exhaustive); codesearch 1791695847210-500-ed1d0e6b83ace7a6 (literal config-lock across C:/dev/gm, 2075 files / 483876 lines -> 0); codesearch 1791696017978-500-a705039732ed3bf5 (literal acquire in gm-mcp/src -> release-bridge.js:338, :377); Read C:/dev/gm/gm-mcp/src/release-bridge.js:338-378 (acquireLock + ''if (!lockPath) return { outcome: ''''busy'''' }'')'\n  acceptance: 'A decision recorded in the gm lane: either acquireLock waits/retries with a bounded backoff and reports which pid holds the lock, or ''busy'' is documented as intended backpressure in the prose that owns it.'\n  session_id: orch-main-r275-w1"
