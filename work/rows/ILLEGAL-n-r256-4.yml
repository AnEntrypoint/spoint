title: "[ILLEGAL-n-r256-4] [fixed] createChartAnchorLattice encodes one invalid-config class two ways"
body: "- id: ILLEGAL-n-r256-4\n  title: createChartAnchorLattice encodes one invalid-config class two ways\n  principle: ILLEGAL\n  surface: src/shared\n  status: fixed\n  claim: src/shared/chartAnchor.js:13 returns null for a non-finite or non-positive radius while line 14 throws for anchorsPerFace < 1, so the same class (an invalid lattice request) has two encodings and every caller re-derives which one it got\n  evidence: src/shared/clusterConfig.js:38-39 and src/terrain/ChartReanchorService.js:5-6 each write `if (!lattice) throw ...` to convert the silent null back into the failure it already was\n  action: pick one encoding for an invalid lattice request (throw a named error at both lines) and delete the caller-side re-derivation\n  witness: 'Live execution against origin/main content (worktree == origin/main asserted in the same dispatch): src/shared/chartAnchor.js createChartAnchorLattice now throws one ChartAnchorLatticeError carrying a reasons array, so an invalid request has exactly one encoding. radius 0 -> reasons [''radius-not-positive-finite'']; anchorsPerFace 0 -> reasons [''anchors-per-face-below-one'']; both bad -> [''radius-not-positive-finite'',''anchors-per-face-below-one''] reported together, so the radius guard no longer masks the anchorsPerFace guard; valid input still returns a lattice with chunkKeyOfDir. No null return, no bare TypeError downstream. Landed in 5ee4c29e, now on origin/main.'\n  session_id: orch-main-r256"
status: "resolved"
createdAt: "2026-11-05T13:14:33.633Z"
