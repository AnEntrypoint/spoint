title: "[DBC-sub1-2-1] [fixed] client/hud/MinimapHUD.js:129 discards the placement scanner's precondition verdict, so a refused scan reads as a completed one"
body: "- id: DBC-sub1-2-1\n  SESSION_ID: orch-main-r250-sub1-2\n  status: fixed\n  subject: client/hud/MinimapHUD.js:129 discards the placement scanner's precondition verdict, so a refused scan reads as a completed one\n  why: 'Hop DBC over client/hud, session orch-main-r250-sub1-2. createPlacementScanner().begin(frame, anchorField, sources, worldSeed, cx, cz, halfM) now states and checks its input contract in client/hud/MinimapPlacements.js - frame present, sources an object, worldSeed an integer, centre finite, halfM a finite positive number, and a present biomeOverride.strokeCount a whole count - and returns false, arming nothing, when the caller breaks it. MinimapHUD.js beginRefresh (:129) calls it and throws the result away, so a refused refresh falls through advanceRefresh (:174-186) exactly like a finished one: phase 2 runs scanner.step, which returns true at once with zero glyphs, then the HUD swaps layers and counts stats.refreshes++ for a window it never scanned. A precondition the caller never observes is only half a contract; DBC requires the caller to branch on it. Not closed here: git_status dispatch 1791682791498-500-e2349857a7ef2720 shows client/hud/MinimapHUD.js carries a foreign uncommitted hunk.'\n  acceptance: 'beginRefresh records begin''s verdict on state.work; advanceRefresh treats a refused begin as terminal for the placement phase - it does not swap layers, does not increment stats.refreshes and does not report the run in stats.lastUpdateMs. Acceptance witness: a live run of createMinimapHUD with a source set that breaks the contract (sources null, or halfM 0) asserts zero refreshes counted and zero glyph chunks painted, while a valid window still paints exactly the placement oracle''s glyphs and counts one refresh.'\n  witness: 'codesearch literal over client/hud dispatch 1791682883476-500-452ea480955a334d (MinimapPlacements, 2 files, exhaustive), scanner. sites dispatch 1791682955427-500-c9ece527bd09e2c3 (:129 begin, :179 step, :252 glyphSnapshot), strokeCount dispatch 1791683212783-500-63c044aff47e007f (BiomeOverride.js:97 = appliedStrokes.length, always a whole count). Live execution: scripts/ClientHudMinimapPlacements-witness.mjs dispatch 1791683401709-500-b214a00ab19aeaba, checks 29 failures 0, RESULT: PASS - it proves begin refuses all nine breach shapes and still arms a valid window, and therefore that the caller''s disregard is now the only unclosed half.'\n  text: Open row on client/hud, owned by the lane holding MinimapHUD.js. Depends on the DBC precondition landed this hop.\n  session_id: orch-main-r250-sub1-2"
status: "resolved"
createdAt: "2026-11-05T13:14:33.674Z"
