title: "[WADLER-n-r249sub1-1] [refuted] src/apps: ''interactable'' has three constructors and only one writes the reified custom._interactable, so a physics.setInteractable entity is pressed by the server tick with no client prompt"
body: "- id: WADLER-n-r249sub1-1\n  SESSION_ID: orch-main-r249-sub1\n  title: 'src/apps: ''interactable'' has three constructors and only one writes the reified custom._interactable, so a physics.setInteractable entity is pressed by the server tick with no client prompt'\n  surface: src/apps/AppPhysics.js:101 vs src/apps/AppContext.js:296-310; consumers client/AppModuleSystem.js:80 and client/app.js:2172; server tick src/apps/AppRuntimeTick.js:305-312\n  node: WADLER\n  status: refuted\n  session_id: orch-main-r249-sub1\n  acceptance_criteria: A live node dispatch shows setInteractable(-1) and setInteractable(NaN) rejected by the same TypeError AppContext.interactable({radius:-1}) throws, and shows every producer leaving custom._interactable present and equal; a second dispatch shows the client predicate (entity.custom?._interactable) truthy for an entity made interactable through physics.setInteractable.\n  body: |-\n    PRINCIPLE WADLER (Theorems for free! / Propositions as Types) over src/apps. NODE-ONLY: filed by hop orch-main-r249-sub1, not executed by it.\n\n    CLAIM: the type custom._interactable = {prompt, radius} is not the type of an interactable entity - it is an optional side effect of one of three constructors, so no free theorem about interactable entities holds.\n\n    PRODUCER A: AppContext.interactable (src/apps/AppContext.js:296-310) parses and validates (throws TypeError 'interactable: radius must be a non-negative finite number' on non-finite or negative radius, same for cooldown), then writes ent._interactable/_interactRadius/_interactCooldown AND ent.custom._interactable = {prompt, radius}.\n    PRODUCER B: physics.setInteractable (src/apps/AppPhysics.js:101) is one line - `setInteractable: (radius = 3) => { ent._interactable = true; ent._interactRadius = radius; runtime._interactableIds?.add(ent.id) }`. It validates nothing and never writes custom._interactable.\n    PRODUCER C: AppRuntime._hydrateInteractable (src/apps/AppRuntime.js:412-425) re-derives the same two fields from custom._interactable under a weaker rule.\n\n    CONSEQUENCE: the two halves of the system read different representations. The server tick iterates runtime._interactableIds and tests `e._interactRadius` (src/apps/AppRuntimeTick.js:305-312), so a setInteractable entity IS pressed server-side. Both client prompt consumers read only `entity.custom?._interactable` and `continue` when it is absent (client/AppModuleSystem.js:80-81, client/app.js:2172-2173), so that same entity never shows a prompt. The server offers an interaction the client cannot advertise.\n\n    WITNESS: exec_js 1791680755504-500-c8bb16aa6d85c9fe against the real modules: buildPhysicsAPI(e,rt).setInteractable(-1) throws nothing and yields {_interactable:true, _interactRadius:-1, custom._interactable:ABSENT, in _interactableIds:true}; setInteractable(NaN) yields _interactRadius NaN with custom._interactable still ABSENT; setInteractable(7) yields radius 7 with custom._interactable still ABSENT; AppContext(e,rt).interactable({radius:-1}) throws TypeError 'interactable: radius must be a non-negative finite number'. codesearch literal '_interact' dispatch 1791680707630-500-b49f2c1d1530001 (56 lines, exhaustive per subtree): custom._interactable is WRITTEN at exactly one site (src/apps/AppContext.js:308) and READ at exactly three (src/apps/AppRuntime.js:414, client/AppModuleSystem.js:80, client/app.js:2172).\n\n    FIX (Wadler: make the illegal state unrepresentable): one constructor. Introduce parseInteractable(config) -> {prompt: string, radius: number, cooldown: number} that throws or returns a distinguished rejection; AppContext.interactable, physics.setInteractable and _hydrateInteractable all call it and all write the same reified block; the tick and the client then read one representation.\n\n    BLOCKER: not an edit this hop. git_status paths-scoped dispatch 1791680434257-500-1052df89cb4dff42 reports src/apps/AppContext.js already modified by another writer (real hunk at :107, the `set custom` plain-object guard), so the hop rule 'close it only if no other writer holds the file' makes this a row. The fix also spans AppPhysics.js and AppContext.js, not one exact-match Edit.\n\n    MERGE: this is the same one-parser work as PARSEDV-n-r249-1 (prd.yml:41370, pending, session orch-main-r249), which owns AppContext.interactable's predicate. Not retired here - another lane owns it. Fold both into one change: a single parseInteractable used by all three producers."
status: "resolved"
