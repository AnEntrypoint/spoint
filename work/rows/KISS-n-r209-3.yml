body: "- id: KISS-n-r209-3\n  subject: 'client/xr: XRControls ships a dead public surface - placeAtCamera, getPlacementInfo and options.scale have no reader'\n  description: 'KISS / client/xr. XRControls.js:71 placeAtCamera() and :99 getPlacementInfo() are public methods with zero call sites anywhere in the tree; :6 puts scale: 1 into this.options and nothing on the surface reads it (it is not a WebXR feature: it is never sent to a session and never applied to a mesh). Three knobs shaped like API on a class whose live path is createReticle/start/update/placeAnchor. EVIDENCE codesearch literal tree-wide placeAtCamera dispatch 1791674306401 (1 occurrence: the definition), getPlacementInfo dispatch 1791674241210 (definition plus prd text only), scoped literal scale over client/xr dispatch 1791674334255 (exhaustive:true, 1 occurrence: the default at :6); exec_js 1791674670580 over the real class shows scaleOption=1 and no read. FIX: delete all three. setInitialFPSPosition (:76) is dead too, but DRY-n-r200-3 already names it for its 1.6 literal; this row carries the dead-surface half of that finding so the two do not duplicate.'\n  notes: 'witness: codesearch literal 1791674306401, 1791674241210, 1791674334255 (all exhaustive:true); exec_js 1791674670580-500-28dc34af9f8cff1. Merges the dead-surface half of DRY-n-r200-3. node-only row; not resolved by this hop.'\n  status: fixed\n  session_id: orch-main-r209"
