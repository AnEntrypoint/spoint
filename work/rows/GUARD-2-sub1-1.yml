body: "- id: GUARD-2-sub1-1\n  principle: GUARD\n  surface: src/behaviours\n  subject: src/behaviours/fireWeather.js:5-11\n  status: refuted\n  witness_path: .gm/witness-out/GUARD-2-sub1-1-verdict.txt\n  note: kind distinguishes absent, unknown-type and unreadable weather; rain byte 0 for dry cases is by design\n  witness: node scripts/fireWeather-witness.mjs\n  title: fireWeather rainByteOf collapses unknown type, malformed intensity and absent weather into one 0\n  text: 'Live: scripts/fireWeather-witness.mjs prints RESULT: PASS at HEAD 4d78408de7 (module_sha256 60f83b6e6a2a2c4aa7cef0c6997e56b1f735ee98e02ffd380b13ece067f5ca15; reply at .gm/exec-spool/out/bash-orch-main-h22-sub1-20380-1791693042234-18379.json.reply.txt). Three shipped checks pin the absorption: ''fog: unknown type yields no rain'' -> 0, ''rain: string intensity yields no rain'' -> 0, ''absent weather yields no rain'' -> 0. So throwing on an unrecognised w.type at :10 turns a GREEN tracked witness RED -- the shipped contract is a total function and the witness is its authority, so GUARD is not admissible here as a silent edit.'\n  why: 'There is no closed set of weather types: :8 and :9 name rain and snow and :10 returns 0 for everything else, so a typo (''Rain'') and a genuinely dry type (''fog'', ''clear'') are indistinguishable; :6 returns the same 0 for a non-finite intensity and for an absent weather object, so four causes share one sentinel that then drives the drying branch at :35.'\n  acceptance: Either enumerate the real weather types and reject every other string, with fireWeather-witness.mjs updated to pin that enumeration, or record in AGENTS.md that unknown-type-means-dry is the contract. A throw that reddens the shipped witness without that decision is refused.\n  session_id: orch-main-h22-sub1"
