title: "[GUARD-2-sub1-2] [refuted] fsm-arena witness stubs defineGameMode, so the shipped match FSM never runs against the real gamemode runtime"
body: "- id: GUARD-2-sub1-2\n  acceptance: 'Drive apps/fsm-arena/index.js buildMatchFSM through the real src/behaviours/gamemode.js and game-fsm.js inside the fsm-arena witness instead of the recorder, and pin the RESULT: FAIL it currently prints at HEAD.'\n  principle: GUARD\n  status: refuted\n  subject: scripts/fsm-arena-index-witness.mjs:82-85\n  surface: src/behaviours\n  text: 'Live: node scripts/fsm-arena-index-witness.mjs exits 1 printing RESULT: FAIL at HEAD 4d78408de7 (W01..W20 all pass, so the failure is past W20). Its runSetup() at :82-85 replaces ctx.defineGameMode with a recorder that returns fakeFsm(''waiting'', 0, undefined), so no claim in it executes src/behaviours/gamemode.js. codeinsight impact (dispatch 1791693322162-500-2867166e136fcf93) names apps/fsm-arena/index.js:10 buildMatchFSM as the only caller of defineGameMode outside src/apps/AppContext.js:377, and it is never run against the runtime.'\n  title: fsm-arena witness stubs defineGameMode, so the shipped match FSM never runs against the real gamemode runtime\n  why: GUARD's proof obligation is that a guard fires when the real module runs; a witness that substitutes the module under test proves nothing about it, and the arena's own end builder at apps/fsm-arena/index.js:26 reads fsm.context.kills, which only the real runtime populates.\n  witness: node scripts/fsm-arena-index-witness.mjs\n  session_id: orch-main-h22-sub1"
status: "resolved"
createdAt: "2026-11-05T13:14:33.719Z"
