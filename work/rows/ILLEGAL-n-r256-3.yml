title: "[ILLEGAL-n-r256-3] [fixed] SpawnSurface admits a malformed ray hit as a walkable surface and returns one null for two causes (walkable half CLOSED, hitY half open)"
body: "- id: ILLEGAL-n-r256-3\n  SESSION_ID: orch-main-r256-sub1\n  action: make a raycast result with a hit but no finite position a distinct failure (throw or a tagged result) instead of folding it into 'miss'; the 'hit with no normal is walkable' half is CLOSED, see closed_by\n  callers: src/apps/AppRuntime.js:655-676 respawn clearance, scripts/spawn-surface-witness.mjs\n  claim: 'src/shared/SpawnSurface.js:11 `hitY` returns null both for ''the ray missed'' and for ''the hit carried no finite position'', and columnSurfaces breaks on that null (line 27), so one unreadable hit ends the column scan exactly as an empty column would; src/shared/SpawnSurface.js:53 returns the same null for ''no surface found'' and for ''bad arguments''. The second half of this row, ''src/shared/SpawnSurface.js:15-17 walkable returns true when the hit has no normal at all'', is no longer live: walkable now requires a finite normal and answers false for a hit carrying no normal.'\n  closed_by: edit to src/shared/SpawnSurface.js:14-17 `walkable` = `!!n && Number.isFinite(n[1]) && n[1] >= MIN_UP_NORMAL_Y`, replacing `!n || !Number.isFinite(n[1]) || ...`; precedent src/shared/characterStep.js:11 `if (!n || !(n[1] >= MIN_WALKABLE_NORMAL_Y)) return 0` and src/physics/World.js:818-830 where a real raycast returns {hit:true, position:[...], normal:null}\n  evidence: 'post-edit live run (dispatch 1791681466911-500-3a35eaac902b570): a hit with no normal, with normal null and with normal[1] NaN all answer not-walkable, so columnSurfaces returns [] for the no-normal column and [1] for the flat-normal column under the identical raycast; pre-edit class sweep (dispatch 1791681155262-500-d3f7c116742a69ca) showed the same inputs accepted as a spawn surface. The pre-existing untracked witness scripts/spawn-surface-witness.mjs still reports claims 22, failed 0 / RESULT: PASS (dispatch 1791681468173-500-f0ed839620686a3b): its worldRaycast always supplies a normal, so it could not have caught this'\n  witness: 1791681466911-500-3a35eaac902b570\n  principle: ILLEGAL\n  session_id: orch-main-r256-sub1\n  status: fixed\n  surface: src/shared\n  title: SpawnSurface admits a malformed ray hit as a walkable surface and returns one null for two causes (walkable half CLOSED, hitY half open)"
status: "resolved"
createdAt: "2026-11-05T13:14:33.632Z"
