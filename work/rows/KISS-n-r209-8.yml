body: "- id: KISS-n-r209-8\n  subject: 'client/xr: alias bindings and a duplicated handsDetected flag carry state the objects already own'\n  description: 'KISS / client/xr. XRWidgets.js:25 keeps wristUI, wristUICanvas and wristUIContext as three bindings to one object fields (:43, read at :48/:49/:59); :68/:96 keep vrSettingsPanel.visible in step with vrSettingsPanel.mesh.visible by hand; and handsDetected exists twice -- XRSystem.js:21/:75/:156 and XRWidgets.js:31/:147/:151 -- where the second copy is only a restatement of the argument passed in. EVIDENCE codesearch literal client/xr, exhaustive:true: wristUI dispatch 1791674770189 (7 lines, 16 occurrences, every canvas/ctx read going through the aliases), handsDetected dispatch 1791674774853 (8 occurrences across both files, two independent declarations). FIX: read wristUI.canvas/.ctx directly, drop the visible field and test mesh.visible, delete the widgets copy of handsDetected. MERGES OWNERSHIP-n-r192-4, whose no-single-writer finding on vrSettings is the same one-fact-two-holders shape on an adjacent object.'\n  notes: 'witness: codesearch literal 1791674770189, 1791674774853 (both exhaustive:true). Merges OWNERSHIP-n-r192-4. node-only row; not resolved by this hop.'\n  status: fixed\n  session_id: orch-main-r209"
