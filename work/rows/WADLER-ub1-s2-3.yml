body: "- id: WADLER-ub1-s2-3\n  body: |-\n    WADLER over src/game, result side of PARSEDV-ub1-s2-2 (that row frames the input side of the same sites and stays open). canCastAbility (:118) and castAbility (:131) return false for unknown-ability, locked-by-level and cooling-down; bindHotkey (:148,:149) returns false for an out-of-range slot AND for an unknown ability. Parametricity: the caller cannot recover which of the three refused, so a cooling cast and a locked cast are indistinguishable downstream, and bindHotkey's two refusals ask for different caller reactions (fix the slot vs. fix the ability).\n\n    Witness-pinned (tracked test file, byte-identical): scripts/AbilityTree-witness.mjs:89 'cast of unknown ability refused' false, :90 locked false, :94 recast while cooling false, :95-97 canCastAbility false/false/true, :117-120 bindHotkey true/false pairs including [false,false] for out-of-range slots, :171-190 the castAbility/canCastAbility agreement checks. 59/59 green at HEAD, verified this hop (1791690352722-500-480e7a5cf10de34a).\n\n    Target shape: {ok, reason} with reason in 'unknown-ability'|'locked'|'cooling'|'slot-out-of-range'|'unknown-ability-for-slot', updating every pinned expectation in the same commit. Note canCastAbility WITHOUT a level is documented as cooldown-readiness only (:173), so its refusal set is genuinely smaller - the row must not unify the two arities.\n  status: refuted\n  witness_path: .gm/witness-out/WADLER-ub1-s2-3-verdict.txt\n  title: 'src/game/AbilityTree.js: canCastAbility/castAbility return one false for unknown-ability, locked and cooling (:118,:131); bindHotkey for out-of-range-slot and unknown-ability (:148,:149)'\n  session_id: orch-main-r260-sub1-s2"
