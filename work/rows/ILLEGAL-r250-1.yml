title: "[ILLEGAL-r250-1] [fixed] client/hud/VoiceIndicator.js carries the team channel as a boolean, so \"Team only\" is reachable with no team to filter by"
body: "- id: ILLEGAL-r250-1\n  SESSION_ID: orch-main-r250\n  status: fixed\n  subject: client/hud/VoiceIndicator.js carries the team channel as a boolean, so \"Team only\" is reachable with no team to filter by\n  acceptance: 'Replace teamChannelOn (boolean) with teamChannelTeamId (null or the team id): onToggleTeamChannel sets it from getLocalTeam() or clears it, the button label and the gain filter both read teamChannelTeamId != null, and onScoreboard clears teamChannelTeamId when getLocalTeam() returns null. A browser witness (this module cannot be imported under node) boots createVoiceIndicator with a stub uiRoot, joins, calls onToggleTeamChannel, then delivers a scoreboard that no longer lists the local player and shows the button absent with teamChannelTeamId null rather than a stuck true.'\n  why: 'Hop ILLEGAL over client/hud, session orch-main-r250. teamChannelOn (VoiceIndicator.js:39) is a boolean while getLocalTeam() (line 68) is nullable, so the pair admits four combinations, one illegal: on with no local team. The render gate is joined && localTeam != null (line 49) but onToggleTeamChannel (line 210) flips the boolean regardless, so once the local team disappears the button stops rendering while the mode stays on and the user is stuck with no control to leave it. updateProximity (line 128) already guards teamChannelOn && localTeam != null, so the illegal state silently plays everyone behind a label that says otherwise.'\n  text: 'No duplicate: a regex scan of .gm/prd.yml for VoiceIndicator (dispatch 1791679901677-500-97ac8a0c32129dc1, exhaustive over the file) returns only unrelated rows.'\n  witness: 'BLOCKER FALSIFIED, THEN CLOSED. Node CAN execute this module: registerHooks redirects only the unresolvable specifier anentrypoint-design plus the dynamic wireweave/xstate imports, with a stub document and AudioContext (dispatch 1791688073008-500-bed707e040501812). Live, through the real render path: after Join the header renders [Everyone, Mute]; click -> Team only with peer gains [1,0] (pk8 same team 1, pk9 other team 0), so the gain filter and the label read the same value; click -> Everyone [1,1]; on again -> Team only [1,0]; a scoreboard that drops the local player -> team button absent and gains [1,1]; re-adding the local player -> Everyone [1,1]. That last step discriminates: under the old boolean the hidden toggle stayed on, so re-adding the team would have rendered Team only. Static: an exhaustive literal scan of client/hud for teamChannelOn returns 0 occurrences across 18 files (dispatch 1791688011909-500-57bfdd84c20fbca4).'\n  session_id: orch-main-r250\n  blocker_notes:\n  - RETIRED-BY LAMPORT-2-sub3-1 (apps/tps-game). Closed and landed; nothing in the spawn-clearance path reads the VoiceIndicator team channel. The live ordering witness for this walk is exec_js 1791688145369-500-aedf0e06181ad4c7. Do not re-walk this id."
status: "resolved"
createdAt: "2026-11-05T13:14:33.628Z"
