body: "- id: HUGHES-n-r251-1\n  SESSION_ID: orch-main-r251\n  title: 'HUGHES src/sdk: StaticHandler''s .glb.prog/ and .glb.ktx2/ branches join the source path with no containment check, so a URL bakes a file outside the served root'\n  status: fixed\n  session_id: orch-main-r251\n  body: 'Property (HUGHES, universal over the surface): every file createStaticHandler reads or writes lies under one of the dirs it was given. FALSIFIED. src/sdk/StaticHandler.js:157-166 (.glb.prog/) and :200-210 (.glb.ktx2/) build the source path as join(dir, sourceUrl.slice(prefix.length)) and pass it to getProgressive/getKtx2Extracted with no containment test, while the plain-file loop at :238-245 does test resolve(fp) against resolve(dir) (fpResolved !== baseResolved && !fpResolved.startsWith(baseResolved + sep) -> continue). Live witness exec_js 1791679479055-500-a957d8f4fb578293 against the real module: dirs=[{prefix:''/served'',dir:<tmp>/served}], a sibling <tmp>/outside holding x.glb; GET /../outside/x.glb.prog/model.progressive.glb and /../outside/x.glb.ktx2/0.ktx2 (plus 8 further traversal shapes through the plain loop) => the handler hashed and baked the OUTSIDE file and created .progressive-cache/ and .glb-cache/ inside <tmp>/outside. Minimal counterexample: one URL, one ''..'' segment, either branch. Shrunk property: the branch touches a path outside every served dir. Both responses stayed 404 ''baking''/''extracting'' and no outside bytes were served, so the escape is write/CPU side (hash + bake of an arbitrary readable path, cache dirs created next to it), not a read of file contents; it is not contained by anything the caller controls. The same traversal shapes through the plain loop 404''d, so :163 and :207 are the only gap. Fix: apply the :238-245 test to srcPath at :163 and :207 before existsSync (resolve(dir), resolve(srcPath), require equality or prefix baseResolved + sep). Consumers to keep green: src/sdk/ServerAPI.js:131, src/sharding/RegionRouter.js:314, scripts/bundle-freshness-witness.mjs:97, scripts/static-handler-identity-witness.mjs:104. No file edited this hop: src/sdk/StaticHandler.js carries another lane''s uncommitted hunks (git_status paths + git_diff dispatch 1791679545295).'"
