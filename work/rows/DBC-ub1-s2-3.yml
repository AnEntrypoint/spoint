title: "[DBC-ub1-s2-3] [refuted] src/game/StatsSystem.js:272 restore admits level/xp pairs that violate the invariant addXP maintains, so a restored player reports a level its own xp contradicts"
body: "- id: DBC-ub1-s2-3\n  title: src/game/StatsSystem.js:272 restore admits level/xp pairs that violate the invariant addXP maintains, so a restored player reports a level its own xp contradicts\n  status: refuted\n  witness_path: .gm/witness-out/DBC-ub1-s2-3-verdict.txt\n  principle: DBC\n  surface: src/game/StatsSystem.js\n  witness: 1791691808410-500-c119bf60027d8a18\n  detail: 'outline 1791691808410-500-c119bf60027d8a18 + Read of :272-319. addXP (:94-108) maintains the invariant level === _levelFromXP(xp) by construction: it sets xp then re-derives level at :100. restore (:272) sets level (:278) and xp (:279) independently from saved data, clamping each to its own range but never relating them, so restore''s postcondition does not re-establish the invariant every other member relies on. getStats (:133) then reports `level` verbatim while _pushToClient (:69) advertises nextLevelXP = _xpForLevel(level+1) -- a save carrying {level:1, xp:100000} restores as level 1 with nextLevelXP 100, a state addXP can never produce and that no member can distinguish from a legal one. INTEGRATION.md:204-207 documents restore as the boot path for both stats and quests, so this is the entry every caller starts from. Fix: derive restored.level from the restored xp with statsSystem._levelFromXP(...) (or reject a pair that disagrees), so restore''s postcondition is the same invariant addXP maintains.'\n  session_id: orch-main-r260-sub1-s2"
status: "resolved"
