title: "[DBC-ub1-s2-1] [open] src/game/ProgressionSystem.js:40 calculateXpThreshold's explicit `curve` arg bypasses the config contract -- an unknown curve silently falls to the switch default (linear), so one predicate has two bodies"
body: "- id: DBC-ub1-s2-1\n  title: src/game/ProgressionSystem.js:40 calculateXpThreshold's explicit `curve` arg bypasses the config contract -- an unknown curve silently falls to the switch default (linear), so one predicate has two bodies\n  status: refuted\n  witness_path: .gm/witness-out/DBC-ub1-s2-1-verdict.txt\n  note: an explicit curve is validated by isLegalCurve and throws, so an unknown curve no longer reaches the linear default\n  principle: DBC\n  surface: src/game/ProgressionSystem.js\n  witness: 1791692068682-500-1a3d975fce1ea427\n  detail: 'Witnessed before the fix (exec_js 1791692068682-500-1a3d975fce1ea427, exit 1): createProgressionSystem({curve:''quad''}) was ACCEPTED and calculateXpThreshold(5) returned 400 -- byte-identical to the linear curve, versus 1600 for ''quadratic''. resolveConfig validated baseXpPerLevel/curveScalar/maxLevel/xpPerKill but not curve, so curve alone of the five config fields had no legal-value set. This hop closed the CONFIG half: curve now has a validator (witness 1791692120732-500-e87bc74d6520e212: ''quad'' and ''QUADRATIC'' both rejected with TypeError, quadratic/exponential/linear accepted, default unchanged at ''quadratic'', addXp path unaffected). STILL OPEN: calculateXpThreshold is exported and takes `curve` as its own parameter (:40), so a direct caller still reaches the `default:` branch at :51 and gets linear for any unrecognised string. Fix: make calculateXpThreshold''s precondition the same predicate resolveConfig uses (reject, or route the arg through the validator) so the module states what a legal curve is exactly once. Depends on: DBC-ub1-s2-4 (same surface family).'\n  session_id: orch-main-r260-sub1-s2"
