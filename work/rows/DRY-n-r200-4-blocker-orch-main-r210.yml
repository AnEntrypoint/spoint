body: "- id: DRY-n-r200-4-blocker-orch-main-r210\n  status: retired\n  session_id: orch-main-r210\n  subject: 'BLOCKER (files held) DRY-n-r200-4: the XR_IDENTITY_ROTATION patch is validated and ready to apply once client/xr/XRSystem.js and client/xr/XRWidgets.js are clean'\n  description: 'DRY-n-r200-4 cannot publish: both files it must edit carry foreign uncommitted hunks, so a path-scoped commit would sweep another lane''s edit. XRSystem.js holds the orch-main-r205 vrSettings/setVRSettings hunks plus the orch-main-r212 createRayLine/XRRayLine hunks; XRWidgets.js holds the orch-main-r212 XRRayLine hunks (createRayLine import at :3 and the initTeleport rewrite at :103). DRY-n-r200-4 is listed in .gm/pool/held-rows.json. VALIDATED PATCH, ready to apply when both files are clean: (1) new leaf module client/xr/xrSpace.js containing exactly ''export const XR_IDENTITY_ROTATION = { x: 0, y: 0, z: 0, w: 1 }''; (2) client/xr/XRSystem.js - add ''import { XR_IDENTITY_ROTATION } from ''''./xrSpace.js'''''' after the ''./XRWidgets.js'' import, and replace both inline literals (now lines 96 and 141; they were 101 and 146 before the XRRayLine hunk) with XR_IDENTITY_ROTATION; (3) client/xr/XRWidgets.js - add the same import after the ''./XRRayLine.js'' import and replace the inline literal at line 121 with XR_IDENTITY_ROTATION. That is 3 sites, 2 files, one spelling. xrSpace.js is also the home DRY-n-r200-2 plans for offsetSpace, so DRY-n-r200-2 can add its helper there instead of creating a second module.'\n  notes: 'witness: exec_js dispatch 1791674897208-500-21cd836fb3022865 applied the whole patch in memory to the live worktree bytes and got RESULT: PASS -- inline literal at XRSystem.js:101, XRSystem.js:146, XRWidgets.js:121 -> 0 remaining; import added to both; constant initializer byte-identical to the removed literal; both transformed sources parse (data-URL link TypeError, not SyntaxError). Second run 1791675065342-500-692a70f56aaab837 applied it on disk to XRWidgets.js and evaluated the real xrSpace.js module: exports { x: 0, y: 0, z: 0, w: 1 }, RESULT: PASS. Both runs are recorded in .gm/witness-log.md. The on-disk application was then reverted by dispatch 1791675124849-500-2bc0099da5236796 (RESULT: PASS) because XRWidgets.js was re-dirtied by orch-main-r212 between the hold check and the commit, so no hunk of this row is left in the worktree for another lane to sweep. Nothing of this row is committed; no sha to cite.'\n  paths:\n  - client/xr/XRSystem.js\n  - client/xr/XRWidgets.js\n  - client/xr/xrSpace.js"
