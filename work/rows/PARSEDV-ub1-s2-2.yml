body: "- id: PARSEDV-ub1-s2-2\n  SESSION_ID: orch-main-r260-sub1-s2\n  body: |-\n    PARSEDV over src/game, AbilityTree.js. WITNESS: gm dispatch 1791688076056-500-c0b761c3bf95d6e2 (AbilityTree-witness 59/59 PASS, was 51/59).\n\n    WHAT THIS HOP CLOSED (result side still untyped): canCastAbility now parses its third argument — `Number.isFinite(playerLevel) && ability.unlockLevel > playerLevel` refuses a locked ability, and an absent level means cooldown-readiness-only; castAbility refuses outright when playerLevel is not finite, so a level-gated ability can no longer be cast with no level parsed. applySnapshot parses each hotkey slot (null or a known ability id, else keep the slot) and derives activeAbilities from the restored cooldowns instead of leaving the stale set. _parseCooldown parses a declared 0 as 0 clamped to the 0.1 floor instead of falling through to the 1.0 default. tick refuses a non-finite dt.\n\n    WHAT REMAINS (this row): bindHotkey returns one bare false for an out-of-range slot (:148) and for an unknown ability (:149) — two causes, one bit. castAbility returns one false for unknown-ability, locked, unparsed-level and cooling; canCastAbility likewise. The caller (apps/_lib/progression.js:85, apps/example-progression/index.js:111) then re-derives the cause with a second call (getAbilityCooldown / getAbility), which is validate-then-re-validate.\n\n    WHY NOT CLOSED HERE: the boolean contract is pinned by scripts/AbilityTree-witness.mjs (untracked, pre-existing, left byte-identical) at :89,:90,:92,:94,:95,:96,:97,:171,:172,:173,:178,:181,:185,:190 and by scripts/game-index-witness.mjs:296,:303 and scripts/progression-witness.mjs:69,:84. Widening the result type reddens three live witnesses in one turn.\n\n    NEEDED: 'a discriminated refusal ({ok:false, reason:''unknown-ability''|''locked''|''level-unparsed''|''cooling''}) landed with the witness and app updates together.'\n  status: fixed\n  title: 'src/game/AbilityTree.js: bindHotkey flattens out-of-range-slot and unknown-ability into one false (:148,:149), and castAbility/canCastAbility still return a bare boolean so locked and cooling are indistinguishable without a second call'\n  session_id: orch-main-r260-sub1-s2"
