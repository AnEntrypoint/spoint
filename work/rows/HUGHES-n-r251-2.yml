body: "- id: HUGHES-n-r251-2\n  SESSION_ID: orch-main-r251\n  title: 'HUGHES src/sdk: emitEnvelope produces an envelope its own validateEnvelope rejects (empty channel => kind:'''' )'\n  status: fixed\n  session_id: orch-main-r251\n  body: 'Property (HUGHES, universal over the surface): every envelope emitEnvelope produces is accepted by validateEnvelope - one module''s producer and its validator agree on their shared type. FALSIFIED. src/sdk/SharedEventEnvelope.js:10-19 emitEnvelope(bus, channel, data) copies channel straight into kind with no check; :21-30 validateEnvelope rejects kind that is not a non-empty string (''kind is required (string)''). Live witness exec_js 1791679479055-500-a957d8f4fb578293 against the real modules: emitEnvelope(bus, '''', {}) returns {id, ts, source, kind:'''', payload} and validateEnvelope(env) answers {valid:false, errors:[''kind is required (string)'']}; every generated non-empty channel (''a'', ''x.y'', ''system.handover'', ''*'', ''fire:ignite'', '' '', ''0'') validates. Minimal counterexample: channel '''' - shrinks to a one-character input. The producer is total over strings and the validator is partial, so the round trip emit->validate, the only contract the file states, is false for one member of the generator''s domain. Adjacent fact from the same run: EventBus.emit (src/apps/EventBus.js:49) reads channel.length, so a non-string channel throws instead of returning an envelope - the empty string is the only case that passes silently through both. Fix: reject a blank channel at the producer (throw a named error or return null), or replace the pair with one parseEnvelope that both the producer and the consumer use, so kind has exactly one accepted set. No file edited this hop: src/sdk/SharedEventEnvelope.js carries another lane''s uncommitted hunk (ts finiteness check, git_diff dispatch 1791679545295). Supersedes the contract-duplication half of PARSEDV-n-r234-2 (same file); that row is merged here.'"
status: "resolved"
