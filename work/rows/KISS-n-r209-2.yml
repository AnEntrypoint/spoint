title: "[KISS-n-r209-2] [fixed] client/xr: an aborted teleport is dropped by the fade machine - DONE is accepted only in fadeOut"
body: "- id: KISS-n-r209-2\n  subject: 'client/xr: an aborted teleport is dropped by the fade machine - DONE is accepted only in fadeOut'\n  description: 'KISS / client/xr. XRWidgets.js:124-128 endTeleport(aborted) sends DONE only when aborted, and DONE is listed only on fadeOut (:19), so an abort raised during fadeIn or delay lands in no state: the screen still fades to full black and back by itself, and teleportPending is already null so no later event can stop it. The only caller passing true is the missing-reference-space path at :119; cancelTeleport, wired for the same case, has zero call sites tree-wide (codesearch 1791674199237). It is the transition table that makes this possible: a phase string set to idle directly cannot swallow an event. EVIDENCE exec_js dispatch 1791674671727-500-b00b6b86a408ac01: after START then DONE the snapshot value is still fadeIn, exactly as written before the dispatch. FIX: on abort set the phase to idle and fadeOpacity to 0 in one place; no event is needed.'\n  notes: 'witness: exec_js 1791674671727-500-b00b6b86a408ac01 (live, exact match); codesearch literal cancelTeleport tree-wide 1791674199237 (0 occurrences outside this file). node-only row; not resolved by this hop.'\n  status: fixed\n  session_id: orch-main-r209"
status: "resolved"
