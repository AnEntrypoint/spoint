title: "[PARSEDV-n-r216-4] [fixed] PARSEDV apps/tps-game: the emote message is guessed (`msg.senderId || msg.playerId`) and unidentifiable senders get a literal \"undefined\" rate-limit bucket"
body: "- id: PARSEDV-n-r216-4\n  SESSION_ID: orch-main-r216\n  status: fixed\n  text: |-\n    PRINCIPLE PARSEDV. SURFACE apps/tps-game. Node-only row, logged unresolved by hop orch-main-r216; the hop edited nothing.\n\n    WITNESS exec_js 1791674928217-500-d1a8b4fd198554e7: driving server-app.js onMessage twice with `{type:'emote', code:'wave'}` -- once with no sender field and once with senderId 'p1' -- produces ctx.state.lastEmoteAt key set `[\"undefined\",\"p1\"]` and plays the clip both times (V7_bucketKeys). A client that never identifies itself gets its own rate-limit bucket under the key `\"undefined\"` and is never throttled, and the identity is guessed rather than parsed: server-app.js:69 `const playerId = msg.senderId || msg.playerId`. The code check at 72 (`EMOTE_CLIPS.has(msg.code)`) is a validation that discards its own evidence -- it does not narrow msg.code, so line 73 hands the raw value to playAnimation.\n\n    WORK: parse the inbound message once into `{kind:'emote', playerId, clip}` at the transport boundary, rejecting a message with no resolvable player id and a code outside EMOTE_CLIPS with a named parse error; delete the `msg.senderId || msg.playerId` guess and let the parsed record carry the clip, not `EMOTE_CLIPS.get(msg.code)`.\n  title: 'PARSEDV apps/tps-game: the emote message is guessed (`msg.senderId || msg.playerId`) and unidentifiable senders get a literal \"undefined\" rate-limit bucket'\n  session_id: orch-main-r216"
status: "resolved"
