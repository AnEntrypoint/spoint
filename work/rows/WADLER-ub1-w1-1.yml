body: "- id: WADLER-ub1-w1-1\n  SESSION_ID: orch-main-r270-sub1-w1\n  status: refuted\n  witness_path: .gm/witness-out/WADLER-ub1-w1-1-verdict.txt\n  note: box, sphere and capsule colliders declare NonNegFinite radii; the cylinder and convex-hull colliders named in the row are no longer declared\n  title: 'types/ctx.d.ts: addBoxCollider/addCylinderCollider/addConvexHullCollider and ColliderConfig still declare bare number, and AppPhysics.js:81 spells the rule a fourth time inline'\n  claim: 'WADLER hop over types/ctx.d.ts (dispatch 1791690990833-500-126c377a54d7121a, exhaustive over src/apps/AppPhysics.js). AppPhysics.js:81 gates addBoxCollider''s size with an inline `typeof x !== ''number'' || !Number.isFinite(x) || x < 0` instead of consuming nonNeg from src/shared/vecGuard.js, so the retired row ILLEGAL-n-r270-2''s claim that every numeric sink asserts one nonNeg precondition is half false. The matching declarations are still bare: types/ctx.d.ts:36 `addBoxCollider(size: Vector3 | number)`, :39 `addCylinderCollider(radius: number, height: number)`, :41 `addConvexHullCollider(shapeKey?: string)`, and ColliderConfig :56-59 radius/height/mass. The shipped tree therefore carries four independent spellings of one predicate plus a declaration that admits what the sink throws on.'\n  acceptance_criteria: 'A live dispatch shows AppPhysics.js:81 routing every element of size through nonNeg (no inline Number.isFinite/x<0 text left in src/apps/AppPhysics.js), and types/ctx.d.ts declaring addBoxCollider(size: Vector3 | NonNegFinite), addCylinderCollider(radius: NonNegFinite, height: NonNegFinite) and ColliderConfig radius/height/mass as NonNegFinite; a codesearch literal nonNeg over src/apps/AppPhysics.js returns one use site per guarded sink and zero inline isFinite comparisons.'\n  session_id: orch-main-r270-sub1-w1"
