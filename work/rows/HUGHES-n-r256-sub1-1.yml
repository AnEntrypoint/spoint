body: "- id: HUGHES-n-r256-sub1-1\n  SESSION_ID: orch-main-r256-sub1\n  action: validate both guards before either returns and throw one named error for any invalid lattice request (delete the null encoding and the caller-side `if (!lattice) throw` re-derivation at src/shared/clusterConfig.js:38-39 and src/terrain/ChartReanchorService.js:5-6); give chartAnchorDecision an explicit lattice precondition that throws a named error rather than a TypeError from a property read; route playerCentroidDir's degenerate dir into the refusal shape\n  claim: 'executed input-class sweep (dispatch 1791681155262-500-d3f7c116742a69ca) over src/shared/chartAnchor.js:13-14 and src/shared/chartReanchorPolicy.js: one invalid-request class is answered three ways. createChartAnchorLattice(0, 0) returns null because the radius guard at line 13 fires first, so the anchorsPerFace guard at line 14 never runs (the first guard masks the second); createChartAnchorLattice(6371e3, 0) throws `chart anchor lattice needs anchorsPerFace >= 1, got 0`; and the null the first call produced is then consumed by chartAnchorDecision, which throws a TypeError from inside its own body instead of the named failure it already was. A fourth input of the same class, a zero-length member dir, escapes playerCentroidDir as an uncaught plain Error that no caller catches.'\n  evidence: 'first falsifying case per class, live dynamic import of src/shared/chartAnchor.js: (radius 0, anchorsPerFace 0) -> null, not a throw; (6371e3, anchorsPerFace 0) -> Error; radius -1 and radius NaN -> null; chartAnchorDecision({lattice: null, frame: {up:[0,1,0]}, dirs: [[0,1,0]]}) -> TypeError inside the policy; a zero-length dir -> uncaught Error out of playerCentroidDir, caught by no caller; chartAnchorCellWorstAngleDeg(createChartAnchorLattice(6371e3)) = 2.2596748516959444 deg, under CHART_REANCHOR_ANGLE_DEG 28, so the AGENTS.md tilt invariant still holds'\n  principle: HUGHES\n  status: fixed\n  surface: src/shared\n  title: an invalid chart-anchor request has three live encodings and the radius guard masks the anchorsPerFace guard\n  witness: 1791681155262-500-d3f7c116742a69ca\n  session_id: orch-main-r256-sub1"
